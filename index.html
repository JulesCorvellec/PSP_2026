      }} />
    </div>
  );
}

/* ---------------- Mini-jauge de segmentation (quadrant attractivité/technique, climat/technique) ---------------- */
function segmentationQuadrant(residences, xKey, yKey, target){
  const xVals = residences.map((r)=>critValue(r,xKey)).filter((v)=>v!==null&&v!==undefined&&!isNaN(v)&&v>0);
  const yVals = residences.map((r)=>critValue(r,yKey)).filter((v)=>v!==null&&v!==undefined&&!isNaN(v)&&v>0);
  const xMax = xVals.length? Math.max(...xVals) : null;
  const yMax = yVals.length? Math.max(...yVals) : null;
  const bandFor = (r)=>{
    const xv = critValue(r,xKey), yv = critValue(r,yKey);
    const xPct = (xv!==null&&xv!==undefined&&!isNaN(xv)&&xMax>0) ? (xv/xMax*100) : null;
    const yPct = (yv!==null&&yv!==undefined&&!isNaN(yv)&&yMax>0) ? (yv/yMax*100) : null;
    return { xBand: bandOf(xPct), yBand: bandOf(yPct) };
  };
  const targetBand = bandFor(target);
  if (!targetBand.xBand || !targetBand.yBand) return null;
  let total=0, count=0;
  residences.forEach((r)=>{
    const b = bandFor(r);
    if (!b.xBand || !b.yBand) return;
    total++;
    if (b.xBand===targetBand.xBand && b.yBand===targetBand.yBand) count++;
  });
  return { xBand:targetBand.xBand, yBand:targetBand.yBand, count, total };
}

/* ---------------- Vue Comparatif dédiée ---------------- */
function ViewComparatif({currentSnapshot}){
  const [saves, setSaves] = useState([]);
  const [versionAId, setVersionAId] = useState(null);
  const [versionBId, setVersionBId] = useState('current');

  useEffect(()=>{
    let cancelled = false;
    // .catch() nécessaire depuis que idbGetAll rejette sur session expirée (12h) : sans lui, un rejet
    // laissait la liste de comparaison silencieusement vide, sans aucune indication à l'utilisateur.
    idbGetAll().then((all)=>{
      if (cancelled) return;
      setSaves(all);
      const base = all.find((s)=>s.estBase);
      setVersionAId((prev)=> prev || (base? base.id : (all[0]? all[0].id : 'current')));
    }).catch((e)=>{ /* déjà géré globalement : apiFetch déclenche onUnauthorized/l'écran de connexion sur 401 */ });
    return ()=>{ cancelled = true; };
  }, []);

  const options = useMemo(()=>{
    const opts = [{id:'current', nom: currentSnapshot.nom}];
    saves.forEach((s)=>opts.push({id:s.id, nom:s.nom + (s.estBase?' (base)':'')}));
    return opts;
  }, [saves, currentSnapshot]);

  function resolveVersion(id){
    if (id==='current') return currentSnapshot;
    const s = saves.find((x)=>x.id===id);
    if (!s) return null;
    return { nom:s.nom, data:s.data, simOperations:s.simOperations||[], budgetLignes: migrateBudgetLignes(s), includeIdentifiees: s.includeIdentifiees!==undefined?s.includeIdentifiees:true, nomFichierSource:s.nomFichierSource, gabaritComplet:s.gabaritComplet };
  }

  // resolveVersion('current') renvoie désormais la même référence currentSnapshot tant qu'elle n'a pas
  // changé (mémoïsée côté App), mais resolveVersion(saveId) reconstruit un nouvel objet littéral à
  // CHAQUE appel : sans ce useMemo, versionA/versionB changeraient de référence à chaque rendu de
  // ViewComparatif, ce qui invaliderait en cascade kpiA/kpiB, investA/investB, dpeShareA/dpeShareB et
  // opsDiff plus bas — recalcul complet (dont computeTrajectory) à chaque re-render, pas seulement
  // quand la version comparée change réellement.
  const versionA = useMemo(()=> versionAId? resolveVersion(versionAId) : null, [versionAId, saves, currentSnapshot]);
  const versionB = useMemo(()=> versionBId? resolveVersion(versionBId) : null, [versionBId, saves, currentSnapshot]);
  const sameSource = versionA && versionB && versionA.nomFichierSource===versionB.nomFichierSource;

  function kpiOf(v){
    if (!v) return null;
    const totalLgt = v.data.residences.reduce((s,r)=>s+r.nbLgt,0);
    const totalInvest = v.simOperations.reduce((s,o)=>s+(o.montant||0),0) + (v.budgetLignes||[]).reduce((s,l)=>s+Object.values(l.valeurs||{}).reduce((s2,x)=>s2+(Number(x)||0),0),0);
    const dpeTotals = {A:0,B:0,C:0,D:0,E:0,F:0,G:0,NR:0};
    v.data.residences.forEach((r)=>{ if (r.distEnergie) Object.keys(dpeTotals).forEach((k)=>{ dpeTotals[k]+=(r.distEnergie[k]||0); }); });
    return { totalLgt, nbRes:v.data.residences.length, totalInvest, dpeTotals };
  }
  const kpiA = useMemo(()=>kpiOf(versionA), [versionA]);
  const kpiB = useMemo(()=>kpiOf(versionB), [versionB]);

  const years = useMemo(()=>{
    if (!versionA || !versionB) return [];
    const ya = computeYearsRange(versionA.simOperations);
    const yb = computeYearsRange(versionB.simOperations);
    const minY = Math.min(ya[0], yb[0]), maxY = Math.max(ya[ya.length-1], yb[yb.length-1]);
    const arr=[]; for (let y=minY;y<=maxY;y++) arr.push(y);
    return arr;
  }, [versionA, versionB]);

  function investByYear(v){
    if (!v) return [];
    const ops = v.simOperations.filter((o)=> v.includeIdentifiees || o.statut==='programme');
    return years.map((y)=> ops.filter((o)=>o.annee===y).reduce((s,o)=>s+(o.montant||0),0) + sumBudgetLignesYear(v.budgetLignes, y));
  }
  const investA = useMemo(()=>investByYear(versionA), [versionA, years]);
  const investB = useMemo(()=>investByYear(versionB), [versionB, years]);

  function dpeShareByYear(v){
    if (!v || !v.data.hasGainsGrid) return null;
    const vy = computeYearsRange(v.simOperations);
    const traj = computeTrajectory(v.data.residences, v.simOperations, v.data.gainsGrid, vy, 'energie', v.includeIdentifiees);
    const classes = ['A','B','C','D','E','F','G','NR'];
    function bestShare(d){ return d? (d.A+d.B+d.C)/Math.max(1,classes.reduce((s,c)=>s+d[c],0))*100 : null; }
    return years.map((y)=>{ const idx = vy.indexOf(y); return idx>=0? bestShare(traj[vy[idx]]) : null; });
  }
  const dpeShareA = useMemo(()=>dpeShareByYear(versionA), [versionA, years]);
  const dpeShareB = useMemo(()=>dpeShareByYear(versionB), [versionB, years]);
  const hasDpeCompare = dpeShareA && dpeShareB;

  const opsDiff = useMemo(()=>{
    if (!versionA || !versionB) return {added:[],removed:[],modified:[]};
    const resByCodeB = {}; versionB.data.residences.forEach((r)=>{ resByCodeB[r.code]=r; });
    const resByCodeA = {}; versionA.data.residences.forEach((r)=>{ resByCodeA[r.code]=r; });
    const mapA = new Map(versionA.simOperations.map((o)=>[o.id,o]));
    const mapB = new Map(versionB.simOperations.map((o)=>[o.id,o]));
    const added=[], removed=[], modified=[];
    mapB.forEach((o,id)=>{ if (!mapA.has(id)) added.push(Object.assign({},o,{resNom:(resByCodeB[o.resCode]||{}).nom||o.resCode})); });
    mapA.forEach((o,id)=>{ if (!mapB.has(id)) removed.push(Object.assign({},o,{resNom:(resByCodeA[o.resCode]||{}).nom||o.resCode})); });
    mapA.forEach((oa,id)=>{
      const ob = mapB.get(id);
      if (ob && (oa.annee!==ob.annee || oa.montant!==ob.montant || oa.statut!==ob.statut)){
        const changes = [];
        if (oa.annee!==ob.annee) changes.push('Année '+(oa.annee??'—')+' → '+(ob.annee??'—'));
        if (oa.montant!==ob.montant) changes.push('Montant '+fmtEur(oa.montant)+' → '+fmtEur(ob.montant));
        if (oa.statut!==ob.statut) changes.push('Statut '+oa.statut+' → '+ob.statut);
        modified.push({ id, resNom:(resByCodeA[oa.resCode]||{}).nom||oa.resCode, type:ob.type, annee:ob.annee, montant:ob.montant, statut:ob.statut, changes: changes.join(' · ') });
      }
    });
    return {added, removed, modified};
  }, [versionA, versionB]);

  const diffRows = [
    ...opsDiff.added.map((o)=>({...o, changeType:'Ajoutée'})),
    ...opsDiff.removed.map((o)=>({...o, changeType:'Supprimée'})),
    ...opsDiff.modified.map((m)=>({...m, changeType:'Modifiée'})),
  ];
  const diffCols = [
    {key:'changeType', label:'Changement', render:(o)=>{
      const color = o.changeType==='Ajoutée'?'var(--ce-vert-principal)':o.changeType==='Supprimée'?'var(--ce-corail)':'#264E46';
      return <span className="ce-badge" style={{background:color, color:'#fff'}}>{o.changeType}</span>;
    }},
    {key:'resNom', label:'Résidence'},
    {key:'type', label:'Type de travaux'},
    {key:'annee', label:'Année', render:(o)=>o.annee??'—'},
    {key:'montant', label:'Montant', render:(o)=>fmtEur(o.montant)},
    {key:'statut', label:'Statut', render:(o)=>o.statut==='programme'?'Programmé':'Identifié'},
    {key:'changes', label:'Détail', render:(o)=>o.changes||'—'},
  ];

  return (
    <div style={{padding:24,display:'flex',flexDirection:'column',gap:20}}>
      <div className="ce-card">
        <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700,marginBottom:14}}>Comparatif de versions</h2>
        <div style={{display:'flex',gap:16,flexWrap:'wrap'}}>
          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            <label style={{fontSize:'.68rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>Version A</label>
            <select className="ce-select" value={versionAId||''} onChange={(e)=>setVersionAId(e.target.value)}>
              {options.map((o)=><option key={o.id} value={o.id}>{o.nom}</option>)}
            </select>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            <label style={{fontSize:'.68rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>Version B</label>
            <select className="ce-select" value={versionBId||''} onChange={(e)=>setVersionBId(e.target.value)}>
              {options.map((o)=><option key={o.id} value={o.id}>{o.nom}</option>)}
            </select>
          </div>
        </div>
        {versionA && versionB && !sameSource && (
          <div style={{marginTop:14,background:'var(--ce-saumon)',borderRadius:8,padding:'10px 14px',fontSize:'.75rem',color:'var(--ce-vert-tres-fonce)'}}>
            <b>Attention :</b> ces deux versions ne proviennent pas du même fichier source ({versionA.nomFichierSource} / {versionB.nomFichierSource}) — vous comparez potentiellement deux patrimoines différents, pas seulement deux scénarios d'un même patrimoine.
          </div>
        )}
      </div>

      {kpiA && kpiB && (
        <div className="ce-card">
          <h3 style={{fontSize:'.85rem',fontWeight:700,marginBottom:12,color:'var(--ce-vert-tres-fonce)'}}>KPI globaux</h3>
          <div style={{overflowX:'auto'}}>
            <table className="ce-table">
              <thead><tr><th>Indicateur</th><th>Version A — {versionA.nom}</th><th>Version B — {versionB.nom}</th><th>Δ</th></tr></thead>
              <tbody>
                <tr><td>Logements</td><td>{fmtNum(kpiA.totalLgt)}</td><td>{fmtNum(kpiB.totalLgt)}</td><td>{kpiB.totalLgt-kpiA.totalLgt>=0?'+':''}{fmtNum(kpiB.totalLgt-kpiA.totalLgt)}</td></tr>
                <tr><td>Résidences</td><td>{fmtNum(kpiA.nbRes)}</td><td>{fmtNum(kpiB.nbRes)}</td><td>{kpiB.nbRes-kpiA.nbRes>=0?'+':''}{fmtNum(kpiB.nbRes-kpiA.nbRes)}</td></tr>
                <tr><td>Budget investissement total</td><td>{fmtKEur(kpiA.totalInvest)}</td><td>{fmtKEur(kpiB.totalInvest)}</td><td>{kpiB.totalInvest-kpiA.totalInvest>=0?'+':''}{fmtKEur(kpiB.totalInvest-kpiA.totalInvest)} ({kpiA.totalInvest>0? (((kpiB.totalInvest-kpiA.totalInvest)/kpiA.totalInvest*100).toFixed(0)):'—'}%)</td></tr>
                {['A','B','C','D','E','F','G'].map((cl)=>(
                  <tr key={cl}><td>DPE Énergie — classe {cl}</td><td>{fmtNum(kpiA.dpeTotals[cl])}</td><td>{fmtNum(kpiB.dpeTotals[cl])}</td><td>{kpiB.dpeTotals[cl]-kpiA.dpeTotals[cl]>=0?'+':''}{fmtNum(kpiB.dpeTotals[cl]-kpiA.dpeTotals[cl])}</td></tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {years.length>0 && (
        <div className="ce-card">
          <h3 style={{fontSize:'.85rem',fontWeight:700,marginBottom:12,color:'var(--ce-vert-tres-fonce)'}}>Trajectoire d'investissement</h3>
          <ChartCanvas type="line" height={260} data={{
            labels: years,
            datasets:[
              { label:'Version A — '+versionA.nom, data: investA, borderColor:'#9fb3ae', backgroundColor:'#9fb3ae', pointRadius:2, tension:.2 },
              { label:'Version B — '+versionB.nom, data: investB, borderColor:'#009261', backgroundColor:'#009261', pointRadius:2, tension:.2 },
            ]
          }} options={{ scales:{ y:{ beginAtZero:true, ticks:{callback:(v)=>fmtKEur(v)} } } }} />
        </div>
      )}

      {hasDpeCompare && (
        <div className="ce-card">
          <h3 style={{fontSize:'.85rem',fontWeight:700,marginBottom:12,color:'var(--ce-vert-tres-fonce)'}}>Trajectoire de décarbonation (% logements classe A-C, DPE Énergie)</h3>
          <ChartCanvas type="line" height={260} data={{
            labels: years,
            datasets:[
              { label:'Version A — '+versionA.nom, data: dpeShareA, borderColor:'#9fb3ae', backgroundColor:'#9fb3ae', pointRadius:2, tension:.2 },
              { label:'Version B — '+versionB.nom, data: dpeShareB, borderColor:'#009261', backgroundColor:'#009261', pointRadius:2, tension:.2 },
            ]
          }} options={{ scales:{ y:{ beginAtZero:true, max:100 } } }} />
        </div>
      )}

      {versionA && versionB && (
        <div className="ce-card">
          <h3 style={{fontSize:'.85rem',fontWeight:700,marginBottom:12,color:'var(--ce-vert-tres-fonce)'}}>Opérations qui diffèrent entre A et B ({diffRows.length})</h3>
          <SortableTable columns={diffCols} rows={diffRows} pageSize={20} />
          {diffRows.length===0 && <p style={{fontSize:'.75rem',color:'#9fb3ae',marginTop:8}}>Aucune différence détectée entre les opérations des deux versions.</p>}
        </div>
      )}
    </div>
  );
}

/* ---------------- Fiche résidence (drill-down) ---------------- */
function ResidenceDrawer({residence, operations, residences, onClose, gainsGrid, hasGainsGrid, includeIdentifiees, baseImport}){
  const [tab, setTab] = useState('synthese');
  // Les hooks doivent s'exécuter à chaque rendu dans le même ordre : le "return null" pour
  // l'absence de résidence sélectionnée doit donc venir APRÈS tous les hooks, jamais avant
  // (sans quoi React lève l'erreur #310 dès qu'une résidence est sélectionnée la 1re fois).
  const climatNoteKey = useMemo(()=>{
    for (const r of (residences||[])){ if (r.notes){ const k = Object.keys(r.notes).find((kk)=>ceNorm(kk).includes('climat')); if (k) return k; } }
    return null;
  }, [residences]);
  const quadrantAttractTechnique = useMemo(()=> (residence && residences && residences.length) ? segmentationQuadrant(residences,'attractivite','technique',residence) : null, [residences, residence]);
  const quadrantClimatTechnique = useMemo(()=> (residence && residences && residences.length && climatNoteKey) ? segmentationQuadrant(residences, climatNoteKey, 'technique', residence) : null, [residences, residence, climatNoteKey]);
  // §6 — projection DPE post-travaux à horizon 10 ans, restreinte aux opérations de cette résidence.
  // Année de référence = début de la trajectoire propre à cette résidence (pas une année calendaire
  // fixe), en réutilisant la même cascade que la trajectoire de décarbonation globale (computeTrajectory).
  const dpeHorizon = useMemo(()=>{
    if (!residence || !hasGainsGrid) return null;
    const resOps = (operations||[]).filter((o)=>o.resCode===residence.code);
    const startYear = computeYearsRange(resOps)[0];
    const endYear = startYear + 10;
    const seq = []; for (let y=startYear;y<=endYear;y++) seq.push(y);
    const trajE = computeTrajectory([residence], resOps, gainsGrid||{}, seq, 'energie', includeIdentifiees);
    const trajG = computeTrajectory([residence], resOps, gainsGrid||{}, seq, 'ges', includeIdentifiees);
    return { startYear, endYear, avantE: trajE[startYear], apresE: trajE[endYear], avantG: trajG[startYear], apresG: trajG[endYear] };
  }, [residence, operations, gainsGrid, hasGainsGrid, includeIdentifiees]);

  if (!residence) return null;
  const ops = operations.filter((o)=>o.resCode===residence.code).sort((a,b)=>(a.annee||9999)-(b.annee||9999));
  const programmees = ops.filter((o)=>o.statut==='programme');
  const identifiees = ops.filter((o)=>o.statut==='identifie');
  const identifieesTop4 = identifiees.slice(0,4);
  const critereGroups = residence.critereGroups || {};

  // §5.4 — comparaison Base des actions de cette résidence, même fonction d'appariement matchOperations
  // que la table des écarts d'"Investissements & Entretien du parc" (§5.3), jamais une 2e implémentation.
  const baseOpsForResidence = baseImport ? (baseImport.simOperations||[]).filter((o)=>o.resCode===residence.code) : [];
  const ecartsResidence = baseImport ? matchOperations(ops, baseOpsForResidence) : null;
  const baseMatchByActuelId = {};
  if (ecartsResidence) ecartsResidence.matched.forEach((m)=>{ baseMatchByActuelId[m.actuelOp.id] = m; });
  const disparuesResidence = ecartsResidence ? ecartsResidence.disparues : [];
  function baseAnnotation(o){
    if (!baseImport) return null;
    const m = baseMatchByActuelId[o.id];
    if (m){
      if ((!m.deltaAnnees || m.deltaAnnees===0) && (!m.deltaMontant || m.deltaMontant===0)) return null; // identique à la base, rien à signaler
      return (
        <div style={{marginTop:4,fontSize:'.7rem',color:'var(--ce-corail)',background:'#fff1ec',display:'inline-block',borderRadius:8,padding:'2px 8px'}}>
          Base : {fmtEur(m.baseOp.montant)} en {m.baseOp.annee ?? '—'}{m.deltaAnnees? ' ('+(m.deltaAnnees>=0?'+':'')+m.deltaAnnees+' an'+(Math.abs(m.deltaAnnees)>1?'s':'')+')':''}
        </div>
      );
    }
    return <div style={{marginTop:4,fontSize:'.7rem',color:'var(--ce-corail)',fontStyle:'italic'}}>Nouvelle opération (absente de la base)</div>;
  }

  const byYear = {};
  ops.forEach((o)=>{ const y=o.annee||'?'; byYear[y]=(byYear[y]||0)+(o.montant||0); });
  const years = Object.keys(byYear).filter((y)=>y!=='?').sort();

  const tabs = [
    {id:'synthese', label:'Synthèse'},
    {id:'actions', label:'Actions stratégiques'},
    {id:'suivi', label:'Suivi / commentaire'},
  ];

  return (
    <React.Fragment>
      <div className="drawer-overlay" onClick={onClose}></div>
      <div className="drawer">
        <div style={{background:'var(--ce-vert-tres-fonce)',padding:'18px 22px',color:'#fff'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
            <div>
              <div style={{fontSize:'.68rem',opacity:.75,textTransform:'uppercase',letterSpacing:'.04em'}}>Fiche résidence</div>
              <div style={{fontSize:'1.2rem',fontWeight:700}}>{residence.nom || residence.code}</div>
              <div style={{fontSize:'.78rem',opacity:.85,marginTop:2}}>{[residence.commune, residence.secteur, residence.agence].filter(Boolean).join(' · ')}</div>
            </div>
            <button onClick={onClose} style={{background:'transparent',border:'none',color:'#fff',fontSize:'1.3rem',cursor:'pointer',lineHeight:1}}>×</button>
          </div>
          <div style={{display:'flex',gap:8,marginTop:12}}>
            <DpeBadge cl={residence.dpeEnergie}/><span style={{fontSize:'.72rem',opacity:.85,alignSelf:'center'}}>Énergie</span>
            <DpeBadge cl={residence.dpeGES}/><span style={{fontSize:'.72rem',opacity:.85,alignSelf:'center'}}>GES</span>
          </div>
        </div>
        <div style={{display:'flex',borderBottom:'2px solid #eef4f2',padding:'0 12px'}}>
          {tabs.map((t)=>(<div key={t.id} className={"ce-tab"+(tab===t.id?" active":"")} onClick={()=>setTab(t.id)}>{t.label}</div>))}
        </div>
        <div style={{padding:22}}>
          {tab==='synthese' && (
            <div style={{display:'flex',flexDirection:'column',gap:16}}>
              <div className="ce-card">
                <h3 style={{fontSize:'.8rem',fontWeight:700,marginBottom:10}}>Identité</h3>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,fontSize:'.8rem'}}>
                  <div><b>Code :</b> {residence.code}</div>
                  <div><b>Nb logements :</b> {fmtNum(residence.nbLgt)}</div>
                  {residence.adresse && <div style={{gridColumn:'1 / -1'}}><b>Adresse :</b> {residence.adresse}</div>}
                  {residence.qpv && <div><b>QPV :</b> {residence.qpv}</div>}
                  {residence.codeInsee && <div><b>Code INSEE :</b> {residence.codeInsee}</div>}
                  {residence.anneeConstruction && <div><b>Année de construction :</b> {residence.anneeConstruction}</div>}
                  {residence.shab!==null && <div><b>SHAB :</b> {fmtNum(residence.shab)} m²</div>}
                  {residence.corpro && <div><b>Copro :</b> {residence.corpro}</div>}
                  {residence.tauxVacance!==null && <div><b>Taux de vacance :</b> {residence.tauxVacance}%</div>}
                  {residence.autofinancementLgt!==null && <div><b>Autofinancement / lgt :</b> {fmtEur(residence.autofinancementLgt)}</div>}
                </div>
                {(residence.distEnergie || residence.distGES) && (
                  <div style={{marginTop:14}}>
                    <h4 style={{fontSize:'.72rem',fontWeight:700,marginBottom:6,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>Répartition DPE</h4>
                    <table className="ce-table">
                      <thead><tr><th>Classe</th><th>Énergie</th><th>GES</th></tr></thead>
                      <tbody>
                        {['A','B','C','D','E','F','G','NR'].map((cl)=>(
                          <tr key={cl}>
                            <td><DpeBadge cl={cl}/></td>
                            <td>{residence.distEnergie? fmtNum(residence.distEnergie[cl]||0):'—'}</td>
                            <td>{residence.distGES? fmtNum(residence.distGES[cl]||0):'—'}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
              {(residence.crd!==null || residence.autofinancement!==null || residence.vnc!==null) && (
                <div className="ce-card">
                  <h3 style={{fontSize:'.8rem',fontWeight:700,marginBottom:10}}>Données financières</h3>
                  <div style={{display:'flex',gap:16,flexWrap:'wrap'}}>
                    {residence.crd!==null && <div style={{flex:1,minWidth:120}}><div style={{fontSize:'.68rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>CRD</div><div style={{fontSize:'1.1rem',fontWeight:700,color:'var(--ce-vert-principal)'}}>{fmtEur(residence.crd)}</div></div>}
                    {residence.autofinancement!==null && <div style={{flex:1,minWidth:120}}><div style={{fontSize:'.68rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>Autofinancement</div><div style={{fontSize:'1.1rem',fontWeight:700,color:'var(--ce-vert-principal)'}}>{fmtEur(residence.autofinancement)}</div></div>}
                    {residence.vnc!==null && <div style={{flex:1,minWidth:120}}><div style={{fontSize:'.68rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>VNC</div><div style={{fontSize:'1.1rem',fontWeight:700,color:'var(--ce-vert-principal)'}}>{fmtEur(residence.vnc)}</div></div>}
                  </div>
                </div>
              )}
              <div className="ce-card">
                <h3 style={{fontSize:'.8rem',fontWeight:700,marginBottom:10}}>Jauges de synthèse</h3>
                <div style={{display:'flex',gap:8,flexWrap:'wrap',justifyContent:'space-around'}}>
                  <GaugeChart label="Attractivité globale" value={residence.attractivite} max={100} color="#009261" />
                  <GaugeChart label="Note technique" value={residence.technique} max={100} color="#264E46" />
                  {residence.performanceCarbone!==null && <GaugeChart label="Performance carbone" value={residence.performanceCarbone} max={100} color="#58D88B" />}
                </div>
                <p style={{fontSize:'.68rem',color:'var(--ce-vert-fonce)',marginTop:10,lineHeight:1.5}}>
                  Chaque jauge affiche la note de la résidence ramenée sur une échelle de 0 (pire cas
                  observé dans le fichier importé) à 100 (meilleur cas).
                </p>
              </div>
              <div className="ce-card">
                <h3 style={{fontSize:'.8rem',fontWeight:700,marginBottom:10}}>Scores de diagnostic</h3>
                <CritBar label={"Attractivité"+(residence.familleAttract? ' (famille '+residence.familleAttract+')':'')} value={residence.attractivite} max={100} />
                <CritBar label={"État technique"+(residence.familleTechnique? ' (famille '+residence.familleTechnique+')':'')} value={residence.technique} max={100} />
              </div>
              {Object.keys(critereGroups).length>0 && (
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
                  {['environnement','programme','technique','carbone','climat'].map((key)=> critereGroups[key] ? (
                    <RadarChart key={key} title={critereGroups[key].label} values={critereGroups[key].values} />
                  ) : null)}
                </div>
              )}
              {Object.keys(critereGroups).length>0 && (
                <p style={{fontSize:'.68rem',color:'var(--ce-vert-fonce)',marginTop:-8,lineHeight:1.5}}>
                  Chaque radar détaille les sous-critères d'un des 5 groupes de cotation ci-dessus (Environnement,
                  Programme, État technique, Performance carbone, Confort d'été / Résilience climatique) : un axe
                  par sous-critère, chacun noté de 0 (pire) à 100 (meilleur) — plus la forme couvre le radar, meilleure
                  est la résidence sur ce groupe.
                </p>
              )}
              {['economique','social'].map((key)=> critereGroups[key] && residences && residences.length ? (
                <CriteresBarChart key={key} title={critereGroups[key].label} values={critereGroups[key].values} residences={residences} groupKey={key} />
              ) : null)}
              {(quadrantAttractTechnique || quadrantClimatTechnique) && (
                <div className="ce-card">
                  <h3 style={{fontSize:'.8rem',fontWeight:700,marginBottom:10}}>Profil comparable dans le patrimoine filtré</h3>
                  <div style={{display:'flex',flexDirection:'column',gap:8}}>
                    {quadrantAttractTechnique && (
                      <div style={{fontSize:'.82rem',color:'var(--ce-vert-tres-fonce)'}}>
                        <b>{fmtNum(quadrantAttractTechnique.count)} résidence{quadrantAttractTechnique.count>1?'s':''} sur {fmtNum(quadrantAttractTechnique.total)}</b> partage{quadrantAttractTechnique.count>1?'nt':''} le même profil (Attractivité {quadrantAttractTechnique.xBand} × État technique {quadrantAttractTechnique.yBand}) que celle-ci.
                      </div>
                    )}
                    {quadrantClimatTechnique && (
                      <div style={{fontSize:'.82rem',color:'var(--ce-vert-tres-fonce)'}}>
                        <b>{fmtNum(quadrantClimatTechnique.count)} résidence{quadrantClimatTechnique.count>1?'s':''} sur {fmtNum(quadrantClimatTechnique.total)}</b> partage{quadrantClimatTechnique.count>1?'nt':''} le même profil (Climat {quadrantClimatTechnique.xBand} × État technique {quadrantClimatTechnique.yBand}) que celle-ci.
                      </div>
                    )}
                  </div>
                  <p style={{fontSize:'.68rem',color:'var(--ce-vert-fonce)',marginTop:10,lineHeight:1.5}}>Comptage réalisé sur les résidences actuellement filtrées (barre de filtres transverses en haut de l'outil), pas sur l'ensemble du patrimoine importé.</p>
                </div>
              )}
              {identifieesTop4.length>0 && (
                <div className="ce-card">
                  <h3 style={{fontSize:'.8rem',fontWeight:700,marginBottom:10,color:'var(--ce-corail)'}}>Actions identifiées ({identifieesTop4.length}{identifiees.length>4? ' sur '+identifiees.length:''})</h3>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                    {identifieesTop4.map((o)=>(
                      <div key={o.id} style={{border:'1px solid #eef4f2',borderRadius:8,padding:'10px 12px'}}>
                        <div style={{fontWeight:700,fontSize:'.8rem',color:'var(--ce-vert-tres-fonce)'}}>{o.nature || o.type || 'Non renseigné'}</div>
                        <div style={{fontSize:'.72rem',color:'var(--ce-vert-fonce)',marginTop:4}}>{o.annee||'année n.c.'}{o.logements? ' · '+fmtNum(o.logements)+' lgt':''}</div>
                        <div style={{fontSize:'.78rem',fontWeight:700,color:'var(--ce-corail)',marginTop:2}}>{fmtEur(o.montant)}</div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              {years.length>0 && (
                <div className="ce-card">
                  <h3 style={{fontSize:'.8rem',fontWeight:700,marginBottom:10}}>Travaux programmés par année</h3>
                  <ChartCanvas type="bar" height={180} data={{labels:years, datasets:[{data:years.map((y)=>byYear[y]), backgroundColor:'#009261', borderRadius:4}]}} options={{plugins:{legend:{display:false}}}} />
                </div>
              )}
            </div>
          )}
          {tab==='actions' && (
            <div style={{display:'flex',flexDirection:'column',gap:16}}>
              <div>
                <h3 style={{fontSize:'.8rem',fontWeight:700,marginBottom:8,color:'var(--ce-vert-principal)'}}>Travaux programmés ({programmees.length})</h3>
                {programmees.map((o)=>(<div key={o.id} className="ce-card" style={{marginBottom:8,borderLeft:'4px solid var(--ce-vert-principal)'}}>
                  <b>{o.nature || o.type || 'Non renseigné'}</b> — {o.annee||'année n.c.'}{o.anneeFin? ' → '+o.anneeFin:''} — {fmtEur(o.montant)}
                  {o.logements>0 && o.montant!==null && o.montant!==undefined && <span style={{color:'#9fb3ae'}}> ({fmtEur(o.montant/o.logements)}/lgt)</span>}
                  {baseAnnotation(o)}
                </div>))}
                {programmees.length===0 && <div style={{fontSize:'.78rem',color:'#9fb3ae'}}>Aucune.</div>}
              </div>
              <div>
                <h3 style={{fontSize:'.8rem',fontWeight:700,marginBottom:8,color:'var(--ce-corail)'}}>Travaux à arbitrer ({identifiees.length})</h3>
                {identifiees.map((o)=>(<div key={o.id} className="ce-card" style={{marginBottom:8,borderLeft:'4px solid var(--ce-corail)'}}>
                  <b>{o.nature || o.type || 'Non renseigné'}</b> — {o.annee||'année n.c.'}{o.anneeFin? ' → '+o.anneeFin:''} — {fmtEur(o.montant)}
                  {o.logements>0 && o.montant!==null && o.montant!==undefined && <span style={{color:'#9fb3ae'}}> ({fmtEur(o.montant/o.logements)}/lgt)</span>}
                  {baseAnnotation(o)}
                </div>))}
                {identifiees.length===0 && <div style={{fontSize:'.78rem',color:'#9fb3ae'}}>Aucune.</div>}
              </div>
              {baseImport && disparuesResidence.length>0 && (
                <div>
                  <h3 style={{fontSize:'.8rem',fontWeight:700,marginBottom:8,color:'#9fb3ae'}}>Disparues / non reconduites vs Base ({disparuesResidence.length})</h3>
                  {disparuesResidence.map((o)=>(<div key={o.id} className="ce-card" style={{marginBottom:8,borderLeft:'4px solid #9fb3ae'}}>
                    <b>{o.nature || o.type || 'Non renseigné'}</b> — {o.annee||'année n.c.'} — {fmtEur(o.montant)} <span style={{color:'#9fb3ae'}}>(Base uniquement)</span>
                  </div>))}
                </div>
              )}
              {dpeHorizon && (
                <div className="ce-card">
                  <h3 style={{fontSize:'.8rem',fontWeight:700,marginBottom:10}}>Projection DPE à 10 ans ({dpeHorizon.startYear} → {dpeHorizon.endYear})</h3>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
                    <table className="ce-table">
                      <thead><tr><th>Énergie</th><th>{dpeHorizon.startYear}</th><th>{dpeHorizon.endYear}</th></tr></thead>
                      <tbody>
                        {['A','B','C','D','E','F','G','NR'].map((cl)=>(
                          <tr key={cl}><td><DpeBadge cl={cl}/></td><td>{fmtNum(dpeHorizon.avantE[cl]||0)}</td><td>{fmtNum(dpeHorizon.apresE[cl]||0)}</td></tr>
                        ))}
                      </tbody>
                    </table>
                    <table className="ce-table">
                      <thead><tr><th>GES</th><th>{dpeHorizon.startYear}</th><th>{dpeHorizon.endYear}</th></tr></thead>
                      <tbody>
                        {['A','B','C','D','E','F','G','NR'].map((cl)=>(
                          <tr key={cl}><td><DpeBadge cl={cl}/></td><td>{fmtNum(dpeHorizon.avantG[cl]||0)}</td><td>{fmtNum(dpeHorizon.apresG[cl]||0)}</td></tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                  <p style={{fontSize:'.68rem',color:'var(--ce-vert-fonce)',marginTop:10,lineHeight:1.5}}>
                    Projection selon les opérations de cette résidence (bascule « Inclure les opérations identifiées » prise en compte), même méthodologie de cascade que la trajectoire de décarbonation globale (§8.2).
                  </p>
                </div>
              )}
              {!dpeHorizon && (
                <div className="ce-card" style={{background:'var(--ce-saumon)'}}>
                  Grille de gains DPE introuvable dans ce fichier : la projection à 10 ans n'est pas disponible pour cette résidence.
                </div>
              )}
            </div>
          )}
          {tab==='suivi' && (
            <div className="ce-card">
              <textarea disabled placeholder="Non disponible en V1 (lecture seule — pas d'édition des données sources)" style={{width:'100%',minHeight:120,border:'1.5px solid #dfeae6',borderRadius:8,padding:10,fontFamily:'var(--ce-font)',color:'#9fb3ae',resize:'vertical'}}></textarea>
            </div>
          )}
        </div>
      </div>
    </React.Fragment>
  );
}

/* ---------------- App racine ---------------- */
function App({currentUser, onLogout}){
  const [data, setData] = useState(null);
  const [simOperations, setSimOperationsRaw] = useState([]);
  const [budgetLignes, setBudgetLignesRaw] = useState([]);
  const [offreNouvelleLgt, setOffreNouvelleLgtRaw] = useState({});
  // §Phase 6 — seuils des histogrammes CRD/Autofinancement/VNC : {crd:{parRes:[b1,b2,b3], parLgt:[...]}, ...},
  // seulement peuplé pour les indicateurs/modes explicitement personnalisés par l'utilisateur (une
  // sauvegarde plus ancienne sans ce champ retombe sur les seuils par défaut calculés depuis les
  // données, cf. ViewFinance) — même principe de compatibilité ascendante que budgetLignes.
  const [financeSeuils, setFinanceSeuilsRaw] = useState({});
  // §Phase 7.2 — vues personnalisées du pivot ({id, nom, dataset, rowKey, colKey, metricKeys, heatmap}),
  // persistées avec la sauvegarde de l'import comme financeSeuils ci-dessus.
  const [customPivotViews, setCustomPivotViewsRaw] = useState([]);
  // §V8 Phase 1 — plan de vente. planVenteLignes remplace l'ancien ventesSimulees comme SEULE source
  // de vérité ; l'ancien format n'est plus un état, il est reconstruit à l'écriture par
  // planVenteToLegacyVentes() pour rester relisible par une version antérieure de l'outil.
  const [planVenteLignes, setPlanVenteLignesRaw] = useState([]);
  const [objectifsVente, setObjectifsVenteRaw] = useState({});   // { 2026: {logements, produit} }
  const [ventesRealisees, setVentesRealiseesRaw] = useState({}); // idem, années ≤ coupure Actuel
  const [criteresVenteConfig, setCriteresVenteConfigRaw] = useState(null); // null = défaut Cellance
  const [includeIdentifiees, setIncludeIdentifiees] = useState(true);
  const [dirty, setDirty] = useState(false);
  const [filters, setFilters] = useState({commune:'',secteur:'',famille:'',dpe:'',qpv:''});
  const [activeTab, setActiveTab] = useState('ensemble');
  const [selectedResidence, setSelectedResidence] = useState(null);
  const [currentSaveId, setCurrentSaveId] = useState(null); // id de la sauvegarde partagée dont provient l'import actuellement ouvert (null si import Excel frais)
  const [showSaveModal, setShowSaveModal] = useState(false);
  const [saveToast, setSaveToast] = useState(null);
  const [baseImport, setBaseImport] = useState(null); // version "base" chargée en parallèle, lecture seule (cf. spec comparaison inline)
  const [savesCount, setSavesCount] = useState(0);
  const [baseRefreshTick, setBaseRefreshTick] = useState(0);

  useEffect(()=>{
    let cancelled = false;
    (async()=>{
      // idbGetAll rejette si la session a expiré (12h) : sans ce try/catch, le rejet restait non
      // intercepté (base import/compteur silencieusement figés, sans message d'erreur) — au lieu de la
      // redirection vers l'écran de connexion normalement déclenchée ailleurs par onUnauthorized.
      try {
        const all = await idbGetAll();
        const baseRaw = all.find((r)=>r.estBase) || null;
        // §V8 §10.5 — les migrations s'appliquent aussi à la version « base », pas seulement à l'import
        // courant : une base antérieure à la V8 serait sinon comparée sur un champ inexistant.
        const base = baseRaw? Object.assign({}, baseRaw, {budgetLignes: migrateBudgetLignes(baseRaw), planVenteLignes: migratePlanVente(baseRaw)}) : null;
        if (!cancelled){ setBaseImport(base); setSavesCount(all.length); }
      } catch(e){ /* déjà géré globalement : apiFetch déclenche onUnauthorized/l'écran de connexion sur 401 */ }
    })();
    return ()=>{ cancelled = true; };
  }, [baseRefreshTick]);

  // Avertit avant fermeture d'onglet/rafraîchissement s'il reste des modifications de simulation non
  // sauvegardées (sinon perdues sans aucun avertissement — même risque que goToImportScreen ci-dessous,
  // mais pour une navigation hors de l'app plutôt qu'un simple changement d'écran interne).
  useEffect(()=>{
    if (!dirty) return;
    const handler = (e)=>{ e.preventDefault(); e.returnValue = ''; };
    window.addEventListener('beforeunload', handler);
    return ()=>window.removeEventListener('beforeunload', handler);
  }, [dirty]);

  function onLoaded(d){
    setData(d);
    setSimOperationsRaw(d.operations.map((o)=>Object.assign({},o)));
    setBudgetLignesRaw([]);
    setOffreNouvelleLgtRaw({});
    // §V8 Phase 1 — le plan de vente n'est pas vide à l'import : il est alimenté par les colonnes
    // vente de la Base de cotation et, quand l'onglet existe, par l'échéancier de « 5. Cessions
    // identifiées ». Les objectifs et le réalisé, eux, n'ont aucune source dans les fichiers.
    setPlanVenteLignesRaw(buildPlanVenteInitial(d.residences, d.cessionsParResCode));
    setObjectifsVenteRaw({});
    setVentesRealiseesRaw({});
    setCriteresVenteConfigRaw(null);
    setFinanceSeuilsRaw({});
    setCustomPivotViewsRaw([]);
    setDirty(false);
    setActiveTab('ensemble');
    setSelectedResidence(null);
    setCurrentSaveId(null);
    // Sans cette réinitialisation, un filtre laissé actif sur un import précédent (ex. Classe DPE)
    // reste appliqué silencieusement au nouveau fichier importé, qui peut sembler avoir beaucoup
    // moins de résidences que réellement présentes dans le fichier.
    setFilters({commune:'',secteur:'',famille:'',dpe:'',qpv:''});
    setBaseRefreshTick((t)=>t+1); // rafraîchit la version base (elle a pu changer depuis un autre onglet/écran)
    const avertissements = [];
    if (d.duplicateCodes && d.duplicateCodes.length){
      const n = d.duplicateCodes.length;
      avertissements.push(`${n} code${n>1?'s':''} de résidence en doublon dans le fichier importé (${d.duplicateCodes.slice(0,5).join(', ')}${n>5?'…':''}) — seule la première occurrence de chaque code a été conservée.`);
    }
    // §V8 Phase 1.2 — les lignes de cessions non rattachées ne sont jamais silencieusement ignorées.
    if (d.cessionsOrphelines){
      const n = d.cessionsOrphelines;
      avertissements.push(`${n} ligne${n>1?'s':''} de « 5. Cessions identifiées » n'${n>1?'ont':'a'} pas pu être rattachée${n>1?'s':''} à une résidence (ni par code, ni par nom) — leur échéancier n'est pas repris au plan de vente.`);
    }
    if (avertissements.length){
      setSaveToast('Attention : ' + avertissements.join(' '));
      setTimeout(()=>setSaveToast(null), 12000);
    }
  }
  function onRestoreSave(rec){
    setData(rec.data);
    setSimOperationsRaw((rec.simOperations||[]).map((o)=>Object.assign({},o)));
    setBudgetLignesRaw(migrateBudgetLignes(rec));
    setOffreNouvelleLgtRaw(rec.offreNouvelleLgt || {});
    // §V8 Phase 1.3 — migration à la LECTURE : une sauvegarde antérieure à la V8 ne porte que
    // ventesSimulees, sans aucune dimension année.
    setPlanVenteLignesRaw(migratePlanVente(rec));
    setObjectifsVenteRaw(rec.objectifsVente || {});
    setVentesRealiseesRaw(rec.ventesRealisees || {});
    setCriteresVenteConfigRaw(rec.criteresVenteConfig || null);
    setFinanceSeuilsRaw(rec.financeSeuils || {});
    setCustomPivotViewsRaw(rec.customPivotViews || []);
    setIncludeIdentifiees(rec.includeIdentifiees!==undefined? rec.includeIdentifiees : true);
    setDirty(false);
    setActiveTab('ensemble');
    setSelectedResidence(null);
    setCurrentSaveId(rec.id);
    setFilters({commune:'',secteur:'',famille:'',dpe:'',qpv:''});
    setBaseRefreshTick((t)=>t+1);
  }
  function goToImportScreen(){
    // `dirty` (simulation modifiée depuis le dernier chargement/sauvegarde) n'était consulté nulle
    // part avant d'abandonner l'état en mémoire : un clic réflexe sur "Importer un autre fichier"
    // perdait silencieusement tout le travail de simulation non sauvegardé.
    if (dirty && !window.confirm('Des modifications non sauvegardées seront perdues si vous importez un autre fichier. Continuer ?')) return;
    setData(null); setCurrentSaveId(null);
  }
  function setOperations(next){ setSimOperationsRaw(next); setDirty(true); }
  function setBudgetLignes(next){ setBudgetLignesRaw(next); setDirty(true); }
  function setOffreNouvelleLgt(next){ setOffreNouvelleLgtRaw(next); setDirty(true); }
  function setPlanVenteLignes(next){ setPlanVenteLignesRaw(next); setDirty(true); }
  function setObjectifsVente(next){ setObjectifsVenteRaw(next); setDirty(true); }
  function setVentesRealisees(next){ setVentesRealiseesRaw(next); setDirty(true); }
  function setCriteresVenteConfig(next){ setCriteresVenteConfigRaw(next); setDirty(true); }
  function setFinanceSeuils(next){ setFinanceSeuilsRaw(next); setDirty(true); }
  function setCustomPivotViews(next){ setCustomPivotViewsRaw(next); setDirty(true); }
  // Réinitialiser, c'est revenir au contenu du FICHIER, pas au vide : le plan de vente est donc
  // reconstruit depuis l'import (colonnes vente + échéancier de cessions), comme à l'ouverture.
  function resetSimulation(){ setSimOperationsRaw(data.operations.map((o)=>Object.assign({},o))); setBudgetLignesRaw([]); setOffreNouvelleLgtRaw({}); setPlanVenteLignesRaw(buildPlanVenteInitial(data.residences, data.cessionsParResCode)); setObjectifsVenteRaw({}); setVentesRealiseesRaw({}); setCriteresVenteConfigRaw(null); setFinanceSeuilsRaw({}); setCustomPivotViewsRaw([]); setIncludeIdentifiees(true); setDirty(false); }

  async function doSaveCurrent(name, asNew){
    // idbGet (comme idbPut) rejette désormais si la session a expiré (12h) : englobé dans le même
    // try/catch que le reste, sinon un rejet non intercepté ici faisait échouer la sauvegarde en
    // silence (aucun toast), en particulier après une longue session de travail.
    try {
      const existing = (!asNew && currentSaveId) ? await idbGet(currentSaveId) : null;
      const record = buildSaveRecord({
        id: existing? existing.id : undefined,
        nom: name,
        nomFichierSource: data.fileName,
        gabaritComplet: data.gabaritComplet,
        nbCols: data.nbCols,
        data, simOperations, budgetLignes, offreNouvelleLgt,
        ventesSimulees: planVenteToLegacyVentes(planVenteLignes),
        planVenteLignes, objectifsVente, ventesRealisees, criteresVenteConfig,
        includeIdentifiees, financeSeuils, customPivotViews,
        estBase: existing? existing.estBase : false,
        dateCreation: existing? existing.dateCreation : undefined,
      });
      await idbPut(record);
      setCurrentSaveId(record.id);
      setShowSaveModal(false);
      setSaveToast('Import sauvegardé sous « '+name+' ».');
      setBaseRefreshTick((t)=>t+1);
      // Sans ce reset, l'indicateur "modifications non sauvegardées" (isModified={dirty}, transmis à
      // ViewInvestissements) continuait d'afficher un état modifié juste après une sauvegarde réussie —
      // décrédibilisant l'indicateur pour la fois suivante où il compte vraiment.
      setDirty(false);
    } catch (e){
      setSaveToast("Échec de la sauvegarde (connexion au service de sauvegarde partagée impossible).");
    }
    setTimeout(()=>setSaveToast(null), 4000);
  }

  // Mémorisé pour garder une référence stable entre deux rendus tant que data/filters n'ont pas
  // changé : sinon chaque rendu de App (ex. ouverture de la fiche résidence) recrée ce tableau, ce
  // qui force LeafletMap (cf. ViewCarto) à reconstruire tous les marqueurs et recentrer la carte.
  const filteredResidences = useMemo(()=> data? applyFilters(data.residences, filters) : [], [data, filters]);

  // §14 — filtres transversaux appliqués aussi à la version "base" des comparaisons inline
  // (ViewCotation, ViewInvestissements, ViewDecarbonation) : calculé une seule fois ici plutôt que
  // dans chacune des 3 vues, pour ne prendre aucun risque de divergence entre elles. budgetLignes
  // n'est pas rattaché à des résidences précises : non filtré, transmis tel quel via Object.assign.
  const hasUsableBase = !!(baseImport && baseImport.data && baseImport.id!==currentSaveId);
  const baseFilteredResidences = useMemo(
    () => hasUsableBase ? applyFilters(baseImport.data.residences, filters) : [],
    [baseImport, filters, hasUsableBase]
  );
  const baseFilteredCodes = useMemo(
    () => new Set(baseFilteredResidences.map((r) => r.code)),
    [baseFilteredResidences]
  );
  const baseFilteredOperations = useMemo(
    () => hasUsableBase ? (baseImport.simOperations || []).filter((o) => baseFilteredCodes.has(o.resCode)) : [],
    [baseImport, baseFilteredCodes, hasUsableBase]
  );
  const baseImportFiltered = useMemo(() => {
    if (!hasUsableBase) return null;
    return Object.assign({}, baseImport, {
      data: Object.assign({}, baseImport.data, { residences: baseFilteredResidences }),
      simOperations: baseFilteredOperations,
    });
  }, [baseImport, baseFilteredResidences, baseFilteredOperations, hasUsableBase]);

  // Référence stable tant que son contenu ne change pas réellement : un littéral inline recréé à
  // chaque rendu de App casserait la mémoïsation en cascade de ViewComparatif (kpiOf/investByYear/
  // dpeShareByYear/opsDiff), qui recalculerait alors tout (dont computeTrajectory sur l'ensemble du
  // portefeuille) à chaque re-render de App, même sans rapport avec l'onglet Comparatif actif.
  // Doit être déclaré AVANT le retour anticipé ci-dessous (règle des Hooks : un Hook ne peut pas être
  // appelé seulement quand `data` est défini, sous peine de "Rendered more hooks than during the
  // previous render" au premier chargement d'un fichier).
  const currentSnapshot = useMemo(()=> data ? ({
    nom: 'Import actuel — '+data.fileName,
    data, simOperations, budgetLignes, includeIdentifiees,
    nomFichierSource: data.fileName, gabaritComplet: data.gabaritComplet,
  }) : null, [data, simOperations, budgetLignes, includeIdentifiees]);

  if (!data){
    return <ImportScreen onLoaded={onLoaded} onRestore={onRestoreSave} onBaseChanged={()=>setBaseRefreshTick((t)=>t+1)} currentUser={currentUser} onLogout={onLogout} />;
  }

  const filteredCodes = new Set(filteredResidences.map((r)=>r.code));
  // resCode===null : opération/vente venant d'être ajoutée, pas encore assignée à une résidence
  // (§9.3/§12 — champs vides à la création) — toujours visible, quels que soient les filtres
  // transverses actifs, sinon la ligne disparaît de la vue dès sa création.
  const filteredOperations = simOperations.filter((o)=>o.resCode===null || filteredCodes.has(o.resCode));
  const hasCarto = data.residences.some((r)=>r.adresse && String(r.adresse).trim());
  const hasFinance = data.residences.some((r)=>r.crd!==null || r.autofinancement!==null || r.vnc!==null);
  const hasCompare = savesCount>=2 || !!baseImport;

  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      {showSaveModal && (
        <SaveImportModal
          defaultName={data.fileName.replace(/\.xlsx$/i,'') + ' — ' + new Date().toLocaleDateString('fr-FR')}
          hasExisting={!!currentSaveId}
          onCancel={()=>setShowSaveModal(false)}
          onSave={(name)=>doSaveCurrent(name, false)}
          onSaveAs={(name)=>doSaveCurrent(name, true)}
        />
      )}
      {saveToast && (
        <div style={{position:'fixed',bottom:20,left:'50%',transform:'translateX(-50%)',zIndex:70,background:'var(--ce-vert-tres-fonce)',color:'#fff',padding:'10px 20px',borderRadius:8,fontSize:'.8rem',boxShadow:'0 4px 16px rgba(0,0,0,.25)'}}>{saveToast}</div>
      )}
      <div className="ce-sticky-shell">
        <div className="ce-header">
          <CeLogo/>
          <span className="ce-header-title">Outil interactif d'exploration du <b>PSP</b> — {data.fileName}</span>
          <div style={{marginLeft:'auto',display:'flex',gap:10,alignItems:'center'}}>
            <span className="ce-badge" style={{background:'var(--ce-vert-clair)', color:'var(--ce-vert-tres-fonce)'}}>
              {data.residences.length} résidences · {data.nbCols} colonnes
            </span>
            <button className="ce-btn-outline ce-btn-sm" style={{color:'#fff',borderColor:'#fff'}} onClick={()=>setShowSaveModal(true)}>💾 Sauvegarder cet import</button>
            <button className="ce-btn-outline ce-btn-sm" style={{color:'#fff',borderColor:'#fff'}} onClick={goToImportScreen}>Importer un autre fichier</button>
            <span style={{color:'#fff',fontSize:'.76rem',opacity:.85}}>{currentUser && currentUser.email}</span>
            <button className="ce-btn-outline ce-btn-sm" style={{color:'#fff',borderColor:'#fff'}} onClick={onLogout}>Déconnexion</button>
          </div>
        </div>


        <FilterBar residences={data.residences} filters={filters} setFilters={setFilters} />
        <Nav active={activeTab} setActive={setActiveTab} hasFinance={hasFinance} hasCarto={hasCarto} hasCompare={hasCompare} hasAdmin={!!(currentUser && currentUser.isAdmin)} />
      </div>

      <div style={{flex:1}}>
        {activeTab==='ensemble' && <ViewEnsemble residences={filteredResidences} operations={filteredOperations} onSelectResidence={setSelectedResidence} />}
        {activeTab==='cotation' && <ViewCotation residences={filteredResidences} onSelectResidence={setSelectedResidence} operations={filteredOperations} includeIdentifiees={includeIdentifiees} baseImport={baseImportFiltered} gainsGrid={data.gainsGrid} hasGainsGrid={data.hasGainsGrid} offreNouvelleLgt={offreNouvelleLgt} />}
        {activeTab==='invest' && (
          <ViewInvestissements
            residences={filteredResidences}
            operations={filteredOperations}
            setOperations={(next)=>{
              const otherCodesOps = simOperations.filter((o)=>o.resCode!==null && !filteredCodes.has(o.resCode));
              setOperations(otherCodesOps.concat(next));
            }}
            includeIdentifiees={includeIdentifiees}
            setIncludeIdentifiees={(v)=>{setIncludeIdentifiees(v); setDirty(true);}}
            budgetLignes={budgetLignes}
            setBudgetLignes={setBudgetLignes}
            gainsGrid={data.gainsGrid}
            isModified={dirty}
            onReset={resetSimulation}
            baseImport={baseImportFiltered}
            onSelectResidence={setSelectedResidence}
          />
        )}
        {activeTab==='dpe' && (
          <ViewDecarbonation
            residences={filteredResidences}
            operations={filteredOperations}
            gainsGrid={data.gainsGrid}
            hasGainsGrid={data.hasGainsGrid}
            includeIdentifiees={includeIdentifiees}
            baseImport={baseImportFiltered}
            onSelectResidence={setSelectedResidence}
            // V9 §1 — referentiels lus à l'import (absents des sauvegardes antérieures : la vue
            // retombe alors sur refsDecarbonationDefaut()), livraisons d'offre nouvelle et plan de
            // vente, filtrés comme partout ailleurs par les filtres transverses.
            refsDecarbo={data.refsDecarbo}
            offreNouvelleLgt={offreNouvelleLgt}
            planVenteLignes={planVenteLignes.filter((v)=>v.resCode===null || filteredCodes.has(v.resCode))}
          />
        )}
        {activeTab==='finance' && <ViewFinance residences={filteredResidences} onSelectResidence={setSelectedResidence} financeSeuils={financeSeuils} setFinanceSeuils={setFinanceSeuils} />}
        {activeTab==='offre' && (
          <ViewOffreNouvelle
            residences={filteredResidences}
            operations={filteredOperations}
            offreNouvelleLgt={offreNouvelleLgt}
            setOffreNouvelleLgt={setOffreNouvelleLgt}
          />
        )}
        {activeTab==='vente' && (
          <ViewVente
            residences={filteredResidences}
            planVenteLignes={planVenteLignes.filter((v)=>v.resCode===null || filteredCodes.has(v.resCode))}
            setPlanVenteLignes={(next)=>{
              const horsFiltre = planVenteLignes.filter((v)=>v.resCode!==null && !filteredCodes.has(v.resCode));
              setPlanVenteLignes(horsFiltre.concat(next));
            }}
          />
        )}
        {activeTab==='pivot' && <ViewPivot residences={filteredResidences} operations={filteredOperations} onSelectResidence={setSelectedResidence} customPivotViews={customPivotViews} setCustomPivotViews={setCustomPivotViews} />}
        {activeTab==='carto' && <ViewCarto residences={filteredResidences} allResidences={data.residences} onSelectResidence={setSelectedResidence} />}
        {activeTab==='compare' && (
          <ViewComparatif currentSnapshot={currentSnapshot} />
        )}
        {activeTab==='admin' && <ViewAdmin currentUser={currentUser} />}
      </div>

      <div className="ce-footer">Cellance - Confidentiel</div>
      <ResidenceDrawer residence={selectedResidence} operations={simOperations} residences={filteredResidences} onClose={()=>setSelectedResidence(null)} gainsGrid={data.gainsGrid} hasGainsGrid={data.hasGainsGrid} includeIdentifiees={includeIdentifiees} baseImport={baseImportFiltered} />
    </div>
  );
}

/* ---------------- Authentification (écrans de connexion / premier compte) ----------------
   Toute l'app est derrière le login (cf. AuthGate plus bas) : ces deux écrans partagent la même mise
   en page que ImportScreen (même en-tête, même pied de page) pour rester cohérents visuellement avant
   même qu'un fichier soit importé. */
function LoginScreen({onLoggedIn}){
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState(null);
  const [loading, setLoading] = useState(false);

  async function submit(e){
    e.preventDefault();
    setError(null); setLoading(true);
    try {
      const json = await apiJson('/api/auth/login', {method:'POST', body: JSON.stringify({email, password})});
      onLoggedIn(json.user);
    } catch(err){ setError(err.message || 'Échec de la connexion.'); }
    setLoading(false);
  }

  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      <div className="ce-header"><CeLogo/><span className="ce-header-title">Outil interactif d'exploration du <b>PSP</b></span></div>
      <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
        <form onSubmit={submit} className="ce-card" style={{maxWidth:360,width:'100%'}}>
          <h1 style={{fontSize:'1.1rem',fontWeight:700,color:'var(--ce-vert-tres-fonce)',marginBottom:16}}>Connexion</h1>
          <div style={{display:'flex',flexDirection:'column',gap:4,marginBottom:12}}>
            <label style={{fontSize:'.72rem',fontWeight:700,color:'var(--ce-vert-fonce)'}}>Email</label>
            <input className="ce-input" type="email" required autoFocus value={email} onChange={(e)=>setEmail(e.target.value)} />
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:4,marginBottom:16}}>
            <label style={{fontSize:'.72rem',fontWeight:700,color:'var(--ce-vert-fonce)'}}>Mot de passe</label>
            <input className="ce-input" type="password" required value={password} onChange={(e)=>setPassword(e.target.value)} />
          </div>
          {error && <div style={{fontSize:'.76rem',color:'var(--ce-corail)',marginBottom:12}}>{error}</div>}
          <button className="ce-btn" type="submit" disabled={loading} style={{width:'100%'}}>{loading?'Connexion…':'Se connecter'}</button>
        </form>
      </div>
      <div className="ce-footer">Cellance - Confidentiel</div>
    </div>
  );
}

function BootstrapScreen({onLoggedIn}){
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [confirm, setConfirm] = useState('');
  const [error, setError] = useState(null);
  const [loading, setLoading] = useState(false);

  async function submit(e){
    e.preventDefault();
    setError(null);
    if (password.length<8){ setError('Mot de passe : 8 caractères minimum.'); return; }
    if (password!==confirm){ setError('Les deux mots de passe ne correspondent pas.'); return; }
    setLoading(true);
    try {
      const json = await apiJson('/api/auth/bootstrap', {method:'POST', body: JSON.stringify({email, password})});
      onLoggedIn(json.user);
    } catch(err){ setError(err.message || 'Échec de la création du compte.'); }
    setLoading(false);
  }

  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      <div className="ce-header"><CeLogo/><span className="ce-header-title">Outil interactif d'exploration du <b>PSP</b></span></div>
      <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
        <form onSubmit={submit} className="ce-card" style={{maxWidth:400,width:'100%'}}>
          <h1 style={{fontSize:'1.1rem',fontWeight:700,color:'var(--ce-vert-tres-fonce)',marginBottom:6}}>Créer le premier compte administrateur</h1>
          <p style={{fontSize:'.76rem',color:'var(--ce-vert-fonce)',marginBottom:16,lineHeight:1.5}}>
            Aucun compte n'existe encore sur cet outil. Ce premier compte sera administrateur et pourra
            ensuite créer les autres comptes depuis l'onglet « Administration ».
          </p>
          <div style={{display:'flex',flexDirection:'column',gap:4,marginBottom:12}}>
            <label style={{fontSize:'.72rem',fontWeight:700,color:'var(--ce-vert-fonce)'}}>Email</label>
            <input className="ce-input" type="email" required autoFocus value={email} onChange={(e)=>setEmail(e.target.value)} />
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:4,marginBottom:12}}>
            <label style={{fontSize:'.72rem',fontWeight:700,color:'var(--ce-vert-fonce)'}}>Mot de passe (8 caractères minimum)</label>
            <input className="ce-input" type="password" required value={password} onChange={(e)=>setPassword(e.target.value)} />
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:4,marginBottom:16}}>
            <label style={{fontSize:'.72rem',fontWeight:700,color:'var(--ce-vert-fonce)'}}>Confirmer le mot de passe</label>
            <input className="ce-input" type="password" required value={confirm} onChange={(e)=>setConfirm(e.target.value)} />
          </div>
          {error && <div style={{fontSize:'.76rem',color:'var(--ce-corail)',marginBottom:12}}>{error}</div>}
          <button className="ce-btn" type="submit" disabled={loading} style={{width:'100%'}}>{loading?'Création…':'Créer le compte'}</button>
        </form>
      </div>
      <div className="ce-footer">Cellance - Confidentiel</div>
    </div>
  );
}

/* ---------------- Administration (gestion des comptes, réservée aux administrateurs) ---------------- */
function ViewAdmin({currentUser}){
  const [users, setUsers] = useState(null);
  const [error, setError] = useState(null);
  const [newEmail, setNewEmail] = useState('');
  const [newPassword, setNewPassword] = useState('');
  const [newIsAdmin, setNewIsAdmin] = useState(false);
  const [resetPasswordFor, setResetPasswordFor] = useState(null);
  const [resetPasswordValue, setResetPasswordValue] = useState('');
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);

  async function refresh(){
    try { const json = await apiJson('/api/admin/users'); setUsers(json.users||[]); }
    catch(err){ setError(err.message); }
  }
  useEffect(()=>{ refresh(); }, []);

  async function addUser(e){
    e.preventDefault();
    setError(null);
    try {
      await apiJson('/api/admin/users', {method:'POST', body: JSON.stringify({email:newEmail, password:newPassword, isAdmin:newIsAdmin})});
      setNewEmail(''); setNewPassword(''); setNewIsAdmin(false);
      await refresh();
    } catch(err){ setError(err.message); }
  }
  async function toggleAdmin(u){
    setError(null);
    try { await apiJson('/api/admin/users/'+u.id, {method:'PATCH', body: JSON.stringify({isAdmin: !u.is_admin})}); await refresh(); }
    catch(err){ setError(err.message); }
  }
  async function submitResetPassword(id){
    setError(null);
    if (resetPasswordValue.length<8){ setError('Mot de passe : 8 caractères minimum.'); return; }
    try {
      await apiJson('/api/admin/users/'+id, {method:'PATCH', body: JSON.stringify({password:resetPasswordValue})});
      setResetPasswordFor(null); setResetPasswordValue('');
    } catch(err){ setError(err.message); }
  }
  async function deleteUser(id){
    setError(null);
    try { await apiJson('/api/admin/users/'+id, {method:'DELETE'}); setConfirmDeleteId(null); await refresh(); }
    catch(err){ setError(err.message); }
  }

  return (
    <div style={{padding:24,display:'flex',flexDirection:'column',gap:20}}>
      <div className="ce-card">
        <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700,marginBottom:12}}>Ajouter un utilisateur</h2>
        <form onSubmit={addUser} style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'flex-end'}}>
          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            <label style={{fontSize:'.66rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>Email</label>
            <input className="ce-input" type="email" required value={newEmail} onChange={(e)=>setNewEmail(e.target.value)} style={{width:220}} />
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            <label style={{fontSize:'.66rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>Mot de passe</label>
            <input className="ce-input" type="password" required value={newPassword} onChange={(e)=>setNewPassword(e.target.value)} style={{width:180}} />
          </div>
          <label style={{fontSize:'.78rem',color:'var(--ce-vert-fonce)',display:'flex',alignItems:'center',gap:6,cursor:'pointer'}}>
            <input type="checkbox" checked={newIsAdmin} onChange={(e)=>setNewIsAdmin(e.target.checked)} />Administrateur
          </label>
          <button className="ce-btn ce-btn-sm" type="submit">+ Ajouter</button>
        </form>
      </div>
      {error && <div style={{fontSize:'.78rem',color:'var(--ce-corail)'}}>{error}</div>}
      <div className="ce-card">
        <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700,marginBottom:12}}>Utilisateurs{users? ' ('+users.length+')' : ''}</h2>
        {!users && <div style={{fontSize:'.8rem',color:'#9fb3ae'}}>Chargement…</div>}
        {users && (
          <div style={{overflowX:'auto'}}>
          <table className="ce-table">
            <thead><tr><th>Email</th><th>Rôle</th><th>Créé le</th><th></th><th></th><th></th></tr></thead>
            <tbody>
              {users.map((u)=>(
                <tr key={u.id}>
                  <td>{u.email}{u.id===currentUser.id? <span style={{color:'#9fb3ae'}}> (vous)</span> : null}</td>
                  <td><span className={"ce-badge"+(u.is_admin?"":" ce-badge-outline")}>{u.is_admin? 'Administrateur':'Utilisateur'}</span></td>
                  <td>{new Date(u.created_at).toLocaleDateString('fr-FR')}</td>
                  <td><button className="ce-btn-outline ce-btn-sm" onClick={()=>toggleAdmin(u)}>{u.is_admin? 'Retirer admin':'Rendre admin'}</button></td>
                  <td>
                    {resetPasswordFor===u.id ? (
                      <span style={{display:'flex',gap:4,alignItems:'center'}}>
                        <input className="ce-input" type="password" placeholder="Nouveau mot de passe" style={{width:160}} value={resetPasswordValue} onChange={(e)=>setResetPasswordValue(e.target.value)} />
                        <button className="ce-btn ce-btn-sm" onClick={()=>submitResetPassword(u.id)}>OK</button>
                        <button className="ce-btn-outline ce-btn-sm" onClick={()=>{setResetPasswordFor(null); setResetPasswordValue('');}}>Annuler</button>
                      </span>
                    ) : (
                      <button className="ce-btn-outline ce-btn-sm" onClick={()=>{setResetPasswordFor(u.id); setResetPasswordValue('');}}>Changer le mot de passe</button>
                    )}
                  </td>
                  <td>
                    {confirmDeleteId===u.id ? (
                      <span style={{display:'flex',gap:4}}>
                        <button className="ce-btn-corail ce-btn-sm" onClick={()=>deleteUser(u.id)}>Confirmer</button>
                        <button className="ce-btn-outline ce-btn-sm" onClick={()=>setConfirmDeleteId(null)}>Annuler</button>
                      </span>
                    ) : (
                      <button className="ce-btn-outline ce-btn-sm" onClick={()=>setConfirmDeleteId(u.id)}>Supprimer</button>
                    )}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          </div>
        )}
      </div>
    </div>
  );
}

// Porte d'entrée de toute l'app : vérifie la session au montage (cookie httpOnly, jamais lu
// directement — cf. /api/auth/me), affiche l'écran de création du 1er compte s'il n'en existe encore
// aucun, sinon l'écran de connexion, sinon l'app. Enregistre aussi le handler appelé par apiFetch sur
// un 401 (survenu n'importe où dans l'app, y compris longtemps après le chargement initial si le JWT
// de 12h expire en cours de session) pour renvoyer immédiatement vers la connexion.
function AuthGate(){
  const [status, setStatus] = useState('loading'); // 'loading'|'bootstrap'|'login'|'authed'
  const [currentUser, setCurrentUser] = useState(null);

  useEffect(()=>{
    setUnauthorizedHandler(()=>{ setCurrentUser(null); setStatus('login'); });
    (async()=>{
      const me = await apiJson('/api/auth/me').catch(()=>null);
      if (me && me.user){ setCurrentUser(me.user); setStatus('authed'); return; }
      try {
        const st = await apiJson('/api/auth/status');
        setStatus(st.hasUsers ? 'login' : 'bootstrap');
      } catch(e){ setStatus('login'); }
    })();
  }, []);

  function handleLoggedIn(user){ setCurrentUser(user); setStatus('authed'); }
  async function handleLogout(){
    try { await apiJson('/api/auth/logout', {method:'POST'}); } catch(e){ /* on déconnecte quand même côté UI */ }
    setCurrentUser(null); setStatus('login');
  }

  if (status==='loading') return <div style={{minHeight:'100vh',background:'var(--ce-vert-tres-clair)'}}></div>;
  if (status==='bootstrap') return <BootstrapScreen onLoggedIn={handleLoggedIn} />;
  if (status==='login') return <LoginScreen onLoggedIn={handleLoggedIn} />;
  return <App currentUser={currentUser} onLogout={handleLogout} />;
}

function MissingLibsScreen({missing}){
  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:24,fontFamily:'sans-serif'}}>
      <div style={{maxWidth:520,background:'#fff',border:'1px solid #F8C6BA',borderRadius:10,padding:24}}>
        <h1 style={{color:'#FF8364',fontSize:'1.1rem',marginBottom:10}}>Chargement incomplet</h1>
        <p style={{fontSize:'.85rem',color:'#1C3A35',lineHeight:1.6}}>
          Les bibliothèques suivantes n'ont pas pu être chargées depuis leur CDN : <b>{missing.join(', ')}</b>.
          L'outil ne peut pas fonctionner sans elles. Vérifiez votre connexion Internet, ou que votre réseau
          (proxy / pare-feu d'entreprise) autorise l'accès à <code>cdnjs.cloudflare.com</code>, puis rechargez cette page.
        </p>
      </div>
    </div>
  );
}

const missingLibs = [];
if (typeof XLSX==='undefined') missingLibs.push('SheetJS (lecture Excel)');
if (typeof Chart==='undefined') missingLibs.push('Chart.js (graphiques)');
if (typeof L==='undefined') missingLibs.push('Leaflet (cartographie)');

ReactDOM.createRoot(document.getElementById('root')).render(missingLibs.length ? <MissingLibsScreen missing={missingLibs} /> : <AuthGate />);
</script>
