<script id="engine-source">
/* =========================================================================
   MOTEUR DE PARSING PSP — lecture des fichiers Excel côté client (SheetJS)
   Aucune donnée n'est transmise à un serveur : tout le traitement a lieu
   dans le navigateur. Le mapping est construit par détection de colonnes
   (recherche du nom d'en-tête), pas par position fixe, afin de rester
   robuste aux variations d'un fichier bailleur à l'autre (cf. cahier des
   charges §11 — variabilité des fichiers clients réels).
   ========================================================================= */

function ceStripAccents(s){ return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function ceNorm(s){
  if (s===null||s===undefined) return '';
  return ceStripAccents(String(s)).toLowerCase().replace(/[°''']/g,'').trim().replace(/\s+/g,' ');
}
// Certains fichiers PSP utilisent "NR" / "N/A" comme convention explicite pour une donnée
// manquante ou non pertinente (cf. onglet Paramétrage) : Number("NR") vaut NaN, ce qui
// s'affichait tel quel ("NaN") dans l'interface. On distingue explicitement l'absence
// de donnée (null) d'une vraie valeur numérique.
function ceNum(v){
  if (v===null||v===undefined||v==='') return null;
  if (typeof v==='number') return isNaN(v)? null : v;
  const n = ceNorm(v);
  if (n==='nr'||n==='n/a'||n==='na'||n==='') return null;
  const num = Number(String(v).replace(',','.'));
  return isNaN(num)? null : num;
}
function sheetToMatrix(ws){ return XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null}); }
function findHeaderRow(matrix, testFn, maxScan){
  const lim = Math.min(maxScan||25, matrix.length);
  for (let r=0;r<lim;r++){ if (testFn(matrix[r]||[])) return r; }
  return -1;
}
function findColIndex(headerRow, patterns){
  for (const p of patterns){ for (let i=0;i<headerRow.length;i++){ if (p.test(ceNorm(headerRow[i]))) return i; } }
  return -1;
}
function findAllColIndices(headerRow, pattern){
  const out=[]; for (let i=0;i<headerRow.length;i++){ if (pattern.test(ceNorm(headerRow[i]))) out.push(i); } return out;
}
function findSheet(sheetNames, pattern){ return sheetNames.find((n)=>pattern.test(ceNorm(n))); }

/* Colonnes de la Base de cotation vérifiées le 2026-07-10 sur les deux fichiers de référence du
   projet (Base patrimoniale_PSP STANDARD v2.xlsx — gabarit complet, 299 colonnes ; Base
   patrimoniale_PSP_OPH_Aubervilliers V4.xlsx — gabarit réduit, 233 colonnes), utilisées pour
   l'enrichissement V4 de la Vue d'ensemble (cf. cahier des charges V4 §Tâche A) :
   - "Année de construction" : présente et peuplée dans les deux fichiers (col. 27 / col. 27).
   - "QPV / Hors QPV" : présente dans les deux fichiers mais convention de valeur différente d'un
     fichier à l'autre — STANDARD utilise "QPV" (vide sinon), Aubervilliers utilise "OUI"/"NON"
     explicites. D'où une détection par exclusion (tout sauf vide/"non"/"hors qpv") plutôt qu'une
     égalité stricte à une valeur unique.
   - "DPE Principal" : présente et peuplée dans les deux fichiers (col. 42 / col. 34).
   - "typologie" (Individuel/Collectif, une valeur par résidence) : présente dans les deux fichiers
     mais seulement peuplée dans STANDARD (40/40) ; entièrement vide dans Aubervilliers (0/84) bien
     que la colonne existe — dégradation gracieuse attendue.
   - "Mode énergie chauffage" / "Mode énergie ECS" : présentes et peuplées dans les deux fichiers.
   - "dont conventionné" / "dont foyer / résidences social" : présentes dans les deux fichiers mais
     partiellement peuplées uniquement (comptes par résidence, pas un statut unique) — utilisées en
     somme (comme nbLgt), jamais comme statut catégoriel unique.
   - "PLU" : non trouvée dans les deux fichiers fournis (aucun en-tête ne s'en approche). TODO :
     colonne non trouvée, à confirmer avec Jules — non codée, aucun indicateur PLU dans l'UI.
   - "Financement" (PLAI/PLUS/HLM) : présente et peuplée dans STANDARD (40/40) mais entièrement vide
     dans Aubervilliers (0/84) — non retenue pour un indicateur dédié V4 (redondante avec la
     conventionnalité issue de "dont conventionné", et absente d'un des deux fichiers de référence).
   - "Moyenne - Performance Carbonne" : présente uniquement dans STANDARD, absente d'Aubervilliers —
     réservée à la Tâche B (fiche résidence), non utilisée en Tâche A. */
function parseBaseCotation(matrix){
  const headerRowIdx = findHeaderRow(matrix, (row)=>row.some((c)=>ceNorm(c)==='code de residence'));
  if (headerRowIdx===-1) return null;
  const header = matrix[headerRowIdx];
  const codeCol = findColIndex(header,[/^code de residence$/]);
  const dataRows = matrix.slice(headerRowIdx+1).filter((r)=>r && r[codeCol]!==null && r[codeCol]!==undefined && r[codeCol]!=='');

  const idx = {
    code: codeCol,
    nom: findColIndex(header,[/^nom residence$/,/^nom du groupe$/]),
    adresse: findColIndex(header,[/^adresse$/,/compilation adresse/]),
    commune: findColIndex(header,[/^commune$/]),
    secteur: findColIndex(header,[/^secteur$/]),
    agence: findColIndex(header,[/^agence$/]),
    codePostal: findColIndex(header,[/^code postal$/]),
    qpv: findColIndex(header,[/qpv/]),
    nbLgt: findColIndex(header,[/^nb lgt ou eq/, /^nb lgts? \(/, /^nb lgts?$/]),
    dpeEnergie: findColIndex(header,[/^dpe energie$/, /^etiquette dpe energie/]),
    dpeGES: findColIndex(header,[/^dpe ges$/, /^etiquette dpe ges/]),
    attractivite: findColIndex(header,[/^note attractivite globale$/, /^note attractivite totale/, /^note de service rendu/]),
    technique: findColIndex(header,[/^moyenne - technique$/, /^note technique globale$/, /^note etat technique$/]),
    familleAttract: findColIndex(header,[/^famille attractivite$/]),
    familleTechnique: findColIndex(header,[/^famille etat technique$/]),
    anneeConstruction: findColIndex(header,[/^annee de construction$/]),
    dpePrincipal: findColIndex(header,[/^dpe principal$/]),
    typeBati: findColIndex(header,[/^typologie$/]),
    modeChauffage: findColIndex(header,[/^mode energie chauffage$/]),
    modeECS: findColIndex(header,[/^mode energie ecs$/]),
    dontConventionne: findColIndex(header,[/^dont conventionne$/]),
    dontFoyer: findColIndex(header,[/^dont foyer/]),
    financement: findColIndex(header,[/^financement$/]),
    codeInsee: findColIndex(header,[/^code insee$/]),
    shab: findColIndex(header,[/^shab \(m.?\)$/]),
    corpro: findColIndex(header,[/^corpro$/]),
    // Colonne brute en %, distincte de la note de cotation "Taux de vacance" du groupe
    // critereGroups.economique (échelle 0/33/66/100, cf. CRITERE_GROUP_DEFS ci-dessous) — motif
    // ancré en préfixe pour absorber le suffixe millésimé côté Aubervilliers ("... (en %) 2024"),
    // sans jamais matcher la variante bare (cotation) ni la variante "hors démolition".
    tauxVacance: findColIndex(header,[/^taux de vacance \(en %\)/]),
    autofinancementLgt: findColIndex(header,[/^autofinancement \(en.*pa lgt\)/, /^autofi\s*\/\s*lgt$/]),
    // Tâche D — Offre nouvelle & Vente : pas d'onglet ONI/ONNI dédié dans les fichiers de référence
    // (confirmé le 2026-07-10, cf. commentaire au-dessus de parseBaseCotation) ; la partie "Vente"
    // est en réalité déjà portée par ces colonnes de la Base de cotation elle-même (confirmées dans
    // Base patrimoniale_PSP STANDARD v2.xlsx, partiellement peuplées — 3 à 5 résidences sur 40 ;
    // colonnes présentes mais vides dans Aubervilliers V4, sauf "Montant au m²").
    planVente: findColIndex(header,[/^plan de vente$/]),
    conventionneVente: findColIndex(header,[/^conventionne \/ non conventionne$/]),
    nbLgtMiseVente: findColIndex(header,[/^nombre de logement a la mise en vente$/]),
    nbLgtRestantVente: findColIndex(header,[/^nombre de logement restant$/]),
    prixVenteBrut: findColIndex(header,[/^prix de vente/]),
    montantVenteM2: findColIndex(header,[/^montant au m/]),
    typeVente: findColIndex(header,[/^type de vente$/]),
    // Données financières (CRD / Autofinancement / VNC) — colonnes vérifiées le 2026-07-10 sur les
    // deux fichiers de référence, présentes et bien peuplées dans les deux (niveau résidence
    // uniquement : la feuille "1. Actions P et I" ne fait que répéter la valeur résidence sur
    // chaque ligne d'opération via formule, ce n'est pas une donnée distincte par opération — donc
    // pas de granularité "par opération" dans ces fichiers, seulement "par résidence"). Motifs
    // conçus pour cibler la valeur totale par résidence, pas la déclinaison "par logement" (colonnes
    // distinctes également présentes mais non retenues ici, ex. "CRD (en € / lgt)" / "CRD / lgt").
    crd: findColIndex(header,[/^crd\s*\(en.*res/, /^crd\s*\(\d{4}\)$/]),
    vnc: findColIndex(header,[/^vnc\s*\(en.*res/, /^vnc\s*\(\d{4}\)$/]),
    autofinancement: findColIndex(header,[/^autofinancement \(en.*res/, /^autofinancement \d{2}\/\d{2}/]),
  };
  const typoCols = {};
  ['T1','T2','T3','T4','T5','T6+'].forEach((t)=>{ typoCols[t]=findColIndex(header,[new RegExp('^'+t.toLowerCase().replace('+','\\+')+'$')]); });

  // Colonnes "notes" génériques (au-delà d'Attractivité/État technique) pouvant servir de
  // critère de segmentation : détectées par mot-clé d'en-tête plutôt que par position fixe,
  // pour rester robustes d'un fichier bailleur à l'autre. Chaque colonne garde son échelle
  // native (0-3, 0-10, sur 100...) ; c'est la vue de segmentation qui la ramène en % de son
  // maximum observé pour appliquer des seuils comparables (§ segmentation en 9 familles).
  const NOTE_PATTERNS = [
    /^note /,
    /^moyenne .*(technique|attractivit|climat|economique|segmentation)/,
    /^etat technique (du logement|facades)/,
    /^niveau de loyers$/,
    /^indice /,
    /^score /,
  ];
  const noteCols = [];
  header.forEach((h,c)=>{
    if (c===idx.attractivite || c===idx.technique) return;
    const n = ceNorm(h);
    if (!n) return;
    if (NOTE_PATTERNS.some((p)=>p.test(n))) noteCols.push({ label: String(h).trim(), col: c });
  });

  idx.performanceCarbone = findColIndex(header,[/^moyenne.*performance carbon/]);

  // Sous-critères de cotation détaillés (Tâche B — fiche résidence, radars/graphiques). Colonnes
  // vérifiées le 2026-07-10 sur Base patrimoniale_PSP STANDARD v2.xlsx (gabarit complet) : présentes
  // et peuplées. Absentes (ou nommées différemment) dans Base patrimoniale_PSP_OPH_Aubervilliers V4.xlsx
  // (gabarit réduit / ancien PSP antérieur au gabarit Cellance actuel) — chaque groupe ne s'affichera
  // donc, en pratique, que sur des fichiers construits sur le gabarit complet récent. Détection par nom
  // normalisé (ceNorm), jamais par position, pour rester robuste si l'ordre des colonnes varie.
  const CRITERE_GROUP_DEFS = [
    { key:'environnement', label:"Environnement urbain", patterns:[
      [/^accessibilite et desserte du quartier$/,'Accessibilité et desserte du quartier'],
      [/^equipements commerciaux et service de proximite/,'Équipements commerciaux et services de proximité'],
      [/^image du quartier$/,'Image du quartier'],
      [/^nuisance et vie sociale$/,'Nuisance et vie sociale'],
    ]},
    { key:'programme', label:"Programme", patterns:[
      [/^les abords et espaces verts$/,'Abords et espaces verts'],
      [/^les stationnements$/,'Stationnements'],
      [/^les parties communes$/,'Parties communes'],
      [/^les equipements techniques collectifs$/,'Équipements techniques collectifs'],
      [/^les logements$/,'Logements'],
      [/^accessibilite \/ adaptabilite pmr$/,'Accessibilité / Adaptabilité PMR'],
    ]},
    { key:'technique', label:"État technique", patterns:[
      [/^facades, toitures et couvertures$/,'Façades, toitures et couvertures'],
      [/^menuiserie$/,'Menuiserie'],
      [/^parties communes$/,'Parties communes'],
      [/^parties privatives$/,'Parties privatives'],
      [/^structure$/,'Structure'],
    ]},
    { key:'carbone', label:"Performance carbone", patterns:[
      [/^etiquette dpe \(nouveau\)$/,'Étiquette DPE (nouveau)'],
      [/^systeme de chauffage$/,'Système de chauffage'],
      [/^capacite de decarbonation$/,'Capacité de décarbonation'],
      [/^emissions absolues/,'Émissions absolues (tCO2e)'],
    ]},
    { key:'climat', label:"Confort d'été / Résilience climatique", patterns:[
      [/^pompe a chaleur reversible/,'Pompe à chaleur réversible / climatisation'],
      [/^vagues de chaleur$/,'Vagues de chaleur'],
      [/^vulnerabilite des residents$/,'Vulnérabilité des résidents'],
      [/^rga$/,'RGA'],
      [/^incendie$/,'Incendie'],
      [/^inondation$/,'Inondation'],
    ]},
    { key:'economique', label:"Performance économique", patterns:[
      [/^commercialite$/,'Commercialité'],
      [/^taux de vacance$/,'Taux de vacance'],
      [/^taux d.?impayes$/,"Taux d'impayés"],
      [/^niveau de loyers$/,'Niveau de loyers'],
      [/^autofinancement$/,'Autofinancement'],
      [/^capitaux restants dus$/,'Capitaux restants dus'],
      [/^taux de rotation$/,'Taux de rotation'],
      [/^valeur nette comptable$/,'Valeur nette comptable'],
      [/^ecart loyers plafonds \/ pratiques$/,'Écart loyers plafonds / pratiqués'],
    ]},
    { key:'social', label:"Fragilité sociale", patterns:[
      [/^taux de famille monoparentale$/,'Taux de familles monoparentales'],
      [/^ressources < a 60% du plafonds plus$/,'Ressources < 60% du plafond PLUS'],
      [/^ressources < a 20% du plafonds plus$/,'Ressources < 20% du plafond PLUS'],
      [/^taux de chomeurs et inactifs$/,'Taux de chômeurs et inactifs'],
      [/^vieillissement$/,'Vieillissement'],
    ]},
  ];
  const critereGroupCols = {};
  CRITERE_GROUP_DEFS.forEach((g)=>{
    const cols = [];
    g.patterns.forEach(([pattern,label])=>{
      const c = findColIndex(header,[pattern]);
      if (c>=0) cols.push({label, col:c});
    });
    if (cols.length>=3) critereGroupCols[g.key] = { label:g.label, cols };
  });

  const distRuns=[];
  for (let i=0;i<header.length-7;i++){
    const seq = header.slice(i,i+8).map(ceNorm);
    if (seq[0]==='a'&&seq[1]==='b'&&seq[2]==='c'&&seq[3]==='d'&&seq[4]==='e'&&seq[5]==='f'&&seq[6]==='g'&&seq[7]==='nr') distRuns.push(i);
  }

  const typeColIdxs = findAllColIndices(header,/^type de travaux$/);
  const opBlocks = typeColIdxs.map((start,bi)=>{
    const nextStart = typeColIdxs[bi+1]!==undefined? typeColIdxs[bi+1] : Math.min(header.length, start+12);
    const span={};
    for (let c=start;c<nextStart;c++){ const key=ceNorm(header[c]); if(key) span[key]=c; }
    let anneeIdx=-1, statut='programme';
    for (const k in span){ if (/^annee os travaux previsionnelle$/.test(k)){ anneeIdx=span[k]; statut='identifie'; break; } }
    if (anneeIdx===-1){ for (const k in span){ if (/^annee d.?os$/.test(k)){ anneeIdx=span[k]; statut='programme'; break; } } }
    let montantIdx=-1;
    for (const k in span){ if (/^cout de revient ttc$/.test(k)){ montantIdx=span[k]; break; } }
    if (montantIdx===-1){ for (const k in span){ if (/^montant total en ttc$/.test(k)){ montantIdx=span[k]; break; } } }
    let logIdx=-1;
    for (const k in span){ if (/^logements concernes$/.test(k)){ logIdx=span[k]; break; } }
    // "Nature des travaux" porte le libellé précis de l'action (ex. "Réha niv. 2", "Ravalement de
    // façade") — c'est CETTE granularité qui correspond aux lignes de la grille de gains DPE et de
    // la matrice de projection État technique, pas "Type de travaux" qui n'est qu'une catégorie
    // large (RC / Réha. / Chgt de vecteur / Démolition). Cf. resolveGain() et
    // computeTechniqueProjection() plus bas.
    let natureIdx=-1;
    for (const k in span){ if (/^nature des travaux$/.test(k)){ natureIdx=span[k]; break; } }
    // "Année de fin de travaux" — absente de tous les blocs sur le fichier Aubervilliers (vérifié le
    // 2026-07-16, cf. Étape 0) : anneeFinIdx reste -1 pour ce fichier, o.anneeFin est alors toujours
    // null à l'import (dégradation gracieuse), mais reste éditable manuellement dans l'UI (§9.2).
    let anneeFinIdx=-1;
    for (const k in span){ if (/^annee de fin de travaux$/.test(k)){ anneeFinIdx=span[k]; break; } }
    return { typeIdx:start, natureIdx, anneeIdx, anneeFinIdx, montantIdx, logIdx, statut };
  });

  const residences = dataRows.map((row)=>{
    const res = {
      code: row[idx.code], nom: idx.nom>=0? row[idx.nom]:null, adresse: idx.adresse>=0? row[idx.adresse]:null,
      commune: idx.commune>=0? row[idx.commune]:null, secteur: idx.secteur>=0? row[idx.secteur]:null,
      agence: idx.agence>=0? row[idx.agence]:null, codePostal: idx.codePostal>=0? row[idx.codePostal]:null,
      qpv: idx.qpv>=0? row[idx.qpv]:null,
      nbLgt: idx.nbLgt>=0? (Number(row[idx.nbLgt])||0):0,
      dpeEnergie: idx.dpeEnergie>=0? row[idx.dpeEnergie]:null, dpeGES: idx.dpeGES>=0? row[idx.dpeGES]:null,
      attractivite: idx.attractivite>=0? ceNum(row[idx.attractivite]):null,
      technique: idx.technique>=0? ceNum(row[idx.technique]):null,
      familleAttract: idx.familleAttract>=0? row[idx.familleAttract]:null,
      familleTechnique: idx.familleTechnique>=0? row[idx.familleTechnique]:null,
      anneeConstruction: idx.anneeConstruction>=0? (Number(row[idx.anneeConstruction])||null):null,
      dpePrincipal: idx.dpePrincipal>=0? row[idx.dpePrincipal]:null,
      typeBati: idx.typeBati>=0? row[idx.typeBati]:null,
      modeChauffage: idx.modeChauffage>=0? row[idx.modeChauffage]:null,
      modeECS: idx.modeECS>=0? row[idx.modeECS]:null,
      dontConventionne: idx.dontConventionne>=0? ceNum(row[idx.dontConventionne]):null,
      dontFoyer: idx.dontFoyer>=0? ceNum(row[idx.dontFoyer]):null,
      performanceCarbone: idx.performanceCarbone>=0? ceNum(row[idx.performanceCarbone]):null,
      planVente: idx.planVente>=0? row[idx.planVente]:null,
      conventionneVente: idx.conventionneVente>=0? row[idx.conventionneVente]:null,
      nbLgtMiseVente: idx.nbLgtMiseVente>=0? ceNum(row[idx.nbLgtMiseVente]):null,
      nbLgtRestantVente: idx.nbLgtRestantVente>=0? ceNum(row[idx.nbLgtRestantVente]):null,
      prixVenteBrut: idx.prixVenteBrut>=0? ceNum(row[idx.prixVenteBrut]):null,
      montantVenteM2: idx.montantVenteM2>=0? ceNum(row[idx.montantVenteM2]):null,
      typeVente: idx.typeVente>=0? row[idx.typeVente]:null,
      crd: idx.crd>=0? ceNum(row[idx.crd]):null,
      vnc: idx.vnc>=0? ceNum(row[idx.vnc]):null,
      autofinancement: idx.autofinancement>=0? ceNum(row[idx.autofinancement]):null,
      financement: idx.financement>=0? row[idx.financement]:null,
      codeInsee: idx.codeInsee>=0? row[idx.codeInsee]:null,
      shab: idx.shab>=0? ceNum(row[idx.shab]):null,
      corpro: idx.corpro>=0? row[idx.corpro]:null,
      tauxVacance: idx.tauxVacance>=0? ceNum(row[idx.tauxVacance]):null,
      autofinancementLgt: idx.autofinancementLgt>=0? ceNum(row[idx.autofinancementLgt]):null,
      notes: {},
      critereGroups: {},
    };
    Object.keys(critereGroupCols).forEach((key)=>{
      const g = critereGroupCols[key];
      const vals = g.cols.map((gc)=>({ label:gc.label, value: ceNum(row[gc.col]) }));
      if (vals.some((v)=>v.value!==null)) res.critereGroups[key] = { label:g.label, values: vals };
    });
    noteCols.forEach((nc)=>{ res.notes[nc.label] = ceNum(row[nc.col]); });
    Object.keys(typoCols).forEach((t)=>{ res[t] = typoCols[t]>=0? (Number(row[typoCols[t]])||0):null; });
    if (distRuns[0]!==undefined){ res.distEnergie={}; ['A','B','C','D','E','F','G','NR'].forEach((cl,i)=>{res.distEnergie[cl]=Number(row[distRuns[0]+i])||0;}); }
    if (distRuns[1]!==undefined){ res.distGES={}; ['A','B','C','D','E','F','G','NR'].forEach((cl,i)=>{res.distGES[cl]=Number(row[distRuns[1]+i])||0;}); }
    // Certains fichiers renseignent une étiquette DPE globale par résidence (colonnes
    // "DPE énergie"/"DPE GES") mais laissent la répartition détaillée par logement (A-G/NR)
    // entièrement vide (tout en NR) : sans ce repli, les graphiques de répartition et la
    // trajectoire de décarbonation traiteraient ces logements comme "non renseignés" alors
    // que leur classe est en réalité connue.
    if (res.distEnergie){
      const connu = ['A','B','C','D','E','F','G'].reduce((s,cl)=>s+(res.distEnergie[cl]||0),0);
      if (connu===0 && res.distEnergie.NR>0 && /^[A-G]$/.test(res.dpeEnergie||'')){
        res.distEnergie = {A:0,B:0,C:0,D:0,E:0,F:0,G:0,NR:0};
        res.distEnergie[res.dpeEnergie] = res.nbLgt;
      }
    }
    if (res.distGES){
      const connu = ['A','B','C','D','E','F','G'].reduce((s,cl)=>s+(res.distGES[cl]||0),0);
      if (connu===0 && res.distGES.NR>0 && /^[A-G]$/.test(res.dpeGES||'')){
        res.distGES = {A:0,B:0,C:0,D:0,E:0,F:0,G:0,NR:0};
        res.distGES[res.dpeGES] = res.nbLgt;
      }
    }
    if (!res.commune && res.adresse){
      const m = String(res.adresse).match(/(\d{5})\s+([A-ZÀ-ÖØ-Þ' -]{3,})\s*$/);
      if (m) res.commune = m[2].trim();
    }
    if (!res.nom){
      // Sans colonne de nom dédiée, on retombe sur l'adresse : on retire le code postal +
      // la commune en fin de chaîne (déjà affichés dans leur propre colonne) et on tronque
      // sur une frontière de mot plutôt qu'en plein milieu.
      let base = res.adresse ? String(res.adresse).replace(/\s*\d{5}\s+[A-ZÀ-ÖØ-Þ' -]{3,}\s*$/,'').trim() : '';
      if (!base) base = res.adresse ? String(res.adresse) : ('Résidence '+res.code);
      res.nom = base.length>42 ? base.slice(0,42).replace(/\s+\S*$/,'')+'…' : base;
    }
    return res;
  });

  let opId=0;
  const operations=[];
  dataRows.forEach((row)=>{
    const code = row[idx.code];
    opBlocks.forEach((b)=>{
      const type = row[b.typeIdx];
      if (type!==null && type!==undefined && String(type).trim()!==''){
        const natureVal = b.natureIdx>=0? row[b.natureIdx] : null;
        operations.push({
          id:'op'+(opId++), resCode:code, type:String(type).trim(), statut:b.statut,
          nature: (natureVal!==null && natureVal!==undefined && String(natureVal).trim()!=='')? String(natureVal).trim() : null,
          annee: b.anneeIdx>=0? (Number(row[b.anneeIdx])||null):null,
          anneeFin: b.anneeFinIdx>=0? (Number(row[b.anneeFinIdx])||null):null,
          montant: b.montantIdx>=0? (Number(row[b.montantIdx])||0):0,
          logements: b.logIdx>=0? (Number(row[b.logIdx])||null):null,
          origine:'import',
        });
      }
    });
  });
  return { headerRowIdx, idx, typoCols, distRuns, opBlocks, residences, operations, nbCols: header.length };
}

function parseGainsDPE(matrix){
  const headerRowIdx = findHeaderRow(matrix, (row)=>row.some((c)=>ceNorm(c)==='energie'));
  if (headerRowIdx===-1) return null;
  const header = matrix[headerRowIdx];
  const energieAnchor = header.findIndex((c)=>ceNorm(c)==='energie');
  let gesAnchor=-1;
  for (let i=energieAnchor+1;i<header.length;i++){ if (ceNorm(header[i])==='ges'){ gesAnchor=i; break; } }
  const energieStart = energieAnchor+1, gesStart = gesAnchor+1;
  const grid={};
  for (let r=headerRowIdx+1;r<matrix.length;r++){
    const row = matrix[r]||[]; const label=row[0];
    if (!label || typeof label!=='string') continue;
    const eVals=[]; for (let i=0;i<7;i++) eVals.push(row[energieStart+i]);
    if (!eVals.some((v)=>typeof v==='number')) continue;
    const gVals=[]; for (let i=0;i<7;i++) gVals.push(gesAnchor>=0? row[gesStart+i]: null);
    grid[label.trim()] = {
      energie:{A:eVals[0]||0,B:eVals[1]||0,C:eVals[2]||0,D:eVals[3]||0,E:eVals[4]||0,F:eVals[5]||0,G:eVals[6]||0},
      ges:{A:gVals[0]||0,B:gVals[1]||0,C:gVals[2]||0,D:gVals[3]||0,E:gVals[4]||0,F:gVals[5]||0,G:gVals[6]||0},
    };
  }
  return grid;
}


/* ---- Cascade DPE (cahier des charges §8.2) ---- */
const CLASS_ORDER = ['G','F','E','D','C','B','A'];
function classIndex(c){ const i=CLASS_ORDER.indexOf(c); return i===-1? null : i; }
// Bug corrigé le 2026-07-10 : la grille de gains DPE (et, de la même façon, la matrice de
// projection État technique plus bas) est indexée au niveau "Nature des travaux" (ex. "Réha niv. 2",
// "Ravalement de façade") — "Type de travaux" seul (RC / Réha. / Chgt de vecteur / Démolition,
// cf. idx.typoCols) est une catégorie trop large pour matcher ces lignes. Avant ce correctif,
// resolveGain() ne recevait que o.type et ne matchait donc jamais rien en dehors des démolitions :
// la trajectoire DPE ne reflétait que les sorties de parc (démolitions), jamais les gains réels des
// travaux simulés. On tente d'abord o.nature (résidences importées), puis o.type en repli (cas des
// opérations ajoutées/éditées manuellement dans l'outil, où seul un champ "type" est proposé — cf.
// ViewInvestissements — et qui utilise déjà directement les libellés de la grille comme options).
function findGridKey(label, gainsGrid){
  if (!label) return null;
  if (gainsGrid[label]) return label;
  const n = ceNorm(label);
  for (const k in gainsGrid){ if (ceNorm(k)===n) return k; }
  return null;
}
function resolveGain(op, gainsGrid, metric){
  const type = typeof op==='string'? op : op.type;
  const nature = typeof op==='string'? null : op.nature;
  const n2 = ceNorm(type);
  if (/^demol/.test(n2)) return 'DEMOL';
  const natureKey = findGridKey(nature, gainsGrid);
  if (natureKey) return gainsGrid[natureKey][metric];
  const typeKey = findGridKey(type, gainsGrid);
  if (typeKey) return gainsGrid[typeKey][metric];
  return null;
}
function hasKnownDpeGain(op, gainsGrid){
  return resolveGain(op, gainsGrid, 'energie')!==null;
}
function computeTrajectory(residences, operations, gainsGrid, years, metric, includeIdentifiees){
  const distKey = metric==='energie'? 'distEnergie':'distGES';
  const state={}, alive={};
  residences.forEach((r)=>{ state[r.code]=Object.assign({A:0,B:0,C:0,D:0,E:0,F:0,G:0,NR:0}, r[distKey]||{}); alive[r.code]=true; });
  const opsByResYear={};
  operations.forEach((o)=>{
    if (!includeIdentifiees && o.statut==='identifie') return;
    if (o.annee===null || o.annee===undefined) return;
    if (!opsByResYear[o.resCode]) opsByResYear[o.resCode]={};
    if (!opsByResYear[o.resCode][o.annee]) opsByResYear[o.resCode][o.annee]=[];
    opsByResYear[o.resCode][o.annee].push(o);
  });
  const timeline={};
  years.forEach((y)=>{
    residences.forEach((r)=>{
      if (!alive[r.code]) return;
      const ops = (opsByResYear[r.code] && opsByResYear[r.code][y]) || [];
      ops.forEach((o)=>{
        const gain = resolveGain(o, gainsGrid, metric);
        if (gain==='DEMOL'){ alive[r.code]=false; return; }
        if (gain===null || gain===undefined) return;
        const dist = state[r.code];
        const next = {A:0,B:0,C:0,D:0,E:0,F:0,G:0,NR:dist.NR||0};
        CLASS_ORDER.forEach((cl)=>{
          const n = dist[cl]||0; if (n<=0) return;
          const idx = classIndex(cl); const g = gain[cl]||0;
          const newCl = CLASS_ORDER[Math.min(6, idx+g)];
          next[newCl] = (next[newCl]||0) + n;
        });
        state[r.code]=next;
      });
    });
    const agg={A:0,B:0,C:0,D:0,E:0,F:0,G:0,NR:0};
    residences.forEach((r)=>{ if (alive[r.code]){ const d=state[r.code]; Object.keys(agg).forEach((cl)=>agg[cl]+=(d[cl]||0)); } });
    timeline[y]=agg;
  });
  return timeline;
}

function familyOfType(type){
  const n = ceNorm(type);
  if (/^demol/.test(n)) return 'Démolition';
  if (/^reha/.test(n)) return 'Réhabilitation';
  if (/passage|vecteur|chgt de mode|chaudiere condensation/.test(n)) return 'Changement de vecteur';
  if (n==='rc') return 'Remplacement de composants';
  return 'Remplacement de composants';
}

/* ---------------- Matrice de projection État technique (hypothèse par défaut, non issue du
   fichier importé — cf. disclaimer affiché dans l'UI ; aucune grille de correspondance travaux ->
   état technique n'existe dans les fichiers de référence du projet, contrairement au DPE). Validée
   avec Jules le 2026-07-10 : Remplacement de composants (RC) -> saut direct à 100 sur le(s)
   sous-critère(s) concerné(s) ; Réhabilitation (niv. 1 à 4) -> effet progressif, chaque niveau fixant
   sa propre valeur cible sur son propre périmètre de sous-critères (pas cumulatif entre niveaux).
   Indexée par "Nature des travaux" (mêmes libellés que la grille de gains DPE), pas par "Type de
   travaux" — même principe que le correctif resolveGain() ci-dessus. */
const TECH_SUBCRITERES = ['Façades, toitures et couvertures','Menuiserie','Parties communes','Parties privatives','Structure'];
const TECH_RC_MAP = {
  'refection toiture et isolation des combles': ['Façades, toitures et couvertures'],
  'ravalement de facade': ['Façades, toitures et couvertures'],
  'isolation thermique exterieure': ['Façades, toitures et couvertures'],
  'changement des menuiseries exterieures': ['Menuiserie'],
  'changement des portes palieres': ['Menuiserie'],
  'remises aux normes electrique - incendie - gaz (parties communes)': ['Parties communes'],
  'refection parties communes': ['Parties communes'],
  'refection vmc': ['Parties communes'],
  'changement sanitaire et reprise salle de bains': ['Parties privatives'],
};
const TECH_REHA_MAP = {
  'reha non thermique': { subs:['Parties privatives'], value:66 },
  'reha niv. 1': { subs:['Façades, toitures et couvertures','Menuiserie'], value:33 },
  'reha niv. 2': { subs:['Façades, toitures et couvertures','Menuiserie','Parties communes'], value:66 },
  'reha niv. 3': { subs:['Façades, toitures et couvertures','Menuiserie','Parties communes','Parties privatives'], value:100 },
  'reha niv. 4': { subs:['Façades, toitures et couvertures','Menuiserie','Parties communes','Parties privatives','Structure'], value:100 },
};
// Résidences sans le détail des 5 sous-critères (moyenne globale seule) : on ne projette rien
// (retour null) plutôt qu'un résultat approximatif — cf. points de vigilance de la spec.
function computeTechniqueProjection(residence, operations, includeIdentifiees){
  const group = residence.critereGroups && residence.critereGroups.technique;
  if (!group) return null;
  const state = {};
  group.values.forEach((v)=>{ state[v.label] = v.value; });
  if (TECH_SUBCRITERES.some((l)=>state[l]===null || state[l]===undefined)) return null;
  // Référence "avant" = moyenne des 5 sous-critères eux-mêmes (pas residence.technique, qui peut
  // moyenner un périmètre de sous-critères plus large selon le fichier — cf. colonnes "Sous-critère
  // 26-35" additionnelles dans le gabarit complet) : on compare ce qui est réellement recalculé.
  const initialTechnique = TECH_SUBCRITERES.reduce((s,l)=>s+state[l],0) / TECH_SUBCRITERES.length;

  const ops = operations.filter((o)=>o.resCode===residence.code)
    .filter((o)=>includeIdentifiees || o.statut==='programme')
    .filter((o)=>o.annee!==null && o.annee!==undefined);

  let demolished = false;
  ops.forEach((o)=>{
    if (demolished) return;
    if (/^demol/.test(ceNorm(o.type))){ demolished = true; return; }
    const key = ceNorm(o.nature || o.type);
    if (TECH_RC_MAP[key]){ TECH_RC_MAP[key].forEach((sub)=>{ state[sub] = Math.max(state[sub], 100); }); return; }
    if (TECH_REHA_MAP[key]){ const {subs, value} = TECH_REHA_MAP[key]; subs.forEach((sub)=>{ state[sub] = Math.max(state[sub], value); }); }
  });

  if (demolished) return { demolished:true, values:null, technique:null, initialTechnique };
  const values = TECH_SUBCRITERES.map((l)=>({label:l, value:state[l]}));
  const technique = values.reduce((s,v)=>s+v.value,0) / values.length;
  return { demolished:false, values, technique, initialTechnique };
}
</script>

<script type="text/babel" data-presets="react,env">
const {useState, useEffect, useMemo, useRef, useCallback} = React;

const DPE_COLORS = {A:'#009261',B:'#58D88B',C:'#CDF3DC',D:'#FAEFE2',E:'#F8C6BA',F:'#FF8364',G:'#1C3A35',NR:'#9fb3ae'};
const DPE_TEXT = {A:'#fff',B:'#1C3A35',C:'#1C3A35',D:'#1C3A35',E:'#1C3A35',F:'#fff',G:'#fff',NR:'#1C3A35'};
const PALETTE = ['#009261','#FF8364','#264E46','#58D88B','#F8C6BA','#1C3A35','#CDF3DC'];
const STATUS_COLORS = {good:'#0ca30c', warning:'#fab219', serious:'#ec835a', critical:'#d03b3b', unknown:'#b7b6ae'};

/* ---------------- Géocodage adresse -> lat/lon (cartographie) ----------------
   Utilise l'API publique et gratuite api-adresse.data.gouv.fr (Base Adresse Nationale).
   Seule l'adresse texte de la résidence est envoyée à ce service tiers — aucune autre
   donnée du fichier importé. Les résultats sont mis en cache dans le localStorage du
   navigateur (par adresse normalisée) pour éviter de re-géocoder à chaque session. */
const GEOCODE_CACHE_KEY = 'psp_geocode_cache_v1';
function ceAddrKey(a){ return ceNorm(a||''); }
function loadGeocodeCache(){
  try { return JSON.parse(localStorage.getItem(GEOCODE_CACHE_KEY) || '{}'); } catch(e){ return {}; }
}
function saveGeocodeCache(cache){
  try { localStorage.setItem(GEOCODE_CACHE_KEY, JSON.stringify(cache)); } catch(e){ /* quota / navigation privée : tant pis, pas de cache */ }
}
async function geocodeOneAddress(address){
  const url = 'https://api-adresse.data.gouv.fr/search/?q=' + encodeURIComponent(address) + '&limit=1';
  const res = await fetch(url);
  if (!res.ok) throw new Error('geocoding http '+res.status);
  const json = await res.json();
  const f = json.features && json.features[0];
  if (!f) return null;
  return { lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0], label: f.properties.label, score: f.properties.score };
}
function useGeocoding(residences){
  const [coords, setCoords] = useState({});
  const [progress, setProgress] = useState({done:0, total:0});
  const [status, setStatus] = useState('idle');
  useEffect(()=>{
    if (!residences || !residences.length) { setStatus('done'); return; }
    let cancelled = false;
    const cache = loadGeocodeCache();
    const toFetch = [];
    const initial = {};
    residences.forEach((r)=>{
      if (!r.adresse){ initial[r.code] = null; return; }
      const key = ceAddrKey(r.adresse);
      if (Object.prototype.hasOwnProperty.call(cache,key)) initial[r.code] = cache[key];
      else toFetch.push(r);
    });
    setCoords((prev)=>Object.assign({}, prev, initial));
    if (!toFetch.length){ setStatus('done'); setProgress({done:residences.length, total:residences.length}); return; }
    setStatus('loading');
    setProgress({done: residences.length - toFetch.length, total: residences.length});
    (async()=>{
      for (const r of toFetch){
        if (cancelled) return;
        const key = ceAddrKey(r.adresse);
        let result = null;
        try { result = await geocodeOneAddress(r.adresse); } catch(e){ result = null; }
        cache[key] = result;
        if (!cancelled){
          setCoords((prev)=>Object.assign({}, prev, {[r.code]: result}));
          setProgress((prev)=>({done: prev.done+1, total: prev.total}));
        }
        await new Promise((r2)=>setTimeout(r2, 130));
      }
      saveGeocodeCache(cache);
      if (!cancelled) setStatus('done');
    })();
    return ()=>{ cancelled = true; };
  }, [residences]);
  return {coords, progress, status};
}

/* ---------------- Sauvegarde locale des imports (IndexedDB) ----------------
   Wrapper minimal en IndexedDB natif (pas de librairie externe) : les imports complets (données +
   simulation en cours) peuvent atteindre plusieurs Mo, largement au-delà des ~5-10 Mo de quota
   généralement disponibles pour localStorage — IndexedDB n'a pas cette limitation pratique.
   Portée strictement locale au navigateur du poste (cf. disclaimer dans ImportScreen) :
   aucune de ces données ne quitte le navigateur via ce mécanisme. */
const IDB_DB_NAME = 'psp_tool_db';
const IDB_DB_VERSION = 1;
const IDB_STORE = 'psp_saved_imports';

function idbOpen(){
  return new Promise((resolve, reject)=>{
    if (typeof indexedDB === 'undefined'){ reject(new Error('IndexedDB indisponible dans ce navigateur/contexte.')); return; }
    const req = indexedDB.open(IDB_DB_NAME, IDB_DB_VERSION);
    req.onupgradeneeded = ()=>{
      const db = req.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE, {keyPath:'id'});
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error || new Error('Échec d’ouverture d’IndexedDB'));
  });
}
async function idbGetAll(){
  try {
    const db = await idbOpen();
    return await new Promise((resolve, reject)=>{
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).getAll();
      req.onsuccess = ()=>resolve(req.result || []);
      req.onerror = ()=>reject(req.error);
    });
  } catch (e){ return []; }
}
async function idbGet(id){
  try {
    const db = await idbOpen();
    return await new Promise((resolve, reject)=>{
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get(id);
      req.onsuccess = ()=>resolve(req.result || null);
      req.onerror = ()=>reject(req.error);
    });
  } catch (e){ return null; }
}
async function idbPut(record){
  const db = await idbOpen();
  return await new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(record);
    tx.oncomplete = ()=>resolve(true);
    tx.onerror = ()=>reject(tx.error || new Error('Échec d’écriture (quota de stockage atteint ?)'));
  });
}
async function idbDelete(id){
  const db = await idbOpen();
  return await new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(id);
    tx.oncomplete = ()=>resolve(true);
    tx.onerror = ()=>reject(tx.error);
  });
}
// Un seul import "base" à la fois : logique centralisée ici, jamais dupliquée entre l'écran de
// liste et un éventuel autre point d'entrée (cf. points de vigilance de la spec).
async function idbSetBase(id){
  const all = await idbGetAll();
  for (const rec of all){
    const shouldBeBase = rec.id===id;
    if (!!rec.estBase !== shouldBeBase){
      await idbPut(Object.assign({}, rec, {estBase: shouldBeBase}));
    }
  }
}
function genSaveId(){
  return 'psp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
}
// §8 — budgetLignes remplace l'ancien budgetLibre (objet simple {année:montant}) par un tableau de
// lignes nommées [{id, nom, valeurs:{année:montant}}]. Migration obligatoire à chaque point d'entrée
// où une sauvegarde ancien format peut être relue (import JSON, restauration, version "base"), pour
// que la sauvegarde suivante écrive déjà le nouveau format — jamais seulement à l'affichage.
function migrateBudgetLignes(rec){
  if (rec && Array.isArray(rec.budgetLignes)) return rec.budgetLignes;
  if (rec && rec.budgetLibre && Object.keys(rec.budgetLibre).length){
    return [{id:'migre', nom:'Ligne budgétaire libre', valeurs: rec.budgetLibre}];
  }
  return [];
}
function buildSaveRecord({id, nom, nomFichierSource, gabaritComplet, nbCols, data, simOperations, budgetLignes, offreNouvelleLgt, ventesSimulees, includeIdentifiees, estBase, dateCreation}){
  const now = new Date().toISOString();
  return {
    id: id || genSaveId(),
    nom,
    dateCreation: dateCreation || now,
    dateModification: now,
    estBase: !!estBase,
    nomFichierSource,
    gabaritComplet,
    nbCols,
    data,
    simOperations,
    budgetLignes: budgetLignes || [],
    offreNouvelleLgt: offreNouvelleLgt || {},
    ventesSimulees: ventesSimulees || [],
    includeIdentifiees,
  };
}
function isValidSaveRecord(obj){
  return !!(obj && typeof obj==='object' && obj.data && Array.isArray(obj.data.residences) && Array.isArray(obj.simOperations));
}

function fmtKEur(n){ if(n===null||n===undefined||isNaN(n)) return '—'; return new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Math.round(n/1000))+' k€'; }

/* ---------------- Chart.js wrapper ---------------- */
function ChartCanvas({type, data, options, height}){
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  useEffect(()=>{
    if (!canvasRef.current) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current.getContext('2d'), {type, data, options: Object.assign({
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{labels:{font:{family:'Open Sans',size:11}, color:'#1C3A35'}}},
    }, options||{})});
    return ()=>{ if (chartRef.current) chartRef.current.destroy(); };
  }, [JSON.stringify(data), JSON.stringify(options), type]);
  return <div style={{height: height||280}}><canvas ref={canvasRef}></canvas></div>;
}

/* ---------------- Carte Leaflet (cartographie) ---------------- */
function LeafletMap({markers, height, onSelectResidence}){
  const divRef = useRef(null);
  const mapRef = useRef(null);
  const layerRef = useRef(null);

  useEffect(()=>{
    if (!divRef.current) return;
    const map = L.map(divRef.current, {zoomControl:true});
    map.setView([46.6, 2.4], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);
    mapRef.current = map;
    layerRef.current = L.layerGroup().addTo(map);
    return ()=>{ map.remove(); mapRef.current = null; layerRef.current = null; };
  }, []);

  useEffect(()=>{
    const map = mapRef.current, layer = layerRef.current;
    if (!map || !layer) return;
    layer.clearLayers();
    const pts = [];
    markers.forEach((m)=>{
      const radius = Math.max(6, Math.min(18, 4 + Math.sqrt(m.res.nbLgt||10)*0.85));
      const marker = L.circleMarker([m.lat, m.lon], {
        radius, weight:1.5, color:'#1C3A35', fillColor:m.color, fillOpacity:0.85
      });
      marker.bindTooltip(
        '<b>'+escapeHtml(m.res.nom||m.res.code)+'</b><br/>'+fmtNum(m.res.nbLgt)+' logements'+(m.res.dpeEnergie? ' · DPE '+m.res.dpeEnergie:''),
        {direction:'top', offset:[0,-4]}
      );
      marker.on('click', ()=>onSelectResidence(m.res));
      marker.addTo(layer);
      pts.push([m.lat, m.lon]);
    });
    if (pts.length) map.fitBounds(pts, {padding:[30,30], maxZoom:15});
    setTimeout(()=>map.invalidateSize(), 60);
  }, [markers]);

  return <div ref={divRef} style={{height: height||520, borderRadius:10, overflow:'hidden', position:'relative', zIndex:0}}></div>;
}

/* ---------------- Écran d'import ---------------- */
function ImportScreen({onLoaded, onRestore, onBaseChanged}){
  const [drag, setDrag] = useState(false);
  const [loading, setLoading] = useState(false);
  const [loadingMsg, setLoadingMsg] = useState('Analyse du fichier en cours…');
  const [error, setError] = useState(null);
  const [saves, setSaves] = useState(null); // null = chargement en cours, [] = aucune sauvegarde
  const [renamingId, setRenamingId] = useState(null);
  const [renameValue, setRenameValue] = useState('');
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [importJsonError, setImportJsonError] = useState(null);
  const [opError, setOpError] = useState(null);
  const inputRef = useRef(null);
  const jsonInputRef = useRef(null);
  const workerRef = useRef(null);

  async function refreshSaves(){
    const all = await idbGetAll();
    all.sort((a,b)=> new Date(b.dateModification) - new Date(a.dateModification));
    setSaves(all);
  }
  useEffect(()=>{ refreshSaves(); }, []);

  useEffect(()=>()=>{ if (workerRef.current) workerRef.current.terminate(); }, []);

  async function handleSetBase(id){
    try { await idbSetBase(id); await refreshSaves(); onBaseChanged && onBaseChanged(); }
    catch(e){ setOpError("Impossible de définir cette version comme base."); }
  }
  async function handleDelete(id){
    try { await idbDelete(id); setConfirmDeleteId(null); await refreshSaves(); onBaseChanged && onBaseChanged(); }
    catch(e){ setOpError("Impossible de supprimer cet import."); }
  }
  async function commitRename(id){
    const rec = (saves||[]).find((r)=>r.id===id);
    setRenamingId(null);
    if (!rec) return;
    const nom = renameValue.trim();
    if (!nom || nom===rec.nom) return;
    try { await idbPut(Object.assign({}, rec, {nom, dateModification: new Date().toISOString()})); await refreshSaves(); }
    catch(e){ setOpError("Impossible de renommer cet import."); }
  }
  function handleExport(rec){
    const blob = new Blob([JSON.stringify(rec)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const safeName = (ceNorm(rec.nom).replace(/[^a-z0-9]+/g,'-').replace(/(^-+|-+$)/g,'')) || 'import';
    a.href = url; a.download = 'psp_export_'+safeName+'_'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  }
  function handleImportJsonFile(file){
    setImportJsonError(null);
    const reader = new FileReader();
    reader.onload = async (e)=>{
      let obj;
      try { obj = JSON.parse(e.target.result); } catch(err){ setImportJsonError("Le fichier n'est pas un JSON valide."); return; }
      if (!isValidSaveRecord(obj)){ setImportJsonError("Ce fichier ne correspond pas au format attendu d'une sauvegarde PSP (structure inattendue — clés « data »/« simOperations » manquantes)."); return; }
      const all = await idbGetAll();
      let nom = obj.nom || 'Import importé';
      if (all.some((r)=>r.nom===nom)) nom = nom + ' (import)';
      const record = buildSaveRecord({
        nom, nomFichierSource: obj.nomFichierSource, gabaritComplet: obj.gabaritComplet, nbCols: obj.nbCols,
        data: obj.data, simOperations: obj.simOperations, budgetLignes: migrateBudgetLignes(obj), offreNouvelleLgt: obj.offreNouvelleLgt||{}, ventesSimulees: obj.ventesSimulees||[],
        includeIdentifiees: obj.includeIdentifiees!==undefined? obj.includeIdentifiees : true,
        estBase: false,
      });
      try { await idbPut(record); await refreshSaves(); }
      catch(err){ setImportJsonError("Échec de l'enregistrement local (quota de stockage du navigateur atteint ?)."); }
    };
    reader.onerror = ()=>setImportJsonError("Impossible de lire ce fichier.");
    reader.readAsText(file);
  }

  function buildWorkerSource(){
    const engineSrc = document.getElementById('engine-source').textContent;
    return [
      "importScripts('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');",
      engineSrc,
      "self.onmessage = function(ev){",
      "  try {",
      "    var wb = XLSX.read(ev.data.buffer, {type:'array', cellDates:false});",
      "    var cotationSheetName = findSheet(wb.SheetNames, /base de cotation/);",
      "    if (!cotationSheetName){ self.postMessage({ok:false, reason:'nosheet'}); return; }",
      "    var cotation = parseBaseCotation(sheetToMatrix(wb.Sheets[cotationSheetName]));",
      "    if (!cotation || cotation.residences.length===0){ self.postMessage({ok:false, reason:'noresidences'}); return; }",
      "    var gainsSheetName = findSheet(wb.SheetNames, /referentiel des gains dpe/);",
      "    var gainsGrid = gainsSheetName ? parseGainsDPE(sheetToMatrix(wb.Sheets[gainsSheetName])) : null;",
      "    self.postMessage({ ok:true, result:{",
      "      nbOnglets: wb.SheetNames.length, nbCols: cotation.nbCols,",
      "      residences: cotation.residences, operations: cotation.operations,",
      "      gainsGrid: gainsGrid || {}, hasGainsGrid: !!gainsSheetName",
      "    }});",
      "  } catch(err){ self.postMessage({ok:false, reason:'exception', message: (err && err.message) || String(err)}); }",
      "};",
    ].join('\n');
  }

  function finishWithResult(fileName, result){
    setLoading(false);
    onLoaded(Object.assign({fileName}, result));
  }

  function failWith(reason, message){
    setLoading(false);
    if (reason==='nosheet') setError("Le fichier importé ne contient pas d'onglet « Base de cotation » reconnaissable. Import refusé : le socle minimal n'est pas présent.");
    else if (reason==='noresidences') setError("L'onglet « Base de cotation » a été trouvé mais aucune résidence n'a pu être lue (colonne « Code de Résidence » introuvable ou onglet vide). Import refusé.");
    else if (reason==='timeout') setError("L'analyse du fichier prend anormalement longtemps (plus de 2 minutes) et a été interrompue. Le fichier est peut-être trop volumineux ou corrompu.");
    else setError("Erreur lors de la lecture du fichier" + (message? (' : '+message):'') + ". Vérifiez qu'il s'agit bien d'un fichier PSP au format Excel (.xlsx).");
  }

  function processFileMainThread(file, buffer){
    // secours si les Web Workers sont indisponibles dans ce navigateur
    try {
      const wb = XLSX.read(buffer, {type:'array', cellDates:false});
      const cotationSheetName = findSheet(wb.SheetNames, /base de cotation/);
      if (!cotationSheetName) return failWith('nosheet');
      const cotation = parseBaseCotation(sheetToMatrix(wb.Sheets[cotationSheetName]));
      if (!cotation || cotation.residences.length===0) return failWith('noresidences');
      const gainsSheetName = findSheet(wb.SheetNames, /referentiel des gains dpe/);
      const gainsGrid = gainsSheetName ? parseGainsDPE(sheetToMatrix(wb.Sheets[gainsSheetName])) : null;
      finishWithResult(file.name, {
        nbOnglets: wb.SheetNames.length, nbCols: cotation.nbCols,
        residences: cotation.residences, operations: cotation.operations,
        gainsGrid: gainsGrid || {}, hasGainsGrid: !!gainsSheetName,
      });
    } catch (err){ failWith('exception', err.message); }
  }

  function processFile(file){
    setError(null); setLoading(true); setLoadingMsg('Lecture du fichier…');
    const reader = new FileReader();
    reader.onload = (e) => {
      const buffer = e.target.result;
      if (typeof Worker === 'undefined'){
        setLoadingMsg('Analyse du fichier en cours (mode compatibilité)…');
        processFileMainThread(file, buffer);
        return;
      }
      let worker;
      try {
        const blob = new Blob([buildWorkerSource()], {type:'application/javascript'});
        worker = new Worker(URL.createObjectURL(blob));
      } catch (err){
        processFileMainThread(file, buffer);
        return;
      }
      workerRef.current = worker;
      setLoadingMsg('Analyse du fichier en cours… (peut prendre jusqu\u2019à une minute pour un fichier volumineux)');
      const timeoutId = setTimeout(() => { worker.terminate(); failWith('timeout'); }, 120000);
      worker.onmessage = (ev) => {
        clearTimeout(timeoutId);
        worker.terminate();
        const msg = ev.data;
        if (msg.ok) finishWithResult(file.name, msg.result);
        else failWith(msg.reason, msg.message);
      };
      worker.onerror = () => {
        clearTimeout(timeoutId);
        worker.terminate();
        // repli sur le thread principal si le worker plante (ex: importScripts bloqué par le réseau)
        processFileMainThread(file, buffer);
      };
      worker.postMessage({buffer}, [buffer]);
    };
    reader.onerror = () => { setError("Impossible de lire ce fichier depuis le disque."); setLoading(false); };
    reader.readAsArrayBuffer(file);
  }

  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      <div className="ce-header"><CeLogo/><span className="ce-header-title">Outil interactif d'exploration du <b>PSP</b></span></div>
      <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',padding:'40px 24px'}}>
        <div style={{maxWidth:640,width:'100%'}}>
          <h1 style={{color:'var(--ce-vert-principal)',fontSize:'1.6rem',fontWeight:700,marginBottom:6}}>Import du fichier PSP</h1>
          <p style={{color:'var(--ce-vert-fonce)',fontSize:'.88rem',marginBottom:22,lineHeight:1.5}}>
            Déposez un fichier PSP construit sur le gabarit Cellance (.xlsx). Le traitement est effectué
            intégralement dans votre navigateur : aucune donnée n'est transmise à un serveur.
          </p>
          <div
            className={"dropzone"+(drag?" drag":"")}
            style={{padding:'48px 24px',textAlign:'center',cursor:'pointer'}}
            onClick={()=>inputRef.current && inputRef.current.click()}
            onDragOver={(e)=>{e.preventDefault();setDrag(true);}}
            onDragLeave={()=>setDrag(false)}
            onDrop={(e)=>{e.preventDefault();setDrag(false); const f=e.dataTransfer.files[0]; if(f) processFile(f);}}
          >
            {loading ? (
              <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:14}}>
                <div className="spinner"></div>
                <span style={{color:'var(--ce-vert-fonce)',fontSize:'.85rem',textAlign:'center',maxWidth:280}}>{loadingMsg}</span>
              </div>
            ) : (
              <React.Fragment>
                <div style={{fontSize:'2.2rem',marginBottom:10}}>📂</div>
                <div style={{fontWeight:700,color:'var(--ce-vert-tres-fonce)',marginBottom:4}}>Glissez-déposez votre fichier PSP ici</div>
                <div style={{fontSize:'.78rem',color:'var(--ce-vert-fonce)'}}>ou cliquez pour sélectionner un fichier .xlsx</div>
              </React.Fragment>
            )}
            <input ref={inputRef} type="file" accept=".xlsx" style={{display:'none'}} onChange={(e)=>{ const f=e.target.files[0]; if(f) processFile(f); }} />
          </div>
          {error && (
            <div style={{marginTop:16,background:'var(--ce-rose)',border:'1px solid var(--ce-corail)',borderRadius:8,padding:'12px 16px',fontSize:'.8rem',color:'var(--ce-vert-tres-fonce)'}}>
              <b>Import refusé.</b> {error}
            </div>
          )}
          <div style={{marginTop:28,fontSize:'.72rem',color:'var(--ce-vert-fonce)',lineHeight:1.6}}>
            <b>Contrôle de conformité :</b> l'import n'est bloqué que si l'onglet « Base de cotation » (socle)
            est absent ou illisible. L'absence de la grille de gains DPE dégrade certaines vues sans bloquer l'import.
          </div>
        </div>

        <div style={{maxWidth:960,width:'100%',marginTop:40}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:10,marginBottom:12}}>
            {saves && saves.length>0 ? (
              <h2 style={{fontSize:'1rem',fontWeight:700,color:'var(--ce-vert-tres-fonce)'}}>Vos sauvegardes</h2>
            ) : <span></span>}
            <div>
              <button className="ce-btn-outline ce-btn-sm" onClick={()=>jsonInputRef.current && jsonInputRef.current.click()}>📁 Importer une sauvegarde (JSON)</button>
              <input ref={jsonInputRef} type="file" accept=".json,application/json" style={{display:'none'}} onChange={(e)=>{ const f=e.target.files[0]; if(f) handleImportJsonFile(f); e.target.value=''; }} />

          {opError && <div style={{marginBottom:12,fontSize:'.75rem',color:'var(--ce-corail)'}}>{opError}</div>}

          {saves && saves.length>0 && (
            <div className="ce-card" style={{padding:0,overflowX:'auto'}}>
              <table className="ce-table">
                <thead>
                  <tr>
                    <th>Nom</th>

                        ) : (
                          <span style={{fontWeight:600,color:'var(--ce-vert-tres-fonce)',cursor:'text'}} title="Cliquer pour renommer"
                            onClick={()=>{setRenamingId(rec.id); setRenameValue(rec.nom);}}>{rec.nom}</span>
                        )}

                        <input type="radio" name="ce-base-radio" checked={!!rec.estBase} onChange={()=>handleSetBase(rec.id)} title="Définir comme version de base" style={{cursor:'pointer'}} />
                      </td>

                        {rec.nomFichierSource} · {(rec.data.residences||[]).length} résidences
                      </td>
                      <td style={{cursor:'default',color:'var(--ce-vert-fonce)',whiteSpace:'nowrap'}}>{new Date(rec.dateModification).toLocaleDateString('fr-FR')}</td>
                      <td style={{cursor:'default'}}><button className="ce-btn ce-btn-sm" onClick={()=>onRestore(rec)}>Consulter</button></td>
                      <td style={{cursor:'default'}}><button className="ce-btn-outline ce-btn-sm" onClick={()=>handleExport(rec)}>Exporter</button></td>
                      <td style={{cursor:'default',whiteSpace:'nowrap'}}>
                        {confirmDeleteId===rec.id ? (
                          <React.Fragment>
                            <span style={{fontSize:'.7rem',color:'var(--ce-corail)',marginRight:6}}>Supprimer ?</span>
                            <button className="ce-btn-corail ce-btn-sm" onClick={()=>handleDelete(rec.id)}>Confirmer</button>
                            <button className="ce-btn-outline ce-btn-sm" style={{marginLeft:6}} onClick={()=>setConfirmDeleteId(null)}>Annuler</button>
                          </React.Fragment>
                        ) : (
                          <button className="ce-btn-outline ce-btn-sm" onClick={()=>setConfirmDeleteId(rec.id)}>Supprimer</button>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      </div>
      <div className="ce-footer">cellance — Document confidentiel — Traitement 100% local, aucune donnée transmise (sauvegardes stockées dans ce navigateur, jamais transmises)</div>
    </div>
  );
}

/* ---------------- Barre de filtres transverses ---------------- */
function uniqueSorted(arr){ return Array.from(new Set(arr.filter((v)=>v!==null&&v!==undefined&&v!==''))).sort((a,b)=>String(a).localeCompare(String(b),'fr')); }

function FilterBar({residences, filters, setFilters}){
  const communes = useMemo(()=>uniqueSorted(residences.map((r)=>r.commune)), [residences]);
  const secteurs = useMemo(()=>uniqueSorted(residences.map((r)=>r.secteur || r.agence)), [residences]);
  const familles = useMemo(()=>uniqueSorted(residences.map((r)=>r.familleAttract)), [residences]);
  const dpeClasses = ['A','B','C','D','E','F','G'];

  const hasActive = filters.commune || filters.secteur || filters.famille || filters.dpe || filters.qpv;
  function reset(){ setFilters({commune:'',secteur:'',famille:'',dpe:'',qpv:''}); }

  return (
    <div style={{background:'#fff',borderBottom:'1px solid #e4ede9',padding:'8px 24px',display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
      <span style={{fontSize:'.7rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase',letterSpacing:'.03em'}}>Filtres</span>
      {communes.length>0 && (
        <select className="ce-select" value={filters.commune} onChange={(e)=>setFilters(Object.assign({},filters,{commune:e.target.value}))}>
          <option value="">Commune (toutes)</option>
          {communes.map((c)=><option key={c} value={c}>{c}</option>)}
        </select>
      )}
      {secteurs.length>0 && (
        <select className="ce-select" value={filters.secteur} onChange={(e)=>setFilters(Object.assign({},filters,{secteur:e.target.value}))}>
          <option value="">Secteur / agence (tous)</option>
          {secteurs.map((c)=><option key={c} value={c}>{c}</option>)}
        </select>
      )}
      {familles.length>0 && (
        <select className="ce-select" value={filters.famille} onChange={(e)=>setFilters(Object.assign({},filters,{famille:e.target.value}))}>
          <option value="">Famille attractivité (toutes)</option>
          {familles.map((c)=><option key={c} value={c}>Famille {c}</option>)}
        </select>
      )}
      <select className="ce-select" value={filters.dpe} onChange={(e)=>setFilters(Object.assign({},filters,{dpe:e.target.value}))}>
        <option value="">Classe DPE énergie (toutes)</option>
        {dpeClasses.map((c)=><option key={c} value={c}>{c}</option>)}
      </select>
      <select className="ce-select" value={filters.qpv} onChange={(e)=>setFilters(Object.assign({},filters,{qpv:e.target.value}))}>
        <option value="">QPV (tous)</option>
        <option value="qpv">QPV</option>
        <option value="hors_qpv">Hors QPV</option>
      </select>
      {hasActive && <button className="ce-btn-outline ce-btn-sm" onClick={reset}>Réinitialiser</button>}
    </div>
  );
}

function applyFilters(residences, filters){
  return residences.filter((r)=>{
    if (filters.commune && r.commune!==filters.commune) return false;
    if (filters.secteur && (r.secteur||r.agence)!==filters.secteur) return false;
    if (filters.famille && r.familleAttract!==filters.famille) return false;
    if (filters.dpe && r.dpeEnergie!==filters.dpe) return false;
    if (filters.qpv==='qpv' && !isQpvValue(r.qpv)) return false;
    if (filters.qpv==='hors_qpv' && isQpvValue(r.qpv)) return false;
    return true;
  });
}

function KpiCard({label, value, sub}){

function isQpvValue(v){
  const n = ceNorm(v);
  return !!n && n!=='non' && n!=='hors qpv';
}
const DECENNIE_BUCKETS = ['avant 1960','1960-1970','1970-1980','1980-1990','1990-2000','2000-2010','2010-2020','après 2020'];
function decennieBucket(annee){
  if (annee<1960) return 'avant 1960';
  const start = Math.floor(annee/10)*10;
  if (start>=2020) return 'après 2020';
  return start+'-'+(start+10);
}

function ViewEnsemble({residences, operations}){
  const [dpeType, setDpeType] = useState('energie');
  const totalLgt = residences.reduce((s,r)=>s+r.nbLgt,0);
  const communesCount = uniqueSorted(residences.map((r)=>r.commune)).length;
  const totalInvest = operations.reduce((s,o)=>s+(o.montant||0),0);

  const topCommunes = useMemo(()=>{
    const m = {};
    residences.forEach((r)=>{ if(r.commune){ m[r.commune]=(m[r.commune]||0)+r.nbLgt; } });
    return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,5);
  }, [residences]);

  const topSecteurs = useMemo(()=>{
    const m = {};
    residences.forEach((r)=>{ const k=r.secteur||r.agence; if(k){ m[k]=(m[k]||0)+r.nbLgt; } });
    return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,5);
  }, [residences]);

  const typoTotals = useMemo(()=>{
    const t = {T1:0,T2:0,T3:0,T4:0,T5:0,'T6+':0};
    residences.forEach((r)=>{ Object.keys(t).forEach((k)=>{ t[k]+= (r[k]||0); }); });
    return t;
  }, [residences]);
  const hasTypo = Object.values(typoTotals).some((v)=>v>0);

  const hasDpePrincipal = residences.some((r)=>r.dpePrincipal);
  const dpeTotals = useMemo(()=>{
    const t = {A:0,B:0,C:0,D:0,E:0,F:0,G:0,NR:0};
    if (dpeType==='principal'){
      residences.forEach((r)=>{ const cl = String(r.dpePrincipal||'').toUpperCase(); if (t[cl]!==undefined) t[cl]+=(r.nbLgt||0); });
    } else {
      const key = dpeType==='ges' ? 'distGES' : 'distEnergie';
      residences.forEach((r)=>{ if (r[key]){ Object.keys(t).forEach((k)=>{ t[k]+=(r[key][k]||0); }); } });
    }
    return t;
  }, [residences, dpeType]);
  const hasDpeDist = Object.values(dpeTotals).some((v)=>v>0);
  const dpeTypeLabel = dpeType==='principal'?'Principal':dpeType==='ges'?'GES':'Énergie';

  // Indicateurs additionnels V4 (cf. commentaire au-dessus de parseBaseCotation pour la provenance
  // des colonnes) : chacun ne s'affiche que si la colonne correspondante a été trouvée dans le
  // fichier importé, jamais avec une valeur à 0 par défaut.
  const hasQpv = residences.some((r)=>r.qpv!==null && r.qpv!==undefined && r.qpv!=='');
  const qpvLgt = useMemo(()=>residences.reduce((s,r)=>s+(isQpvValue(r.qpv)?(r.nbLgt||0):0),0), [residences]);

  const hasConventionne = residences.some((r)=>r.dontConventionne!==null);
  const conventionneLgt = useMemo(()=>residences.reduce((s,r)=>s+(r.dontConventionne||0),0), [residences]);

  const hasFoyer = residences.some((r)=>r.dontFoyer!==null);
  const foyerLgt = useMemo(()=>residences.reduce((s,r)=>s+(r.dontFoyer||0),0), [residences]);

  const decennieData = useMemo(()=>{
    const t = {}; DECENNIE_BUCKETS.forEach((b)=>t[b]=0);
    residences.forEach((r)=>{ if (r.anneeConstruction){ t[decennieBucket(r.anneeConstruction)] += (r.nbLgt||0); } });
    return DECENNIE_BUCKETS.map((b)=>({bucket:b, total:t[b]}));
  }, [residences]);
  const hasDecennie = decennieData.some((d)=>d.total>0);

  const allAgences = useMemo(()=>{
    const m = {};
    residences.forEach((r)=>{ if (r.agence){ m[r.agence]=(m[r.agence]||0)+r.nbLgt; } });
    return Object.entries(m).sort((a,b)=>b[1]-a[1]);
  }, [residences]);

  const typeBatiTotals = useMemo(()=>{
    const t = {};
    residences.forEach((r)=>{ if (r.typeBati){ const k=String(r.typeBati).trim(); t[k]=(t[k]||0)+(r.nbLgt||0); } });
    return t;
  }, [residences]);
  const hasTypeBati = Object.keys(typeBatiTotals).length>0;
  const typeBatiColor = (k)=>{ const n=ceNorm(k); if (n==='individuel') return '#58D88B'; if (n==='collectif') return '#264E46'; return PALETTE[Object.keys(typeBatiTotals).indexOf(k)%PALETTE.length]; };

  const chauffageTotals = useMemo(()=>{
    const t = {};
    residences.forEach((r)=>{ if (r.modeChauffage){ const k=String(r.modeChauffage).trim(); t[k]=(t[k]||0)+(r.nbLgt||0); } });
    return t;
  }, [residences]);
  const ecsTotals = useMemo(()=>{
    const t = {};
    residences.forEach((r)=>{ if (r.modeECS){ const k=String(r.modeECS).trim(); t[k]=(t[k]||0)+(r.nbLgt||0); } });
    return t;
  }, [residences]);

  // Colonne présente mais entièrement vide sur certains fichiers (ex. Aubervilliers) : on masque
  // le graphique dans ce cas plutôt que d'afficher un anneau vide, pas seulement si absente.
  const financementTotals = useMemo(()=>{
    const t = {};
    residences.forEach((r)=>{ if (r.financement){ const k=String(r.financement).trim(); t[k]=(t[k]||0)+(r.nbLgt||0); } });
    return t;
  }, [residences]);
  const hasFinancement = Object.keys(financementTotals).length>0;

  return (
    <div style={{padding:24,display:'flex',flexDirection:'column',gap:20}}>
      <div style={{display:'flex',gap:16,flexWrap:'wrap'}}>
        <KpiCard label="Logements" value={fmtNum(totalLgt)} />
        <KpiCard label="Résidences" value={fmtNum(residences.length)} />
        <KpiCard label="Communes" value={fmtNum(communesCount)} />
        <KpiCard label="Budget investissements (import)" value={fmtKEur(totalInvest)} sub={operations.length+" opérations importées"} />
        {hasQpv && <KpiCard label="Logements en QPV" value={fmtNum(qpvLgt)} sub={totalLgt>0? ((qpvLgt/totalLgt)*100).toFixed(0)+"% du parc":null} />}
        {hasConventionne && <KpiCard label="Logements conventionnés" value={fmtNum(conventionneLgt)} />}
        {hasFoyer && <KpiCard label="Logements en foyer / résidence sociale" value={fmtNum(foyerLgt)} />}
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
        {topCommunes.length>0 && (
          <div className="ce-card">
            <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700,marginBottom:12}}>Top 5 communes (logements)</h2>
            <ChartCanvas type="bar" height={220} data={{
              labels: topCommunes.map((c)=>c[0]),
              datasets:[{label:'Logements', data:topCommunes.map((c)=>c[1]), backgroundColor:'#009261', borderRadius:4}]
            }} options={{indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{beginAtZero:true}}}} />
          </div>
        )}
        {topSecteurs.length>0 && (
          <div className="ce-card">
            <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700,marginBottom:12}}>Top 5 secteurs / agences (logements)</h2>
            <ChartCanvas type="bar" height={220} data={{
              labels: topSecteurs.map((c)=>c[0]),
              datasets:[{label:'Logements', data:topSecteurs.map((c)=>c[1]), backgroundColor:'#FF8364', borderRadius:4}]
            }} options={{indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{beginAtZero:true}}}} />
          </div>
        )}
        {hasTypo && (
          <div className="ce-card">
            <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700,marginBottom:12}}>Répartition par typologie</h2>
            <ChartCanvas type="doughnut" height={220} data={{
              labels: Object.keys(typoTotals), datasets:[{data:Object.values(typoTotals), backgroundColor:PALETTE}]
            }} />
          </div>
        )}
        {hasDpeDist && (
          <div className="ce-card">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,flexWrap:'wrap',gap:8}}>
              <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700}}>Répartition DPE {dpeTypeLabel} (logements)</h2>
              <div style={{display:'flex',gap:6}}>
                {hasDpePrincipal && <button className={dpeType==='principal'?'ce-btn ce-btn-sm':'ce-btn-outline ce-btn-sm'} onClick={()=>setDpeType('principal')}>Principal</button>}
                <button className={dpeType==='energie'?'ce-btn ce-btn-sm':'ce-btn-outline ce-btn-sm'} onClick={()=>setDpeType('energie')}>Énergie</button>
                <button className={dpeType==='ges'?'ce-btn ce-btn-sm':'ce-btn-outline ce-btn-sm'} onClick={()=>setDpeType('ges')}>GES</button>
              </div>
            </div>
            <ChartCanvas type="doughnut" height={220} data={{
              labels: Object.keys(dpeTotals).filter(k=>dpeTotals[k]>0),
              datasets:[{data:Object.keys(dpeTotals).filter(k=>dpeTotals[k]>0).map(k=>dpeTotals[k]), backgroundColor:Object.keys(dpeTotals).filter(k=>dpeTotals[k]>0).map(k=>DPE_COLORS[k])}]
            }} />
          </div>
        )}
        {hasDecennie && (
          <div className="ce-card">
            <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700,marginBottom:12}}>Logements mis en service par décennie</h2>
            <ChartCanvas type="bar" height={220} data={{
              labels: decennieData.map((d)=>d.bucket),
              datasets:[{label:'Logements', data: decennieData.map((d)=>d.total), backgroundColor:'#009261', borderRadius:4}]
            }} options={{plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}}}} />
          </div>
        )}
        {allAgences.length>0 && (
          <div className="ce-card">
            <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700,marginBottom:12}}>Répartition par agence (logements)</h2>
            <ChartCanvas type="bar" height={Math.max(220, allAgences.length*26)} data={{
              labels: allAgences.map((c)=>c[0]),
              datasets:[{label:'Logements', data: allAgences.map((c)=>c[1]), backgroundColor:'#264E46', borderRadius:4}]
            }} options={{indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{beginAtZero:true}}}} />
          </div>
        )}
        {hasTypeBati && (
          <div className="ce-card">
            <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700,marginBottom:12}}>Répartition individuel / collectif</h2>
            <ChartCanvas type="doughnut" height={220} data={{
              labels: Object.keys(typeBatiTotals),
              datasets:[{data:Object.values(typeBatiTotals), backgroundColor: Object.keys(typeBatiTotals).map((k)=>typeBatiColor(k))}]
            }} />
          </div>
        )}
        {Object.keys(chauffageTotals).length>0 && (
          <div className="ce-card">
            <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700,marginBottom:12}}>Mode de chauffage (logements)</h2>
            {Object.keys(chauffageTotals).length>6 ? (
              <ChartCanvas type="bar" height={Math.max(220, Object.keys(chauffageTotals).length*26)} data={{
                labels: Object.keys(chauffageTotals), datasets:[{data:Object.values(chauffageTotals), backgroundColor:'#FF8364', borderRadius:4}]
              }} options={{indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{beginAtZero:true}}}} />
            ) : (
              <ChartCanvas type="doughnut" height={220} data={{
                labels: Object.keys(chauffageTotals), datasets:[{data:Object.values(chauffageTotals), backgroundColor: Object.keys(chauffageTotals).map((_,i)=>PALETTE[i%PALETTE.length])}]
              }} />
            )}
          </div>
        )}
        {Object.keys(ecsTotals).length>0 && (
          <div className="ce-card">
            <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700,marginBottom:12}}>Mode de production ECS (logements)</h2>
            {Object.keys(ecsTotals).length>6 ? (
              <ChartCanvas type="bar" height={Math.max(220, Object.keys(ecsTotals).length*26)} data={{
                labels: Object.keys(ecsTotals), datasets:[{data:Object.values(ecsTotals), backgroundColor:'#FF8364', borderRadius:4}]
              }} options={{indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{beginAtZero:true}}}} />
            ) : (
              <ChartCanvas type="doughnut" height={220} data={{
