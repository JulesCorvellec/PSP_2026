          </div>
          <div className="ce-card">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
              <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700}}>Trajectoire de décarbonation — DPE {metric==='energie'?'Énergie':'GES'}</h2>
              <div style={{display:'flex',gap:6}}>
                <button className={metric==='energie'?'ce-btn ce-btn-sm':'ce-btn-outline ce-btn-sm'} onClick={()=>setMetric('energie')}>Énergie</button>
                <button className={metric==='ges'?'ce-btn ce-btn-sm':'ce-btn-outline ce-btn-sm'} onClick={()=>setMetric('ges')}>GES</button>
              </div>
            </div>
            {(()=>{
              const visibleClasses = classes.filter((c)=>years.some((y)=>trajectory[y][c]>0));
              return (
                <ChartCanvas type="bar" height={340} data={{
                  labels: years,
                  datasets: visibleClasses.map((c)=>({
                    label:c, data: years.map((y)=>trajectory[y][c]||0), backgroundColor: DPE_COLORS[c], stack:'s'
                  }))
                }} options={{ scales:{ x:{stacked:true}, y:{stacked:true, title:{display:true,text:'Logements'}} }, onClick:(evt,elements)=>{
                  if (!elements.length) return;
                  const el = elements[0];
                  toggleTrajPanel('trajectoire', years[el.index], visibleClasses[el.datasetIndex]);
                }}} />

            <p style={{fontSize:'.7rem',color:'var(--ce-vert-fonce)',marginTop:10,lineHeight:1.5}}>
              Méthodologie (§8.2 du cahier des charges) : chaque résidence part de sa distribution DPE constatée ;
              chaque opération programmée (ou identifiée si incluse) applique le gain de la grille de référence à la classe
              atteinte à cet instant, avec effet cumulatif pour les opérations successives. Une démolition sort la résidence
              du parc à compter de l'année concernée. Simplification V1 : le gain s'applique à l'ensemble du parc de la
              résidence, pas uniquement aux logements concernés par l'opération.
            </p>
            {trajPanel && trajPanel.source==='trajectoire' && <ResidenceListPanel title={trajPanel.title} rows={trajPanel.rows} renderRow={trajPanel.renderRow} onClose={()=>setTrajPanel(null)} />}
          </div>
          <div className="ce-card">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10,marginBottom:12}}>
              <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700}}>
                Répartition des étiquettes DPE {metric==='energie'?'Énergie':'GES'} — avant / après intervention
              </h2>
              <div style={{display:'flex',flexDirection:'column',gap:4}}>
                <label style={{fontSize:'.66rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>Année (après travaux)</label>
                <select className="ce-select" value={repartYear??''} onChange={(e)=>setRepartYear(Number(e.target.value))}>
                  {years.map((y)=>{
                    const badge = y===baseCardYear? 'Base' : y===cutoffActuel? 'Actuel' : y===cibleCardYear? 'Cible' : null;
                    return <option key={y} value={y}>{y}{badge? ' — '+badge:''}</option>;
                  })}
                </select>
              </div>
            </div>
            {(()=>{
              const repartLabels = classes.filter((c)=>(initial[c]||0)>0 || ((final||{})[c]||0)>0);
              return (
                <ChartCanvas type="bar" height={300} data={{
                  // `final` peut être momentanément null le temps que l'effet ci-dessus fixe `repartYear`
                  // au tout premier rendu (même garde que `dpeCardShare` plus haut) : (final||{})[c] évite
                  // un crash "Cannot read properties of null" à ce moment précis.
                  labels: repartLabels,
                  datasets: [
                    { label:'Avant intervention', data: repartLabels.map((c)=>initial[c]||0), backgroundColor:'#9fb3ae' },
                    { label:'Après intervention', data: repartLabels.map((c)=>(final||{})[c]||0), backgroundColor: repartLabels.map((c)=>DPE_COLORS[c]) },
                  ]
                }} options={{ scales:{ y:{ title:{display:true,text:'Logements'} } }, onClick:(evt,elements)=>{
                  if (!elements.length || final===null) return;
                  const el = elements[0];
                  const cl = repartLabels[el.index];
                  // Le clic sur "Avant" utilise years[0] (distribution constatée à l'import), sur
                  // "Après" utilise repartYear (sélecteur d'année déjà présent dans cette vue) — même
                  // logique de résolution résidence par résidence que le graphique de trajectoire.
                  const year = el.datasetIndex===0 ? years[0] : repartYear;
                  toggleTrajPanel('avantApres', year, cl);
                }}} />
              );
            })()}
            <p style={{fontSize:'.7rem',color:'var(--ce-vert-fonce)',marginTop:10,lineHeight:1.5}}>
              Avant = distribution DPE constatée en {years[0]}. Après = distribution projetée en {repartYear} selon
              les opérations actuellement incluses dans la simulation (bascule « Inclure les opérations identifiées » prise en compte).
            </p>
            {trajPanel && trajPanel.source==='avantApres' && <ResidenceListPanel title={trajPanel.title} rows={trajPanel.rows} renderRow={trajPanel.renderRow} onClose={()=>setTrajPanel(null)} />}
          </div>
          {decarbo && <DecarbonationTrajectoire decarbo={decarbo} refs={refs} ventesSansAnnee={ventes.sansAnnee} />}
        </React.Fragment>
      )}
    </div>
  );
}

/* ---------------- Offre nouvelle & Vente ----------------
   Le "Plan de vente" ne correspond à aucun onglet ONI/ONNI dédié (aucun des deux fichiers de
   référence du projet n'en contient) : il s'agit en réalité de colonnes déjà présentes dans
   « 1. Base de cotation » elle-même (confirmé le 2026-07-10, cf. idx.planVente et suivants dans
   parseBaseCotation) — traité ici comme un dérivé de residences, pas comme un parseur séparé.
   L'"Offre nouvelle" (construction neuve) n'a en revanche aucune source dans les fichiers fournis :
   à la demande de Jules, elle est portée par une simulation manuelle (saisie libre par année,
   même principe que la "Ligne budgétaire libre" de la vue Investissements), pas par un import. */
// §12 — dérivation lecture seule de la conventionnalité d'une résidence pour une entrée de vente
// ajoutée manuellement : residence.conventionneVente si renseigné (donnée déjà présente dans la
// Base de cotation pour les résidences déjà en plan de vente), sinon déduit de dont conventionné /
// dont foyer (comptages déjà parsés), jamais une nouvelle saisie dupliquée dans l'entrée de vente.
function deriveConventionne(r){
  if (!r) return '—';
  if (r.conventionneVente) return r.conventionneVente;
  if (r.dontConventionne>0) return 'Conventionné';
  if (r.dontFoyer>0) return 'Foyer / résidence sociale';
  return '—';
}
// §6 — scission de l'ancienne vue "Offre nouvelle & Vente" en deux onglets distincts (Orientations
// stratégiques), sans changement de logique ni de calcul : ViewOffreNouvelle reprend la carte de
// simulation manuelle, ViewVente les deux cartes de ventes (simulées + résidences déjà en plan de
// vente). Les deux parties ne partageaient déjà aucun state ni logique croisée.
function ViewOffreNouvelle({residences, operations, offreNouvelleLgt, setOffreNouvelleLgt}){
  const years = useMemo(()=>computeYearsRange(operations), [operations]);
  const annualValues = years.map((y)=>Number(offreNouvelleLgt[y])||0);
  const cumulative = useMemo(()=>{
    let cum = 0;
    return years.map((y)=>{ cum += Number(offreNouvelleLgt[y])||0; return cum; });
  }, [years, offreNouvelleLgt]);

  return (
    <div style={{padding:24,display:'flex',flexDirection:'column',gap:20}}>
      <div className="ce-card">
        <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700,marginBottom:12}}>Offre nouvelle — simulation manuelle</h2>
        <p style={{fontSize:'.72rem',color:'var(--ce-vert-fonce)',marginBottom:14,lineHeight:1.5}}>
          Aucun onglet du fichier importé ne recense l'offre nouvelle (construction neuve) : cette section permet
          de saisir manuellement, année par année, le nombre de logements neufs simulés — à titre indicatif,
          en complément de la Base de cotation.
        </p>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:16}}>
          {years.map((y)=>(
            <div key={y} style={{display:'flex',flexDirection:'column',gap:3}}>
              <label style={{fontSize:'.68rem',color:'var(--ce-vert-fonce)'}}>{y}</label>
              <input className="ce-input" style={{width:92}} type="number" min="0" value={offreNouvelleLgt[y]||''}
                placeholder="0"
                onChange={(e)=>setOffreNouvelleLgt(Object.assign({},offreNouvelleLgt,{[y]: e.target.value===''? undefined : Number(e.target.value)}))} />
            </div>
          ))}
        </div>
        <ChartCanvas type="bar" height={260} data={{
          labels: years,
          datasets: [
            { type:'bar', label:'Logements neufs simulés (par année)', data: annualValues, backgroundColor:'#58D88B', borderRadius:4 },
            { type:'line', label:'Cumul de logements neufs', data: cumulative, borderColor:'#009261', backgroundColor:'#009261', pointRadius:3, fill:false, yAxisID:'y1' },
          ]
        }} options={{ scales:{ y:{ beginAtZero:true, title:{display:true,text:'Logements (année)'} }, y1:{ beginAtZero:true, position:'right', grid:{drawOnChartArea:false}, title:{display:true,text:'Cumul'} } } }} />
      </div>
    </div>
  );
}

// §V8 Phase 1 — la vue consomme désormais planVenteLignes. Phase de socle : aucune interface nouvelle
// ici, la carte « Ventes simulées » continue de n'afficher QUE les lignes ajoutées à la main
// (origine 'ajout'). Les lignes issues de l'import vivent dans le modèle sans être affichées deux
// fois — la carte du dessous les restitue déjà depuis `residences`. La table d'échéancier annuel et
// le moteur de potentiel qui les exploiteront arrivent en Phases 2 et 3.
function ViewVente({residences, planVenteLignes, setPlanVenteLignes}){
  const resByCode = useMemo(()=>{ const m={}; residences.forEach((r)=>m[r.code]=r); return m; }, [residences]);
  const typeVenteSuggestions = useMemo(()=>uniqueSorted(residences.map((r)=>r.typeVente)), [residences]);
  const lignesAjoutees = useMemo(()=>planVenteLignes.filter((l)=>l.origine==='ajout'), [planVenteLignes]);

  function addVente(){
    if (!residences.length) return;
    setPlanVenteLignes([{
      id: genLocalId('pv'), resCode:null, origine:'ajout', retenue:true,
      typeVente:null, conventionne:null, logementsTotal:null, parAnnee:{},
      prioriteManuelle:null, scorePotentiel:null, commentaire:null,
      _legacyLogementsRestants:null, _legacyPrixVente:null,
    }].concat(planVenteLignes));
  }
  function updateVente(id, patch){ setPlanVenteLignes(planVenteLignes.map((v)=> v.id===id? Object.assign({},v,patch) : v)); }
  function removeVente(id){ setPlanVenteLignes(planVenteLignes.filter((v)=>v.id!==id)); }
  function selectVenteResidence(id, rawResCode, currentLogementsRestants){
    // rawResCode vient de <select> (toujours une chaîne côté DOM) : on le résout vers le code natif
    // de la résidence (souvent numérique) pour rester cohérent avec filteredCodes.has(resCode) côté
    // App, sans quoi la ligne disparaissait de la vue dès la sélection d'une résidence.
    const match = residences.find((r)=>String(r.code)===rawResCode);
    const resCode = match? match.code : rawResCode;
    const patch = { resCode };
    // §V8 Phase 1.3 — logementsTotal accompagne désormais la sélection : c'est lui qui plafonnera la
    // somme des nbLgt de l'échéancier en Phase 3.
    if (match) patch.logementsTotal = match.nbLgt || null;
    // Pré-remplissage au moment de la sélection uniquement, jamais en repli permanent : une fois
    // modifié manuellement par l'utilisateur, la valeur ne doit plus être écrasée par ce pré-remplissage.
    if (currentLogementsRestants===null || currentLogementsRestants===undefined){
      const r = resByCode[resCode];
      if (r && r.nbLgtRestantVente!==null && r.nbLgtRestantVente!==undefined) patch._legacyLogementsRestants = r.nbLgtRestantVente;
    }
    updateVente(id, patch);
  }

  const ventesSimuleesCols = [
    {key:'resCode', label:'Résidence', render:(v)=>{
      const inList = residences.some((r)=>r.code===v.resCode);
      return (
        <select className="ce-select" value={v.resCode ?? ''} onChange={(e)=>selectVenteResidence(v.id, e.target.value, v._legacyLogementsRestants)}>
          <option value="" disabled>— À sélectionner —</option>
          {!inList && v.resCode && <option value={v.resCode}>{(resByCode[v.resCode]||{}).nom || v.resCode} (hors filtre)</option>}
          {residences.map((r)=><option key={r.code} value={r.code}>{r.nom||r.code}</option>)}
        </select>
      );
    }},
    {key:'commune', label:'Commune', render:(v)=>(resByCode[v.resCode]||{}).commune || '—'},
    {key:'conventionne', label:'Conventionné / non conventionné', render:(v)=>deriveConventionne(resByCode[v.resCode])},
    {key:'typeVente', label:'Type de vente', render:(v)=>(
      <input className="ce-input" style={{width:140}} list="ce-type-vente-suggestions" value={v.typeVente ?? ''} placeholder="— À sélectionner —"
        onChange={(e)=>updateVente(v.id,{typeVente:e.target.value})} />
    )},
    {key:'_legacyLogementsRestants', label:'Logements restants', render:(v)=><input className="ce-input" style={{width:90}} type="number" min="0" value={v._legacyLogementsRestants ?? ''} onChange={(e)=>updateVente(v.id,{_legacyLogementsRestants: e.target.value===''? null: Number(e.target.value)})} />},
    {key:'_legacyPrixVente', label:'Prix de vente', render:(v)=><input className="ce-input" style={{width:110}} type="number" min="0" value={v._legacyPrixVente ?? ''} onChange={(e)=>updateVente(v.id,{_legacyPrixVente: e.target.value===''? null: Number(e.target.value)})} />},
    {key:'_montantM2', label:'Montant au m²', render:(v)=>{
      const r = resByCode[v.resCode];
      if (!r || !r.shab || r.shab<=0 || v._legacyPrixVente===null || v._legacyPrixVente===undefined) return '—';
      return fmtEur(v._legacyPrixVente / r.shab);
    }},
    {key:'_actions', label:'', render:(v)=><button className="ce-btn-outline ce-btn-sm" onClick={()=>removeVente(v.id)}>Suppr.</button>},
  ];

  const venteRows = useMemo(()=>residences.filter((r)=>
    r.nbLgtMiseVente!==null || r.prixVenteBrut!==null || r.typeVente!==null || r.planVente
  ), [residences]);
  const hasVente = venteRows.length>0;
  const totalMiseVente = venteRows.reduce((s,r)=>s+(r.nbLgtMiseVente||0),0);
  const totalRestant = venteRows.reduce((s,r)=>s+(r.nbLgtRestantVente||0),0);
  const totalProduitCession = venteRows.reduce((s,r)=>s+(r.prixVenteBrut||0),0);

  const venteCols = [
    {key:'nom', label:'Résidence'},
    {key:'commune', label:'Commune'},
    {key:'typeVente', label:'Type de vente', render:(r)=>r.typeVente||'—'},
    {key:'conventionneVente', label:'Conventionné / non conventionné', render:(r)=>r.conventionneVente||'—'},
    {key:'nbLgtMiseVente', label:'Logements mis en vente', render:(r)=>r.nbLgtMiseVente!==null? fmtNum(r.nbLgtMiseVente):'—'},
    {key:'nbLgtRestantVente', label:'Logements restants', render:(r)=>r.nbLgtRestantVente!==null? fmtNum(r.nbLgtRestantVente):'—'},
    {key:'prixVenteBrut', label:'Prix de vente brut', render:(r)=>r.prixVenteBrut!==null? fmtEur(r.prixVenteBrut):'—'},
    {key:'montantVenteM2', label:'Montant au m²', render:(r)=>r.montantVenteM2!==null? fmtEur(r.montantVenteM2):'—'},
  ];

  return (
    <div style={{padding:24,display:'flex',flexDirection:'column',gap:20}}>
      <div className="ce-card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10,marginBottom:12}}>
          <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700}}>Ventes simulées ({lignesAjoutees.length})</h2>
          <button className="ce-btn ce-btn-sm" onClick={addVente} disabled={!residences.length} title={!residences.length? "Aucune résidence ne correspond aux filtres actifs" : ""}>+ Ajouter une vente</button>
        </div>
        <p style={{fontSize:'.72rem',color:'var(--ce-vert-fonce)',marginBottom:12,lineHeight:1.5}}>
          Ajoute une entrée de vente pour une résidence déjà existante du patrimoine importé (pas une résidence fictive) —
          en complément des résidences déjà en plan de vente listées ci-dessous.
        </p>
        <datalist id="ce-type-vente-suggestions">{typeVenteSuggestions.map((t)=><option key={t} value={t} />)}</datalist>
        {lignesAjoutees.length>0 ? <SortableTable columns={ventesSimuleesCols} rows={lignesAjoutees} pageSize={20} /> : <div style={{fontSize:'.78rem',color:'#9fb3ae'}}>Aucune vente simulée pour l'instant.</div>}
      </div>

      {hasVente ? (
        <React.Fragment>
          <div style={{display:'flex',gap:16,flexWrap:'wrap'}}>
            <KpiCard label="Résidences en plan de vente" value={fmtNum(venteRows.length)} />
            <KpiCard label="Logements mis en vente" value={fmtNum(totalMiseVente)} />
            <KpiCard label="Logements restants à vendre" value={fmtNum(totalRestant)} />
            <KpiCard label="Produit de cession (brut)" value={fmtKEur(totalProduitCession)} />
          </div>
          <div className="ce-card">
            <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700,marginBottom:12}}>Détail des résidences en plan de vente ({venteRows.length})</h2>
            <SortableTable columns={venteCols} rows={venteRows} pageSize={20} />
          </div>
        </React.Fragment>
      ) : (
        <div className="ce-card" style={{background:'var(--ce-saumon)'}}>
          Aucune donnée de vente (« Plan de vente », « Nombre de logement à la mise en vente », « Prix de vente »…)
          n'a été trouvée dans ce fichier — non disponible dans ce fichier.
        </div>
      )}
    </div>
  );
}

/* ---------------- Données financières (CRD / Autofinancement / VNC) ----------------
   Granularité confirmée le 2026-07-10 sur les deux fichiers de référence : résidence uniquement
   (cf. commentaire au-dessus de idx.crd dans parseBaseCotation) — pas de graphique d'évolution
   dans le temps ici, faute de dimension année associée à ces montants dans les fichiers fournis. */
// §Phase 6.1/6.2 — histogrammes de répartition CRD/Autofinancement/VNC, seuils éditables persistés
// avec la sauvegarde de l'import (cf. financeSeuils dans App). Les seuils "< 2%, 2-3,5%, 3,5-6%, > 6%"
// (Autofinancement) et "< 3%, 3-6%, 6-9%, > 9%" (CRD) trouvés dans l'Excel de référence (onglet
// « 2. Graphiques Cotation ») portent en réalité sur un ratio absent de nos colonnes (qui n'exposent
// que des montants bruts en € — cf. commentaire sur idx.crd/idx.autofinancement dans parseBaseCotation) :
// les appliquer tels quels à des montants en € viderait la répartition dans une seule tranche. Défaut
// retenu, cohérent pour les 3 indicateurs (dont VNC, pour lequel l'Excel n'a de toute façon aucun
// seuil) : quartiles de la distribution effectivement importée — seuils entièrement éditables ci-dessous
// si Jules préfère une autre convention.
const FINANCE_INDICATORS = [
  {key:'crd', label:'CRD', get:(r)=>r.crd, color:'#009261'},
  {key:'autofinancement', label:'Autofinancement', get:(r)=>r.autofinancement, color:'#FF8364'},
  {key:'vnc', label:'VNC', get:(r)=>r.vnc, color:'#264E46'},
];
function financeIndicatorValue(r, indicator, mode){
  const raw = indicator.get(r);
  if (raw===null || raw===undefined || isNaN(raw)) return null;
  return mode==='parLgt' ? (r.nbLgt>0 ? raw/r.nbLgt : null) : raw;
}
function financeDefaultSeuils(residences, indicator, mode){
  const vals = residences.map((r)=>financeIndicatorValue(r, indicator, mode)).filter((v)=>v!==null && v!==undefined && !isNaN(v)).sort((a,b)=>a-b);
  if (!vals.length) return [0,0,0];
  const q = (p)=>{ const pos=(vals.length-1)*p, base=Math.floor(pos), rest=pos-base; return vals[base+1]!==undefined? vals[base]+rest*(vals[base+1]-vals[base]) : vals[base]; };
  const round = mode==='parLgt' ? (x)=>Math.round(x/10)*10 : (x)=>Math.round(x/100)*100;
  return [round(q(0.25)), round(q(0.5)), round(q(0.75))];
}
function financeTranches(residences, indicator, mode, seuils){
  const [b1,b2,b3] = seuils;
  const defs = [
    { label:'< '+fmtEur(b1), test:(v)=>v<b1 },
    { label:fmtEur(b1)+' – '+fmtEur(b2), test:(v)=>v>=b1 && v<b2 },
    { label:fmtEur(b2)+' – '+fmtEur(b3), test:(v)=>v>=b2 && v<b3 },
    { label:'≥ '+fmtEur(b3), test:(v)=>v>=b3 },
  ];
  const tranches = defs.map((d)=>Object.assign({members:[], nbLgt:0, nbRes:0}, d));
  residences.forEach((r)=>{
    const v = financeIndicatorValue(r, indicator, mode);
    if (v===null || v===undefined || isNaN(v)) return;
    const t = tranches.find((tt)=>tt.test(v));
    if (!t) return;
    t.members.push(r); t.nbRes++; t.nbLgt += (r.nbLgt||0);
  });
  const totalLgt = tranches.reduce((s,t)=>s+t.nbLgt,0);
  let cum = 0;
  const cumulPct = tranches.map((t)=>{ cum += t.nbLgt; return totalLgt>0? Math.round(cum/totalLgt*100) : 0; });
  return { tranches, cumulPct };
}
function FinanceHistogram({indicator, residences, mode, seuilsStore, onSeuilsChange, onSelectResidence}){
  const defaultSeuils = useMemo(()=>financeDefaultSeuils(residences, indicator, mode), [residences, indicator, mode]);
  const customSeuils = seuilsStore && seuilsStore[indicator.key] && seuilsStore[indicator.key][mode];
  const seuils = customSeuils || defaultSeuils;
  const { tranches, cumulPct } = useMemo(()=>financeTranches(residences, indicator, mode, seuils), [residences, indicator, mode, seuils]);
  const [panelIdx, setPanelIdx] = useState(null);

  function updateSeuil(i, raw){
    const val = raw===''? 0 : Number(raw);

  return (

            <label style={{fontSize:'.66rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>Seuil {i+1}{mode==='parLgt'?' (€/lgt)':' (€)'}</label>

          { type:'bar', label:'Résidences', data: tranches.map((t)=>t.nbRes), backgroundColor: hexToRgba(indicator.color,0.35), yAxisID:'y1', borderRadius:4 },
          { type:'line', label:'% cumulé (logements)', data: cumulPct, borderColor:'#1C3A35', backgroundColor:'#1C3A35', pointRadius:3, yAxisID:'y2', tension:.2 },
        ]

        scales:{

          y1:{ type:'linear', position:'right', beginAtZero:true, title:{display:true,text:'Résidences'}, grid:{drawOnChartArea:false} },
          y2:{ type:'linear', position:'right', beginAtZero:true, max:100, title:{display:true,text:'% cumulé'}, grid:{drawOnChartArea:false}, offset:true },

        Barres : nombre de logements (échelle de gauche) et de résidences (échelle de droite) par tranche.
        Courbe : % cumulé de logements de cette tranche et des tranches inférieures (courbe de Pareto).
        Seuils modifiables ci-dessus, persistés avec la sauvegarde de l'import. Cliquez sur une barre
        pour voir le détail des résidences de cette tranche.
      </p>
      {panelIdx!==null && (
        <ResidenceListPanel
          title={tranches[panelIdx].label+' — '+tranches[panelIdx].members.length+' résidence'+(tranches[panelIdx].members.length>1?'s':'')}
          rows={tranches[panelIdx].members}
          onClose={()=>setPanelIdx(null)}
          renderRow={(r)=>{
            const v = financeIndicatorValue(r, indicator, mode);
            return (
              <div onClick={()=>onSelectResidence && onSelectResidence(r)} style={{display:'flex',justifyContent:'space-between',gap:8,fontSize:'.76rem',color:'var(--ce-vert-fonce)',padding:'3px 0',borderBottom:'1px solid #f0f5f3',cursor:onSelectResidence?'pointer':'default'}}>
                <span>{r.nom || r.code}</span>
                <span style={{color:'#9fb3ae',flexShrink:0}}>{fmtEur(v)}{mode==='parLgt'?'/lgt':''} — {fmtNum(r.nbLgt)} lgt</span>
              </div>

          }}
        />
      )}
    </div>
  );
}
function ViewFinance({residences, onSelectResidence, financeSeuils, setFinanceSeuils}){

  const rows = useMemo(()=>residences.filter((r)=>r.crd!==null || r.autofinancement!==null || r.vnc!==null), [residences]);
  const filteredRows = useMemo(()=>{
    const s = ceNorm(search);
    if (!s) return rows;
    return rows.filter((r)=>ceNorm(r.nom).includes(s) || ceNorm(r.code).includes(s) || ceNorm(r.commune).includes(s));
  }, [rows, search]);

  const totalCrd = rows.reduce((s,r)=>s+(r.crd||0),0);
  const totalAuto = rows.reduce((s,r)=>s+(r.autofinancement||0),0);
  const totalVnc = rows.reduce((s,r)=>s+(r.vnc||0),0);

  // §11 — moyenne pondérée au logement = somme(indicateur)/somme(nbLgt) sur le périmètre filtré,
  // scopée aux résidences où l'indicateur est renseigné (pas la moyenne simple des colonnes "par
  // lgt" déjà présentes dans le fichier, qui ne serait pas pondérée par la taille des résidences).
  function weightedAvgPerLgt(key){
    const scoped = residences.filter((r)=>r[key]!==null && r[key]!==undefined);
    const totalLgt = scoped.reduce((s,r)=>s+(r.nbLgt||0),0);
    if (totalLgt<=0) return null;
    return scoped.reduce((s,r)=>s+(r[key]||0),0) / totalLgt;
  }
  const avgCrdLgt = weightedAvgPerLgt('crd');
  const avgAutoLgt = weightedAvgPerLgt('autofinancement');

  const cols = [

    {key:'nom', label:'Résidence'},

    {key:'autofinancement', label:'Autofinancement', render:(r)=>r.autofinancement!==null? fmtEur(r.autofinancement):'—'},
    {key:'vnc', label:'VNC', render:(r)=>r.vnc!==null? fmtEur(r.vnc):'—'},
  ];

  return (
    <div style={{padding:24,display:'flex',flexDirection:'column',gap:20}}>
      <div style={{display:'flex',gap:16,flexWrap:'wrap'}}>
        <KpiCard label="CRD total du patrimoine" value={fmtKEur(totalCrd)} sub={rows.length+" résidences renseignées"} />
        <KpiCard label="CRD moyen pondéré / lgt" value={avgCrdLgt!==null? fmtEur(avgCrdLgt):'—'} />
        <KpiCard label="Autofinancement total" value={fmtKEur(totalAuto)} />
        <KpiCard label="Autofinancement moyen pondéré / lgt" value={avgAutoLgt!==null? fmtEur(avgAutoLgt):'—'} />
        <KpiCard label="VNC totale" value={fmtKEur(totalVnc)} />
        <KpiCard label="VNC moyenne pondérée / lgt" value={avgVncLgt!==null? fmtEur(avgVncLgt):'—'} />
      </div>
      <div className="ce-card" style={{background:'var(--ce-saumon)'}}>
        <p style={{fontSize:'.72rem',color:'var(--ce-vert-fonce)',lineHeight:1.5,margin:0}}>
          CRD, Autofinancement et VNC sont disponibles au niveau résidence dans ce fichier — aucune
          décomposition par opération/emprunt n'a été trouvée dans les fichiers de référence du
          projet, et aucun graphique d'évolution dans le temps n'est donc affiché ici (pas de
          dimension année associée à ces montants).
        </p>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:8}}>
        <span style={{fontSize:'.78rem',fontWeight:700,color:'var(--ce-vert-fonce)'}}>Répartition :</span>
        <button className={mode==='parRes'?'ce-btn ce-btn-sm':'ce-btn-outline ce-btn-sm'} onClick={()=>setMode('parRes')}>Par résidence</button>
        <button className={mode==='parLgt'?'ce-btn ce-btn-sm':'ce-btn-outline ce-btn-sm'} onClick={()=>setMode('parLgt')}>Par logement</button>
      </div>
      {FINANCE_INDICATORS.map((ind)=>(
        <FinanceHistogram key={ind.key} indicator={ind} residences={rows} mode={mode} seuilsStore={financeSeuils} onSeuilsChange={setFinanceSeuils} onSelectResidence={onSelectResidence} />
      ))}
      <div className="ce-card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10,marginBottom:12}}>
          <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700}}>Détail par résidence ({filteredRows.length})</h2>
          <input className="ce-input" placeholder="Rechercher résidence / commune…" value={search} onChange={(e)=>setSearch(e.target.value)} style={{width:220}} />
        </div>
        <SortableTable columns={cols} rows={filteredRows} onRowClick={onSelectResidence} pageSize={20} />
      </div>
    </div>

}

/* ---------------- Analyse libre (tableau croisé dynamique) ---------------- */
function csvSanitizeCell(s){
  // Neutralise l'injection de formule (CSV/Excel) : un champ commençant par =, +, -, @ ou une
  // tabulation est interprété comme une formule par Excel/LibreOffice à l'ouverture du CSV.
  // Préfixer d'une apostrophe force l'interprétation en texte (recommandation OWASP CSV Injection).
  return /^[=+\-@\t]/.test(s) ? "'"+s : s;
}
function downloadCsv(filename, rows){
  const csv = rows.map((r)=>r.map((c)=>{
    const s = csvSanitizeCell(c===null||c===undefined? '' : String(c));
    return /[",;\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(';')).join('\r\n');
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function pivotAggregate(items, metric){
  if (metric.agg==='count') return items.length;
  if (metric.agg==='sum') return items.reduce((s,it)=>s+(metric.get(it)||0),0);
  const vals = items.map(metric.get).filter((v)=>v!==null&&v!==undefined&&!isNaN(v));
  return vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}

// §13 — Analyse libre : direction validée avec Jules (multi-métriques côte à côte, drill-down au
// clic vers la liste résidences/opérations d'une cellule avec lien vers la fiche résidence, tri des
// lignes au clic sur un en-tête, heatmap optionnelle, champs enrichis, presets de croisements
// rapides). Priorisation fine et détail visuel (heatmap, presets) non arbitrés avec Jules : traité en
// dernier, implémentation volontairement simple plutôt que de deviner un détail non validé.
function ViewPivot({residences, operations, onSelectResidence, customPivotViews, setCustomPivotViews}){
  const [dataset, setDataset] = useState('residences');
  const [showChart, setShowChart] = useState(false); // §7.1 — toggle Tableau/Graphique
  const [newViewName, setNewViewName] = useState('');
  // §7.2 — application d'une vue personnalisée qui change de jeu de données : setDataset ci-dessous
  // déclenche l'effet [dataset] qui réinitialise rowKey/colKey/metricKeys par défaut ; cette réf permet
  // à cet effet d'appliquer la vue visée à la place des valeurs par défaut, sans course entre les deux.
  const pendingViewRef = useRef(null);
  const resByCode = useMemo(()=>{ const m={}; residences.forEach((r)=>m[r.code]=r); return m; }, [residences]);

  const RESIDENCE_FIELDS = useMemo(()=>[
    {key:'commune', label:'Commune', get:(r)=>r.commune||'Non renseignée'},
    {key:'secteur', label:'Secteur / agence', get:(r)=>r.secteur||r.agence||'Non renseigné'},
    {key:'qpv', label:'QPV', get:(r)=>r.qpv||'Non renseigné'},
    {key:'financement', label:'Financement', get:(r)=>r.financement||'Non renseigné'},
    {key:'familleAttract', label:'Famille attractivité', get:(r)=>r.familleAttract? ('Famille '+r.familleAttract):'Non renseignée'},
    {key:'familleTechnique', label:'Famille état technique', get:(r)=>r.familleTechnique? ('Famille '+r.familleTechnique):'Non renseignée'},
    {key:'dpeEnergie', label:'DPE Énergie', get:(r)=>r.dpeEnergie||'Non renseigné'},
    {key:'dpeGES', label:'DPE GES', get:(r)=>r.dpeGES||'Non renseigné'},
  ], []);
  const RESIDENCE_METRICS = useMemo(()=>[
    {key:'nbLgt_sum', label:'Nombre de logements', agg:'sum', get:(r)=>r.nbLgt||0, fmt:fmtNum},
    {key:'count', label:'Nombre de résidences', agg:'count', fmt:fmtNum},
    {key:'attractivite_avg', label:'Attractivité moyenne', agg:'avg', get:(r)=>r.attractivite, fmt:(v)=>v!==null?v.toFixed(1):'—'},
    {key:'technique_avg', label:'État technique moyen', agg:'avg', get:(r)=>r.technique, fmt:(v)=>v!==null?v.toFixed(1):'—'},
    {key:'crd_sum', label:'CRD total', agg:'sum', get:(r)=>r.crd||0, fmt:fmtEur},
    {key:'autofinancement_sum', label:'Autofinancement total', agg:'sum', get:(r)=>r.autofinancement||0, fmt:fmtEur},
    {key:'vnc_sum', label:'VNC totale', agg:'sum', get:(r)=>r.vnc||0, fmt:fmtEur},
  ], []);
  const OPERATION_FIELDS = useMemo(()=>[
    {key:'type', label:'Type de travaux', get:(o)=>o.type||'Non renseigné'},
    {key:'famille', label:'Famille de travaux', get:(o)=>familyOfType(o.type)},
    {key:'statut', label:'Statut', get:(o)=>o.statut==='programme'?'Programmé':'Identifié'},
    {key:'annee', label:'Année', get:(o)=>o.annee!==null&&o.annee!==undefined? String(o.annee):'Non renseignée'},
    {key:'commune', label:'Commune (résidence)', get:(o)=>{ const r=resByCode[o.resCode]; return (r&&r.commune)||'Non renseignée'; }},
  ], [resByCode]);
  const OPERATION_METRICS = useMemo(()=>[
    {key:'montant_sum', label:'Montant total', agg:'sum', get:(o)=>o.montant||0, fmt:fmtEur},
    {key:'count', label:"Nombre d'opérations", agg:'count', fmt:fmtNum},
    {key:'logements_sum', label:'Logements concernés', agg:'sum', get:(o)=>o.logements||0, fmt:fmtNum},
  ], []);

  const fields = dataset==='residences' ? RESIDENCE_FIELDS : OPERATION_FIELDS;
  const metrics = dataset==='residences' ? RESIDENCE_METRICS : OPERATION_METRICS;
  const items = dataset==='residences' ? residences : operations;

  const [rowKey, setRowKey] = useState(fields[0].key);
  const [colKey, setColKey] = useState('');
  const [metricKeys, setMetricKeys] = useState([metrics[0].key]);
  const [heatmap, setHeatmap] = useState(false);
  const [sortIdx, setSortIdx] = useState(null);
  const [sortDir, setSortDir] = useState(-1);
  const [drillIdx, setDrillIdx] = useState(null); // {rowIdx, cellIdx} de la cellule dépliée

  useEffect(()=>{
    const pending = pendingViewRef.current;
    if (pending && pending.dataset===dataset){
      setRowKey(pending.rowKey); setColKey(pending.colKey||''); setMetricKeys(pending.metricKeys && pending.metricKeys.length? pending.metricKeys : [metrics[0].key]); setHeatmap(!!pending.heatmap);
      pendingViewRef.current = null;
    } else {
      setRowKey(fields[0].key); setColKey(''); setMetricKeys([metrics[0].key]);
    }
    setSortIdx(null); setDrillIdx(null);
    // eslint-disable-next-line
  }, [dataset]);

  // §7.2 — sauvegarder la configuration actuelle sous un nom, l'appliquer, ou la supprimer.
  function saveCurrentView(){
    const nom = newViewName.trim();
    if (!nom) return;
    const view = { id: genLocalId('pivotview'), nom, dataset, rowKey, colKey, metricKeys: metricKeys.slice(), heatmap };
    setCustomPivotViews((customPivotViews||[]).concat([view]));
    setNewViewName('');
  }
  function applyCustomView(v){
    if (v.dataset===dataset){
      setRowKey(v.rowKey); setColKey(v.colKey||''); setMetricKeys(v.metricKeys && v.metricKeys.length? v.metricKeys : [metrics[0].key]); setHeatmap(!!v.heatmap);
      setSortIdx(null); setDrillIdx(null);
    } else {
      pendingViewRef.current = v;
      setDataset(v.dataset);
    }
  }
  function deleteCustomView(id){ setCustomPivotViews((customPivotViews||[]).filter((v)=>v.id!==id)); }

  const rowField = fields.find((f)=>f.key===rowKey) || fields[0];
  const colField = colKey ? fields.find((f)=>f.key===colKey) : null;
  // .filter() recrée un nouveau tableau à chaque rendu même quand metricKeys n'a pas changé, ce qui
  // invaliderait le useMemo du pivot (dépendant d'activeMetrics) à chaque interaction locale (cocher
  // "Heatmap", ouvrir le drill-down…) et refait recalculer tout le tableau croisé pour rien. On
  // mémoïse sur une signature stable (chaîne) plutôt que sur l'identité du tableau metricKeys.
  const metricKeysSig = metricKeys.join(',');
  const activeMetrics = useMemo(()=>{
    const selected = metrics.filter((m)=>metricKeys.includes(m.key));
    return selected.length? selected : [metrics[0]];
    // eslint-disable-next-line
  }, [metrics, metricKeysSig]);

  function toggleMetric(key){
    setMetricKeys((cur)=> cur.includes(key) ? (cur.length>1? cur.filter((k)=>k!==key) : cur) : cur.concat([key]));
    setSortIdx(null);
  }

  const PRESETS = dataset==='residences' ? [
    {label:'Commune × DPE Énergie (logements)', apply:()=>{ setRowKey('commune'); setColKey('dpeEnergie'); setMetricKeys(['nbLgt_sum']); }},
    {label:'Famille attractivité × État technique', apply:()=>{ setRowKey('familleAttract'); setColKey('familleTechnique'); setMetricKeys(['count']); }},
    {label:'Commune — CRD / Autofinancement / VNC', apply:()=>{ setRowKey('commune'); setColKey(''); setMetricKeys(['crd_sum','autofinancement_sum','vnc_sum']); }},
  ] : [
    {label:'Année × Type de travaux (montant)', apply:()=>{ setRowKey('annee'); setColKey('type'); setMetricKeys(['montant_sum']); }},
    {label:'Statut × Année (nombre)', apply:()=>{ setRowKey('statut'); setColKey('annee'); setMetricKeys(['count']); }},
  ];

  const pivot = useMemo(()=>{
    const rowGroups = {};
    items.forEach((it)=>{ const k=String(rowField.get(it)); (rowGroups[k]=rowGroups[k]||[]).push(it); });
    const rowKeys = Object.keys(rowGroups).sort((a,b)=>a.localeCompare(b,'fr'));
    let colKeys = ['__all__'];
    if (colField){
      const s = new Set();
      items.forEach((it)=>s.add(String(colField.get(it))));
      colKeys = Array.from(s).sort((a,b)=>a.localeCompare(b,'fr'));
    }
    const subsetFor = (rk, ck) => {
      const rowItems = rowGroups[rk] || [];
      return colField ? rowItems.filter((it)=>String(colField.get(it))===ck) : rowItems;
    };
    const rows = rowKeys.map((rk)=>({
      key: rk,
      cells: colKeys.flatMap((ck)=> activeMetrics.map((m)=>({
        value: pivotAggregate(subsetFor(rk,ck), m), items: subsetFor(rk,ck), colKey: ck, metric: m,
      }))),
    }));
    const colTotals = colKeys.flatMap((ck)=>{
      const subset = colField ? items.filter((it)=>String(colField.get(it))===ck) : items;
      return activeMetrics.map((m)=>pivotAggregate(subset, m));
    });
    return { rowKeys, colKeys, rows, colTotals };
  }, [items, rowField, colField, activeMetrics]);

  const sortedRows = useMemo(()=>{
    if (sortIdx===null) return pivot.rows;
    const copy = pivot.rows.slice();
    copy.sort((a,b)=>{
      const va=a.cells[sortIdx].value, vb=b.cells[sortIdx].value;
      if (va===null||va===undefined) return 1; if (vb===null||vb===undefined) return -1;
      return (va-vb)*sortDir;
    });
    return copy;
  }, [pivot.rows, sortIdx, sortDir]);

  function toggleSort(idx){ if (sortIdx===idx) setSortDir(sortDir*-1); else { setSortIdx(idx); setSortDir(-1); } }

  const colMax = useMemo(()=>{
    const max = [];
    (pivot.rows[0]? pivot.rows[0].cells : []).forEach((_,i)=>{
      const vals = pivot.rows.map((r)=>r.cells[i].value).filter((v)=>v!==null&&v!==undefined&&!isNaN(v));
      max[i] = vals.length? Math.max(...vals.map(Math.abs)) : 0;
    });
    return max;
  }, [pivot.rows]);

  function fmtCell(cell){
    if (cell.value===null||cell.value===undefined) return '—';
    return cell.metric.fmt ? cell.metric.fmt(cell.value) : fmtNum(cell.value);
  }

  function exportCsv(){
    const header = [''].concat(pivot.colKeys.flatMap((ck)=> activeMetrics.map((m)=> colField? (ck+' — '+m.label) : m.label)));
    const rows = sortedRows.map((r)=>[r.key].concat(r.cells.map((c)=>c.value===null?'':c.value)));
    const totalRow = ['Total'].concat(pivot.colTotals.map((c)=>c===null?'':c));
    downloadCsv('pivot_'+dataset+'.csv', [header].concat(rows).concat([totalRow]));
  }

  const drillCell = drillIdx!==null ? sortedRows[drillIdx.rowIdx].cells[drillIdx.cellIdx] : null;

  return (
    <div style={{padding:24,display:'flex',flexDirection:'column',gap:20}}>
      <div className="ce-card" style={{background:'var(--ce-saumon)'}}>
        <p style={{fontSize:'.72rem',color:'var(--ce-vert-fonce)',lineHeight:1.5,margin:0}}>
          Choisissez un champ à mettre en ligne et, si besoin, un champ à mettre en colonne, puis une ou
          plusieurs valeurs à agréger. Cliquez sur une cellule du tableau pour voir le détail des
          résidences ou opérations qui la composent, et sur un en-tête de colonne pour trier.
        </p>
      </div>
      <div className="ce-card">
        <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700,marginBottom:14}}>Tableau croisé dynamique</h2>
        <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center',marginBottom:8}}>
          {PRESETS.map((p)=><button key={p.label} className="ce-btn-outline ce-btn-sm" onClick={p.apply}>{p.label}</button>)}
          {(customPivotViews||[]).map((v)=>(
            <span key={v.id} style={{display:'inline-flex',alignItems:'center',gap:2}}>
              <button className="ce-btn-outline ce-btn-sm" onClick={()=>applyCustomView(v)}>{v.nom}</button>
              <button title="Supprimer cette vue" onClick={()=>deleteCustomView(v.id)} style={{background:'none',border:'none',cursor:'pointer',color:'var(--ce-corail)',fontSize:'.9rem',padding:'0 2px'}}>×</button>
            </span>
          ))}
        </div>
        <div style={{display:'flex',gap:6,alignItems:'center',marginBottom:14}}>
          <input className="ce-input" style={{width:200}} placeholder="Nom de la vue à sauvegarder…" value={newViewName} onChange={(e)=>setNewViewName(e.target.value)} />
          <button className="ce-btn-outline ce-btn-sm" onClick={saveCurrentView} disabled={!newViewName.trim()}>+ Sauvegarder cette vue</button>
        </div>
        <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'flex-end'}}>
          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            <label style={{fontSize:'.68rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>Jeu de données</label>
            <select className="ce-select" value={dataset} onChange={(e)=>setDataset(e.target.value)}>
              <option value="residences">Résidences ({residences.length})</option>
              <option value="operations">Opérations ({operations.length})</option>
            </select>
          </div>

              return (

/* ---------------- Jauge (demi-cercle SVG, sans dépendance externe) ---------------- */
function polarPoint(cx, cy, r, angleDeg){
  const rad = angleDeg * Math.PI / 180;
  return { x: cx + r*Math.cos(rad), y: cy - r*Math.sin(rad) };
}
function GaugeChart({value, max, label, color}){
  const size = 160, cx = size/2, cy = size/2+2, r = size/2-16;
  const has = typeof value==='number' && !isNaN(value) && max>0;
  const frac = has ? Math.max(0, Math.min(1, value/max)) : 0;
  const start = polarPoint(cx, cy, r, 180);
  const bgEnd = polarPoint(cx, cy, r, 0);
  const valEnd = polarPoint(cx, cy, r, 180 - 180*frac);
  const bgPath = 'M '+start.x+' '+start.y+' A '+r+' '+r+' 0 0 1 '+bgEnd.x+' '+bgEnd.y;
  const valPath = 'M '+start.x+' '+start.y+' A '+r+' '+r+' 0 0 1 '+valEnd.x+' '+valEnd.y;
  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',flex:1,minWidth:130}}>
      <svg viewBox={'0 0 '+size+' '+(size/2+22)} style={{width:'100%',maxWidth:170}}>
        <path d={bgPath} fill="none" stroke="var(--ce-vert-tres-clair)" strokeWidth="14" strokeLinecap="round" />
        {has && <path d={valPath} fill="none" stroke={color||'var(--ce-vert-principal)'} strokeWidth="14" strokeLinecap="round" />}
        <text x={cx} y={cy-4} textAnchor="middle" fontSize="22" fontWeight="700" fill="var(--ce-vert-tres-fonce)">{has? Math.round(value):'—'}</text>
      </svg>
      <div style={{fontSize:'.72rem',fontWeight:700,color:'var(--ce-vert-fonce)',textAlign:'center',marginTop:2}}>{label}</div>
    </div>
  );
}

/* ---------------- Barres de sous-critères avec seuil (moyenne du parc filtré) ---------------- */
function CriteresBarChart({title, values, residences, groupKey}){
  const known = values.filter((v)=>v.value!==null && v.value!==undefined);
  if (known.length<3) return null;
  // Fragilité sociale : seul groupe dont les valeurs sont un % (cf. parseBaseCotation), pas une note
  // sur 100 comme les autres groupes — l'axe et l'infobulle le précisent pour ne pas laisser croire

    return vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null;
  });

        ]
