/* ---------------- Base de cotation ---------------- */
function SortableTable({columns, rows, onRowClick, pageSize}){
  const [sortCol, setSortCol] = useState(null);
  const [sortDir, setSortDir] = useState(1);
  const [page, setPage] = useState(0);
  const size = pageSize || 20;

  const sorted = useMemo(()=>{
    if (!sortCol) return rows;
    const copy = rows.slice();
    copy.sort((a,b)=>{
      const va=a[sortCol], vb=b[sortCol];
      if (va===null||va===undefined) return 1; if (vb===null||vb===undefined) return -1;
      if (typeof va==='number' && typeof vb==='number') return (va-vb)*sortDir;
      return String(va).localeCompare(String(vb),'fr')*sortDir;
    });
    return copy;
  }, [rows, sortCol, sortDir]);

  useEffect(()=>{ setPage(0); }, [rows.length, sortCol, sortDir]);
  const pageCount = Math.max(1, Math.ceil(sorted.length/size));
  const pageRows = sorted.slice(page*size, page*size+size);

  function toggleSort(key){ if (sortCol===key) setSortDir(sortDir*-1); else { setSortCol(key); setSortDir(1); } }

  return (
    <div>
      <div style={{overflowX:'auto',maxHeight:480,overflowY:'auto',border:'1px solid #eef4f2',borderRadius:8}}>
        <table className="ce-table">
          <thead><tr>{columns.map((c)=>(
            <th key={c.key} onClick={()=>toggleSort(c.key)}>{c.label}{sortCol===c.key? (sortDir>0?' ▲':' ▼'):''}</th>
          ))}</tr></thead>
          <tbody>
            {pageRows.map((row,i)=>(
              <tr key={i} onClick={()=>onRowClick && onRowClick(row)}>
                {columns.map((c)=><td key={c.key}>{c.render? c.render(row): (row[c.key]??'—')}</td>)}
              </tr>
            ))}
            {pageRows.length===0 && <tr><td colSpan={columns.length} style={{textAlign:'center',color:'#9fb3ae',padding:20}}>Aucun résultat pour ces filtres.</td></tr>}
          </tbody>
        </table>
      </div>
      {pageCount>1 && (
        <div style={{display:'flex',gap:8,alignItems:'center',justifyContent:'flex-end',marginTop:10,fontSize:'.75rem',color:'var(--ce-vert-fonce)'}}>
          <button className="ce-btn-outline ce-btn-sm" disabled={page===0} onClick={()=>setPage(page-1)}>◀</button>
          <span>Page {page+1} / {pageCount}</span>
          <button className="ce-btn-outline ce-btn-sm" disabled={page>=pageCount-1} onClick={()=>setPage(page+1)}>▶</button>
        </div>
      )}
    </div>
  );
}

/* ---------------- Segmentation en 9 familles (grille 3x3) ---------------- */
function critValue(r, key){
  if (key==='attractivite') return r.attractivite;
  if (key==='technique') return r.technique;
  return (r.notes && r.notes[key]!==undefined) ? r.notes[key] : null;
}
const SEG_BANDS = ['Très bon','Bon','Mauvais'];
function bandOf(pct){
  if (pct===null||pct===undefined||isNaN(pct)) return null;
  if (pct>=70) return 'Très bon';
  if (pct>=50) return 'Bon';
  return 'Mauvais';
}

function SegmentationGrid({residences, onSelectResidence}){
  const criteria = useMemo(()=>{
    const list = [
      {key:'attractivite', label:'Attractivité'},
      {key:'technique', label:'État technique'},
    ];
    const noteKeys = new Set();
    residences.forEach((r)=>{ if (r.notes) Object.keys(r.notes).forEach((k)=>{ if (r.notes[k]!==null && r.notes[k]!==undefined) noteKeys.add(k); }); });
    Array.from(noteKeys).sort((a,b)=>a.localeCompare(b,'fr')).forEach((k)=>list.push({key:k, label:k}));
    return list;
  }, [residences]);

  const [xKey, setXKey] = useState('attractivite');
  const [yKey, setYKey] = useState('technique');
  const [sizeBy, setSizeBy] = useState('nbLgt');
  const [pinned, setPinned] = useState(null);

  const xLabel = (criteria.find((c)=>c.key===xKey)||{}).label || xKey;
  const yLabel = (criteria.find((c)=>c.key===yKey)||{}).label || yKey;

  const { rows, colTotals, rowTotals, maxCell, unclassified, maxVal } = useMemo(()=>{
    const xVals = residences.map((r)=>critValue(r,xKey)).filter((v)=>v!==null&&v!==undefined&&!isNaN(v)&&v>0);
    const yVals = residences.map((r)=>critValue(r,yKey)).filter((v)=>v!==null&&v!==undefined&&!isNaN(v)&&v>0);
    const xMax = xVals.length? Math.max(...xVals) : null;
    const yMax = yVals.length? Math.max(...yVals) : null;

    const classified = [];
    let unclassifiedCount = 0;
    residences.forEach((r)=>{
      const xv = critValue(r,xKey), yv = critValue(r,yKey);
      const xPct = (xv!==null&&xv!==undefined&&!isNaN(xv)&&xMax>0) ? (xv/xMax*100) : null;
      const yPct = (yv!==null&&yv!==undefined&&!isNaN(yv)&&yMax>0) ? (yv/yMax*100) : null;
      const xBand = bandOf(xPct), yBand = bandOf(yPct);
      if (!xBand || !yBand) { unclassifiedCount++; return; }
      classified.push({ r, xBand, yBand });
    });

    const cellsOf = (yBand)=> SEG_BANDS.slice().reverse().map((xBand)=>{
      const members = classified.filter((c)=>c.yBand===yBand && c.xBand===xBand).map((c)=>c.r);
      const value = sizeBy==='nbLgt' ? members.reduce((s,r)=>s+(r.nbLgt||0),0) : members.length;
      return { xBand, yBand, members, value };
    });
    const rows = SEG_BANDS.map((yBand)=>({ yBand, cells: cellsOf(yBand) }));
    const maxCell = Math.max(1, ...rows.flatMap((row)=>row.cells.map((c)=>c.value)));
    const rowTotals = rows.map((row)=>row.cells.reduce((s,c)=>s+c.value,0));
    const colTotals = SEG_BANDS.slice().reverse().map((_,ci)=>rows.reduce((s,row)=>s+row.cells[ci].value,0));
    const maxVal = sizeBy==='nbLgt' ? residences.reduce((s,r)=>s+(r.nbLgt||0),0) : residences.length;
    return { rows, colTotals, rowTotals, maxCell, unclassified: unclassifiedCount, maxVal };
  }, [residences, xKey, yKey, sizeBy]);

  const pinnedMembers = pinned ? (rows.find((r)=>r.yBand===pinned.yBand).cells.find((c)=>c.xBand===pinned.xBand).members) : null;
  function togglePinned(cell){
    setPinned((cur)=> (cur && cur.xBand===cell.xBand && cur.yBand===cell.yBand) ? null : {xBand:cell.xBand, yBand:cell.yBand});
  }

  return (
    <div className="ce-card">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10,marginBottom:14}}>
        <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700}}>Segmentation en 9 familles</h2>
        <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'flex-end'}}>
          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            <label style={{fontSize:'.66rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>Axe X</label>
            <select className="ce-select" value={xKey} onChange={(e)=>setXKey(e.target.value)}>
              {criteria.map((c)=><option key={c.key} value={c.key} disabled={c.key===yKey}>{c.label}</option>)}
            </select>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            <label style={{fontSize:'.66rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>Axe Y</label>
            <select className="ce-select" value={yKey} onChange={(e)=>setYKey(e.target.value)}>
              {criteria.map((c)=><option key={c.key} value={c.key} disabled={c.key===xKey}>{c.label}</option>)}
            </select>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            <label style={{fontSize:'.66rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>Taille des familles</label>
            <select className="ce-select" value={sizeBy} onChange={(e)=>setSizeBy(e.target.value)}>
              <option value="nbLgt">Nombre de logements</option>
              <option value="count">Nombre de résidences</option>
            </select>
          </div>
        </div>
      </div>

      <div style={{display:'flex',gap:20,flexWrap:'wrap',alignItems:'flex-start'}}>
        <div style={{display:'flex',gap:8}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'center',writingMode:'vertical-rl',transform:'rotate(180deg)',fontSize:'.72rem',fontWeight:700,color:'var(--ce-vert-fonce)',padding:'4px 0'}}>{yLabel}</div>
          <div>
            <div style={{display:'grid',gridTemplateColumns:'90px repeat(3, 130px)',gap:4}}>
              <div></div>
              {SEG_BANDS.slice().reverse().map((xBand)=>(
                <div key={xBand} style={{textAlign:'center',fontSize:'.68rem',fontWeight:700,color:'var(--ce-vert-fonce)'}}>{xBand}</div>
              ))}
              {rows.map((row)=>(
                <React.Fragment key={row.yBand}>
                  <div style={{display:'flex',alignItems:'center',fontSize:'.68rem',fontWeight:700,color:'var(--ce-vert-fonce)'}}>{row.yBand}</div>
                  {row.cells.map((cell)=>{
                    const alpha = 0.1 + 0.8*(cell.value/maxCell);
                    const isPinned = pinned && pinned.xBand===cell.xBand && pinned.yBand===cell.yBand;
                    return (
                      <div key={cell.xBand}
                        onClick={()=>togglePinned(cell)}
                        style={{
                          height:80,borderRadius:8,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
                          background: cell.value>0 ? 'rgba(0,146,97,'+alpha.toFixed(2)+')' : '#f5f8f7',
                          border: isPinned? '2px solid var(--ce-vert-tres-fonce)' : '1px solid #eef4f2',
                          cursor:'pointer', transition:'border .1s',
                        }}>
                        <span style={{fontSize:'1.1rem',fontWeight:700,color: alpha>0.5? '#fff':'var(--ce-vert-tres-fonce)'}}>{sizeBy==='nbLgt'? fmtNum(cell.value): cell.value}</span>
                        <span style={{fontSize:'.65rem',color: alpha>0.5? '#fff':'var(--ce-vert-fonce)'}}>{cell.members.length} résidence{cell.members.length>1?'s':''}</span>
                      </div>
                    );
                  })}
                </React.Fragment>
              ))}
            </div>
            <div style={{textAlign:'center',fontSize:'.72rem',fontWeight:700,color:'var(--ce-vert-fonce)',marginTop:6}}>{xLabel}</div>
          </div>
        </div>

        <div style={{flex:1,minWidth:220,border:'1px solid #eef4f2',borderRadius:8,padding:'10px 14px',maxHeight:280,overflowY:'auto'}}>
          {!pinned && <div style={{fontSize:'.78rem',color:'#9fb3ae'}}>Cliquez sur une famille pour voir la liste des résidences concernées.</div>}
          {pinned && (
            <React.Fragment>
              <div style={{fontSize:'.78rem',fontWeight:700,color:'var(--ce-vert-tres-fonce)',marginBottom:8}}>
                {yLabel} : {pinned.yBand} · {xLabel} : {pinned.xBand} — {pinnedMembers.length} résidence{pinnedMembers.length>1?'s':''}
              </div>
              {pinnedMembers.length===0 && <div style={{fontSize:'.76rem',color:'#9fb3ae'}}>Aucune résidence.</div>}
              {pinnedMembers.map((r)=>(
                <div key={r.code} onClick={()=>onSelectResidence && onSelectResidence(r)} style={{fontSize:'.76rem',color:'var(--ce-vert-fonce)',padding:'3px 0',borderBottom:'1px solid #f0f5f3',cursor:onSelectResidence?'pointer':'default'}}>
                  {r.nom || r.code} <span style={{color:'#9fb3ae'}}>— {fmtNum(r.nbLgt)} lgt</span>
                </div>
              ))}
            </React.Fragment>
          )}
        </div>
      </div>

      <p style={{fontSize:'.7rem',color:'var(--ce-vert-fonce)',marginTop:12,lineHeight:1.5}}>
        Chaque critère est ramené en pourcentage de son maximum observé dans le fichier importé, puis classé
        « Très bon » (≥ 70), « Bon » (50 à 70) ou « Mauvais » (&lt; 50). Les familles disponibles dans les menus
        sont détectées automatiquement parmi les colonnes de notation du fichier (Attractivité, État technique,
        et toute autre colonne de note/moyenne présente).
        {unclassified>0 && <span> {unclassified} résidence{unclassified>1?'s':''} non classée{unclassified>1?'s':''} (donnée manquante sur l'un des deux critères).</span>}
      </p>
    </div>
  );
}

function ViewCotation({residences, onSelectResidence, operations, includeIdentifiees, baseImport}){
  const [showAdvanced, setShowAdvanced] = useState(false);
  const [compareView, setCompareView] = useState('overlay'); // 'overlay' | 'base' | 'actuel'
  const hasScatterData = residences.some((r)=>r.attractivite!==null && r.technique!==null);
  const hasCompareBase = !!baseImport;

  const scatterPoints = residences.filter((r)=>r.attractivite!==null && r.technique!==null).map((r)=>({
    x:r.attractivite, y:r.technique, r: Math.max(4,Math.min(22, Math.sqrt(r.nbLgt||1)*1.6)), res:r
  }));

  // Comparaison inline "Base" vs "Actuel" (cf. spec dédiée) : le point "Actuel" utilise l'État
  // technique projeté selon les opérations simulées (matrice RC/Réha), pas la valeur brute du
  // fichier — c'est tout l'intérêt de la comparaison. Résidences démolies dans la simulation : exclues
  // (pas de point à comparer). Résidences sans détail des 5 sous-critères : repli sur la valeur brute.
  const actuelComparePoints = useMemo(()=>{
    if (!hasCompareBase) return [];
    return residences.filter((r)=>r.attractivite!==null).map((r)=>{
      const proj = computeTechniqueProjection(r, operations, includeIdentifiees);
      const tech = proj ? (proj.demolished? null : proj.technique) : r.technique;
      return tech!==null && tech!==undefined ? {x:r.attractivite, y:tech, r: Math.max(4,Math.min(22, Math.sqrt(r.nbLgt||1)*1.6)), res:r} : null;
    }).filter(Boolean);
  }, [residences, operations, includeIdentifiees, hasCompareBase]);
  const baseComparePoints = useMemo(()=>{
    if (!hasCompareBase) return [];
    return (baseImport.data.residences||[]).filter((r)=>r.attractivite!==null && r.technique!==null).map((r)=>({
      x:r.attractivite, y:r.technique, r: Math.max(4,Math.min(22, Math.sqrt(r.nbLgt||1)*1.6)), res:r
    }));
  }, [baseImport, hasCompareBase]);
  const avgTech = (pts)=> pts.length? pts.reduce((s,p)=>s+p.y,0)/pts.length : null;
  const deltaTechnique = hasCompareBase && actuelComparePoints.length && baseComparePoints.length
    ? avgTech(actuelComparePoints) - avgTech(baseComparePoints) : null;

  const baseCols = [
    {key:'code', label:'Code'},
    {key:'nom', label:'Résidence'},
    {key:'commune', label:'Commune'},
    {key:'familleAttract', label:'Segment'},
    {key:'attractivite', label:'Attractivité', render:(r)=>r.attractivite!==null? r.attractivite.toFixed(1):'—'},
    {key:'technique', label:'État technique', render:(r)=>r.technique!==null? r.technique.toFixed(1):'—'},
    {key:'dpeEnergie', label:'DPE', render:(r)=><DpeBadge cl={r.dpeEnergie}/>},
  ];
  const advancedCols = [
    {key:'nbLgt', label:'Nb lgt'},
    {key:'secteur', label:'Secteur'},
    {key:'agence', label:'Agence'},
    {key:'dpeGES', label:'DPE GES', render:(r)=><DpeBadge cl={r.dpeGES}/>},
    {key:'familleTechnique', label:'Segment technique'},
    {key:'qpv', label:'QPV'},
  ];
  const columns = showAdvanced ? baseCols.concat(advancedCols) : baseCols;

  return (
    <div style={{padding:24,display:'flex',flexDirection:'column',gap:20}}>
      {hasScatterData && (
        <div className="ce-card">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10,flexWrap:'wrap',gap:8}}>
            <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700}}>Segmentation — Attractivité × État technique</h2>
            <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
              {hasCompareBase && (
                <div style={{display:'flex',gap:6}}>
                  <button className={compareView==='overlay'?'ce-btn ce-btn-sm':'ce-btn-outline ce-btn-sm'} onClick={()=>setCompareView('overlay')}>Superposé</button>
                  <button className={compareView==='base'?'ce-btn ce-btn-sm':'ce-btn-outline ce-btn-sm'} onClick={()=>setCompareView('base')}>Base seule</button>
                  <button className={compareView==='actuel'?'ce-btn ce-btn-sm':'ce-btn-outline ce-btn-sm'} onClick={()=>setCompareView('actuel')}>Actuel seul</button>
                </div>
              )}
              <span style={{fontSize:'.7rem',color:'var(--ce-vert-fonce)'}}>Taille des bulles = nombre de logements</span>
            </div>
          </div>
          {hasCompareBase && deltaTechnique!==null && (
            <div style={{fontSize:'.78rem',color:'var(--ce-vert-fonce)',marginBottom:10}}>
              Δ note technique moyenne du parc : <b style={{color: deltaTechnique>=0?'var(--ce-vert-principal)':'var(--ce-corail)'}}>{deltaTechnique>=0?'+':''}{deltaTechnique.toFixed(1)}</b> (base « {baseImport.nom} » → actuel)
            </div>
          )}
          {!hasCompareBase ? (
            <ChartCanvas type="bubble" height={340} data={{
              datasets:[{
                label:'Résidences',
                data: scatterPoints,
                backgroundColor: scatterPoints.map((p)=> PALETTE[(String(p.res.familleAttract||'').charCodeAt(0)||0)%PALETTE.length]+'cc'),
              }]
            }} options={{
              plugins:{ legend:{display:false},
                tooltip:{ callbacks:{ label:(ctx)=>{ const r=ctx.raw.res; return (r.nom||r.code)+' — Attract. '+r.x.toFixed(1)+' / Tech. '+r.y.toFixed(1)+' / '+fmtNum(r.nbLgt)+' lgt'; } } }
              },
              scales:{ x:{title:{display:true,text:'Attractivité'}}, y:{title:{display:true,text:'État technique'}} },
              onClick:(evt,elements)=>{ if(elements.length){ const p=scatterPoints[elements[0].index]; onSelectResidence(p.res); } }
            }} />
          ) : (
            <ChartCanvas type="bubble" height={340} data={{
              datasets:[
                ...(compareView!=='actuel'? [{ label:'Base — '+baseImport.nom, data: baseComparePoints, backgroundColor:'#9fb3aecc' }] : []),
                ...(compareView!=='base'? [{ label:'Actuel (projeté)', data: actuelComparePoints, backgroundColor:'#009261cc' }] : []),
              ]
            }} options={{
              plugins:{ legend:{display:true},
                tooltip:{ callbacks:{ label:(ctx)=>{ const r=ctx.raw.res; return ctx.dataset.label+' — '+(r.nom||r.code)+' — Attract. '+ctx.raw.x.toFixed(1)+' / Tech. '+ctx.raw.y.toFixed(1); } } }
              },
              scales:{ x:{title:{display:true,text:'Attractivité'}}, y:{title:{display:true,text:'État technique'}} },
              onClick:(evt,elements)=>{
                if (!elements.length) return;
                const el = elements[0];
                // seule la série "Actuel" est cliquable pour ouvrir la fiche résidence (les points "Base"
                // proviennent d'un instantané figé, distinct des opérations actuellement simulées).
                const isActuelDataset = (compareView==='actuel') || (compareView==='overlay' && el.datasetIndex===1);
                if (isActuelDataset && actuelComparePoints[el.index]) onSelectResidence(actuelComparePoints[el.index].res);
              }
            }} />
          )}
        </div>
      )}
      <SegmentationGrid residences={residences} onSelectResidence={onSelectResidence} />
      <div className="ce-card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
          <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700}}>Table des résidences ({residences.length})</h2>
          <button className="ce-btn-outline ce-btn-sm" onClick={()=>setShowAdvanced(!showAdvanced)}>{showAdvanced? 'Masquer les colonnes avancées':'Colonnes avancées'}</button>
        </div>
        <SortableTable columns={columns} rows={residences} onRowClick={onSelectResidence} pageSize={20} />
      </div>
    </div>
  );
}

/* ---------------- Cartographie ---------------- */
function scoreStatusColor(value){
  if (value===null || value===undefined || isNaN(value)) return STATUS_COLORS.unknown;
  if (value<35) return STATUS_COLORS.critical;
  if (value<55) return STATUS_COLORS.serious;
  if (value<75) return STATUS_COLORS.warning;
  return STATUS_COLORS.good;
}
function ViewCarto({residences, allResidences, onSelectResidence}){
  const [colorMode, setColorMode] = useState('attractivite');
  const {coords, progress, status} = useGeocoding(allResidences);

  const withAddress = residences.filter((r)=>r.adresse).length;
  const failed = residences.filter((r)=>r.adresse && coords[r.code]===null).length;

  // Mémorisé : passé tel quel à LeafletMap, dont l'effet de (re)construction des marqueurs et de
  // recentrage de la carte dépend de cette référence. Sans ce useMemo, un rendu de ViewCarto
  // déclenché par un état sans rapport avec la carte (ex. ouverture de la fiche résidence, qui fait
  // remonter selectedResidence dans App) recréerait un nouveau tableau à chaque fois, et ferait donc
  // recharger inutilement tous les marqueurs et re-fitter la vue de la carte.
  const markers = useMemo(()=> residences.filter((r)=>coords[r.code]!=null).map((r)=>{
    const c = coords[r.code];
    let color;
    if (colorMode==='dpe') color = DPE_COLORS[String(r.dpeEnergie||'').toUpperCase()] || DPE_COLORS.NR;
    else if (colorMode==='technique') color = scoreStatusColor(r.technique);
    else color = scoreStatusColor(r.attractivite);
    return {res:r, lat:c.lat, lon:c.lon, color};
  }), [residences, coords, colorMode]);

  const legendDefs = colorMode==='dpe'
    ? [['A / B', DPE_COLORS.A],['C', DPE_COLORS.C],['D', DPE_COLORS.D],['E', DPE_COLORS.E],['F', DPE_COLORS.F],['G', DPE_COLORS.G],['NR', DPE_COLORS.NR]]
    : [['Bon (≥75)', STATUS_COLORS.good],['Correct (55-75)', STATUS_COLORS.warning],['Fragile (35-55)', STATUS_COLORS.serious],['Faible (<35)', STATUS_COLORS.critical],['Non renseigné', STATUS_COLORS.unknown]];

  return (
    <div style={{padding:24,display:'flex',flexDirection:'column',gap:20}}>
      <div style={{display:'flex',gap:16,flexWrap:'wrap'}}>
        <KpiCard label="Résidences géolocalisées" value={fmtNum(markers.length)} sub={"sur "+fmtNum(residences.length)} />
        <KpiCard label="Adresses non résolues" value={fmtNum(failed)} sub={failed>0? "vérifier l'adresse dans le fichier source":"—"} />
        {status==='loading' && <KpiCard label="Géolocalisation en cours" value={progress.done+' / '+progress.total} sub="via api-adresse.data.gouv.fr" />}
      </div>

      <div className="ce-card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14,flexWrap:'wrap',gap:10}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <span style={{fontSize:'.78rem',fontWeight:700,color:'var(--ce-vert-fonce)'}}>Coloration</span>
            <select className="ce-select" value={colorMode} onChange={(e)=>setColorMode(e.target.value)}>
              <option value="attractivite">Attractivité</option>
              <option value="technique">État technique</option>
              <option value="dpe">DPE énergie</option>
            </select>
          </div>
          <div className="carto-legend">
            {legendDefs.map((it)=>(<span key={it[0]} style={{display:'flex',alignItems:'center'}}><span className="sw" style={{background:it[1]}}></span>{it[0]}</span>))}
          </div>
        </div>
        {withAddress===0 ? (
          <div style={{padding:'40px 20px',textAlign:'center',color:'#9fb3ae',fontSize:'.85rem'}}>Aucune adresse exploitable n'a été trouvée dans le fichier importé pour ces résidences.</div>
        ) : (
          <LeafletMap markers={markers} height={520} onSelectResidence={onSelectResidence} />
        )}
      </div>

      <div style={{fontSize:'.7rem',color:'#9fb3ae'}}>Positionnement par géocodage des adresses via l'API publique <a href="https://api-adresse.data.gouv.fr/" target="_blank" rel="noreferrer" style={{color:'var(--ce-vert-principal)'}}>api-adresse.data.gouv.fr</a> (Base Adresse Nationale) — seules les adresses sont transmises à ce service, mises en cache localement dans votre navigateur. Cliquez sur un point pour ouvrir la fiche résidence complète.</div>
    </div>
  );
}

/* ---------------- Investissements & simulation ---------------- */
function computeYearsRange(operations){
  const yrs = operations.map((o)=>o.annee).filter((y)=>y!==null && y!==undefined && !isNaN(y));
  let min = yrs.length? Math.min(...yrs) : 2026;
  let max = yrs.length? Math.max(...yrs) : 2036;
  min = Math.min(min, 2026); max = Math.max(max, min+5);
  const arr=[]; for (let y=min;y<=max;y++) arr.push(y);
  return arr;
}

// §9.1 — catégorisation de la colonne brute "Type de travaux" (RC / Réha. / Changement de vecteur /
// Démolition), utilisée UNIQUEMENT comme filtre dans le tableau des opérations de cette vue — jamais
// comme champ éditable, et jamais ailleurs dans l'outil (fiche résidence, pivot, formulaire d'ajout).
// Mêmes règles de détection que familyOfType() (robuste aux variantes de libellé), labels alignés sur
// le vocabulaire brut du fichier plutôt que sur les familles conviviales du graphique d'agrégation.
const TYPE_CAT_OPTIONS = ['RC','Réha.','Changement de vecteur','Démolition','Non renseigné'];
function typeCategorie(type){
  if (!type) return 'Non renseigné';
  const n = ceNorm(type);
  if (/^demol/.test(n)) return 'Démolition';
  if (/^reha/.test(n)) return 'Réha.';
  if (/passage|vecteur|chgt de mode|chaudiere condensation/.test(n)) return 'Changement de vecteur';
  return 'RC';
}
// §8 — palette des lignes budgétaires libres, distincte des couleurs de familles de travaux
// (Réhabilitation/RC/Chgt de vecteur/Démolition) déjà utilisées dans le même graphique empilé.
const BUDGET_LIGNE_COLORS = ['#F8C6BA','#9fb3ae','#B79CED','#FFD16A','#6BC9C0','#E6A4B4'];
function sumBudgetLignesYear(lignes, y){ return (lignes||[]).reduce((s,l)=>s+(Number((l.valeurs||{})[y])||0),0); }
function ViewInvestissements({residences, operations, setOperations, includeIdentifiees, setIncludeIdentifiees, budgetLignes, setBudgetLignes, gainsGrid, isModified, onReset, baseImport}){
  const [search, setSearch] = useState('');
  const [compareView, setCompareView] = useState('overlay'); // 'overlay' | 'base' | 'actuel'
  const [filterNature, setFilterNature] = useState('');
  const [filterTypeCat, setFilterTypeCat] = useState('');
  const [filterStatut, setFilterStatut] = useState('');
  const [filterAnneeMin, setFilterAnneeMin] = useState('');
  const [filterAnneeMax, setFilterAnneeMax] = useState('');
  const [filterMontantMin, setFilterMontantMin] = useState('');
  const [filterMontantMax, setFilterMontantMax] = useState('');
  const [editingLigneId, setEditingLigneId] = useState(null);
  const [editingLigneName, setEditingLigneName] = useState('');
  const years = useMemo(()=>computeYearsRange(operations), [operations]);
  const resByCode = useMemo(()=>{ const m={}; residences.forEach((r)=>m[r.code]=r); return m; }, [residences]);

  const visibleOps = useMemo(()=>operations.filter((o)=> includeIdentifiees || o.statut==='programme'), [operations, includeIdentifiees]);

  const families = ['Réhabilitation','Remplacement de composants','Changement de vecteur','Démolition'];
  const famColors = {'Réhabilitation':'#009261','Remplacement de composants':'#58D88B','Changement de vecteur':'#264E46','Démolition':'#FF8364'};

  const aggregation = useMemo(()=>{
    const agg = {}; families.forEach((f)=>{ agg[f]={}; years.forEach((y)=>agg[f][y]=0); });
    visibleOps.forEach((o)=>{ if (o.annee===null||!years.includes(o.annee)) return; const f=familyOfType(o.type); if(!agg[f]) agg[f]={}; agg[f][o.annee]=(agg[f][o.annee]||0)+(o.montant||0); });
    return { agg };
  }, [visibleOps, years]);

  const totalByYear = years.map((y)=> families.reduce((s,f)=>s+(aggregation.agg[f][y]||0),0) + sumBudgetLignesYear(budgetLignes, y));

  const hasCompareBase = !!baseImport;
  const baseTotalByYear = useMemo(()=>{
    if (!hasCompareBase) return null;
    const baseOps = (baseImport.simOperations||[]).filter((o)=> baseImport.includeIdentifiees || o.statut==='programme');
    return years.map((y)=> baseOps.filter((o)=>o.annee===y).reduce((s,o)=>s+(o.montant||0),0) + sumBudgetLignesYear(baseImport.budgetLignes, y));
  }, [baseImport, years, hasCompareBase]);
  const sumArr = (arr)=> arr? arr.reduce((a,b)=>a+b,0) : null;
  const deltaBudget = hasCompareBase ? sumArr(totalByYear) - sumArr(baseTotalByYear) : null;
  const deltaBudgetPct = hasCompareBase && sumArr(baseTotalByYear)>0 ? (deltaBudget/sumArr(baseTotalByYear)*100) : null;

  const typeOptions = useMemo(()=>{
    const s = new Set(Object.keys(gainsGrid));
    // o.type est null pour une opération venant d'être ajoutée (§9.3, champs vides à la création) :
    // sans ce garde, Array.from(s).sort() tente null.localeCompare(...) et fait planter tout le rendu
    // React (aucun error boundary dans l'app) dès qu'une opération est ajoutée.
    operations.forEach((o)=>{ if (o.type) s.add(o.type); });
    return Array.from(s).sort((a,b)=>a.localeCompare(b,'fr'));
  }, [gainsGrid, operations]);

  const hasActiveFilters = !!(search.trim() || filterNature || filterTypeCat || filterStatut || filterAnneeMin!=='' || filterAnneeMax!=='' || filterMontantMin!=='' || filterMontantMax!=='');
  function resetFilters(){
    setSearch(''); setFilterNature(''); setFilterTypeCat(''); setFilterStatut('');
    setFilterAnneeMin(''); setFilterAnneeMax(''); setFilterMontantMin(''); setFilterMontantMax('');
  }

  const filteredOps = useMemo(()=>{
    const s = ceNorm(search);
    const aMin = filterAnneeMin===''? null : Number(filterAnneeMin);
    const aMax = filterAnneeMax===''? null : Number(filterAnneeMax);
    const mMin = filterMontantMin===''? null : Number(filterMontantMin);
    const mMax = filterMontantMax===''? null : Number(filterMontantMax);
    return operations.filter((o)=>{
      const r = resByCode[o.resCode];
      if (s && !(ceNorm(o.nature||o.type).includes(s) || ceNorm(o.resCode).includes(s) || (r && ceNorm(r.nom).includes(s)))) return false;
      if (filterNature && (o.nature||o.type)!==filterNature) return false;
      if (filterTypeCat && typeCategorie(o.type)!==filterTypeCat) return false;
      if (filterStatut && o.statut!==filterStatut) return false;
      if (aMin!==null && (o.annee===null || o.annee<aMin)) return false;
      if (aMax!==null && (o.annee===null || o.annee>aMax)) return false;
      if (mMin!==null && (o.montant||0)<mMin) return false;
      if (mMax!==null && (o.montant||0)>mMax) return false;
      return true;
    }).map((o)=>Object.assign({}, o, {resNom: (resByCode[o.resCode]||{}).nom || o.resCode}));
  }, [operations, search, filterNature, filterTypeCat, filterStatut, filterAnneeMin, filterAnneeMax, filterMontantMin, filterMontantMax, resByCode]);

  function updateOp(id, patch){ setOperations(operations.map((o)=> o.id===id? Object.assign({},o,patch) : o)); }
  function deleteOp(id){ setOperations(operations.filter((o)=>o.id!==id)); }
  function addLigne(){
    const id = 'ligne_'+Date.now();
    setBudgetLignes(budgetLignes.concat([{id, nom:'Nouvelle ligne', valeurs:{}}]));
  }
  function removeLigne(id){ setBudgetLignes(budgetLignes.filter((l)=>l.id!==id)); }
  function updateLigneValeur(id, year, rawVal){
    setBudgetLignes(budgetLignes.map((l)=> l.id===id? Object.assign({},l,{valeurs:Object.assign({},l.valeurs,{[year]: rawVal===''? undefined : Number(rawVal)})}) : l));
  }
  function commitLigneName(id){
    setBudgetLignes(budgetLignes.map((l)=> l.id===id? Object.assign({},l,{nom: editingLigneName || l.nom}) : l));
    setEditingLigneId(null);
  }
  function addOp(){
    // Garde nécessaire : si les filtres transverses actifs excluent toutes les résidences,
    // residences[0] est undefined — sans cette garde, l'opération était créée avec un
    // resCode undefined, invisible dans toutes les vues et impossible à retrouver/supprimer.
    if (!residences.length) return;
    // §9.3 — tous les champs modifiables démarrent vides pour repérer immédiatement la ligne
    // nouvellement ajoutée (au lieu de pré-remplir résidence/nature/année/montant par défaut).
    const newOp = { id:'op_new_'+Date.now(), resCode:null, nature:null, type:null, statut:null, annee:null, anneeFin:null, montant:null, logements:null, origine:'ajout' };
    setOperations([newOp].concat(operations));
  }

  const opsCols = [
    {key:'resCode', label:'Résidence', render:(o)=>{
      const inList = residences.some((r)=>r.code===o.resCode);
      return (
        <select className="ce-select" value={o.resCode ?? ''} onChange={(e)=>updateOp(o.id,{resCode:e.target.value})}>
          <option value="" disabled>— À sélectionner —</option>
          {!inList && o.resCode && <option value={o.resCode}>{o.resNom || o.resCode} (hors filtre)</option>}
          {residences.map((r)=><option key={r.code} value={r.code}>{r.nom||r.code}</option>)}
        </select>
      );
    }},
    {key:'nature', label:'Nature des travaux', render:(o)=>{
      const generic = !hasKnownDpeGain(o, gainsGrid);
      const val = o.nature ?? o.type ?? '';
      return (
        <div>
          <select className="ce-select" value={val} onChange={(e)=>updateOp(o.id,{nature:e.target.value})}>
            <option value="" disabled>— À sélectionner —</option>
            {typeOptions.map((t)=><option key={t} value={t}>{t}</option>)}
          </select>
          {val && generic && <div style={{fontSize:'.65rem',color:'var(--ce-corail)',marginTop:2}}>type générique importé — gain DPE non calculé</div>}
        </div>
      );
    }},
    {key:'type', label:'Type de travaux', render:(o)=><span style={{color:'#9fb3ae'}}>{o.type || 'Non renseigné'}</span>},
    {key:'statut', label:'Statut', render:(o)=>(
      <select className="ce-select" value={o.statut ?? ''} onChange={(e)=>updateOp(o.id,{statut:e.target.value})}>
        <option value="" disabled>— À sélectionner —</option>
        <option value="programme">Programmé</option>
        <option value="identifie">Identifié</option>
      </select>
    )},
    {key:'annee', label:'Année', render:(o)=><input className="ce-input" style={{width:76}} type="number" value={o.annee ?? ''} onChange={(e)=>updateOp(o.id,{annee: e.target.value===''? null: Number(e.target.value)})} />},
    {key:'anneeFin', label:'Date de fin de travaux', render:(o)=><input className="ce-input" style={{width:76}} type="number" value={o.anneeFin ?? ''} onChange={(e)=>updateOp(o.id,{anneeFin: e.target.value===''? null: Number(e.target.value)})} />},
    {key:'montant', label:'Coût de revient TTC', render:(o)=><input className="ce-input" style={{width:110}} type="number" value={o.montant ?? ''} onChange={(e)=>updateOp(o.id,{montant: e.target.value===''? null: Number(e.target.value)})} />},
    {key:'_coutLgt', label:'Coût TTC / logement', render:(o)=> (o.logements>0 && o.montant!==null && o.montant!==undefined) ? fmtEur(o.montant/o.logements) : '—'},
    {key:'_actions', label:'', render:(o)=><button className="ce-btn-outline ce-btn-sm" onClick={()=>deleteOp(o.id)}>Suppr.</button>},
  ];

  return (
    <div style={{padding:24,display:'flex',flexDirection:'column',gap:20}}>
      <div className="ce-card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10,marginBottom:12}}>
          <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700}}>Évolution des investissements ({years[0]}–{years[years.length-1]})</h2>
          <div style={{display:'flex',gap:14,alignItems:'center'}}>
            <label style={{fontSize:'.78rem',color:'var(--ce-vert-fonce)',display:'flex',alignItems:'center',gap:6,cursor:'pointer'}}>
              <input type="checkbox" checked={includeIdentifiees} onChange={(e)=>setIncludeIdentifiees(e.target.checked)} />
              Inclure les opérations identifiées
            </label>
            {isModified && <button className="ce-btn-corail ce-btn-sm" onClick={onReset}>Réinitialiser la simulation</button>}
          </div>
        </div>
        <ChartCanvas type="bar" height={300} data={{
          labels: years,
          datasets: families.map((f)=>({ label:f, data: years.map((y)=>aggregation.agg[f][y]||0), backgroundColor: famColors[f], stack:'s' }))
            .concat(budgetLignes.map((l,i)=>({ label:l.nom||'Ligne budgétaire', data: years.map((y)=>Number((l.valeurs||{})[y])||0), backgroundColor: BUDGET_LIGNE_COLORS[i%BUDGET_LIGNE_COLORS.length], stack:'s' })))
        }} options={{ scales:{ x:{stacked:true}, y:{stacked:true, ticks:{callback:(v)=>fmtKEur(v)}} },
          plugins:{ tooltip:{ callbacks:{ label:(ctx)=> ctx.dataset.label+': '+fmtEur(ctx.raw) } } } }} />
      </div>

      {hasCompareBase && (
        <div className="ce-card">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10,flexWrap:'wrap',gap:8}}>
            <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700}}>Comparaison — Base « {baseImport.nom} » vs Actuel</h2>
            <div style={{display:'flex',gap:6}}>
              <button className={compareView==='overlay'?'ce-btn ce-btn-sm':'ce-btn-outline ce-btn-sm'} onClick={()=>setCompareView('overlay')}>Superposé</button>
              <button className={compareView==='base'?'ce-btn ce-btn-sm':'ce-btn-outline ce-btn-sm'} onClick={()=>setCompareView('base')}>Base seule</button>
              <button className={compareView==='actuel'?'ce-btn ce-btn-sm':'ce-btn-outline ce-btn-sm'} onClick={()=>setCompareView('actuel')}>Actuel seul</button>
            </div>
          </div>
          <div style={{fontSize:'.78rem',color:'var(--ce-vert-fonce)',marginBottom:10}}>
            Δ budget total : <b style={{color: deltaBudget>=0?'var(--ce-corail)':'var(--ce-vert-principal)'}}>{deltaBudget>=0?'+':''}{fmtEur(deltaBudget)}</b>
            {deltaBudgetPct!==null && <span> ({deltaBudgetPct>=0?'+':''}{deltaBudgetPct.toFixed(0)}%)</span>}
          </div>
          <ChartCanvas type="line" height={260} data={{
            labels: years,
            datasets: [
              ...(compareView!=='actuel'? [{ label:'Base — '+baseImport.nom, data: baseTotalByYear, borderColor:'#9fb3ae', backgroundColor:'#9fb3ae', pointRadius:2, tension:.2 }] : []),
              ...(compareView!=='base'? [{ label:'Actuel', data: totalByYear, borderColor:'#009261', backgroundColor:'#009261', pointRadius:2, tension:.2 }] : []),
            ]
          }} options={{ scales:{ y:{ beginAtZero:true, ticks:{callback:(v)=>fmtKEur(v)} } },
            plugins:{ tooltip:{ callbacks:{ label:(ctx)=> ctx.dataset.label+': '+fmtEur(ctx.raw) } } } }} />
        </div>
      )}

      <div className="ce-card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
          <h3 style={{fontSize:'.85rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700}}>Lignes budgétaires libres (par année, en €)</h3>
          <button className="ce-btn ce-btn-sm" onClick={addLigne}>+ Ajouter une ligne</button>
        </div>
        {budgetLignes.length===0 && <div style={{fontSize:'.78rem',color:'#9fb3ae'}}>Aucune ligne budgétaire libre — utile pour représenter une enveloppe non ventilée par opération.</div>}
        {budgetLignes.map((l,i)=>(
          <div key={l.id} style={{marginBottom:14,paddingBottom:14,borderBottom: i<budgetLignes.length-1? '1px solid #eef4f2':'none'}}>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}>
              <span style={{width:10,height:10,borderRadius:'50%',background:BUDGET_LIGNE_COLORS[i%BUDGET_LIGNE_COLORS.length],display:'inline-block',flexShrink:0}}></span>
              {editingLigneId===l.id ? (
                <input className="ce-input" value={editingLigneName} autoFocus
                  onChange={(e)=>setEditingLigneName(e.target.value)}
                  onBlur={()=>commitLigneName(l.id)}
                  onKeyDown={(e)=>{ if(e.key==='Enter') e.target.blur(); else if(e.key==='Escape') setEditingLigneId(null); }} />
              ) : (
                <span style={{fontWeight:600,color:'var(--ce-vert-tres-fonce)',cursor:'text'}} title="Cliquer pour renommer"
                  onClick={()=>{setEditingLigneId(l.id); setEditingLigneName(l.nom);}}>{l.nom}</span>
              )}
              <button className="ce-btn-outline ce-btn-sm" onClick={()=>removeLigne(l.id)} style={{marginLeft:'auto'}}>Suppr.</button>
            </div>
            <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              {years.map((y)=>(
                <div key={y} style={{display:'flex',flexDirection:'column',gap:3}}>
                  <label style={{fontSize:'.68rem',color:'var(--ce-vert-fonce)'}}>{y}</label>
                  <input className="ce-input" style={{width:92}} type="number" value={(l.valeurs||{})[y]||''}
                    placeholder="0"
                    onChange={(e)=>updateLigneValeur(l.id, y, e.target.value)} />
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>

      <div className="ce-card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10,marginBottom:12}}>
          <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700}}>Opérations ({filteredOps.length} / {operations.length})</h2>
          <button className="ce-btn ce-btn-sm" onClick={addOp} disabled={!residences.length} title={!residences.length? "Aucune résidence ne correspond aux filtres actifs" : ""}>+ Ajouter une opération</button>
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'flex-end',marginBottom:14}}>
          <input className="ce-input" placeholder="Rechercher résidence / nature…" value={search} onChange={(e)=>setSearch(e.target.value)} style={{width:200}} />
          <select className="ce-select" value={filterNature} onChange={(e)=>setFilterNature(e.target.value)}>
            <option value="">Toutes natures de travaux</option>
            {typeOptions.map((t)=><option key={t} value={t}>{t}</option>)}
          </select>
          <select className="ce-select" value={filterTypeCat} onChange={(e)=>setFilterTypeCat(e.target.value)}>
            <option value="">Tous types de travaux</option>
            {TYPE_CAT_OPTIONS.map((t)=><option key={t} value={t}>{t}</option>)}
          </select>
          <select className="ce-select" value={filterStatut} onChange={(e)=>setFilterStatut(e.target.value)}>
            <option value="">Tous statuts</option>
            <option value="programme">Programmé</option>
            <option value="identifie">Identifié</option>
          </select>
          <div style={{display:'flex',flexDirection:'column',gap:3}}>
            <label style={{fontSize:'.65rem',color:'var(--ce-vert-fonce)'}}>Année (de)</label>
            <select className="ce-select" value={filterAnneeMin} onChange={(e)=>setFilterAnneeMin(e.target.value)}>
              <option value="">—</option>
              {years.map((y)=><option key={y} value={y}>{y}</option>)}
            </select>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:3}}>
            <label style={{fontSize:'.65rem',color:'var(--ce-vert-fonce)'}}>Année (à)</label>
            <select className="ce-select" value={filterAnneeMax} onChange={(e)=>setFilterAnneeMax(e.target.value)}>
              <option value="">—</option>
              {years.map((y)=><option key={y} value={y}>{y}</option>)}
            </select>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:3}}>
            <label style={{fontSize:'.65rem',color:'var(--ce-vert-fonce)'}}>Montant min (€)</label>
            <input className="ce-input" style={{width:110}} type="number" value={filterMontantMin} onChange={(e)=>setFilterMontantMin(e.target.value)} />
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:3}}>
            <label style={{fontSize:'.65rem',color:'var(--ce-vert-fonce)'}}>Montant max (€)</label>
            <input className="ce-input" style={{width:110}} type="number" value={filterMontantMax} onChange={(e)=>setFilterMontantMax(e.target.value)} />
          </div>
          {hasActiveFilters && <button className="ce-btn-outline ce-btn-sm" onClick={resetFilters}>Réinitialiser les filtres</button>}
        </div>
        <SortableTable columns={opsCols} rows={filteredOps} pageSize={15} />
      </div>
    </div>
  );
}

/* ---------------- Décarbonation & DPE ---------------- */
const CLASS_ORDER_AG = CLASS_ORDER.slice().reverse(); // A -> G
function classRangeAG(lo, hi){
  const i1 = CLASS_ORDER_AG.indexOf(lo), i2 = CLASS_ORDER_AG.indexOf(hi);
  if (i1===-1 || i2===-1) return [];
  return CLASS_ORDER_AG.slice(Math.min(i1,i2), Math.max(i1,i2)+1);
}
function ViewDecarbonation({residences, operations, gainsGrid, hasGainsGrid, includeIdentifiees, baseImport}){
  const [metric, setMetric] = useState('energie');
  const [compareView, setCompareView] = useState('overlay'); // 'overlay' | 'base' | 'actuel'
  const years = useMemo(()=>computeYearsRange(operations), [operations]);
  const classes = ['A','B','C','D','E','F','G','NR'];

  const trajectory = useMemo(()=>{
    if (!hasGainsGrid) return null;
    return computeTrajectory(residences, operations, gainsGrid, years, metric, includeIdentifiees);
  }, [residences, operations, gainsGrid, years, metric, includeIdentifiees, hasGainsGrid]);

  const initial = trajectory ? trajectory[years[0]] : null;
  const final = trajectory ? trajectory[years[years.length-1]] : null;
  const bestShare = (d)=> d ? ((d.A+d.B+d.C) / Math.max(1, classes.reduce((s,c)=>s+d[c],0)) * 100) : null;
  const rangeShare = (d, lo, hi)=>{
    if (!d) return null;
    const range = classRangeAG(lo, hi);
    const num = range.reduce((s,c)=>s+(d[c]||0),0);
    return (num / Math.max(1, classes.reduce((s,c)=>s+d[c],0))) * 100;
  };

  // §10 — carte configurable (remplace les deux cartes fixes "Logements A-C en <année de début/fin>") :
  // la borne haute du sélecteur d'année suit la dernière année de la trajectoire actuellement affichée
  // (pas une année calendaire codée en dur), et les deux sélecteurs de classe reproduisent n'importe
  // quelle plage A-G (ex. "A-C", "E-G").
  const [dpeCardYear, setDpeCardYear] = useState(null);
  const [dpeCardLo, setDpeCardLo] = useState('A');
  const [dpeCardHi, setDpeCardHi] = useState('C');
  useEffect(()=>{ if (years.length && !years.includes(dpeCardYear)) setDpeCardYear(years[years.length-1]); }, [years]);
  const dpeCardShare = trajectory && dpeCardYear!==null ? rangeShare(trajectory[dpeCardYear], dpeCardLo, dpeCardHi) : null;

  const hasCompareBase = !!(baseImport && baseImport.data.hasGainsGrid);
  const baseTrajectory = useMemo(()=>{
    if (!hasCompareBase) return null;
    const baseYears = computeYearsRange(baseImport.simOperations||[]);
    return { years: baseYears, traj: computeTrajectory(baseImport.data.residences, baseImport.simOperations||[], baseImport.data.gainsGrid||{}, baseYears, metric, baseImport.includeIdentifiees) };
  }, [baseImport, hasCompareBase, metric]);
  const baseShareByYear = useMemo(()=>{
    if (!baseTrajectory) return null;
    return years.map((y)=>{
      const idx = baseTrajectory.years.indexOf(y);
      const d = idx>=0? baseTrajectory.traj[baseTrajectory.years[idx]] : null;
      return d? bestShare(d) : null;
    });
  }, [baseTrajectory, years]);
  const actuelShareByYear = trajectory ? years.map((y)=>bestShare(trajectory[y])) : null;
  const deltaShare = (hasCompareBase && actuelShareByYear && baseShareByYear && baseShareByYear[baseShareByYear.length-1]!==null)
    ? actuelShareByYear[actuelShareByYear.length-1] - baseShareByYear[baseShareByYear.length-1] : null;

  return (
    <div style={{padding:24,display:'flex',flexDirection:'column',gap:20}}>
      {!hasGainsGrid && (
        <div className="ce-card" style={{background:'var(--ce-saumon)'}}>
          Grille de gains DPE (onglet « Référentiel des gains DPE ») introuvable dans ce fichier : la projection de trajectoire n'est pas disponible. Seule la distribution actuelle peut être affichée.
        </div>
      )}
      {trajectory && (
        <React.Fragment>
          <div className="ce-card" style={{display:'flex',gap:16,flexWrap:'wrap',alignItems:'center'}}>
            <div style={{flex:1,minWidth:150}}>
              <div style={{fontSize:'.68rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase',letterSpacing:'.03em',marginBottom:6}}>
                Logements classe {dpeCardLo}{dpeCardLo!==dpeCardHi?('-'+dpeCardHi):''} en {dpeCardYear??''}
              </div>
              <div style={{fontSize:'1.7rem',fontWeight:700,color:'var(--ce-vert-principal)'}}>{dpeCardShare!==null? dpeCardShare.toFixed(0)+'%':'—'}</div>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:4}}>
              <label style={{fontSize:'.66rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>Année</label>
              <select className="ce-select" value={dpeCardYear??''} onChange={(e)=>setDpeCardYear(Number(e.target.value))}>
                {years.map((y)=><option key={y} value={y}>{y}</option>)}
              </select>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:4}}>
              <label style={{fontSize:'.66rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>Classe (borne basse)</label>
              <select className="ce-select" value={dpeCardLo} onChange={(e)=>setDpeCardLo(e.target.value)}>
                {CLASS_ORDER_AG.map((c)=><option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:4}}>
              <label style={{fontSize:'.66rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>Classe (borne haute)</label>
              <select className="ce-select" value={dpeCardHi} onChange={(e)=>setDpeCardHi(e.target.value)}>
                {CLASS_ORDER_AG.map((c)=><option key={c} value={c}>{c}</option>)}
              </select>
            </div>
          </div>
          <div className="ce-card">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
              <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700}}>Trajectoire de décarbonation — DPE {metric==='energie'?'Énergie':'GES'}</h2>
              <div style={{display:'flex',gap:6}}>
                <button className={metric==='energie'?'ce-btn ce-btn-sm':'ce-btn-outline ce-btn-sm'} onClick={()=>setMetric('energie')}>Énergie</button>
                <button className={metric==='ges'?'ce-btn ce-btn-sm':'ce-btn-outline ce-btn-sm'} onClick={()=>setMetric('ges')}>GES</button>
              </div>
            </div>
            <ChartCanvas type="bar" height={340} data={{
              labels: years,
              datasets: classes.filter((c)=>years.some((y)=>trajectory[y][c]>0)).map((c)=>({
                label:c, data: years.map((y)=>trajectory[y][c]||0), backgroundColor: DPE_COLORS[c], stack:'s'
              }))
            }} options={{ scales:{ x:{stacked:true}, y:{stacked:true, title:{display:true,text:'Logements'}} } }} />
            <p style={{fontSize:'.7rem',color:'var(--ce-vert-fonce)',marginTop:10,lineHeight:1.5}}>
              Méthodologie (§8.2 du cahier des charges) : chaque résidence part de sa distribution DPE constatée ;
              chaque opération programmée (ou identifiée si incluse) applique le gain de la grille de référence à la classe
              atteinte à cet instant, avec effet cumulatif pour les opérations successives. Une démolition sort la résidence
              du parc à compter de l'année concernée. Simplification V1 : le gain s'applique à l'ensemble du parc de la
              résidence, pas uniquement aux logements concernés par l'opération.
            </p>
          </div>
          <div className="ce-card">
            <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700,marginBottom:12}}>
              Répartition des étiquettes DPE {metric==='energie'?'Énergie':'GES'} — avant / après intervention
            </h2>
            <ChartCanvas type="bar" height={300} data={{
              labels: classes.filter((c)=>(initial[c]||0)>0 || (final[c]||0)>0),
              datasets: [
                { label:'Avant intervention', data: classes.filter((c)=>(initial[c]||0)>0 || (final[c]||0)>0).map((c)=>initial[c]||0), backgroundColor:'#9fb3ae' },
                { label:'Après intervention', data: classes.filter((c)=>(initial[c]||0)>0 || (final[c]||0)>0).map((c)=>final[c]||0), backgroundColor: classes.filter((c)=>(initial[c]||0)>0 || (final[c]||0)>0).map((c)=>DPE_COLORS[c]) },
              ]
            }} options={{ scales:{ y:{ title:{display:true,text:'Logements'} } } }} />
            <p style={{fontSize:'.7rem',color:'var(--ce-vert-fonce)',marginTop:10,lineHeight:1.5}}>
              Avant = distribution DPE constatée en {years[0]}. Après = distribution projetée en {years[years.length-1]} selon
              les opérations actuellement incluses dans la simulation (bascule « Inclure les opérations identifiées » prise en compte).
            </p>
          </div>
          {hasCompareBase && (
            <div className="ce-card">
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10,flexWrap:'wrap',gap:8}}>
                <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700}}>Comparaison — Base « {baseImport.nom} » vs Actuel</h2>
                <div style={{display:'flex',gap:6}}>
                  <button className={compareView==='overlay'?'ce-btn ce-btn-sm':'ce-btn-outline ce-btn-sm'} onClick={()=>setCompareView('overlay')}>Superposé</button>
                  <button className={compareView==='base'?'ce-btn ce-btn-sm':'ce-btn-outline ce-btn-sm'} onClick={()=>setCompareView('base')}>Base seule</button>
                  <button className={compareView==='actuel'?'ce-btn ce-btn-sm':'ce-btn-outline ce-btn-sm'} onClick={()=>setCompareView('actuel')}>Actuel seul</button>
                </div>
              </div>
              {deltaShare!==null && (
                <div style={{fontSize:'.78rem',color:'var(--ce-vert-fonce)',marginBottom:10}}>
                  Δ logements classe A-C en fin de trajectoire : <b style={{color: deltaShare>=0?'var(--ce-vert-principal)':'var(--ce-corail)'}}>{deltaShare>=0?'+':''}{deltaShare.toFixed(0)} pts</b>
                </div>
              )}
              <ChartCanvas type="line" height={260} data={{
                labels: years,
                datasets: [
                  ...(compareView!=='actuel'? [{ label:'Base — '+baseImport.nom, data: baseShareByYear, borderColor:'#9fb3ae', backgroundColor:'#9fb3ae', pointRadius:2, tension:.2 }] : []),
                  ...(compareView!=='base'? [{ label:'Actuel', data: actuelShareByYear, borderColor:'#009261', backgroundColor:'#009261', pointRadius:2, tension:.2 }] : []),
                ]
              }} options={{ scales:{ y:{ beginAtZero:true, max:100, title:{display:true,text:'% logements classe A-C'} } } }} />
            </div>
          )}
        </React.Fragment>
      )}
    </div>
  );
}

/* ---------------- Offre nouvelle & Vente ----------------
   Le "Plan de vente" ne correspond à aucun onglet ONI/ONNI dédié (aucun des deux fichiers de
   référence du projet n'en contient) : il s'agit en réalité de colonnes déjà présentes dans
   « 1. Base de cotation » elle-même (confirmé le 2026-07-10, cf. idx.planVente et suivants dans
   parseBaseCotation) — traité ici comme un dérivé de residences, pas comme un parseur séparé.
   L'"Offre nouvelle" (construction neuve) n'a en revanche aucune source dans les fichiers fournis :
   à la demande de Jules, elle est portée par une simulation manuelle (saisie libre par année,
   même principe que la "Ligne budgétaire libre" de la vue Investissements), pas par un import. */
// §12 — dérivation lecture seule de la conventionnalité d'une résidence pour une entrée de vente
// ajoutée manuellement : residence.conventionneVente si renseigné (donnée déjà présente dans la
// Base de cotation pour les résidences déjà en plan de vente), sinon déduit de dont conventionné /
// dont foyer (comptages déjà parsés), jamais une nouvelle saisie dupliquée dans l'entrée de vente.
function deriveConventionne(r){
  if (!r) return '—';
  if (r.conventionneVente) return r.conventionneVente;
  if (r.dontConventionne>0) return 'Conventionné';
  if (r.dontFoyer>0) return 'Foyer / résidence sociale';
  return '—';
}
function ViewOffreVente({residences, operations, offreNouvelleLgt, setOffreNouvelleLgt, ventesSimulees, setVentesSimulees}){
  const years = useMemo(()=>computeYearsRange(operations), [operations]);
  const resByCode = useMemo(()=>{ const m={}; residences.forEach((r)=>m[r.code]=r); return m; }, [residences]);
  const typeVenteSuggestions = useMemo(()=>uniqueSorted(residences.map((r)=>r.typeVente)), [residences]);

  function addVente(){
    if (!residences.length) return;
    setVentesSimulees([{ id:'vente_'+Date.now(), resCode:null, typeVente:null, logementsRestants:null, prixVente:null, origine:'ajout' }].concat(ventesSimulees));
  }
  function updateVente(id, patch){ setVentesSimulees(ventesSimulees.map((v)=> v.id===id? Object.assign({},v,patch) : v)); }
  function removeVente(id){ setVentesSimulees(ventesSimulees.filter((v)=>v.id!==id)); }
  function selectVenteResidence(id, resCode, currentLogementsRestants){
    const patch = { resCode };
    // Pré-remplissage au moment de la sélection uniquement, jamais en repli permanent : une fois
    // modifié manuellement par l'utilisateur, la valeur ne doit plus être écrasée par ce pré-remplissage.
    if (currentLogementsRestants===null || currentLogementsRestants===undefined){
      const r = resByCode[resCode];
      if (r && r.nbLgtRestantVente!==null && r.nbLgtRestantVente!==undefined) patch.logementsRestants = r.nbLgtRestantVente;
    }
    updateVente(id, patch);
  }

  const ventesSimuleesCols = [
    {key:'resCode', label:'Résidence', render:(v)=>{
      const inList = residences.some((r)=>r.code===v.resCode);
      return (
        <select className="ce-select" value={v.resCode ?? ''} onChange={(e)=>selectVenteResidence(v.id, e.target.value, v.logementsRestants)}>
          <option value="" disabled>— À sélectionner —</option>
          {!inList && v.resCode && <option value={v.resCode}>{(resByCode[v.resCode]||{}).nom || v.resCode} (hors filtre)</option>}
          {residences.map((r)=><option key={r.code} value={r.code}>{r.nom||r.code}</option>)}
        </select>
      );
    }},
    {key:'commune', label:'Commune', render:(v)=>(resByCode[v.resCode]||{}).commune || '—'},
    {key:'conventionne', label:'Conventionné / non conventionné', render:(v)=>deriveConventionne(resByCode[v.resCode])},
    {key:'typeVente', label:'Type de vente', render:(v)=>(
      <input className="ce-input" style={{width:140}} list="ce-type-vente-suggestions" value={v.typeVente ?? ''} placeholder="— À sélectionner —"
        onChange={(e)=>updateVente(v.id,{typeVente:e.target.value})} />
    )},
    {key:'logementsRestants', label:'Logements restants', render:(v)=><input className="ce-input" style={{width:90}} type="number" value={v.logementsRestants ?? ''} onChange={(e)=>updateVente(v.id,{logementsRestants: e.target.value===''? null: Number(e.target.value)})} />},
    {key:'prixVente', label:'Prix de vente', render:(v)=><input className="ce-input" style={{width:110}} type="number" value={v.prixVente ?? ''} onChange={(e)=>updateVente(v.id,{prixVente: e.target.value===''? null: Number(e.target.value)})} />},
    {key:'_montantM2', label:'Montant au m²', render:(v)=>{
      const r = resByCode[v.resCode];
      if (!r || !r.shab || r.shab<=0 || v.prixVente===null || v.prixVente===undefined) return '—';
      return fmtEur(v.prixVente / r.shab);
    }},
    {key:'_actions', label:'', render:(v)=><button className="ce-btn-outline ce-btn-sm" onClick={()=>removeVente(v.id)}>Suppr.</button>},
  ];

  const venteRows = useMemo(()=>residences.filter((r)=>
    r.nbLgtMiseVente!==null || r.prixVenteBrut!==null || r.typeVente!==null || r.planVente
  ), [residences]);
  const hasVente = venteRows.length>0;
  const totalMiseVente = venteRows.reduce((s,r)=>s+(r.nbLgtMiseVente||0),0);
  const totalRestant = venteRows.reduce((s,r)=>s+(r.nbLgtRestantVente||0),0);
  const totalProduitCession = venteRows.reduce((s,r)=>s+(r.prixVenteBrut||0),0);

  const venteCols = [
    {key:'nom', label:'Résidence'},
    {key:'commune', label:'Commune'},
    {key:'typeVente', label:'Type de vente', render:(r)=>r.typeVente||'—'},
    {key:'conventionneVente', label:'Conventionné / non conventionné', render:(r)=>r.conventionneVente||'—'},
    {key:'nbLgtMiseVente', label:'Logements mis en vente', render:(r)=>r.nbLgtMiseVente!==null? fmtNum(r.nbLgtMiseVente):'—'},
    {key:'nbLgtRestantVente', label:'Logements restants', render:(r)=>r.nbLgtRestantVente!==null? fmtNum(r.nbLgtRestantVente):'—'},
    {key:'prixVenteBrut', label:'Prix de vente brut', render:(r)=>r.prixVenteBrut!==null? fmtEur(r.prixVenteBrut):'—'},
    {key:'montantVenteM2', label:'Montant au m²', render:(r)=>r.montantVenteM2!==null? fmtEur(r.montantVenteM2):'—'},
  ];

  const annualValues = years.map((y)=>Number(offreNouvelleLgt[y])||0);
  const cumulative = useMemo(()=>{
    let cum = 0;
    return years.map((y)=>{ cum += Number(offreNouvelleLgt[y])||0; return cum; });
  }, [years, offreNouvelleLgt]);

  return (
    <div style={{padding:24,display:'flex',flexDirection:'column',gap:20}}>
      <div className="ce-card">
        <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700,marginBottom:12}}>Offre nouvelle — simulation manuelle</h2>
        <p style={{fontSize:'.72rem',color:'var(--ce-vert-fonce)',marginBottom:14,lineHeight:1.5}}>
          Aucun onglet du fichier importé ne recense l'offre nouvelle (construction neuve) : cette section permet
          de saisir manuellement, année par année, le nombre de logements neufs simulés — à titre indicatif,
          en complément de la Base de cotation.
        </p>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:16}}>
          {years.map((y)=>(
            <div key={y} style={{display:'flex',flexDirection:'column',gap:3}}>
              <label style={{fontSize:'.68rem',color:'var(--ce-vert-fonce)'}}>{y}</label>
              <input className="ce-input" style={{width:92}} type="number" value={offreNouvelleLgt[y]||''}
                placeholder="0"
                onChange={(e)=>setOffreNouvelleLgt(Object.assign({},offreNouvelleLgt,{[y]: e.target.value===''? undefined : Number(e.target.value)}))} />
            </div>
          ))}
        </div>
        <ChartCanvas type="bar" height={260} data={{
          labels: years,
          datasets: [
            { type:'bar', label:'Logements neufs simulés (par année)', data: annualValues, backgroundColor:'#58D88B', borderRadius:4 },
            { type:'line', label:'Cumul de logements neufs', data: cumulative, borderColor:'#009261', backgroundColor:'#009261', pointRadius:3, fill:false, yAxisID:'y1' },
          ]
        }} options={{ scales:{ y:{ beginAtZero:true, title:{display:true,text:'Logements (année)'} }, y1:{ beginAtZero:true, position:'right', grid:{drawOnChartArea:false}, title:{display:true,text:'Cumul'} } } }} />
      </div>

      <div className="ce-card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10,marginBottom:12}}>
          <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700}}>Ventes simulées ({ventesSimulees.length})</h2>
          <button className="ce-btn ce-btn-sm" onClick={addVente} disabled={!residences.length} title={!residences.length? "Aucune résidence ne correspond aux filtres actifs" : ""}>+ Ajouter une vente</button>
        </div>
        <p style={{fontSize:'.72rem',color:'var(--ce-vert-fonce)',marginBottom:12,lineHeight:1.5}}>
          Ajoute une entrée de vente pour une résidence déjà existante du patrimoine importé (pas une résidence fictive) —
          en complément des résidences déjà en plan de vente listées ci-dessous.
        </p>
        <datalist id="ce-type-vente-suggestions">{typeVenteSuggestions.map((t)=><option key={t} value={t} />)}</datalist>
        {ventesSimulees.length>0 ? <SortableTable columns={ventesSimuleesCols} rows={ventesSimulees} pageSize={20} /> : <div style={{fontSize:'.78rem',color:'#9fb3ae'}}>Aucune vente simulée pour l'instant.</div>}
      </div>

      {hasVente ? (
        <React.Fragment>
          <div style={{display:'flex',gap:16,flexWrap:'wrap'}}>
            <KpiCard label="Résidences en plan de vente" value={fmtNum(venteRows.length)} />
            <KpiCard label="Logements mis en vente" value={fmtNum(totalMiseVente)} />
            <KpiCard label="Logements restants à vendre" value={fmtNum(totalRestant)} />
            <KpiCard label="Produit de cession (brut)" value={fmtKEur(totalProduitCession)} />
          </div>
          <div className="ce-card">
            <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700,marginBottom:12}}>Détail des résidences en plan de vente ({venteRows.length})</h2>
            <SortableTable columns={venteCols} rows={venteRows} pageSize={20} />
          </div>
        </React.Fragment>
      ) : (
        <div className="ce-card" style={{background:'var(--ce-saumon)'}}>
          Aucune donnée de vente (« Plan de vente », « Nombre de logement à la mise en vente », « Prix de vente »…)
          n'a été trouvée dans ce fichier — non disponible dans ce fichier.
        </div>
      )}
    </div>
  );
}

/* ---------------- Données financières (CRD / Autofinancement / VNC) ----------------
   Granularité confirmée le 2026-07-10 sur les deux fichiers de référence : résidence uniquement
   (cf. commentaire au-dessus de idx.crd dans parseBaseCotation) — pas de graphique d'évolution
   dans le temps ici, faute de dimension année associée à ces montants dans les fichiers fournis. */
function ViewFinance({residences, onSelectResidence}){
  const [search, setSearch] = useState('');
  const rows = useMemo(()=>residences.filter((r)=>r.crd!==null || r.autofinancement!==null || r.vnc!==null), [residences]);
  const filteredRows = useMemo(()=>{
    const s = ceNorm(search);
    if (!s) return rows;
    return rows.filter((r)=>ceNorm(r.nom).includes(s) || ceNorm(r.code).includes(s) || ceNorm(r.commune).includes(s));
  }, [rows, search]);

  const totalCrd = rows.reduce((s,r)=>s+(r.crd||0),0);
  const totalAuto = rows.reduce((s,r)=>s+(r.autofinancement||0),0);
  const totalVnc = rows.reduce((s,r)=>s+(r.vnc||0),0);

  // §11 — moyenne pondérée au logement = somme(indicateur)/somme(nbLgt) sur le périmètre filtré,
  // scopée aux résidences où l'indicateur est renseigné (pas la moyenne simple des colonnes "par
  // lgt" déjà présentes dans le fichier, qui ne serait pas pondérée par la taille des résidences).
  function weightedAvgPerLgt(key){
    const scoped = residences.filter((r)=>r[key]!==null && r[key]!==undefined);
    const totalLgt = scoped.reduce((s,r)=>s+(r.nbLgt||0),0);
    if (totalLgt<=0) return null;
    return scoped.reduce((s,r)=>s+(r[key]||0),0) / totalLgt;
  }
  const avgCrdLgt = weightedAvgPerLgt('crd');
  const avgAutoLgt = weightedAvgPerLgt('autofinancement');
  const avgVncLgt = weightedAvgPerLgt('vnc');

  const cols = [
    {key:'code', label:'Code'},
    {key:'nom', label:'Résidence'},
    {key:'commune', label:'Commune'},
    {key:'crd', label:'CRD', render:(r)=>r.crd!==null? fmtEur(r.crd):'—'},
    {key:'autofinancement', label:'Autofinancement', render:(r)=>r.autofinancement!==null? fmtEur(r.autofinancement):'—'},
    {key:'vnc', label:'VNC', render:(r)=>r.vnc!==null? fmtEur(r.vnc):'—'},
  ];

  return (
    <div style={{padding:24,display:'flex',flexDirection:'column',gap:20}}>
      <div style={{display:'flex',gap:16,flexWrap:'wrap'}}>
        <KpiCard label="CRD total du patrimoine" value={fmtKEur(totalCrd)} sub={rows.length+" résidences renseignées"} />
        <KpiCard label="CRD moyen pondéré / lgt" value={avgCrdLgt!==null? fmtEur(avgCrdLgt):'—'} />
        <KpiCard label="Autofinancement total" value={fmtKEur(totalAuto)} />
        <KpiCard label="Autofinancement moyen pondéré / lgt" value={avgAutoLgt!==null? fmtEur(avgAutoLgt):'—'} />
        <KpiCard label="VNC totale" value={fmtKEur(totalVnc)} />
        <KpiCard label="VNC moyenne pondérée / lgt" value={avgVncLgt!==null? fmtEur(avgVncLgt):'—'} />
      </div>
      <div className="ce-card" style={{background:'var(--ce-saumon)'}}>
        <p style={{fontSize:'.72rem',color:'var(--ce-vert-fonce)',lineHeight:1.5,margin:0}}>
          CRD, Autofinancement et VNC sont disponibles au niveau résidence dans ce fichier — aucune
          décomposition par opération/emprunt n'a été trouvée dans les fichiers de référence du
          projet, et aucun graphique d'évolution dans le temps n'est donc affiché ici (pas de
          dimension année associée à ces montants).
        </p>
      </div>
      <div className="ce-card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10,marginBottom:12}}>
          <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700}}>Détail par résidence ({filteredRows.length})</h2>
          <input className="ce-input" placeholder="Rechercher résidence / commune…" value={search} onChange={(e)=>setSearch(e.target.value)} style={{width:220}} />
        </div>
        <SortableTable columns={cols} rows={filteredRows} onRowClick={onSelectResidence} pageSize={20} />
      </div>
    </div>
  );
}

/* ---------------- Analyse libre (tableau croisé dynamique) ---------------- */
function downloadCsv(filename, rows){
  const csv = rows.map((r)=>r.map((c)=>{
    const s = c===null||c===undefined? '' : String(c);
    return /[",;\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(';')).join('\r\n');
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function pivotAggregate(items, metric){
  if (metric.agg==='count') return items.length;
  if (metric.agg==='sum') return items.reduce((s,it)=>s+(metric.get(it)||0),0);
  const vals = items.map(metric.get).filter((v)=>v!==null&&v!==undefined&&!isNaN(v));
  return vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}

// §13 — Analyse libre : direction validée avec Jules (multi-métriques côte à côte, drill-down au
// clic vers la liste résidences/opérations d'une cellule avec lien vers la fiche résidence, tri des
// lignes au clic sur un en-tête, heatmap optionnelle, champs enrichis, presets de croisements
// rapides). Priorisation fine et détail visuel (heatmap, presets) non arbitrés avec Jules : traité en
// dernier, implémentation volontairement simple plutôt que de deviner un détail non validé.
function ViewPivot({residences, operations, onSelectResidence}){
  const [dataset, setDataset] = useState('residences');
  const resByCode = useMemo(()=>{ const m={}; residences.forEach((r)=>m[r.code]=r); return m; }, [residences]);

  const RESIDENCE_FIELDS = useMemo(()=>[
    {key:'commune', label:'Commune', get:(r)=>r.commune||'Non renseignée'},
    {key:'secteur', label:'Secteur / agence', get:(r)=>r.secteur||r.agence||'Non renseigné'},
    {key:'qpv', label:'QPV', get:(r)=>r.qpv||'Non renseigné'},
    {key:'financement', label:'Financement', get:(r)=>r.financement||'Non renseigné'},
    {key:'familleAttract', label:'Famille attractivité', get:(r)=>r.familleAttract? ('Famille '+r.familleAttract):'Non renseignée'},
    {key:'familleTechnique', label:'Famille état technique', get:(r)=>r.familleTechnique? ('Famille '+r.familleTechnique):'Non renseignée'},
    {key:'dpeEnergie', label:'DPE Énergie', get:(r)=>r.dpeEnergie||'Non renseigné'},
    {key:'dpeGES', label:'DPE GES', get:(r)=>r.dpeGES||'Non renseigné'},
  ], []);
  const RESIDENCE_METRICS = useMemo(()=>[
    {key:'nbLgt_sum', label:'Nombre de logements', agg:'sum', get:(r)=>r.nbLgt||0, fmt:fmtNum},
    {key:'count', label:'Nombre de résidences', agg:'count', fmt:fmtNum},
    {key:'attractivite_avg', label:'Attractivité moyenne', agg:'avg', get:(r)=>r.attractivite, fmt:(v)=>v!==null?v.toFixed(1):'—'},
    {key:'technique_avg', label:'État technique moyen', agg:'avg', get:(r)=>r.technique, fmt:(v)=>v!==null?v.toFixed(1):'—'},
    {key:'crd_sum', label:'CRD total', agg:'sum', get:(r)=>r.crd||0, fmt:fmtEur},
    {key:'autofinancement_sum', label:'Autofinancement total', agg:'sum', get:(r)=>r.autofinancement||0, fmt:fmtEur},
    {key:'vnc_sum', label:'VNC totale', agg:'sum', get:(r)=>r.vnc||0, fmt:fmtEur},
  ], []);
  const OPERATION_FIELDS = useMemo(()=>[
    {key:'type', label:'Type de travaux', get:(o)=>o.type||'Non renseigné'},
    {key:'famille', label:'Famille de travaux', get:(o)=>familyOfType(o.type)},
    {key:'statut', label:'Statut', get:(o)=>o.statut==='programme'?'Programmé':'Identifié'},
    {key:'annee', label:'Année', get:(o)=>o.annee!==null&&o.annee!==undefined? String(o.annee):'Non renseignée'},
    {key:'commune', label:'Commune (résidence)', get:(o)=>{ const r=resByCode[o.resCode]; return (r&&r.commune)||'Non renseignée'; }},
  ], [resByCode]);
  const OPERATION_METRICS = useMemo(()=>[
    {key:'montant_sum', label:'Montant total', agg:'sum', get:(o)=>o.montant||0, fmt:fmtEur},

  ], []);

  const fields = dataset==='residences' ? RESIDENCE_FIELDS : OPERATION_FIELDS;
  const metrics = dataset==='residences' ? RESIDENCE_METRICS : OPERATION_METRICS;
  const items = dataset==='residences' ? residences : operations;

  const [rowKey, setRowKey] = useState(fields[0].key);
  const [colKey, setColKey] = useState('');
  const [metricKeys, setMetricKeys] = useState([metrics[0].key]);
  const [heatmap, setHeatmap] = useState(false);
  const [sortIdx, setSortIdx] = useState(null);
  const [sortDir, setSortDir] = useState(-1);
  const [drillIdx, setDrillIdx] = useState(null); // {rowIdx, cellIdx} de la cellule dépliée

  useEffect(()=>{
    setRowKey(fields[0].key); setColKey(''); setMetricKeys([metrics[0].key]); setSortIdx(null); setDrillIdx(null);
    // eslint-disable-next-line
  }, [dataset]);

  const rowField = fields.find((f)=>f.key===rowKey) || fields[0];
  const colField = colKey ? fields.find((f)=>f.key===colKey) : null;
  const selectedMetrics = metrics.filter((m)=>metricKeys.includes(m.key));
  const activeMetrics = selectedMetrics.length? selectedMetrics : [metrics[0]];

  function toggleMetric(key){
    setMetricKeys((cur)=> cur.includes(key) ? (cur.length>1? cur.filter((k)=>k!==key) : cur) : cur.concat([key]));
    setSortIdx(null);
  }

  const PRESETS = dataset==='residences' ? [
    {label:'Commune × DPE Énergie (logements)', apply:()=>{ setRowKey('commune'); setColKey('dpeEnergie'); setMetricKeys(['nbLgt_sum']); }},

  ];

  const pivot = useMemo(()=>{
    const rowGroups = {};
    items.forEach((it)=>{ const k=String(rowField.get(it)); (rowGroups[k]=rowGroups[k]||[]).push(it); });
    const rowKeys = Object.keys(rowGroups).sort((a,b)=>a.localeCompare(b,'fr'));
    let colKeys = ['__all__'];
    if (colField){
      const s = new Set();
      items.forEach((it)=>s.add(String(colField.get(it))));
      colKeys = Array.from(s).sort((a,b)=>a.localeCompare(b,'fr'));
    }
    const subsetFor = (rk, ck) => {
      const rowItems = rowGroups[rk] || [];
      return colField ? rowItems.filter((it)=>String(colField.get(it))===ck) : rowItems;
    };
    const rows = rowKeys.map((rk)=>({
      key: rk,
      cells: colKeys.flatMap((ck)=> activeMetrics.map((m)=>({
        value: pivotAggregate(subsetFor(rk,ck), m), items: subsetFor(rk,ck), colKey: ck, metric: m,
      }))),
    }));
    const colTotals = colKeys.flatMap((ck)=>{
      const subset = colField ? items.filter((it)=>String(colField.get(it))===ck) : items;
      return activeMetrics.map((m)=>pivotAggregate(subset, m));
    });
    return { rowKeys, colKeys, rows, colTotals };
  }, [items, rowField, colField, activeMetrics]);

  const sortedRows = useMemo(()=>{
    if (sortIdx===null) return pivot.rows;
    const copy = pivot.rows.slice();
    copy.sort((a,b)=>{
      const va=a.cells[sortIdx].value, vb=b.cells[sortIdx].value;
      if (va===null||va===undefined) return 1; if (vb===null||vb===undefined) return -1;
      return (va-vb)*sortDir;
    });
    return copy;
  }, [pivot.rows, sortIdx, sortDir]);

  function toggleSort(idx){ if (sortIdx===idx) setSortDir(sortDir*-1); else { setSortIdx(idx); setSortDir(-1); } }

    const max = [];
    (pivot.rows[0]? pivot.rows[0].cells : []).forEach((_,i)=>{

  }, [pivot.rows]);

  function exportCsv(){
    const header = [''].concat(pivot.colKeys.flatMap((ck)=> activeMetrics.map((m)=> colField? (ck+' — '+m.label) : m.label)));
    const rows = sortedRows.map((r)=>[r.key].concat(r.cells.map((c)=>c.value===null?'':c.value)));

            <label style={{fontSize:'.68rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>Jeu de données</label>
            <select className="ce-select" value={dataset} onChange={(e)=>setDataset(e.target.value)}>

          </div>
          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            <label style={{fontSize:'.68rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>Lignes</label>
            <select className="ce-select" value={rowKey} onChange={(e)=>{setRowKey(e.target.value); setSortIdx(null);}}>
