  if (!res.ok) throw new Error((json && json.error) || ('Erreur serveur ('+res.status+').'));
  return json || {};
}

/* ---------------- Sauvegarde partagée des imports (proxy backend -> Supabase) ----------------
   Les imports sauvegardés sont stockés dans une table Supabase commune à tous les utilisateurs
   connectés de l'outil (cf. README, section Authentification) : n'importe quel compte peut voir,
   modifier ou supprimer n'importe quelle sauvegarde — pas de distinction par propriétaire, seule la
   connexion (compte + mot de passe) est requise. L'enregistrement complet (données + simulation en
   cours) est stocké tel quel dans la colonne jsonb `payload` de la table côté serveur. */
async function idbGetAll(){
  const json = await apiJson('/api/saves');
  return json.records || [];
}
async function idbGet(id){
  const json = await apiJson('/api/saves/'+encodeURIComponent(id));
  return json.record || null;
}
async function idbPut(record){
  await apiJson('/api/saves', { method:'POST', body: JSON.stringify(record) });
  return true;
}
async function idbDelete(id){
  await apiJson('/api/saves/'+encodeURIComponent(id), { method:'DELETE' });
  return true;
}
// Un seul import "base" à la fois : logique désormais appliquée atomiquement côté serveur (cf.
// api/saves/set-base.js), plus jamais orchestrée ici via une boucle de GetAll+Put.
async function idbSetBase(id){
  await apiJson('/api/saves/set-base', { method:'POST', body: JSON.stringify({id}) });
  return true;
}

/* ---------------- Cache de géolocalisation partagé (proxy backend -> Supabase) ----------------
   Une ligne par adresse normalisée (clé = ceAddrKey), quel que soit l'import ou l'utilisateur
   d'origine — un géocodage effectué une fois profite à tout le monde ensuite. Best-effort par
   construction (cf. useGeocoding) : ces fonctions avalent déjà toute erreur réseau/serveur en
   retombant sur {}/rien plutôt que de faire échouer l'affichage de la carte pour l'utilisateur
   courant. */
async function sbGeocodeCacheGetMany(keys){
  if (!keys.length) return {};
  try {
    const json = await apiJson('/api/geocode-cache/get', { method:'POST', body: JSON.stringify({keys}) });
    return json.results || {};
  } catch(e){ return {}; }
}
async function sbGeocodeCacheSetMany(entries){
  if (!entries.length) return;
  try { await apiJson('/api/geocode-cache/set', { method:'POST', body: JSON.stringify({entries}) }); }
  catch(e){ /* best-effort : un échec d'écriture du cache partagé ne doit jamais bloquer l'affichage de la carte pour l'utilisateur courant */ }
}
function genSaveId(){
  return 'psp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
}
// Identifiant local (ligne budgétaire/opération/vente ajoutée manuellement) : Date.now() seul peut
// collisionner sur deux clics rapprochés (même milliseconde), ce qui ferait éditer/supprimer deux
// lignes à la fois puisque updateOp/deleteOp etc. matchent par id. Le suffixe aléatoire élimine ce risque.
function genLocalId(prefix){
  return prefix + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
}
// §8 — budgetLignes remplace l'ancien budgetLibre (objet simple {année:montant}) par un tableau de
// lignes nommées [{id, nom, valeurs:{année:montant}}]. Migration obligatoire à chaque point d'entrée
// où une sauvegarde ancien format peut être relue (import JSON, restauration, version "base"), pour
// que la sauvegarde suivante écrive déjà le nouveau format — jamais seulement à l'affichage.
function migrateBudgetLignes(rec){
  if (rec && Array.isArray(rec.budgetLignes)) return rec.budgetLignes;
  if (rec && rec.budgetLibre && Object.keys(rec.budgetLibre).length){
    return [{id:'migre', nom:'Ligne budgétaire libre', valeurs: rec.budgetLibre}];
  }
  return [];
}
// V8 §1.3 — planVenteLignes remplace ventesSimulees (qui n'avait aucune dimension année :
// {id, resCode, typeVente, logementsRestants, prixVente, origine}). Migration ascendante appliquée à
// CHAQUE point d'entrée où une sauvegarde ancien format peut être relue — import JSON, restauration,
// version « base » — comme migrateBudgetLignes, pour que la sauvegarde suivante écrive déjà le
// nouveau format et non seulement l'affichage courant.
function migratePlanVente(rec){
  if (rec && Array.isArray(rec.planVenteLignes)) return rec.planVenteLignes;
  return ((rec && rec.ventesSimulees) || []).map((v)=>({
    id: v.id, resCode: v.resCode, origine: v.origine || 'ajout', retenue: true,
    typeVente: v.typeVente ?? null, conventionne: null,
    logementsTotal: null,
    // Aucune année n'existait dans l'ancien modèle : on ne l'invente pas. La ligne reste sans
    // échéancier et se signalera « année à renseigner » dans la table du plan de vente.
    parAnnee: {},
    prioriteManuelle: null, scorePotentiel: null, commentaire: null,
    _legacyPrixVente: v.prixVente ?? null,
    _legacyLogementsRestants: v.logementsRestants ?? null,
  }));
}
// Écriture descendante : reconstruit l'ancien tableau ventesSimulees à partir du nouveau modèle, pour
// qu'une sauvegarde produite par la V8 reste relisible par une version antérieure de l'outil (le champ
// est toujours sérialisé par buildSaveRecord). L'échéancier annuel n'a pas d'équivalent dans l'ancien
// format : seules les valeurs de stock y sont reportées, la perte est assumée et unidirectionnelle.
function planVenteToLegacyVentes(lignes){
  return (lignes||[]).map((l)=>({
    id: l.id, resCode: l.resCode, typeVente: l.typeVente ?? null,
    logementsRestants: l._legacyLogementsRestants ?? null,
    prixVente: l._legacyPrixVente ?? null,
    origine: l.origine || 'ajout',
  }));
}
function buildSaveRecord({id, nom, nomFichierSource, gabaritComplet, nbCols, data, simOperations, budgetLignes, offreNouvelleLgt, ventesSimulees, planVenteLignes, objectifsVente, ventesRealisees, criteresVenteConfig, includeIdentifiees, financeSeuils, customPivotViews, estBase, dateCreation}){
  const now = new Date().toISOString();
  return {
    id: id || genSaveId(),
    nom,
    dateCreation: dateCreation || now,
    dateModification: now,
    estBase: !!estBase,
    nomFichierSource,
    gabaritComplet,
    nbCols,
    data,
    simOperations,
    budgetLignes: budgetLignes || [],
    offreNouvelleLgt: offreNouvelleLgt || {},
    // V8 §1.3 — ventesSimulees reste ÉCRIT (et non seulement lu) tant que des sauvegardes antérieures
    // à la V8 circulent : une sauvegarde relue par une version plus ancienne de l'outil y retrouve son
    // format. Les nouveaux champs sont ajoutés APRÈS les existants, sans toucher à l'ordre de
    // sérialisation en place (leçon des phases précédentes).
    ventesSimulees: ventesSimulees || [],
    includeIdentifiees,
    financeSeuils: financeSeuils || {},
    customPivotViews: customPivotViews || [],
    planVenteLignes: planVenteLignes || [],
    objectifsVente: objectifsVente || {},
    ventesRealisees: ventesRealisees || {},
    criteresVenteConfig: criteresVenteConfig || null,
  };
}
function isValidSaveRecord(obj){
  return !!(obj && typeof obj==='object' && obj.data && Array.isArray(obj.data.residences) && Array.isArray(obj.simOperations));
}

function CeLogo(){
  return (
    <div style={{display:'flex',alignItems:'center',gap:10}}>
      <img src={CE_LOGO_PASTILLE} alt="Cellance" style={{height:34,width:34,flexShrink:0,display:'block'}} />

}

function fmtNum(n){ if(n===null||n===undefined||isNaN(n)) return '—'; return new Intl.NumberFormat('fr-FR').format(Math.round(n)); }
function fmtEur(n){ if(n===null||n===undefined||isNaN(n)) return '—'; return new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Math.round(n))+' €'; }
function fmtKEur(n){ if(n===null||n===undefined||isNaN(n)) return '—'; return new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Math.round(n/1000))+' k€'; }
function escapeHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function DpeBadge({cl}){
  if (!cl) return <span className="dpe-badge" style={{background:'#eef4f2',color:'#9fb3ae'}}>?</span>;
  const c = String(cl).toUpperCase();
  return <span className="dpe-badge" style={{background:DPE_COLORS[c]||'#eef4f2', color:DPE_TEXT[c]||'#1C3A35'}}>{c}</span>;
}

function CritBar({label, value, max}){
  const has = typeof value==='number' && !isNaN(value);
  const pct = has && max>0 ? Math.max(2,Math.min(100,(value/max)*100)) : 0;
  return (
    <div style={{marginBottom:8}}>
      <div style={{display:'flex',justifyContent:'space-between',fontSize:'.72rem',color:'var(--ce-vert-fonce)',marginBottom:3}}>
        <span>{label}</span><span style={{fontWeight:700}}>{has? value.toFixed(1): '—'}</span>
      </div>
      <div className="crit-bar-track"><div className="crit-bar-fill" style={{width:pct+'%'}}></div></div>
    </div>
  );
}

/* ---------------- Chart.js wrapper ---------------- */
function ChartCanvas({type, data, options, height, plugins}){
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  useEffect(()=>{
    if (!canvasRef.current) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current.getContext('2d'), {type, data, options: Object.assign({
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{labels:{font:{family:'Open Sans',size:11}, color:'#1C3A35'}}},
    }, options||{}), plugins: plugins||[]});
    return ()=>{ if (chartRef.current) chartRef.current.destroy(); };
  }, [JSON.stringify(data), JSON.stringify(options), type, plugins]);
  return <div style={{height: height||280}}><canvas ref={canvasRef}></canvas></div>;
}

// Plugin Chart.js dessinant un % d'écart sous chaque barre d'une catégorie, aligné pixel pour pixel
// sur la position réelle de la barre du dataset ciblé (contrairement à une rangée HTML posée sous le
// graphique, qui ne peut pas connaître la largeur de l'axe Y ni le padding interne de Chart.js et se
// désaligne dès que ces derniers changent). N'agit que si `options.plugins.ceEcartLabels` est fourni
// (sinon no-op) — passé via la prop `plugins` de ChartCanvas, jamais enregistré globalement.
const CE_ECART_LABELS_PLUGIN = {
  id: 'ceEcartLabels',
  afterDatasetsDraw(chart){
    const cfg = chart.options.plugins && chart.options.plugins.ceEcartLabels;
    if (!cfg || !cfg.values) return;
    const meta = chart.getDatasetMeta(cfg.datasetIndex||0);
    if (!meta || !meta.data || !meta.data.length) return;
    const ctx = chart.ctx;
    ctx.save();
    ctx.font = '700 11px "Open Sans", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    meta.data.forEach((bar, i)=>{
      const val = cfg.values[i];
      if (val===null || val===undefined || isNaN(val)) return;
      const { x } = bar.getProps(['x'], true);
      ctx.fillStyle = val>=0 ? (cfg.colorPos||'#FF8364') : (cfg.colorNeg||'#009261');
      ctx.fillText((val>=0?'+':'')+val.toFixed(0)+'%', x, chart.chartArea.bottom + (cfg.offsetY!=null? cfg.offsetY : 20));
    });
    ctx.restore();
  }
};
// Référence stable (pas un littéral recréé à chaque rendu) : passée telle quelle à la prop `plugins`
// de ChartCanvas, dont l'effet de (re)création du graphique en dépend — un nouveau tableau à chaque
// rendu forcerait Chart.js à se détruire/recréer inutilement à chaque re-rendu du composant parent.
const CE_ECART_LABELS_PLUGINS = [CE_ECART_LABELS_PLUGIN];

/* ---------------- Carte Leaflet (cartographie) ---------------- */
function LeafletMap({markers, height, onSelectResidence}){
  const divRef = useRef(null);
  const mapRef = useRef(null);
  const layerRef = useRef(null);

  useEffect(()=>{
    if (!divRef.current) return;
    const map = L.map(divRef.current, {zoomControl:true});
    map.setView([46.6, 2.4], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);
    mapRef.current = map;
    layerRef.current = L.layerGroup().addTo(map);
    return ()=>{ map.remove(); mapRef.current = null; layerRef.current = null; };
  }, []);

  useEffect(()=>{
    const map = mapRef.current, layer = layerRef.current;
    if (!map || !layer) return;
    layer.clearLayers();
    const pts = [];
    markers.forEach((m)=>{
      const radius = Math.max(6, Math.min(18, 4 + Math.sqrt(m.res.nbLgt||10)*0.85));
      const marker = L.circleMarker([m.lat, m.lon], {
        radius, weight:1.5, color:'#1C3A35', fillColor:m.color, fillOpacity:0.85
      });
      marker.bindTooltip(
        '<b>'+escapeHtml(m.res.nom||m.res.code)+'</b><br/>'+fmtNum(m.res.nbLgt)+' logements'+(m.res.dpeEnergie? ' · DPE '+escapeHtml(m.res.dpeEnergie):''),
        {direction:'top', offset:[0,-4]}
      );
      marker.on('click', ()=>onSelectResidence(m.res));
      marker.addTo(layer);
      pts.push([m.lat, m.lon]);
    });
    if (pts.length) map.fitBounds(pts, {padding:[30,30], maxZoom:15});
    // Sans nettoyage, ce timer en attente peut se déclencher après le démontage du composant (ex.
    // changement d'onglet pendant que le géocodage progresse encore, ce qui refait tourner cet effet
    // à chaque nouveau marqueur résolu) : `map` a déjà été détruite par le cleanup de l'effet
    // précédent, et invalidateSize() plante alors avec "Cannot read properties of undefined
    // (reading '_leaflet_pos')" — reproduit en usage réel lors d'un changement d'onglet rapide.
    const t = setTimeout(()=>map.invalidateSize(), 60);
    return ()=>clearTimeout(t);
  }, [markers]);

  return <div ref={divRef} style={{height: height||520, borderRadius:10, overflow:'hidden', position:'relative', zIndex:0}}></div>;
}

/* ---------------- Écran d'import ---------------- */
// Aucune limite de taille ne protégeait la lecture d'un fichier importé (.xlsx ou .json) avant même
// FileReader/JSON.parse : un fichier de plusieurs centaines de Mo (sélectionné par erreur, ou déposé
// par un visiteur quelconque sur cet outil à accès public non authentifié) pouvait geler ou faire
// planter l'onglet. Seuil généreux pour un fichier PSP réel (les gabarits Cellance existants font
// quelques Mo) tout en filtrant les cas clairement aberrants.
const MAX_IMPORT_FILE_BYTES = 50 * 1024 * 1024;
function ImportScreen({onLoaded, onRestore, onBaseChanged, currentUser, onLogout}){
  const [drag, setDrag] = useState(false);
  const [loading, setLoading] = useState(false);
  const [loadingMsg, setLoadingMsg] = useState('Analyse du fichier en cours…');
  const [error, setError] = useState(null);
  const [saves, setSaves] = useState(null); // null = chargement en cours, [] = aucune sauvegarde
  const [renamingId, setRenamingId] = useState(null);
  const [renameValue, setRenameValue] = useState('');
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [importJsonError, setImportJsonError] = useState(null);
  const [opError, setOpError] = useState(null);
  const inputRef = useRef(null);
  const jsonInputRef = useRef(null);
  const workerRef = useRef(null);

  async function refreshSaves(){
    // idbGetAll() peut lever (requête Supabase en erreur, réseau coupé) : les appels déclenchés par une
    // action utilisateur (handleSetBase/handleDelete/commitRename plus bas) sont déjà protégés par leur
    // propre try/catch, mais l'appel initial (useEffect ci-dessous) ne l'était pas — une erreur ici
    // laissait `saves` à `null` indéfiniment (état "chargement en cours" par construction, cf. useState
    // plus haut), sans spinner ni message d'erreur pour l'utilisateur.
    try {
      const all = await idbGetAll();
      all.sort((a,b)=> new Date(b.dateModification) - new Date(a.dateModification));
      setSaves(all);
    } catch(e){ setSaves([]); setOpError("Impossible de charger les sauvegardes partagées (connexion au service indisponible)."); }
  }
  useEffect(()=>{ refreshSaves(); }, []);

  useEffect(()=>()=>{ if (workerRef.current) workerRef.current.terminate(); }, []);

  async function handleSetBase(id){
    try { await idbSetBase(id); await refreshSaves(); onBaseChanged && onBaseChanged(); }
    catch(e){ setOpError("Impossible de définir cette version comme base."); }
  }
  async function handleDelete(id){
    try { await idbDelete(id); setConfirmDeleteId(null); await refreshSaves(); onBaseChanged && onBaseChanged(); }
    catch(e){ setOpError("Impossible de supprimer cet import."); }
  }
  async function commitRename(id){
    const rec = (saves||[]).find((r)=>r.id===id);
    setRenamingId(null);
    if (!rec) return;
    const nom = renameValue.trim();
    if (!nom || nom===rec.nom) return;
    try { await idbPut(Object.assign({}, rec, {nom, dateModification: new Date().toISOString()})); await refreshSaves(); }
    catch(e){ setOpError("Impossible de renommer cet import."); }
  }
  function handleExport(rec){
    const blob = new Blob([JSON.stringify(rec)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const safeName = (ceNorm(rec.nom).replace(/[^a-z0-9]+/g,'-').replace(/(^-+|-+$)/g,'')) || 'import';
    a.href = url; a.download = 'psp_export_'+safeName+'_'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  }
  function handleImportJsonFile(file){
    setImportJsonError(null);
    if (file.size > MAX_IMPORT_FILE_BYTES){
      setImportJsonError(`Fichier trop volumineux (${Math.round(file.size/1e6)} Mo, maximum ${MAX_IMPORT_FILE_BYTES/1e6} Mo).`);
      return;
    }
    const reader = new FileReader();
    reader.onload = async (e)=>{
      let obj;
      try { obj = JSON.parse(e.target.result); } catch(err){ setImportJsonError("Le fichier n'est pas un JSON valide."); return; }
      if (!isValidSaveRecord(obj)){ setImportJsonError("Ce fichier ne correspond pas au format attendu d'une sauvegarde PSP (structure inattendue — clés « data »/« simOperations » manquantes)."); return; }
      // idbGetAll (comme idbPut) rejette désormais si la session a expiré : englobé dans le même
      // try/catch que idbPut ci-dessous, sinon un rejet ici faisait échouer l'import en silence (aucun
      // message d'erreur affiché).
      try {
        const all = await idbGetAll();
        let nom = obj.nom || 'Import importé';
        if (all.some((r)=>r.nom===nom)) nom = nom + ' (import)';
        const record = buildSaveRecord({
          nom, nomFichierSource: obj.nomFichierSource, gabaritComplet: obj.gabaritComplet, nbCols: obj.nbCols,
          data: obj.data, simOperations: obj.simOperations, budgetLignes: migrateBudgetLignes(obj), offreNouvelleLgt: obj.offreNouvelleLgt||{}, ventesSimulees: obj.ventesSimulees||[],
          // §V8 Phase 1.3 — un fichier JSON exporté avant la V8 ne porte que ventesSimulees : migré ici
          // pour que la sauvegarde créée à partir de cet import soit déjà au nouveau format.
          planVenteLignes: migratePlanVente(obj), objectifsVente: obj.objectifsVente||{},
          ventesRealisees: obj.ventesRealisees||{}, criteresVenteConfig: obj.criteresVenteConfig||null,
          includeIdentifiees: obj.includeIdentifiees!==undefined? obj.includeIdentifiees : true,
          estBase: false,
        });
        await idbPut(record); await refreshSaves();
      } catch(err){ setImportJsonError("Échec de l'enregistrement (connexion au service de sauvegarde partagée impossible)."); }
    };
    reader.onerror = ()=>setImportJsonError("Impossible de lire ce fichier.");
    reader.readAsText(file);
  }

  function buildWorkerSource(){
    const engineSrc = document.getElementById('engine-source').textContent;
    return [
      "importScripts('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');",
      engineSrc,
      "self.onmessage = function(ev){",
      "  try {",
      "    var wb = XLSX.read(ev.data.buffer, {type:'array', cellDates:false});",
      "    var cotationSheetName = findSheet(wb.SheetNames, /base de cotation/);",
      "    if (!cotationSheetName){ self.postMessage({ok:false, reason:'nosheet'}); return; }",
      "    var cotation = parseBaseCotation(sheetToMatrix(wb.Sheets[cotationSheetName]));",
      "    if (!cotation || cotation.residences.length===0){ self.postMessage({ok:false, reason:'noresidences'}); return; }",
      "    var gainsSheetName = findSheet(wb.SheetNames, /referentiel des gains dpe/);",
      "    var gainsGrid = gainsSheetName ? parseGainsDPE(sheetToMatrix(wb.Sheets[gainsSheetName])) : null;",
      // V8 §1.1 — onglet optionnel : son absence laisse cessionsEcheancier à null et n'interrompt rien.
      "    var cessionsSheetName = findSheet(wb.SheetNames, /cessions identifiees/);",
      "    var cessions = cessionsSheetName ? parseCessionsIdentifiees(sheetToMatrix(wb.Sheets[cessionsSheetName])) : null;",
      "    var cessionsMatch = matchCessionsToResidences(cessions, cotation.residences);",
      // V9 §1 — deux onglets optionnels de plus (référentiels de la trajectoire de décarbonation) :
      // absents, ils font retomber sur les valeurs de repli Cellance, jamais sur un écran vide.
      "    var refsDecarbo = buildRefsDecarbonation(wb);",
      "    self.postMessage({ ok:true, result:{",
      "      nbOnglets: wb.SheetNames.length, nbCols: cotation.nbCols,",
      "      residences: cotation.residences, operations: cotation.operations,",
      "      gainsGrid: gainsGrid || {}, hasGainsGrid: !!gainsSheetName,",
      "      duplicateCodes: cotation.duplicateCodes || [],",
      "      cessionsEcheancier: cessions, hasCessions: !!cessionsSheetName,",
      "      cessionsParResCode: cessionsMatch.parResCode,",
      "      cessionsOrphelines: cessionsMatch.orphelines.length,",
      "      refsDecarbo: refsDecarbo",
      "    }});",
      "  } catch(err){ self.postMessage({ok:false, reason:'exception', message: (err && err.message) || String(err)}); }",
      "};",
    ].join('\n');
  }

  function finishWithResult(fileName, result){
    setLoading(false);
    onLoaded(Object.assign({fileName}, result));
  }

  function failWith(reason, message){
    setLoading(false);
    if (reason==='toolarge') setError(`Fichier trop volumineux (maximum ${MAX_IMPORT_FILE_BYTES/1e6} Mo). Vérifiez qu'il s'agit bien d'un export du gabarit Cellance.`);
    else if (reason==='nosheet') setError("Le fichier importé ne contient pas d'onglet « Base de cotation » reconnaissable. Import refusé : le socle minimal n'est pas présent.");
    else if (reason==='noresidences') setError("L'onglet « Base de cotation » a été trouvé mais aucune résidence n'a pu être lue (colonne « Code de Résidence » introuvable ou onglet vide). Import refusé.");
    else if (reason==='timeout') setError("L'analyse du fichier prend anormalement longtemps (plus de 2 minutes) et a été interrompue. Le fichier est peut-être trop volumineux ou corrompu.");
    else setError("Erreur lors de la lecture du fichier" + (message? (' : '+message):'') + ". Vérifiez qu'il s'agit bien d'un fichier PSP au format Excel (.xlsx).");
  }

  function processFileMainThread(file, buffer){
    // secours si les Web Workers sont indisponibles dans ce navigateur
    try {
      const wb = XLSX.read(buffer, {type:'array', cellDates:false});
      const cotationSheetName = findSheet(wb.SheetNames, /base de cotation/);
      if (!cotationSheetName) return failWith('nosheet');
      const cotation = parseBaseCotation(sheetToMatrix(wb.Sheets[cotationSheetName]));
      if (!cotation || cotation.residences.length===0) return failWith('noresidences');
      const gainsSheetName = findSheet(wb.SheetNames, /referentiel des gains dpe/);
      const gainsGrid = gainsSheetName ? parseGainsDPE(sheetToMatrix(wb.Sheets[gainsSheetName])) : null;
      // V8 §1.1 — doit rester rigoureusement identique au corps de buildWorkerSource() ci-dessus :
      // ce repli thread principal sert quand les Web Workers sont indisponibles ou plantent, un écart
      // entre les deux produirait des imports au contenu différent selon le navigateur.
      const cessionsSheetName = findSheet(wb.SheetNames, /cessions identifiees/);
      const cessions = cessionsSheetName ? parseCessionsIdentifiees(sheetToMatrix(wb.Sheets[cessionsSheetName])) : null;
      const cessionsMatch = matchCessionsToResidences(cessions, cotation.residences);
      const refsDecarbo = buildRefsDecarbonation(wb);
      finishWithResult(file.name, {
        nbOnglets: wb.SheetNames.length, nbCols: cotation.nbCols,
        residences: cotation.residences, operations: cotation.operations,
        gainsGrid: gainsGrid || {}, hasGainsGrid: !!gainsSheetName,
        duplicateCodes: cotation.duplicateCodes || [],
        cessionsEcheancier: cessions, hasCessions: !!cessionsSheetName,
        cessionsParResCode: cessionsMatch.parResCode,
        cessionsOrphelines: cessionsMatch.orphelines.length,
        refsDecarbo: refsDecarbo,
      });
    } catch (err){ failWith('exception', err.message); }
  }

  function processFile(file){
    setError(null);
    if (file.size > MAX_IMPORT_FILE_BYTES){ failWith('toolarge'); return; }
    setLoading(true); setLoadingMsg('Lecture du fichier…');
    const reader = new FileReader();
    reader.onload = (e) => {
      const buffer = e.target.result;
      if (typeof Worker === 'undefined'){
        setLoadingMsg('Analyse du fichier en cours (mode compatibilité)…');
        processFileMainThread(file, buffer);
        return;
      }
      let worker;
      try {
        const blob = new Blob([buildWorkerSource()], {type:'application/javascript'});
        const workerUrl = URL.createObjectURL(blob);
        worker = new Worker(workerUrl);
        // Le Worker a déjà résolu l'URL au moment de sa construction : la révoquer immédiatement après
        // ne l'empêche pas de démarrer, et évite de laisser une entrée en mémoire jusqu'au déchargement
        // de la page à chaque import réussi (aucun autre appel ne la révoquait).
        URL.revokeObjectURL(workerUrl);
      } catch (err){
        processFileMainThread(file, buffer);
        return;
      }
      workerRef.current = worker;
      setLoadingMsg('Analyse du fichier en cours… (peut prendre jusqu\u2019à une minute pour un fichier volumineux)');
      const timeoutId = setTimeout(() => { worker.terminate(); failWith('timeout'); }, 120000);
      worker.onmessage = (ev) => {
        clearTimeout(timeoutId);
        worker.terminate();
        const msg = ev.data;
        if (msg.ok) finishWithResult(file.name, msg.result);
        else failWith(msg.reason, msg.message);
      };
      worker.onerror = () => {
        clearTimeout(timeoutId);
        worker.terminate();
        // repli sur le thread principal si le worker plante (ex: importScripts bloqué par le réseau).
        // `buffer` original (jamais transféré, cf. plus bas) reste valide ici : le transférer aurait
        // détaché sa mémoire (byteLength → 0) dès le postMessage, avant même que ce repli ne puisse
        // s'exécuter (onerror est forcément asynchrone) — XLSX.read() aurait alors échoué avec une
        // erreur bas niveau incompréhensible au lieu du repli attendu.
        processFileMainThread(file, buffer);
      };
      // On transfère une COPIE (bufferForWorker), jamais `buffer` lui-même, pour que ce dernier reste
      // exploitable par le repli ci-dessus si le worker échoue après coup.
      const bufferForWorker = buffer.slice(0);
      worker.postMessage({buffer: bufferForWorker}, [bufferForWorker]);
    };
    reader.onerror = () => { setError("Impossible de lire ce fichier depuis le disque."); setLoading(false); };
    reader.readAsArrayBuffer(file);
  }

  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      <div className="ce-header">
        <CeLogo/><span className="ce-header-title">Outil interactif d'exploration du <b>PSP</b></span>
        <div style={{marginLeft:'auto',display:'flex',gap:10,alignItems:'center'}}>
          <span style={{color:'#fff',fontSize:'.76rem',opacity:.85}}>{currentUser && currentUser.email}</span>
          <button className="ce-btn-outline ce-btn-sm" style={{color:'#fff',borderColor:'#fff'}} onClick={onLogout}>Déconnexion</button>
        </div>
      </div>
      <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',padding:'40px 24px'}}>
        <div style={{maxWidth:640,width:'100%'}}>
          <h1 style={{color:'var(--ce-vert-principal)',fontSize:'1.6rem',fontWeight:700,marginBottom:6}}>Import du fichier PSP</h1>
          <p style={{color:'var(--ce-vert-fonce)',fontSize:'.88rem',marginBottom:22,lineHeight:1.5}}>
            Déposez un fichier PSP construit sur le gabarit Cellance (.xlsx). Le traitement est effectué
            intégralement dans votre navigateur : aucune donnée n'est transmise à un serveur.
          </p>
          <div
            className={"dropzone"+(drag?" drag":"")}
            style={{padding:'48px 24px',textAlign:'center',cursor:'pointer'}}
            onClick={()=>inputRef.current && inputRef.current.click()}
            onDragOver={(e)=>{e.preventDefault();setDrag(true);}}
            onDragLeave={()=>setDrag(false)}
            onDrop={(e)=>{e.preventDefault();setDrag(false); const f=e.dataTransfer.files[0]; if(f) processFile(f);}}
          >
            {loading ? (
              <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:14}}>
                <div className="spinner"></div>
                <span style={{color:'var(--ce-vert-fonce)',fontSize:'.85rem',textAlign:'center',maxWidth:280}}>{loadingMsg}</span>
              </div>
            ) : (
              <React.Fragment>
                <div style={{fontSize:'2.2rem',marginBottom:10}}>📂</div>
                <div style={{fontWeight:700,color:'var(--ce-vert-tres-fonce)',marginBottom:4}}>Glissez-déposez votre fichier PSP ici</div>
                <div style={{fontSize:'.78rem',color:'var(--ce-vert-fonce)'}}>ou cliquez pour sélectionner un fichier .xlsx</div>
              </React.Fragment>
            )}
            <input ref={inputRef} type="file" accept=".xlsx" style={{display:'none'}} onChange={(e)=>{ const f=e.target.files[0]; if(f) processFile(f); }} />
          </div>
          {error && (
            <div style={{marginTop:16,background:'var(--ce-rose)',border:'1px solid var(--ce-corail)',borderRadius:8,padding:'12px 16px',fontSize:'.8rem',color:'var(--ce-vert-tres-fonce)'}}>
              <b>Import refusé.</b> {error}
            </div>
          )}
          <div style={{marginTop:28,fontSize:'.72rem',color:'var(--ce-vert-fonce)',lineHeight:1.6}}>
            <b>Contrôle de conformité :</b> l'import n'est bloqué que si l'onglet « Base de cotation » (socle)
            est absent ou illisible. L'absence de la grille de gains DPE dégrade certaines vues sans bloquer l'import.
          </div>
        </div>

        <div style={{maxWidth:960,width:'100%',marginTop:40}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:10,marginBottom:12}}>
            {saves && saves.length>0 ? (

function uniqueSorted(arr){ return Array.from(new Set(arr.filter((v)=>v!==null&&v!==undefined&&v!==''))).sort((a,b)=>String(a).localeCompare(String(b),'fr')); }

function FilterBar({residences, filters, setFilters}){
  const communes = useMemo(()=>uniqueSorted(residences.map((r)=>r.commune)), [residences]);
  const secteurs = useMemo(()=>uniqueSorted(residences.map((r)=>r.secteur || r.agence)), [residences]);
  const familles = useMemo(()=>uniqueSorted(residences.map((r)=>r.familleAttract)), [residences]);
  const dpeClasses = ['A','B','C','D','E','F','G'];

  const hasActive = filters.commune || filters.secteur || filters.famille || filters.dpe || filters.qpv;
  function reset(){ setFilters({commune:'',secteur:'',famille:'',dpe:'',qpv:''}); }

  return (
    <div style={{background:'#fff',borderBottom:'1px solid #e4ede9',padding:'8px 24px',display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
      <span style={{fontSize:'.7rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase',letterSpacing:'.03em'}}>Filtres</span>
      {communes.length>0 && (
        <select className="ce-select" value={filters.commune} onChange={(e)=>setFilters(Object.assign({},filters,{commune:e.target.value}))}>
          <option value="">Commune (toutes)</option>
          {communes.map((c)=><option key={c} value={c}>{c}</option>)}
        </select>
      )}
      {secteurs.length>0 && (
        <select className="ce-select" value={filters.secteur} onChange={(e)=>setFilters(Object.assign({},filters,{secteur:e.target.value}))}>
          <option value="">Secteur / agence (tous)</option>
          {secteurs.map((c)=><option key={c} value={c}>{c}</option>)}
        </select>
      )}
      {familles.length>0 && (
        <select className="ce-select" value={filters.famille} onChange={(e)=>setFilters(Object.assign({},filters,{famille:e.target.value}))}>
          <option value="">Famille attractivité (toutes)</option>
          {familles.map((c)=><option key={c} value={c}>Famille {c}</option>)}
        </select>
      )}
      <select className="ce-select" value={filters.dpe} onChange={(e)=>setFilters(Object.assign({},filters,{dpe:e.target.value}))}>
        <option value="">Classe DPE énergie (toutes)</option>
        {dpeClasses.map((c)=><option key={c} value={c}>{c}</option>)}
      </select>
      <select className="ce-select" value={filters.qpv} onChange={(e)=>setFilters(Object.assign({},filters,{qpv:e.target.value}))}>
        <option value="">QPV (tous)</option>
        <option value="qpv">QPV</option>
        <option value="hors_qpv">Hors QPV</option>
      </select>
      {hasActive && <button className="ce-btn-outline ce-btn-sm" onClick={reset}>Réinitialiser</button>}
    </div>
  );
}

function applyFilters(residences, filters){
  return residences.filter((r)=>{
    if (filters.commune && r.commune!==filters.commune) return false;
    if (filters.secteur && (r.secteur||r.agence)!==filters.secteur) return false;
    if (filters.famille && r.familleAttract!==filters.famille) return false;
    if (filters.dpe && r.dpeEnergie!==filters.dpe) return false;
    if (filters.qpv==='qpv' && !isQpvValue(r.qpv)) return false;
    if (filters.qpv==='hors_qpv' && isQpvValue(r.qpv)) return false;
    return true;
  });
}

/* ---------------- Sélecteur générique Base / Actuel / Cible ----------------
   3 cases indépendantes (1, 2 ou 3 cochées simultanément), utilisées aux 4 emplacements de
   comparaison généralisée (§2.3 de la spec) : nuage Attractivité x État technique, trajectoire
   d'investissement, trajectoire de décarbonation, tableau Impact des actions stratégiques.
   Toujours au moins une case cochée (on ignore le clic qui viderait tout plutôt que de reverrouiller
   après coup, pour éviter tout flash d'état vide). Base est désactivée si aucune version base n'est
   chargée ; Actuel et Cible restent toujours actives (Cible ne dépend que du fichier ouvert, pas
   d'une sauvegarde Base — choix assumé pour préserver le tableau Impact qui fonctionne déjà sans Base,
   cf. plan approuvé). */
const COMPARE_COLORS = { base:'#9fb3ae', actuel:'#009261', cible:'#FF8364' };
const COMPARE_LABELS = { base:'Base', actuel:'Actuel', cible:'Cible' };
function defaultCompareState(){ return {base:false, actuel:true, cible:false}; }
function clampCompareState(state, hasBase){
  const s = Object.assign({}, state);
  if (!hasBase) s.base = false;
  if (!s.base && !s.actuel && !s.cible) s.actuel = true;
  return s;
}
function CompareCheckboxes({checked, onChange, hasBase}){
  function toggle(key){
    if (key==='base' && !hasBase) return;
    const next = Object.assign({}, checked, {[key]: !checked[key]});
    if (!next.base && !next.actuel && !next.cible) return; // reverrouille : ignore le clic qui viderait tout
    onChange(next);
  }
  return (
    <div style={{display:'flex',gap:12,alignItems:'center',flexWrap:'wrap'}}>
      {['base','actuel','cible'].map((key)=>{
        const disabled = key==='base' && !hasBase;
        return (
          <label key={key} title={disabled? "Définissez une version base pour activer cette comparaison" : ""}
            style={{display:'flex',alignItems:'center',gap:5,fontSize:'.76rem',fontWeight:700,color: disabled? '#c3d0cc' : 'var(--ce-vert-fonce)',cursor: disabled?'not-allowed':'pointer',opacity: disabled?0.6:1}}>
            <input type="checkbox" checked={!!checked[key]} disabled={disabled} onChange={()=>toggle(key)} />
            <span style={{display:'inline-block',width:9,height:9,borderRadius:'50%',background:COMPARE_COLORS[key]}}></span>
            {COMPARE_LABELS[key]}
          </label>
        );
      })}
    </div>
  );
}

/* ---------------- Navigation ----------------
   Arborescence à 2 sections (§1 de la spec) : "Synthèse du PSP" et "Orientations stratégiques"
   regroupent des sous-onglets ; les autres entrées restent au niveau 1, inchangées. Seuls le
   libellé/regroupement changent — les composants de vue gardent leurs noms et props existants. */
const NAV_ITEMS = [
  {id:'ensemble', label:"Vue d'ensemble"},
  {section:'synthese', label:'Synthèse du PSP', tabs:[
    {id:'cotation', label:'Impacts stratégiques'},
  ]},
  // V9 §1 — « Décarbonation DPE » quitte la Synthèse pour rejoindre les Orientations stratégiques sous
  // le nom de la feuille Excel dont elle reprend désormais les tableaux (« 4. Trajectoire
  // décarbonation »). L'identifiant d'onglet reste 'dpe' : il est stocké dans aucune sauvegarde, mais
  // le renommer obligerait à toucher toutes les conditions d'affichage pour un gain nul.
  {section:'orientations', label:'Orientations stratégiques', tabs:[
    {id:'invest', label:'Investissements & Entretien du parc'},
    {id:'dpe', label:'Trajectoire de décarbonation'},
    {id:'offre', label:'Offre nouvelle'},
    {id:'vente', label:'Vente'},
  ]},
  {id:'finance', label:'Données financières'},
  {id:'pivot', label:'Analyse libre (pivot)'},
  {id:'carto', label:'Cartographie'},
];
function Nav({active, setActive, hasFinance, hasCarto, hasCompare, hasAdmin}){
  const [openSection, setOpenSection] = useState(null);
  const items = NAV_ITEMS.map((it)=>{
    if (it.id==='finance') return Object.assign({}, it, {disabled: !hasFinance});
    if (it.id==='carto') return Object.assign({}, it, {disabled: !hasCarto});
    return it;
  });
  if (hasCompare) items.push({id:'compare', label:'Comparatif'});
  if (hasAdmin) items.push({id:'admin', label:'Administration'});

  // Une section reste surlignée tant que l'onglet actif lui appartient, indépendamment du menu
  // déroulant (qui, lui, ne reste ouvert que tant que l'utilisateur ne l'a pas refermé/n'a pas choisi
  // un sous-onglet/cliqué ailleurs).
  const activeSection = items.find((it)=> it.tabs && it.tabs.some((t)=>t.id===active));

  return (
    // overflowX:'auto' ici clipperait le menu déroulant des sections (position:absolute, positionné
    // sous son déclencheur) : per la spec CSS, un axe overflow non-'visible' force l'autre axe à
    // 'auto' aussi, ce qui transforme cette barre en zone de défilement qui coupe tout ce qui dépasse
    // sa hauteur — dont le menu. flexWrap remplace le scroll horizontal si la barre est trop étroite.
    <div style={{background:'#fff',borderBottom:'2px solid #eef4f2',display:'flex',flexWrap:'wrap',padding:'0 24px'}}>
      {items.map((it)=>{
        if (it.tabs){
          const isOpen = openSection===it.section;
          const isActive = (activeSection && activeSection.section===it.section) || isOpen;
          return (
            <div key={it.section} style={{position:'relative'}}>
              <div
                className={"ce-tab"+(isActive?" active":"")}
                onClick={()=> setOpenSection((cur)=> cur===it.section? null : it.section)}
              >{it.label} {isOpen?'▴':'▾'}</div>
              {isOpen && (
                <React.Fragment>
                  {/* Ferme le menu au clic en dehors — même principe que drawer-overlay pour la fiche résidence. */}
                  <div style={{position:'fixed',inset:0,zIndex:9}} onClick={()=>setOpenSection(null)}></div>
                  <div style={{position:'absolute',top:'100%',left:0,marginTop:2,background:'#fff',border:'1px solid #eef4f2',borderRadius:8,boxShadow:'0 8px 24px rgba(0,0,0,.12)',zIndex:10,minWidth:240,padding:6}}>
                    {it.tabs.map((t)=>(
                      <div key={t.id}
                        className={"ce-nav-dropdown-item"+(active===t.id?" active":"")}
                        onClick={()=>{ setActive(t.id); setOpenSection(null); }}
                      >{t.label}</div>
                    ))}
                  </div>
                </React.Fragment>
              )}
            </div>
          );
        }
        return (
          <div key={it.id}
            className={"ce-tab"+(active===it.id?" active":"")+(it.disabled?" disabled":"")}
            title={it.disabled? (it.id==='carto' ? "Nécessite une colonne adresse dans le fichier importé" : "Non disponible dans ce fichier"):""}
            onClick={()=>{ if(!it.disabled){ setActive(it.id); setOpenSection(null); } }}
          >{it.label}</div>
        );
      })}
    </div>
  );
}
