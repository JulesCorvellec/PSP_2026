function isQpvValue(v){
  const n = ceNorm(v);
  return !!n && n!=='non' && n!=='hors qpv';
}
const DECENNIE_BUCKETS = ['avant 1960','1960-1970','1970-1980','1980-1990','1990-2000','2000-2010','2010-2020','après 2020'];
function decennieBucket(annee){
  if (annee<1960) return 'avant 1960';
  const start = Math.floor(annee/10)*10;
  if (start>=2020) return 'après 2020';
  return start+'-'+(start+10);
}

// Lignes "résidence — X lgt" réutilisées par tous les panneaux ouverts au clic sur un graphique dont
// la catégorie (commune, secteur, décennie, agence) est déjà une donnée résidence entière (pas une
// sous-répartition par logement) — pas de % à calculer ici, cf. fractionRow/pctResRow ci-dessous pour
// les graphiques à la maille logement.
function ensembleSimpleResRow(onSelectResidence){
  return (r)=>(
    <div onClick={()=>onSelectResidence && onSelectResidence(r)} style={{display:'flex',justifyContent:'space-between',gap:8,fontSize:'.76rem',color:'var(--ce-vert-fonce)',padding:'3px 0',borderBottom:'1px solid #f0f5f3',cursor:onSelectResidence?'pointer':'default'}}>
      <span>{r.nom || r.code}</span>
      <span style={{color:'#9fb3ae',flexShrink:0}}>{fmtNum(r.nbLgt)} lgt</span>
    </div>
  );
}
// Typologie/DPE : formulation "X/Y logements en {catégorie}" (règle de formatage confirmée avec
// Jules — le % de la résidence concernée, pas seulement le total de logements).
function ensembleFractionRow(onSelectResidence, getCount, categoryLabel){
  return (r)=>{
    const n = getCount(r);
    const pct = r.nbLgt>0 ? Math.round(n/r.nbLgt*100) : null;
    return (
      <div onClick={()=>onSelectResidence && onSelectResidence(r)} style={{display:'flex',justifyContent:'space-between',gap:8,fontSize:'.76rem',color:'var(--ce-vert-fonce)',padding:'3px 0',borderBottom:'1px solid #f0f5f3',cursor:onSelectResidence?'pointer':'default'}}>
        <span>{r.nom || r.code}</span>
        <span style={{color:'#9fb3ae',flexShrink:0}}>{fmtNum(n)}/{fmtNum(r.nbLgt)} lgt en {categoryLabel}{pct!==null?' ('+pct+'%)':''}</span>
      </div>
    );
  };
}
// Chauffage/ECS/individuel-collectif/financement : formulation validée par Jules ("55% de logements
// PLUS/Électrique dans la résidence"). Ces champs sont une valeur unique par résidence dans le
// gabarit importé (pas une sous-répartition par logement, cf. chauffageTotals/ecsTotals ci-dessous)
// : le % vaut donc toujours 100 ici — cohérent avec la donnée disponible, pas une approximation.
function ensemblePctResRow(onSelectResidence, modeLabel){
  return (r)=>(
    <div onClick={()=>onSelectResidence && onSelectResidence(r)} style={{display:'flex',justifyContent:'space-between',gap:8,fontSize:'.76rem',color:'var(--ce-vert-fonce)',padding:'3px 0',borderBottom:'1px solid #f0f5f3',cursor:onSelectResidence?'pointer':'default'}}>
      <span>{r.nom || r.code}</span>
      <span style={{color:'#9fb3ae',flexShrink:0}}>100% de logements {modeLabel} dans la résidence ({fmtNum(r.nbLgt)} lgt)</span>
    </div>
  );
}

function ViewEnsemble({residences, operations, onSelectResidence}){
  const [dpeType, setDpeType] = useState('energie');
  const totalLgt = residences.reduce((s,r)=>s+r.nbLgt,0);
  const communesCount = uniqueSorted(residences.map((r)=>r.commune)).length;
  const totalInvest = operations.reduce((s,o)=>s+(o.montant||0),0);
  // Panneau ouvert au clic sur une KPI (une seule à la fois, cf. §2.2) : positionné sous la ligne de
  // KPI, distinct des panneaux par graphique ci-dessous (chartPanel, un par carte).
  const [kpiPanel, setKpiPanel] = useState(null); // {key, title, rows, renderRow}
  function toggleKpiPanel(key, data){ setKpiPanel((cur)=> (cur && cur.key===key) ? null : Object.assign({key}, data)); }
  // Panneau ouvert au clic sur une barre/part de graphique (§2.3) : un seul objet partagé, discriminé
  // par `chart` pour savoir sous quelle carte l'afficher — équivalent du `pinned`/`drillIdx` déjà
  // utilisé ailleurs dans l'outil (Segmentation, Impact, Pivot), appliqué ici aux graphiques de la
  // Vue d'ensemble.
  const [chartPanel, setChartPanel] = useState(null); // {chart, value, title, rows, renderRow}
  function toggleChartPanel(chart, value, data){
    setChartPanel((cur)=> (cur && cur.chart===chart && cur.value===value) ? null : Object.assign({chart, value}, data));
  }
  const simpleResRow = useMemo(()=>ensembleSimpleResRow(onSelectResidence), [onSelectResidence]);

  const resByCode = useMemo(()=>{ const m={}; residences.forEach((r)=>m[r.code]=r); return m; }, [residences]);
  // Agrégat complet par commune (pas seulement le top 5 du graphique) pour le panneau de la KPI
  // "Communes" — l'info utile ici est l'agrégat par commune, pas une liste de résidences (§2.2).
  const communesAgg = useMemo(()=>{
    const m = {};
    residences.forEach((r)=>{ if (r.commune){ if(!m[r.commune]) m[r.commune]={commune:r.commune, nbRes:0, nbLgt:0}; m[r.commune].nbRes++; m[r.commune].nbLgt+=(r.nbLgt||0); } });
    return Object.values(m).sort((a,b)=>b.nbLgt-a.nbLgt);
  }, [residences]);

  const topCommunes = useMemo(()=>{
    const m = {};
    residences.forEach((r)=>{ if(r.commune){ m[r.commune]=(m[r.commune]||0)+r.nbLgt; } });
    return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,5);
  }, [residences]);

  const topSecteurs = useMemo(()=>{
    const m = {};
    residences.forEach((r)=>{ const k=r.secteur||r.agence; if(k){ m[k]=(m[k]||0)+r.nbLgt; } });
    return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,5);
  }, [residences]);

  const typoTotals = useMemo(()=>{
    const t = {T1:0,T2:0,T3:0,T4:0,T5:0,'T6+':0};
    residences.forEach((r)=>{ Object.keys(t).forEach((k)=>{ t[k]+= (r[k]||0); }); });
    return t;
  }, [residences]);
  const hasTypo = Object.values(typoTotals).some((v)=>v>0);

  const hasDpePrincipal = residences.some((r)=>r.dpePrincipal);
  const dpeTotals = useMemo(()=>{
    const t = {A:0,B:0,C:0,D:0,E:0,F:0,G:0,NR:0};
    if (dpeType==='principal'){
      residences.forEach((r)=>{ const cl = String(r.dpePrincipal||'').toUpperCase(); if (t[cl]!==undefined) t[cl]+=(r.nbLgt||0); });
    } else {
      const key = dpeType==='ges' ? 'distGES' : 'distEnergie';
      residences.forEach((r)=>{ if (r[key]){ Object.keys(t).forEach((k)=>{ t[k]+=(r[key][k]||0); }); } });
    }
    return t;
  }, [residences, dpeType]);
  const hasDpeDist = Object.values(dpeTotals).some((v)=>v>0);
  const dpeTypeLabel = dpeType==='principal'?'Principal':dpeType==='ges'?'GES':'Énergie';
  const dpeLabels = Object.keys(dpeTotals).filter((k)=>dpeTotals[k]>0);
  function dpeCountFor(cl){
    if (dpeType==='principal') return (r)=> String(r.dpePrincipal||'').toUpperCase()===cl ? (r.nbLgt||0) : 0;
    const key = dpeType==='ges' ? 'distGES' : 'distEnergie';
    return (r)=> (r[key] && r[key][cl]) || 0;
  }

  // Indicateurs additionnels V4 (cf. commentaire au-dessus de parseBaseCotation pour la provenance
  // des colonnes) : chacun ne s'affiche que si la colonne correspondante a été trouvée dans le
  // fichier importé, jamais avec une valeur à 0 par défaut.
  const hasQpv = residences.some((r)=>r.qpv!==null && r.qpv!==undefined && r.qpv!=='');
  const qpvLgt = useMemo(()=>residences.reduce((s,r)=>s+(isQpvValue(r.qpv)?(r.nbLgt||0):0),0), [residences]);

  const hasConventionne = residences.some((r)=>r.dontConventionne!==null);
  const conventionneLgt = useMemo(()=>residences.reduce((s,r)=>s+(r.dontConventionne||0),0), [residences]);

  const hasFoyer = residences.some((r)=>r.dontFoyer!==null);
  const foyerLgt = useMemo(()=>residences.reduce((s,r)=>s+(r.dontFoyer||0),0), [residences]);

  const decennieData = useMemo(()=>{
    const t = {}; DECENNIE_BUCKETS.forEach((b)=>t[b]=0);
    residences.forEach((r)=>{ if (r.anneeConstruction){ t[decennieBucket(r.anneeConstruction)] += (r.nbLgt||0); } });
    return DECENNIE_BUCKETS.map((b)=>({bucket:b, total:t[b]}));
  }, [residences]);
  const hasDecennie = decennieData.some((d)=>d.total>0);

  const allAgences = useMemo(()=>{
    const m = {};
    residences.forEach((r)=>{ if (r.agence){ m[r.agence]=(m[r.agence]||0)+r.nbLgt; } });
    return Object.entries(m).sort((a,b)=>b[1]-a[1]);
  }, [residences]);

  const typeBatiTotals = useMemo(()=>{
    const t = {};
    residences.forEach((r)=>{ if (r.typeBati){ const k=String(r.typeBati).trim(); t[k]=(t[k]||0)+(r.nbLgt||0); } });
    return t;
  }, [residences]);
  const hasTypeBati = Object.keys(typeBatiTotals).length>0;
  const typeBatiColor = (k)=>{ const n=ceNorm(k); if (n==='individuel') return '#58D88B'; if (n==='collectif') return '#264E46'; return PALETTE[Object.keys(typeBatiTotals).indexOf(k)%PALETTE.length]; };

  const chauffageTotals = useMemo(()=>{
    const t = {};
    residences.forEach((r)=>{ if (r.modeChauffage){ const k=String(r.modeChauffage).trim(); t[k]=(t[k]||0)+(r.nbLgt||0); } });
    return t;
  }, [residences]);
  const ecsTotals = useMemo(()=>{
    const t = {};
    residences.forEach((r)=>{ if (r.modeECS){ const k=String(r.modeECS).trim(); t[k]=(t[k]||0)+(r.nbLgt||0); } });
    return t;
  }, [residences]);

  // Colonne présente mais entièrement vide sur certains fichiers (ex. Aubervilliers) : on masque
  // le graphique dans ce cas plutôt que d'afficher un anneau vide, pas seulement si absente.
  const financementTotals = useMemo(()=>{
    const t = {};
    residences.forEach((r)=>{ if (r.financement){ const k=String(r.financement).trim(); t[k]=(t[k]||0)+(r.nbLgt||0); } });
    return t;
  }, [residences]);
  const hasFinancement = Object.keys(financementTotals).length>0;

  return (
    <div style={{padding:24,display:'flex',flexDirection:'column',gap:20}}>
      <div style={{display:'flex',gap:16,flexWrap:'wrap'}}>
        <KpiCard label="Logements" value={fmtNum(totalLgt)} />
        <KpiCard label="Résidences" value={fmtNum(residences.length)} />
        <KpiCard label="Communes" value={fmtNum(communesCount)} active={kpiPanel && kpiPanel.key==='communes'}
          onClick={()=>toggleKpiPanel('communes', {
            title: communesAgg.length+' commune'+(communesAgg.length>1?'s':''),
            rows: communesAgg,
            renderRow: (c)=>(
              <div style={{display:'flex',justifyContent:'space-between',gap:8,fontSize:'.76rem',color:'var(--ce-vert-fonce)',padding:'3px 0',borderBottom:'1px solid #f0f5f3'}}>
                <span>{c.commune}</span>
                <span style={{color:'#9fb3ae',flexShrink:0}}>{c.nbRes} résidence{c.nbRes>1?'s':''} — {fmtNum(c.nbLgt)} lgt</span>
              </div>
            ),
          })} />
        <KpiCard label="Budget investissements (import)" value={fmtKEur(totalInvest)} sub={operations.length+" opérations importées"} active={kpiPanel && kpiPanel.key==='budget'}
          onClick={()=>toggleKpiPanel('budget', {
            title: operations.length+' opération'+(operations.length>1?'s':''),
            rows: operations,
            renderRow: (o)=>{
              const r = resByCode[o.resCode];
              return (
                <div onClick={()=>r && onSelectResidence && onSelectResidence(r)} style={{display:'flex',justifyContent:'space-between',gap:8,fontSize:'.76rem',color:'var(--ce-vert-fonce)',padding:'3px 0',borderBottom:'1px solid #f0f5f3',cursor:(r&&onSelectResidence)?'pointer':'default'}}>
                  <span>{(r&&r.nom)||o.resCode||'—'}</span>
                  <span style={{color:'#9fb3ae',flexShrink:0}}>{o.nature||o.type||'Non renseigné'} · {o.annee||'année n.c.'} · {fmtEur(o.montant)}</span>
                </div>
              );
            },
          })} />
        {hasQpv && <KpiCard label="Logements en QPV" value={fmtNum(qpvLgt)} sub={totalLgt>0? ((qpvLgt/totalLgt)*100).toFixed(0)+"% du parc":null} active={kpiPanel && kpiPanel.key==='qpv'}
          onClick={()=>{
            const rows = residences.filter((r)=>isQpvValue(r.qpv));
            toggleKpiPanel('qpv', {
              title: rows.length+' résidence'+(rows.length>1?'s':'')+' en QPV',
              rows,
              renderRow: (r)=>(
                <div onClick={()=>onSelectResidence && onSelectResidence(r)} style={{display:'flex',justifyContent:'space-between',gap:8,fontSize:'.76rem',color:'var(--ce-vert-fonce)',padding:'3px 0',borderBottom:'1px solid #f0f5f3',cursor:onSelectResidence?'pointer':'default'}}>
                  <span>{r.nom || r.code}</span>
                  <span style={{color:'#9fb3ae',flexShrink:0}}>{fmtNum(r.nbLgt)} lgt — 100% en QPV</span>
                </div>
              ),
            });
          }} />}
        {hasConventionne && <KpiCard label="Logements conventionnés" value={fmtNum(conventionneLgt)} active={kpiPanel && kpiPanel.key==='conventionne'}
          onClick={()=>{
            const rows = residences.filter((r)=>(r.dontConventionne||0)>0);
            toggleKpiPanel('conventionne', {
              title: rows.length+' résidence'+(rows.length>1?'s':'')+' avec logements conventionnés',
              rows,
              renderRow: (r)=>{
                const n = r.dontConventionne||0;
                const pct = r.nbLgt>0 ? Math.round(n/r.nbLgt*100) : null;
                return (
                  <div onClick={()=>onSelectResidence && onSelectResidence(r)} style={{display:'flex',justifyContent:'space-between',gap:8,fontSize:'.76rem',color:'var(--ce-vert-fonce)',padding:'3px 0',borderBottom:'1px solid #f0f5f3',cursor:onSelectResidence?'pointer':'default'}}>
                    <span>{r.nom || r.code}</span>
                    <span style={{color:'#9fb3ae',flexShrink:0}}>{fmtNum(n)} lgt conventionnés{pct!==null?' ('+pct+'% de la résidence)':''}</span>
                  </div>
                );
              },
            });
          }} />}
        {hasFoyer && <KpiCard label="Logements en foyer / résidence sociale" value={fmtNum(foyerLgt)} active={kpiPanel && kpiPanel.key==='foyer'}
          onClick={()=>{
            const rows = residences.filter((r)=>(r.dontFoyer||0)>0);
            toggleKpiPanel('foyer', {
              title: rows.length+' résidence'+(rows.length>1?'s':'')+' en foyer / résidence sociale',
              rows,
              renderRow: (r)=>{
                const n = r.dontFoyer||0;
                const pct = r.nbLgt>0 ? Math.round(n/r.nbLgt*100) : null;
                return (
                  <div onClick={()=>onSelectResidence && onSelectResidence(r)} style={{display:'flex',justifyContent:'space-between',gap:8,fontSize:'.76rem',color:'var(--ce-vert-fonce)',padding:'3px 0',borderBottom:'1px solid #f0f5f3',cursor:onSelectResidence?'pointer':'default'}}>
                    <span>{r.nom || r.code}</span>
                    <span style={{color:'#9fb3ae',flexShrink:0}}>{fmtNum(n)} lgt en foyer{pct!==null?' ('+pct+'% de la résidence)':''}</span>
                  </div>
                );
              },
            });
          }} />}
      </div>
      {kpiPanel && <ResidenceListPanel title={kpiPanel.title} rows={kpiPanel.rows} renderRow={kpiPanel.renderRow} onClose={()=>setKpiPanel(null)} />}

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
        {topCommunes.length>0 && (
          <div className="ce-card">
            <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700,marginBottom:12}}>Top 5 communes (logements)</h2>
            <ChartCanvas type="bar" height={220} data={{
              labels: topCommunes.map((c)=>c[0]),
              datasets:[{label:'Logements', data:topCommunes.map((c)=>c[1]), backgroundColor:'#009261', borderRadius:4}]
            }} options={{indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{beginAtZero:true}}, onClick:(evt,elements)=>{
              if (!elements.length) return;
              const commune = topCommunes[elements[0].index][0];
              const rows = residences.filter((r)=>r.commune===commune);
              toggleChartPanel('communes', commune, {title:'Résidences de '+commune+' ('+rows.length+')', rows, renderRow:simpleResRow});
            }}} />
            {chartPanel && chartPanel.chart==='communes' && <ResidenceListPanel title={chartPanel.title} rows={chartPanel.rows} renderRow={chartPanel.renderRow} onClose={()=>setChartPanel(null)} maxHeight={240} />}
          </div>
        )}
        {topSecteurs.length>0 && (
          <div className="ce-card">
            <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700,marginBottom:12}}>Top 5 secteurs / agences (logements)</h2>
            <ChartCanvas type="bar" height={220} data={{
              labels: topSecteurs.map((c)=>c[0]),
              datasets:[{label:'Logements', data:topSecteurs.map((c)=>c[1]), backgroundColor:'#FF8364', borderRadius:4}]
            }} options={{indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{beginAtZero:true}}, onClick:(evt,elements)=>{
              if (!elements.length) return;
              const secteur = topSecteurs[elements[0].index][0];
              const rows = residences.filter((r)=>(r.secteur||r.agence)===secteur);
              toggleChartPanel('secteurs', secteur, {title:'Résidences de '+secteur+' ('+rows.length+')', rows, renderRow:simpleResRow});
            }}} />
            {chartPanel && chartPanel.chart==='secteurs' && <ResidenceListPanel title={chartPanel.title} rows={chartPanel.rows} renderRow={chartPanel.renderRow} onClose={()=>setChartPanel(null)} maxHeight={240} />}
          </div>
        )}
        {hasTypo && (
          <div className="ce-card">
            <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700,marginBottom:12}}>Répartition par typologie</h2>
            <ChartCanvas type="doughnut" height={220} data={{
              labels: Object.keys(typoTotals), datasets:[{data:Object.values(typoTotals), backgroundColor:PALETTE}]
            }} options={{onClick:(evt,elements)=>{
              if (!elements.length) return;
              const typo = Object.keys(typoTotals)[elements[0].index];
              const getCount = (r)=>r[typo]||0;
              const rows = residences.filter((r)=>getCount(r)>0);
              toggleChartPanel('typologie', typo, {title:'Résidences avec des logements '+typo+' ('+rows.length+')', rows, renderRow:ensembleFractionRow(onSelectResidence, getCount, typo)});
            }}} />
            {chartPanel && chartPanel.chart==='typologie' && <ResidenceListPanel title={chartPanel.title} rows={chartPanel.rows} renderRow={chartPanel.renderRow} onClose={()=>setChartPanel(null)} maxHeight={240} />}
          </div>
        )}
        {hasDpeDist && (
          <div className="ce-card">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,flexWrap:'wrap',gap:8}}>
              <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700}}>Répartition DPE {dpeTypeLabel} (logements)</h2>
              <div style={{display:'flex',gap:6}}>
                {hasDpePrincipal && <button className={dpeType==='principal'?'ce-btn ce-btn-sm':'ce-btn-outline ce-btn-sm'} onClick={()=>{setDpeType('principal'); setChartPanel(null);}}>Principal</button>}
                <button className={dpeType==='energie'?'ce-btn ce-btn-sm':'ce-btn-outline ce-btn-sm'} onClick={()=>{setDpeType('energie'); setChartPanel(null);}}>Énergie</button>
                <button className={dpeType==='ges'?'ce-btn ce-btn-sm':'ce-btn-outline ce-btn-sm'} onClick={()=>{setDpeType('ges'); setChartPanel(null);}}>GES</button>
              </div>
            </div>
            <ChartCanvas type="doughnut" height={220} data={{
              labels: dpeLabels,
              datasets:[{data:dpeLabels.map(k=>dpeTotals[k]), backgroundColor:dpeLabels.map(k=>DPE_COLORS[k])}]
            }} options={{onClick:(evt,elements)=>{
              if (!elements.length) return;
              const cl = dpeLabels[elements[0].index];
              const getCount = dpeCountFor(cl);
              const rows = residences.filter((r)=>getCount(r)>0);
              toggleChartPanel('dpe', dpeType+'|'+cl, {title:'Résidences avec des logements en classe '+cl+' ('+rows.length+')', rows, renderRow:ensembleFractionRow(onSelectResidence, getCount, 'classe '+cl)});
            }}} />
            {chartPanel && chartPanel.chart==='dpe' && <ResidenceListPanel title={chartPanel.title} rows={chartPanel.rows} renderRow={chartPanel.renderRow} onClose={()=>setChartPanel(null)} maxHeight={240} />}
          </div>
        )}
        {hasDecennie && (
          <div className="ce-card">
            <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700,marginBottom:12}}>Logements mis en service par décennie</h2>
            <ChartCanvas type="bar" height={220} data={{
              labels: decennieData.map((d)=>d.bucket),
              datasets:[{label:'Logements', data: decennieData.map((d)=>d.total), backgroundColor:'#009261', borderRadius:4}]
            }} options={{plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}}, onClick:(evt,elements)=>{
              if (!elements.length) return;
              const bucket = decennieData[elements[0].index].bucket;
              const rows = residences.filter((r)=>r.anneeConstruction && decennieBucket(r.anneeConstruction)===bucket);
              toggleChartPanel('decennie', bucket, {title:'Résidences construites '+bucket+' ('+rows.length+')', rows, renderRow:simpleResRow});
            }}} />
            {chartPanel && chartPanel.chart==='decennie' && <ResidenceListPanel title={chartPanel.title} rows={chartPanel.rows} renderRow={chartPanel.renderRow} onClose={()=>setChartPanel(null)} maxHeight={240} />}
          </div>
        )}
        {allAgences.length>0 && (
          <div className="ce-card">
            <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700,marginBottom:12}}>Répartition par agence (logements)</h2>
            <ChartCanvas type="bar" height={Math.max(220, allAgences.length*26)} data={{
              labels: allAgences.map((c)=>c[0]),
              datasets:[{label:'Logements', data: allAgences.map((c)=>c[1]), backgroundColor:'#264E46', borderRadius:4}]
            }} options={{indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{beginAtZero:true}}, onClick:(evt,elements)=>{
              if (!elements.length) return;
              const agence = allAgences[elements[0].index][0];
              const rows = residences.filter((r)=>r.agence===agence);
              toggleChartPanel('agence', agence, {title:'Résidences de l\'agence '+agence+' ('+rows.length+')', rows, renderRow:simpleResRow});
            }}} />
            {chartPanel && chartPanel.chart==='agence' && <ResidenceListPanel title={chartPanel.title} rows={chartPanel.rows} renderRow={chartPanel.renderRow} onClose={()=>setChartPanel(null)} maxHeight={240} />}
          </div>
        )}
        {hasTypeBati && (
          <div className="ce-card">
            <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700,marginBottom:12}}>Répartition individuel / collectif</h2>
            <ChartCanvas type="doughnut" height={220} data={{
              labels: Object.keys(typeBatiTotals),
              datasets:[{data:Object.values(typeBatiTotals), backgroundColor: Object.keys(typeBatiTotals).map((k)=>typeBatiColor(k))}]
            }} options={{onClick:(evt,elements)=>{
              if (!elements.length) return;
              const value = Object.keys(typeBatiTotals)[elements[0].index];
              const rows = residences.filter((r)=>r.typeBati && String(r.typeBati).trim()===value);
              toggleChartPanel('typeBati', value, {title:'Résidences « '+value+' » ('+rows.length+')', rows, renderRow:ensemblePctResRow(onSelectResidence, value)});
            }}} />
            {chartPanel && chartPanel.chart==='typeBati' && <ResidenceListPanel title={chartPanel.title} rows={chartPanel.rows} renderRow={chartPanel.renderRow} onClose={()=>setChartPanel(null)} maxHeight={240} />}
          </div>
        )}
        {Object.keys(chauffageTotals).length>0 && (()=>{
          const chauffageClickOptions = {onClick:(evt,elements)=>{
            if (!elements.length) return;
            const mode = Object.keys(chauffageTotals)[elements[0].index];
            const rows = residences.filter((r)=>r.modeChauffage && String(r.modeChauffage).trim()===mode);
            toggleChartPanel('chauffage', mode, {title:'Résidences en chauffage « '+mode+' » ('+rows.length+')', rows, renderRow:ensemblePctResRow(onSelectResidence, mode)});
          }};
          return (
            <div className="ce-card">
              <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700,marginBottom:12}}>Mode de chauffage (logements)</h2>
              {Object.keys(chauffageTotals).length>6 ? (
                <ChartCanvas type="bar" height={Math.max(220, Object.keys(chauffageTotals).length*26)} data={{
                  labels: Object.keys(chauffageTotals), datasets:[{data:Object.values(chauffageTotals), backgroundColor:'#FF8364', borderRadius:4}]
                }} options={Object.assign({indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{beginAtZero:true}}}, chauffageClickOptions)} />
              ) : (
                <ChartCanvas type="doughnut" height={220} data={{
                  labels: Object.keys(chauffageTotals), datasets:[{data:Object.values(chauffageTotals), backgroundColor: Object.keys(chauffageTotals).map((_,i)=>PALETTE[i%PALETTE.length])}]
                }} options={chauffageClickOptions} />
              )}
              {chartPanel && chartPanel.chart==='chauffage' && <ResidenceListPanel title={chartPanel.title} rows={chartPanel.rows} renderRow={chartPanel.renderRow} onClose={()=>setChartPanel(null)} maxHeight={240} />}
            </div>
          );
        })()}
        {Object.keys(ecsTotals).length>0 && (()=>{
          const ecsClickOptions = {onClick:(evt,elements)=>{
            if (!elements.length) return;
            const mode = Object.keys(ecsTotals)[elements[0].index];
            const rows = residences.filter((r)=>r.modeECS && String(r.modeECS).trim()===mode);
            toggleChartPanel('ecs', mode, {title:'Résidences en ECS « '+mode+' » ('+rows.length+')', rows, renderRow:ensemblePctResRow(onSelectResidence, mode)});
          }};
          return (
            <div className="ce-card">
              <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700,marginBottom:12}}>Mode de production ECS (logements)</h2>
              {Object.keys(ecsTotals).length>6 ? (
                <ChartCanvas type="bar" height={Math.max(220, Object.keys(ecsTotals).length*26)} data={{
                  labels: Object.keys(ecsTotals), datasets:[{data:Object.values(ecsTotals), backgroundColor:'#FF8364', borderRadius:4}]
                }} options={Object.assign({indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{beginAtZero:true}}}, ecsClickOptions)} />
              ) : (
                <ChartCanvas type="doughnut" height={220} data={{
                  labels: Object.keys(ecsTotals), datasets:[{data:Object.values(ecsTotals), backgroundColor: Object.keys(ecsTotals).map((_,i)=>PALETTE[i%PALETTE.length])}]
                }} options={ecsClickOptions} />
              )}
              {chartPanel && chartPanel.chart==='ecs' && <ResidenceListPanel title={chartPanel.title} rows={chartPanel.rows} renderRow={chartPanel.renderRow} onClose={()=>setChartPanel(null)} maxHeight={240} />}
            </div>
          );
        })()}
        {hasFinancement && (
          <div className="ce-card">
            <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700,marginBottom:12}}>Répartition par financement (logements)</h2>
            <ChartCanvas type="doughnut" height={220} data={{
              labels: Object.keys(financementTotals),
              datasets:[{data:Object.values(financementTotals), backgroundColor: Object.keys(financementTotals).map((_,i)=>PALETTE[i%PALETTE.length])}]
            }} options={{onClick:(evt,elements)=>{
              if (!elements.length) return;
              const value = Object.keys(financementTotals)[elements[0].index];
              const rows = residences.filter((r)=>r.financement && String(r.financement).trim()===value);
              toggleChartPanel('financement', value, {title:'Résidences « '+value+' » ('+rows.length+')', rows, renderRow:ensemblePctResRow(onSelectResidence, value)});
            }}} />
            {chartPanel && chartPanel.chart==='financement' && <ResidenceListPanel title={chartPanel.title} rows={chartPanel.rows} renderRow={chartPanel.renderRow} onClose={()=>setChartPanel(null)} maxHeight={240} />}
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------------- Panneau de liste de résidences au clic (segmentation, impact, pivot) ---------------- */
// Composant partagé par les 3 panneaux "en ligne" ouverts au clic sur une cellule/famille/barre
// (jamais un tiroir latéral ni une modale) : Segmentation en 9 familles, Impact des actions
// stratégiques, drill-down du pivot. `title`/`headerActions`/`onClose` sont optionnels : sans eux,
// aucun en-tête n'est rendu (cas des blocs "Parc à traiter"/"Résidences non projetées" de l'Impact,
// qui listent directement leurs résidences sans titre ni bouton propres).
function ResidenceListPanel({title, headerActions, rows, renderRow, onClose, maxHeight, marginTop, children}){
  return (
    <div style={{border:'1px solid #eef4f2',borderRadius:8,padding:'10px 14px',maxHeight:maxHeight||280,overflowY:'auto',marginTop:marginTop!==undefined?marginTop:12}}>
      {(title || headerActions || onClose) && (
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:8,marginBottom:8}}>
          <div style={{fontSize:'.78rem',fontWeight:700,color:'var(--ce-vert-tres-fonce)'}}>{title}</div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            {headerActions}
            {onClose && <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',color:'var(--ce-vert-fonce)',fontSize:'.9rem'}}>×</button>}
          </div>
        </div>
      )}
      {children}
      {rows.length===0 && <div style={{fontSize:'.76rem',color:'#9fb3ae'}}>Aucun élément.</div>}
      {rows.slice(0,200).map((row,i)=><React.Fragment key={i}>{renderRow(row)}</React.Fragment>)}
      {rows.length>200 && <div style={{fontSize:'.7rem',color:'#9fb3ae',marginTop:6}}>… et {rows.length-200} de plus (affinez les filtres transverses).</div>}
    </div>
  );
}

/* ---------------- Base de cotation ---------------- */
function SortableTable({columns, rows, onRowClick, pageSize, dense}){
  const [sortCol, setSortCol] = useState(null);
  const [sortDir, setSortDir] = useState(1);
  const [page, setPage] = useState(0);
  const size = pageSize || 20;

  const sorted = useMemo(()=>{
    if (!sortCol) return rows;
    const copy = rows.slice();
    copy.sort((a,b)=>{
      const va=a[sortCol], vb=b[sortCol];
      if (va===null||va===undefined) return 1; if (vb===null||vb===undefined) return -1;
      if (typeof va==='number' && typeof vb==='number') return (va-vb)*sortDir;
      return String(va).localeCompare(String(vb),'fr')*sortDir;
    });
    return copy;
  }, [rows, sortCol, sortDir]);

  useEffect(()=>{ setPage(0); }, [rows.length, sortCol, sortDir]);
  const pageCount = Math.max(1, Math.ceil(sorted.length/size));
  const pageRows = sorted.slice(page*size, page*size+size);

  function toggleSort(key){ if (sortCol===key) setSortDir(sortDir*-1); else { setSortCol(key); setSortDir(1); } }

  return (
    <div>
      <div style={{overflowX:'auto',maxHeight:480,overflowY:'auto',border:'1px solid #eef4f2',borderRadius:8}}>
        <table className={"ce-table"+(dense?" ce-table-dense":"")}>
          <thead><tr>{columns.map((c)=>(
            <th key={c.key} onClick={()=>toggleSort(c.key)}>{c.label}{sortCol===c.key? (sortDir>0?' ▲':' ▼'):''}</th>
          ))}</tr></thead>
          <tbody>
            {pageRows.map((row,i)=>(
              <tr key={i} onClick={()=>onRowClick && onRowClick(row)}>
                {columns.map((c)=><td key={c.key}>{c.render? c.render(row): (row[c.key]??'—')}</td>)}
              </tr>
            ))}
            {pageRows.length===0 && <tr><td colSpan={columns.length} style={{textAlign:'center',color:'#9fb3ae',padding:20}}>Aucun résultat pour ces filtres.</td></tr>}
          </tbody>
        </table>
      </div>
      {pageCount>1 && (
        <div style={{display:'flex',gap:8,alignItems:'center',justifyContent:'flex-end',marginTop:10,fontSize:'.75rem',color:'var(--ce-vert-fonce)'}}>
          <button className="ce-btn-outline ce-btn-sm" disabled={page===0} onClick={()=>setPage(page-1)}>◀</button>
          <span>Page {page+1} / {pageCount}</span>
          <button className="ce-btn-outline ce-btn-sm" disabled={page>=pageCount-1} onClick={()=>setPage(page+1)}>▶</button>
        </div>
      )}
    </div>
  );
}

/* ---------------- Segmentation en 9 familles (grille 3x3) ---------------- */
function critValue(r, key){
  if (key==='attractivite') return r.attractivite;
  if (key==='technique') return r.technique;
  if (key==='dpeGlobal') return null; // classé directement via dpeGlobalBand, pas de valeur numérique brute
  return (r.notes && r.notes[key]!==undefined) ? r.notes[key] : null;
}
const SEG_BANDS = ['Très bon','Bon','Mauvais'];
function bandOf(pct){
  if (pct===null||pct===undefined||isNaN(pct)) return null;
  if (pct>=70) return 'Très bon';
  if (pct>=50) return 'Bon';
  return 'Mauvais';
}
// DPE Global ne peut pas suivre bandOf(pct) (seuils relatifs au max observé dans le fichier) : ses
// seuils sont absolus (présence de logements E/F/G, part de logements A/B/C) et propres au DPE — cf.
// dpeGlobalBand(). On généralise donc ici le système de bandes : chaque critère fournit ses propres
// libellés de bandes (meilleur -> pire, même convention que SEG_BANDS) et sa propre fonction de
// classement, sans changer le comportement d'Attractivité/État technique/notes (toujours pct-du-max).
const DPE_GLOBAL_BANDS = DPE_PERF_ORDER.slice().reverse(); // ['Performant +','Performant ±','Performant -']
function bandsForCriterion(key){
  return key==='dpeGlobal' ? DPE_GLOBAL_BANDS : SEG_BANDS;
}
function classifierForCriterion(residences, key){
  if (key==='dpeGlobal') return (r)=>dpeGlobalBand(r);
  const vals = residences.map((r)=>critValue(r,key)).filter((v)=>v!==null&&v!==undefined&&!isNaN(v)&&v>0);
  const max = vals.length? Math.max(...vals) : null;
  return (r)=>{
    const v = critValue(r,key);
    if (v===null||v===undefined||isNaN(v)||!max||max<=0) return null;
    return bandOf(v/max*100);
  };
}
// Compteurs Réhab / RC / Démolition / Vente affichés en permanence dans chaque cellule, quel que
// soit le croisement de critères choisi — mêmes familles que la trajectoire d'investissement
// (§7.1), toujours en nombre de logements même quand "Taille des familles" est sur "résidences".
// Logements d'une famille de travaux dans un jeu d'opérations, avec repli sur nbLgt de la résidence
// pour les démolitions ne renseignant pas "Logements concernés" (même règle dans les deux usages) —
// extraite ici pour être réutilisée à la fois par cellCounters (une seule famille de résidences) et
// countByFamily (comparaison Base/Actuel sur l'ensemble du parc, cf. bandeaux §4.2/§5.2).
function sumLogementsForFamily(ops, fam, resByCode){
  return ops.filter((o)=>familyOfType(o.type)===fam).reduce((s,o)=>{
    let n = o.logements;
    if ((n===null || n===undefined) && fam==='Démolition'){ const r=resByCode[o.resCode]; n = r? r.nbLgt : 0; }
    return s+(n||0);
  }, 0);
}
function cellCounters(members, operations, includeIdentifiees){
  const resByCode = {}; members.forEach((r)=>{ resByCode[r.code]=r; });
  const resCodes = new Set(members.map((r)=>r.code));
  const ops = operations.filter((o)=> resCodes.has(o.resCode) && (includeIdentifiees || o.statut!=='identifie'));
  return {
    rehab: sumLogementsForFamily(ops, 'Réhabilitation', resByCode),
    rc: sumLogementsForFamily(ops, 'Remplacement de composants', resByCode),
    demolition: sumLogementsForFamily(ops, 'Démolition', resByCode),
    vente: members.reduce((s,r)=>s+(r.nbLgtMiseVente||0),0),
  };
}
// Compteurs "prévu (Base) / réalisé (Actuel) / taux de réalisation" par famille de travaux — bandeaux
// §4.2 (Impact des actions stratégiques) et §5.2 (Investissements & Entretien du parc), qui réutilisent
// tous deux cette même fonction plutôt que de recompter indépendamment (cf. plan approuvé).
function countByFamily(baseOps, actuelOps, baseResidences, actuelResidences, families){
  // Deux rosters distincts (Base et Actuel), pas un seul : le repli "logements" des démolitions sans
  // valeur saisie (cf. sumLogementsForFamily, juste au-dessus) lit r.nbLgt sur le roster correspondant
  // à CHAQUE jeu d'opérations — mélanger les deux sous un seul roster (ex. toujours l'Actuel) sous-
  // évalue silencieusement le "prévu (Base)" dès qu'une résidence a été démolie/modifiée entre les deux.
  const resByCodeBase = {}; (baseResidences||[]).forEach((r)=>{ resByCodeBase[r.code]=r; });
  const resByCodeActuel = {}; (actuelResidences||[]).forEach((r)=>{ resByCodeActuel[r.code]=r; });
  const fams = families || ['Réhabilitation','Remplacement de composants','Démolition'];
  const out = {};
  fams.forEach((fam)=>{
    const prevu = sumLogementsForFamily(baseOps||[], fam, resByCodeBase);
    const realise = sumLogementsForFamily(actuelOps||[], fam, resByCodeActuel);
    out[fam] = { prevu, realise, tauxPct: prevu>0 ? Math.round(realise/prevu*100) : null };
  });
  return out;
}
// Vente et Offre nouvelle ne viennent pas des opérations classiques de la Base de cotation (cf. §4.2
// de la spec) : Vente vient de nbLgtMiseVente (colonne dédiée, snapshot par résidence, pas de notion
// d'année), Offre nouvelle de la simulation manuelle année par année (offreNouvelleLgt). Comptage
// séparé de countByFamily, mais affiché dans le même bandeau (ImpactCountersRow) pour la lisibilité.
function countVenteOffreNouvelle(baseResidences, actuelResidences, baseOffreNouvelleLgt, actuelOffreNouvelleLgt, cutoffActuel){
  const sumVente = (residences)=> (residences||[]).reduce((s,r)=>s+(r.nbLgtMiseVente||0),0);
  const sumOffre = (map, uptoYear)=> Object.keys(map||{}).reduce((s,y)=> (uptoYear==null || Number(y)<=uptoYear) ? s+(Number(map[y])||0) : s, 0);
  const ventePrevu = sumVente(baseResidences), venteRealise = sumVente(actuelResidences);
  const offrePrevu = sumOffre(baseOffreNouvelleLgt, null), offreRealise = sumOffre(actuelOffreNouvelleLgt, cutoffActuel);
  return {
    'Vente': { prevu: ventePrevu, realise: venteRealise, tauxPct: ventePrevu>0? Math.round(venteRealise/ventePrevu*100) : null },
    'Offre nouvelle': { prevu: offrePrevu, realise: offreRealise, tauxPct: offrePrevu>0? Math.round(offreRealise/offrePrevu*100) : null },
  };
}
const IMPACT_COUNTER_META = {
  'Réhabilitation': { short:'Réhab.', prevuWord:'prévues', realiseWord:'réalisées' },
  'Remplacement de composants': { short:'RC', prevuWord:'prévus', realiseWord:'réalisés' },
  'Démolition': { short:'Démol.', prevuWord:'prévues', realiseWord:'réalisées' },
  'Vente': { short:'Vente', prevuWord:'prévues', realiseWord:'réalisées' },
  'Offre nouvelle': { short:'Dévelop.', prevuWord:'prévus', realiseWord:'réalisés' },
};
const IMPACT_COUNTER_ORDER = ['Réhabilitation','Remplacement de composants','Démolition','Vente','Offre nouvelle'];
// Bandeau compact de compteurs "prévu (Base) / réalisé (Actuel) / taux" par catégorie — §4.2 (Impact
// des actions stratégiques, Réhab/RC/Démol/Vente/Offre nouvelle) et §5.2 (Investissements & Entretien
// du parc, Réhab/RC/Démol + "reste à faire"). Composant unique réutilisé aux deux emplacements plutôt
// que deux rendus dupliqués ; n'apparaît que pour les catégories présentes dans `counters` (une vue
// peut ne transmettre qu'un sous-ensemble des clés).
function ImpactCountersRow({counters}){
  const keys = IMPACT_COUNTER_ORDER.filter((k)=>counters[k]);
  if (!keys.length) return null;
  return (
    <div style={{display:'flex',gap:8,overflowX:'auto',paddingBottom:4,marginBottom:14}}>
      {keys.map((k)=>{
        const c = counters[k], meta = IMPACT_COUNTER_META[k];
        return (
          <div key={k} style={{display:'flex',alignItems:'center',gap:6,padding:'6px 12px',borderRadius:20,background:'#f5f8f7',fontSize:'.74rem',color:'var(--ce-vert-tres-fonce)',whiteSpace:'nowrap',flexShrink:0}}>
            <b>{meta.short}</b>
            <span style={{color:'var(--ce-vert-fonce)'}}>
              {fmtNum(c.prevu)} {meta.prevuWord} · {fmtNum(c.realise)} {meta.realiseWord}
              {c.tauxPct!==null && <React.Fragment> · <b style={{color:'var(--ce-corail)'}}>{c.tauxPct}%</b></React.Fragment>}
              {c.restant!==undefined && <React.Fragment> · reste à faire {fmtNum(c.restant)}{c.restantPct!==null? ' ('+c.restantPct+'%)':''}</React.Fragment>}
            </span>
          </div>
        );
      })}
    </div>
  );
}
// Travaux prévus sur une résidence donnée, résumés en libellés courts (Démol./Réhab./RC/Vente) pour
// affichage dans une liste de résidences — même catégorisation que cellCounters ci-dessus, mais au
// niveau d'une seule résidence plutôt qu'agrégée sur une famille entière.
function residenceTravauxLabels(r, operations, includeIdentifiees){
  const ops = operations.filter((o)=> o.resCode===r.code && (includeIdentifiees || o.statut!=='identifie'));
  const fams = new Set(ops.map((o)=>familyOfType(o.type)));
  const labels = [];
  if (fams.has('Démolition')) labels.push('Démol.');
  if (fams.has('Réhabilitation')) labels.push('Réhab.');
  if (fams.has('Remplacement de composants')) labels.push('RC');
  if (r.nbLgtMiseVente>0) labels.push('Vente');
  return labels;
}

// Projette les résidences à une année donnée : État technique (computeTechniqueProjection) et
// distributions DPE (computeTrajectoryByResidence) recalculés à cette échéance, tous les autres
// champs (attractivité, notes, nbLgt...) laissés tels quels (non affectés par le temps). Les
// résidences démolies avant l'année choisie sont exclues. Réutilisée telle quelle par la Segmentation
// en 9 familles (sélecteur d'année) — jamais recalculée indépendamment des fonctions de projection
// déjà utilisées ailleurs dans l'outil (Impact des actions stratégiques, ViewCotation).
function projectResidencesToYear(residences, operations, gainsGrid, year, includeIdentifiees){
  const opsUntil = filterOpsUntil(operations, year);
  const trajE = computeTrajectoryByResidence(residences, operations, gainsGrid||{}, year, 'energie', includeIdentifiees);
  const trajG = computeTrajectoryByResidence(residences, operations, gainsGrid||{}, year, 'ges', includeIdentifiees);
  return residences.filter((r)=> trajE.alive[r.code]!==false && trajG.alive[r.code]!==false).map((r)=>{
    const techProj = computeTechniqueProjection(r, opsUntil, includeIdentifiees);
    return Object.assign({}, r, {
      technique: techProj ? techProj.technique : r.technique,
      distEnergie: trajE.state[r.code] || r.distEnergie,
      distGES: trajG.state[r.code] || r.distGES,
    });
  });
}
// Dernière année (<= year) à laquelle une réhabilitation a été simulée sur cette résidence, ou null
// si aucune — utilisé pour marquer visuellement les réhabs déjà "réalisées" dans la grille par année.
// Par famille de travaux (Réhab./RC/Démol. — Vente exclue, ce n'est pas une opération datée), dernière
// année (<= year) à laquelle une action de cette famille a déjà été simulée sur cette résidence. Une
// résidence peut avoir plusieurs travaux prévus (ex. Réhab. + RC) dont un seul déjà réalisé : le
// marquage doit donc préciser LAQUELLE, pas juste "réalisé" au global.
const REALIZED_FAMILY_SHORT = { 'Réhabilitation':'Réhab.', 'Remplacement de composants':'RC', 'Démolition':'Démol.' };
// Constante de module (pas un Hook) : Object.values(REALIZED_FAMILY_SHORT) ne change jamais, inutile
// de la recalculer par un useMemo à l'intérieur d'un composant — et surtout, un useMemo placé après un
// retour conditionnel (cf. ImpactActionsStrategiques) viole la règle des Hooks et fait planter React.
const REALIZABLE_LABELS = new Set(Object.values(REALIZED_FAMILY_SHORT));
function realizedFamiliesForYear(r, operations, year, includeIdentifiees){
  const result = {};
  Object.keys(REALIZED_FAMILY_SHORT).forEach((fam)=>{
    const years = operations
      .filter((o)=> o.resCode===r.code && familyOfType(o.type)===fam && o.annee!=null && o.annee<=year && (includeIdentifiees || o.statut==='programme'))
      .map((o)=>o.annee);
    if (years.length) result[REALIZED_FAMILY_SHORT[fam]] = Math.max(...years);
  });
  return result;
}

function SegmentationGrid({residences, operations, gainsGrid, includeIdentifiees, baseImport, onSelectResidence}){
  const criteria = useMemo(()=>{
    const list = [
      {key:'attractivite', label:'Attractivité'},
      {key:'technique', label:'État technique'},
    ];
    const noteKeys = new Set();
    residences.forEach((r)=>{ if (r.notes) Object.keys(r.notes).forEach((k)=>{ if (r.notes[k]!==null && r.notes[k]!==undefined) noteKeys.add(k); }); });
    Array.from(noteKeys).sort((a,b)=>a.localeCompare(b,'fr')).forEach((k)=>list.push({key:k, label:k}));
    list.push({key:'dpeGlobal', label:'DPE Global'});
    return list;
  }, [residences]);

  const [xKey, setXKey] = useState('attractivite');
  const [yKey, setYKey] = useState('technique');
  const [sizeBy, setSizeBy] = useState('nbLgt');
  const [pinned, setPinned] = useState(null);
  const [showDpeBreakdown, setShowDpeBreakdown] = useState(false);

  const cutoffActuel = useMemo(()=>anneeCoupureActuel(), []);
  const trajectoryYears = useMemo(()=>computeYearsRange(operations), [operations]);
  const [year, setYear] = useState(null);
  useEffect(()=>{
    if (!trajectoryYears.length || trajectoryYears.includes(year)) return;
    // cutoffActuel (année-1 tant qu'on est avant novembre) peut tomber avant la première année de
    // trajectoryYears — computeYearsRange plafonne toujours sa borne basse à 2026 au minimum. Sans ce
    // clamp, `year` serait mis à une valeur absente des <option> du sélecteur (aucune sélection visible
    // alors que la grille est bien calculée sur cette année hors plage, silencieusement incohérente).
    const clamped = Math.max(trajectoryYears[0], Math.min(cutoffActuel, trajectoryYears[trajectoryYears.length-1]));
    setYear(clamped);
  }, [trajectoryYears]);

  // Badge Base/Actuel/Cible : comparaison directe de l'année sélectionnée aux 3 repères de la spec.
  const baseYear = (baseImport && baseImport.dateCreation) ? new Date(baseImport.dateCreation).getFullYear() : null;
  const trajEndYear = trajectoryYears.length? trajectoryYears[trajectoryYears.length-1] : null;
  function badgeForYear(y){ return y===baseYear ? 'Base' : y===cutoffActuel ? 'Actuel' : y===trajEndYear ? 'Cible' : null; }
  const yearBadge = badgeForYear(year);

  const projectedResidences = useMemo(()=>{
    if (year===null) return residences;
    return projectResidencesToYear(residences, operations, gainsGrid, year, includeIdentifiees);
  }, [residences, operations, gainsGrid, year, includeIdentifiees]);

  const xLabel = (criteria.find((c)=>c.key===xKey)||{}).label || xKey;
  const yLabel = (criteria.find((c)=>c.key===yKey)||{}).label || yKey;

  const dataAvailability = useMemo(()=>{
    const opsVisible = operations.filter((o)=> includeIdentifiees || o.statut!=='identifie');
    return {
      rehab: opsVisible.some((o)=>familyOfType(o.type)==='Réhabilitation'),
      rc: opsVisible.some((o)=>familyOfType(o.type)==='Remplacement de composants'),
      demolition: opsVisible.some((o)=>familyOfType(o.type)==='Démolition'),
      vente: residences.some((r)=>r.nbLgtMiseVente!==null && r.nbLgtMiseVente!==undefined),
    };
  }, [residences, operations, includeIdentifiees]);

  const { rows, colTotals, rowTotals, maxCell, unclassified, maxVal, xBands, yBands } = useMemo(()=>{
    const residences = projectedResidences;
    const xBands = bandsForCriterion(xKey);
    const yBands = bandsForCriterion(yKey);
    const xClassifier = classifierForCriterion(residences, xKey);
    const yClassifier = classifierForCriterion(residences, yKey);

    const classified = [];
    let unclassifiedCount = 0;
    residences.forEach((r)=>{
      const xBand = xClassifier(r), yBand = yClassifier(r);
      if (!xBand || !yBand) { unclassifiedCount++; return; }
      classified.push({ r, xBand, yBand });
    });

    const cellsOf = (yBand)=> xBands.slice().reverse().map((xBand)=>{
      const members = classified.filter((c)=>c.yBand===yBand && c.xBand===xBand).map((c)=>c.r);
      const value = sizeBy==='nbLgt' ? members.reduce((s,r)=>s+(r.nbLgt||0),0) : members.length;
      const counters = cellCounters(members, operations, includeIdentifiees);
      return { xBand, yBand, members, value, counters };
    });
    const rows = yBands.map((yBand)=>({ yBand, cells: cellsOf(yBand) }));
    const maxCell = Math.max(1, ...rows.flatMap((row)=>row.cells.map((c)=>c.value)));
    const rowTotals = rows.map((row)=>row.cells.reduce((s,c)=>s+c.value,0));
    const colTotals = xBands.slice().reverse().map((_,ci)=>rows.reduce((s,row)=>s+row.cells[ci].value,0));
    const maxVal = sizeBy==='nbLgt' ? residences.reduce((s,r)=>s+(r.nbLgt||0),0) : residences.length;
    return { rows, colTotals, rowTotals, maxCell, unclassified: unclassifiedCount, maxVal, xBands, yBands };
  }, [projectedResidences, xKey, yKey, sizeBy, operations, includeIdentifiees]);

  const pinnedMembers = pinned ? (rows.find((r)=>r.yBand===pinned.yBand).cells.find((c)=>c.xBand===pinned.xBand).members) : null;
  const pinnedBreakdown = useMemo(()=>{
    if (!pinnedMembers) return null;
    const distE = {A:0,B:0,C:0,D:0,E:0,F:0,G:0,NR:0}, distG = {A:0,B:0,C:0,D:0,E:0,F:0,G:0,NR:0};
    pinnedMembers.forEach((r)=>{
      if (r.distEnergie) Object.keys(distE).forEach((c)=>{ distE[c]+=(r.distEnergie[c]||0); });
      if (r.distGES) Object.keys(distG).forEach((c)=>{ distG[c]+=(r.distGES[c]||0); });
    });
    return { distE, distG };
  }, [pinnedMembers]);
  function togglePinned(cell){
    setPinned((cur)=> (cur && cur.xBand===cell.xBand && cur.yBand===cell.yBand) ? null : {xBand:cell.xBand, yBand:cell.yBand});
  }

  return (
    <div className="ce-card">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10,marginBottom:14}}>
        <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700}}>Segmentation en 9 familles</h2>
        <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'flex-end'}}>
          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            <label style={{fontSize:'.66rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>Année</label>
            <div style={{display:'flex',alignItems:'center',gap:6}}>
              <select className="ce-select" value={year??''} onChange={(e)=>{ setYear(Number(e.target.value)); setPinned(null); }}>
                {trajectoryYears.map((y)=>{ const b = badgeForYear(y); return <option key={y} value={y}>{y}{b? ' — '+b:''}</option>; })}
              </select>
              {yearBadge && <span style={{fontSize:'.66rem',fontWeight:700,color:'#fff',background:COMPARE_COLORS[yearBadge.toLowerCase()],borderRadius:10,padding:'2px 8px'}}>{yearBadge}</span>}
            </div>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            <label style={{fontSize:'.66rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>Axe X</label>
            <select className="ce-select" value={xKey} onChange={(e)=>{setXKey(e.target.value); setPinned(null);}}>
              {criteria.map((c)=><option key={c.key} value={c.key} disabled={c.key===yKey}>{c.label}</option>)}
            </select>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            <label style={{fontSize:'.66rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>Axe Y</label>
            <select className="ce-select" value={yKey} onChange={(e)=>{setYKey(e.target.value); setPinned(null);}}>
              {criteria.map((c)=><option key={c.key} value={c.key} disabled={c.key===xKey}>{c.label}</option>)}
            </select>
          </div>

        importé, puis classés « Très bon » (≥ 70), « Bon » (50 à 70) ou « Mauvais » (&lt; 50). Le DPE Global suit
        des seuils absolus propres au DPE (au moins un logement E/F/G → Performant -, moins de 80% de logements
        A/B/C → Performant ±, sinon Performant +) — c'est une règle de classement Cellance, pas une colonne du
        gabarit importé. Réhab/RC/Démolition/Vente sont toujours comptés en logements, quelle que soit la bascule
        de taille des familles.
        {unclassified>0 && <span> {unclassified} résidence{unclassified>1?'s':''} non classée{unclassified>1?'s':''} (donnée manquante sur l'un des deux critères).</span>}

}

/* ---------------- Impact des actions stratégiques (avant/après, sur une même version) ----------------
   Contrairement à la Segmentation en 9 familles (comparaison de deux versions sauvegardées), ce
   tableau compare deux instants dans le temps d'une même version : le fichier importé tel quel, et
   une projection de cette même donnée après application des opérations simulées jusqu'à une
   échéance calendaire choisie. Axes fixes (non configurables) : État technique (seuils absolus,
   cf. technicalBand) × DPE Global (cf. dpeGlobalBand, partagé avec la Segmentation en 9 familles). */
function buildEcheanceOptions(operations){
  const currentYear = new Date().getFullYear();
  const opYears = operations.map((o)=>o.annee).filter((y)=>y!==null && y!==undefined && !isNaN(y));
  // Une option par année calendaire (pas seulement des jalons +5/+10/...) jusqu'à la dernière année
  // d'opération simulée, avec un horizon minimum de 5 ans même sans aucune opération dans le fichier.
  const maxOpYear = opYears.length? Math.max(...opYears) : currentYear+10;
  const endYear = Math.max(maxOpYear, currentYear+5);
  const years = [];
  for (let y=currentYear+1; y<=endYear; y++) years.push(y);
  return years.length? years : [currentYear+10];
}

const IMPACT_TECH_BANDS = ['Bon état','État moyen','État à améliorer'];
// Couleurs des 9 familles du tableau Impact, façon étiquette DPE : palette ColorBrewer RdYlGn à 9
// classes (rouge foncé = pire famille, orange/jaune au centre, vert foncé = meilleure famille) —
// une palette de référence publique, pas une couleur de marque Cellance, choisie pour son
// dégradé rouge -> vert immédiatement lisible.
const IMPACT_FAMILY_RDYLGN9 = ['#a50026','#d73027','#f46d43','#fdae61','#fee08b','#d9ef8b','#a6d96a','#66bd63','#1a9850'];
// Numérotation des 9 familles façon matrice à 9 cases (1 = meilleure cellule unique, 9 = pire
// cellule unique, paliers de 1/2/3/2/1 cellules le long de la diagonale) — convention de
// présentation pour la couleur, pas une donnée du fichier importé.
const IMPACT_FAMILY_MAP = {
  'Bon état|Performant +': 1,
  'Bon état|Performant ±': 2,
  'État moyen|Performant +': 3,
  'Bon état|Performant -': 4,
  'État moyen|Performant ±': 5,
  'État à améliorer|Performant +': 6,
  'État moyen|Performant -': 7,
  'État à améliorer|Performant ±': 8,
  'État à améliorer|Performant -': 9,
};
function impactFamilyColor(techBand, dpeBand){
  const n = IMPACT_FAMILY_MAP[techBand+'|'+dpeBand];
  return n ? IMPACT_FAMILY_RDYLGN9[9-n] : '#f5f8f7';
}
function relLuminance(hex){
  const h = hex.replace('#','');
  const toLin = (c)=>{ c/=255; return c<=0.03928? c/12.92 : Math.pow((c+0.055)/1.055,2.4); };
  const r=toLin(parseInt(h.substring(0,2),16)), g=toLin(parseInt(h.substring(2,4),16)), b=toLin(parseInt(h.substring(4,6),16));
  return 0.2126*r+0.7152*g+0.0722*b;
}
function textColorFor(bgHex){ return relLuminance(bgHex)<0.5 ? '#fff' : 'var(--ce-vert-tres-fonce)'; }
function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const r=parseInt(h.substring(0,2),16), g=parseInt(h.substring(2,4),16), b=parseInt(h.substring(4,6),16);
  return 'rgba('+r+','+g+','+b+','+alpha+')';
}
// Classe DPE la moins bonne effectivement présente (≥1 logement) dans une distribution — utilisée
// pour résumer en une seule lettre le DPE d'une résidence après projection (la projection donne une
// distribution, pas une lettre unique), même logique que « le moins bon des deux » de dpeGlobalBand.
function worstPresentClass(dist){
  if (!dist) return null;
  for (const cl of CLASS_ORDER){ if ((dist[cl]||0)>0) return cl; }
  return null;
}
// Couleur du delta définie par position de cellule (pas par signe brut du delta) : une cellule en
// haut à droite (bonne position) où le delta est positif progresse réellement -> vert ; une cellule
// en bas à gauche (mauvaise position) où le delta est positif se dégrade -> corail. Les 3 cellules de
// la diagonale médiane (mi-bon/mi-mauvais sur les deux axes) restent neutres : leur lecture n'est pas
// univoque et forcer une couleur introduirait un biais non demandé par la spec.
function deltaQuality(techBand, dpeBand){
  const xRank = DPE_GLOBAL_BANDS.indexOf(dpeBand); // 0 = Performant + (meilleur) .. 2 = Performant - (pire)
  const yRank = IMPACT_TECH_BANDS.indexOf(techBand); // 0 = Bon état (meilleur) .. 2 = État à améliorer (pire)
  return (2-xRank)+(2-yRank); // 0 (pire cellule) .. 4 (meilleure cellule)
}
function deltaColorKind(techBand, dpeBand, delta){
  if (delta===0) return 'neutral';
  const quality = deltaQuality(techBand, dpeBand);
  if (quality>2) return delta>0? 'good' : 'bad';
  if (quality<2) return delta>0? 'bad' : 'good';
  return 'neutral';
}

function emptyImpactCells(){
  const dpeBands = DPE_GLOBAL_BANDS;
  const emptyDist = ()=>({A:0,B:0,C:0,D:0,E:0,F:0,G:0,NR:0});
  const c = {}; IMPACT_TECH_BANDS.forEach((tb)=>dpeBands.forEach((db)=>{ c[tb+'|'+db]={value:0,members:[],distE:emptyDist(),distG:emptyDist()}; }));
  return c;
}
// Grille projetée (Actuel ou Cible) à une échéance donnée : mêmes deux fonctions de projection que le
// reste de l'outil (computeTrajectoryByResidence pour le DPE, computeTechniqueProjection pour l'État
// technique), jamais recalculées différemment entre Actuel et Cible — seule l'échéance change (cf.
// §2.1 de la spec, filterOpsUntil()).
function computeImpactCellsForEcheance(residences, operations, gainsGrid, echeance, includeIdentifiees, offreNouvelleLgt){
  const opsJusquaEcheance = filterOpsUntil(operations, echeance);
  const trajE = computeTrajectoryByResidence(residences, operations, gainsGrid||{}, echeance, 'energie', includeIdentifiees);
  const trajG = computeTrajectoryByResidence(residences, operations, gainsGrid||{}, echeance, 'ges', includeIdentifiees);

  const cells = emptyImpactCells();
  function addToCell(k, r, distE, distG){
    cells[k].value += (r.nbLgt||0);
    cells[k].members.push(r);
    if (distE) Object.keys(cells[k].distE).forEach((cl)=>{ cells[k].distE[cl]+=(distE[cl]||0); });
    if (distG) Object.keys(cells[k].distG).forEach((cl)=>{ cells[k].distG[cl]+=(distG[cl]||0); });
  }

  const nonProjetees = [];
  let parcATraiterLgt = 0; const parcATraiterRes = [];

  residences.forEach((r)=>{
    // Démolition simulée avant l'échéance : sort du parc (cf. section 6 de la spec) — la cascade DPE
    // (Énergie et GES) détecte déjà la démolition (même règle que resolveGain/type /^demol/), on la
    // réutilise plutôt que de dupliquer la détection.
    const demolie = (trajE.alive[r.code]===false) || (trajG.alive[r.code]===false);
    if (demolie) return;

    const techProj = computeTechniqueProjection(r, opsJusquaEcheance, includeIdentifiees);
    const note = techProj ? techProj.technique : r.technique;
    if (!techProj) nonProjetees.push(r);
    const tb = technicalBand(note);

    const distE = trajE.state[r.code], distG = trajG.state[r.code];
    const db = dpeGlobalBand({ distEnergie: distE, distGES: distG });
    if (db===null && !nonProjetees.includes(r)) nonProjetees.push(r);

    if (tb && db){ addToCell(tb+'|'+db, r, distE, distG); }

    const mauvaisTech = note!==null && note!==undefined && !isNaN(note) && note<50;
    const mauvaisDpe = db==='Performant -';
    if (mauvaisTech || mauvaisDpe){ parcATraiterLgt += (r.nbLgt||0); parcATraiterRes.push(r); }
  });

  // Construction neuve simulée (offre nouvelle, saisie manuelle année par année) : cumul jusqu'à
  // l'échéance, classée par hypothèse par défaut en Bon état × Performant + (aucune donnée d'état
  // technique ou de DPE propre n'existe pour du neuf simulé). Comptée en "NR" dans le détail DPE de
  // la cellule (pas de classe A-G connue) pour que le total du détail reste cohérent avec l'effectif.
  const cumulNeuf = Object.keys(offreNouvelleLgt||{}).reduce((s,y)=> Number(y)<=echeance ? s+(Number(offreNouvelleLgt[y])||0) : s, 0);
  if (cumulNeuf>0){
    const k = 'Bon état|Performant +';
    cells[k].value += cumulNeuf;
    cells[k].distE.NR += cumulNeuf;
    cells[k].distG.NR += cumulNeuf;
    cells[k].members.push({ code:'_neuf_'+echeance, nom:'Logements neufs simulés (construction)', nbLgt:cumulNeuf, isNeuf:true });
  }

  return { cells, nonProjetees, parcATraiterLgt, parcATraiterRes, trajE, trajG, cumulNeuf, echeance };
}
// Grille Base : instantané figé de la version sauvegardée (baseImport.data.residences), jamais
// reprojetée — même convention que baseComparePoints de ViewCotation (cf. §2.1 de la spec).
function computeImpactCellsRaw(residences){
  const cells = emptyImpactCells();
  let unclassified = 0;
  residences.forEach((r)=>{
    const tb = technicalBand(r.technique), db = dpeGlobalBand(r);
    if (tb && db){
      const k = tb+'|'+db;
      cells[k].value += (r.nbLgt||0);
      cells[k].members.push(r);
      if (r.distEnergie) Object.keys(cells[k].distE).forEach((cl)=>{ cells[k].distE[cl]+=(r.distEnergie[cl]||0); });
      if (r.distGES) Object.keys(cells[k].distG).forEach((cl)=>{ cells[k].distG[cl]+=(r.distGES[cl]||0); });
    } else unclassified++;
  });
  return { cells, unclassified };
}
function computeImpactActions(residences, operations, gainsGrid, offreNouvelleLgt, baseImport, cutoffActuel, echeanceCible, includeIdentifiees){
  const actuel = computeImpactCellsForEcheance(residences, operations, gainsGrid, cutoffActuel, includeIdentifiees, offreNouvelleLgt);
  const cible = computeImpactCellsForEcheance(residences, operations, gainsGrid, echeanceCible, includeIdentifiees, offreNouvelleLgt);
  const base = baseImport ? computeImpactCellsRaw(baseImport.data.residences||[]) : null;
  return { base, actuel, cible, dpeBands: DPE_GLOBAL_BANDS };
}

const IMPACT_GRID_LABELS = { base:'Base', actuel:'Actuel', cible:'Cible' };
function ImpactActionsStrategiques({residences, operations, includeIdentifiees, gainsGrid, hasGainsGrid, offreNouvelleLgt, baseImport, onSelectResidence}){
  const echeanceOptions = useMemo(()=>buildEcheanceOptions(operations), [operations]);
  const [echeanceCible, setEcheanceCible] = useState(null);
  const [compare, setCompare] = useState(defaultCompareState());
  const [pinned, setPinned] = useState(null); // {which:'base'|'actuel'|'cible'|'parcATraiter'|'nonProjetees', tb, db}
  const [showDpeBreakdown, setShowDpeBreakdown] = useState(false);
  const hasCompareBase = !!baseImport;
  const compareState = clampCompareState(compare, hasCompareBase);
  const cutoffActuel = useMemo(()=>anneeCoupureActuel(), []);

  useEffect(()=>{
    if (echeanceOptions.length && (echeanceCible===null || !echeanceOptions.includes(echeanceCible))){
      const endYear = trajectoryEndYear(operations);
      const preferred = echeanceOptions.includes(endYear) ? endYear : echeanceOptions[echeanceOptions.length-1];
      setEcheanceCible(preferred);
    }
  }, [echeanceOptions, operations]);

  const result = useMemo(()=>{
    if (echeanceCible===null) return null;
    return computeImpactActions(residences, operations, gainsGrid, offreNouvelleLgt, baseImport, cutoffActuel, echeanceCible, includeIdentifiees);
  }, [residences, operations, gainsGrid, offreNouvelleLgt, baseImport, cutoffActuel, echeanceCible, includeIdentifiees]);

  // Pour ne pas afficher un compteur à 0 trompeur (aucune opération de cette famille dans le fichier
  // entier) vs un 0 réel (la famille existe ailleurs mais pas dans cette cellule) — même principe que
  // la Segmentation en 9 familles. Calculé avant le `return null` ci-dessous : un Hook ne doit jamais
  // être appelé après un retour conditionnel (sinon le nombre de Hooks diffère d'un rendu à l'autre
  // et React plante — c'était le bug d'écran blanc sur l'onglet Base de cotation).
  const dataAvailability = useMemo(()=>{
    const opsVisible = operations.filter((o)=> includeIdentifiees || o.statut!=='identifie');
    return {
      rehab: opsVisible.some((o)=>familyOfType(o.type)==='Réhabilitation'),
      rc: opsVisible.some((o)=>familyOfType(o.type)==='Remplacement de composants'),
      demolition: opsVisible.some((o)=>familyOfType(o.type)==='Démolition'),
      vente: residences.some((r)=>r.nbLgtMiseVente!==null && r.nbLgtMiseVente!==undefined),
    };
  }, [residences, operations, includeIdentifiees]);

  // Bandeau de compteurs §4.2 : n'existe que si Base est définie (a besoin d'un "prévu en Base").
  // Calculé avant le retour conditionnel ci-dessous (règle des Hooks, cf. commentaire dataAvailability).
  const impactCounters = useMemo(()=>{
    const base = result && result.base;
    if (!base || !baseImport) return null;
    const baseOps = (baseImport.simOperations||[]).filter((o)=> baseImport.includeIdentifiees || o.statut==='programme');
    const actuelOpsRealisees = filterOpsUntil(operations, cutoffActuel).filter((o)=> includeIdentifiees || o.statut==='programme');
    const famCounters = countByFamily(baseOps, actuelOpsRealisees, baseImport.data.residences, residences);
    const venteOffre = countVenteOffreNouvelle(baseImport.data.residences, residences, baseImport.offreNouvelleLgt, offreNouvelleLgt, cutoffActuel);
    return Object.assign({}, famCounters, venteOffre);
  }, [result, baseImport, operations, residences, includeIdentifiees, cutoffActuel, offreNouvelleLgt]);

  if (!result || echeanceCible===null) return null;

  const { base, actuel, cible, dpeBands } = result;
  const gridsByKey = { base, actuel, cible };
  // KPI "Parc à traiter"/"non projetées"/"construction neuve cumulée" restent orientés Cible (l'état
  // final visé par le PSP), comme dans l'ancienne grille "après travaux (échéance)".
  const { nonProjetees, cumulNeuf, parcATraiterLgt, parcATraiterRes } = cible;

  // Résume le DPE d'une résidence en une seule lettre pour l'affichage en liste : valeur brute du
  // fichier (dpeEnergie/dpeGES) pour Base, classe la moins bonne de la distribution projetée (cf.
  // worstPresentClass) pour Actuel/Cible (la projection ne donne qu'une distribution, jamais une
  // lettre unique).
  function dpeBadgesFor(r, which){
    if (r.isNeuf) return null;
    const grid = gridsByKey[which];
    const energieCl = which==='base' ? r.dpeEnergie : worstPresentClass(grid.trajE.state[r.code]);
    const gesCl = which==='base' ? r.dpeGES : worstPresentClass(grid.trajG.state[r.code]);
    return (
      <span style={{display:'flex',gap:3,flexShrink:0}}>
        <DpeBadge cl={energieCl} />
        <DpeBadge cl={gesCl} />
      </span>
    );
  }
  function residenceRow(r, which){
    if (r.isNeuf){
      return (
        <div key={r.code} style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,fontSize:'.76rem',color:'#9fb3ae',fontStyle:'italic',padding:'3px 0',borderBottom:'1px solid #f0f5f3'}}>
          <span>{r.nom} <span style={{color:'#9fb3ae'}}>— {fmtNum(r.nbLgt)} logements neufs construits</span></span>
        </div>
      );
    }
    const travaux = residenceTravauxLabels(r, operations, includeIdentifiees);
    // Base est un instantané figé (pas de notion de "déjà réalisé" à une échéance) ; Actuel/Cible
    // utilisent respectivement anneeCoupureActuel()/l'échéance Cible choisie, cf. realizedFamiliesForYear.
    const yearForRealized = which==='actuel' ? cutoffActuel : which==='cible' ? echeanceCible : null;
    const realized = yearForRealized!==null ? realizedFamiliesForYear(r, operations, yearForRealized, includeIdentifiees) : {};
    return (
      <div key={r.code} onClick={()=>onSelectResidence && onSelectResidence(r)}
        style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,fontSize:'.76rem',color:'var(--ce-vert-fonce)',padding:'3px 0',borderBottom:'1px solid #f0f5f3',cursor:onSelectResidence?'pointer':'default'}}>
        <span>{r.nom || r.code} <span style={{color:'#9fb3ae'}}>— {fmtNum(r.nbLgt)} lgt</span></span>
        <span style={{display:'flex',gap:4,alignItems:'center',flexShrink:0,flexWrap:'wrap'}}>
          {travaux.map((t)=>{
            const trackable = REALIZABLE_LABELS.has(t);
            const isRealized = trackable && realized[t]!==undefined;
            return (
              <span key={t} title={trackable? (isRealized? t+' réalisé en '+realized[t] : t+' pas encore réalisé') : t}
                style={{fontSize:'.62rem',fontWeight:700,borderRadius:8,padding:'1px 6px',color: isRealized?'var(--ce-vert-principal)':'var(--ce-vert-fonce)',background: isRealized?'#e7f5ee':'#f0f5f3'}}>
                {isRealized?'✓ ':''}{t}
              </span>
            );
          })}
          {dpeBadgesFor(r, which)}
        </span>
      </div>
    );
  }

  function renderGrid(which, title){
    const cells = gridsByKey[which].cells;
    const showDelta = which!=='base' && compareState.base && !!base;
    // flex:'0 0 auto' (au lieu de flex:1) : le conteneur épouse la largeur réelle de la grille
    // (98px + 3×116px) plutôt que de s'étirer sur toute la largeur de sa ligne flex — sans quoi le
    // titre, centré sur tout le conteneur, se retrouve centré au-dessus du vide quand la grille ne
    // remplit pas sa ligne (cf. justifyContent:'center' sur les lignes qui appellent renderGrid).
    return (
      <div style={{flex:'0 0 auto'}}>
        <div style={{fontSize:'.78rem',fontWeight:700,color:'var(--ce-vert-tres-fonce)',marginBottom:8,textAlign:'center'}}>{title}</div>
        <div style={{display:'grid',gridTemplateColumns:'98px repeat(3, 116px)',gap:4}}>
          <div></div>
          {dpeBands.slice().reverse().map((db)=>(
            <div key={db} style={{textAlign:'center',fontSize:'.62rem',fontWeight:700,color:'var(--ce-vert-fonce)'}}>{db}</div>
          ))}
          {IMPACT_TECH_BANDS.map((tb)=>(
            <React.Fragment key={tb}>
              <div style={{display:'flex',alignItems:'center',fontSize:'.62rem',fontWeight:700,color:'var(--ce-vert-fonce)'}}>{tb}</div>
              {dpeBands.slice().reverse().map((db)=>{
                const k = tb+'|'+db;
                const cell = cells[k];
                const bg = impactFamilyColor(tb, db);
                const txt = textColorFor(bg);
                const background = cell.value>0 ? bg : hexToRgba(bg, 0.15);
                const isPinned = pinned && pinned.which===which && pinned.tb===tb && pinned.db===db;
                let deltaInfo = null;
                if (showDelta){
                  const delta = cell.value - base.cells[k].value;
                  const kind = deltaColorKind(tb, db, delta);
                  const color = kind==='good' ? 'var(--ce-vert-principal)' : kind==='bad' ? 'var(--ce-corail)' : 'var(--ce-vert-fonce)';
                  deltaInfo = { delta, color };
                }
                const textColor = cell.value>0 ? txt : 'var(--ce-vert-fonce)';
                return (
                  <div key={db}
                    onClick={()=>setPinned((cur)=> (cur && cur.which===which && cur.tb===tb && cur.db===db) ? null : {which,tb,db})}
                    style={{
                      height:78,borderRadius:8,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:2,
                      background, color:textColor,
                      border: isPinned? '2px solid var(--ce-vert-tres-fonce)' : '1px solid #eef4f2',
                      cursor:'pointer', transition:'border .1s',
                    }}>
                    <span style={{fontSize:'1rem',fontWeight:700}}>{fmtNum(cell.value)}</span>
                    {deltaInfo && (
                      <span style={{fontSize:'.66rem',fontWeight:700,padding:'1px 6px',borderRadius:10,background:'rgba(255,255,255,0.88)',color:deltaInfo.color}}>
                        {deltaInfo.delta>=0?'+':''}{fmtNum(deltaInfo.delta)}
                      </span>
                    )}
                  </div>
                );
              })}
            </React.Fragment>
          ))}
        </div>
      </div>
    );
  }

  const pinnedGridMembers = (pinned && gridsByKey[pinned.which])
    ? gridsByKey[pinned.which].cells[pinned.tb+'|'+pinned.db].members : null;

  return (
    <div className="ce-card">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10,marginBottom:14}}>
        <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700}}>Impact des actions stratégiques</h2>
        <div style={{display:'flex',alignItems:'flex-end',gap:14,flexWrap:'wrap'}}>
          <CompareCheckboxes checked={compareState} onChange={setCompare} hasBase={hasCompareBase} />
          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            <label style={{fontSize:'.66rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>Échéance Cible</label>
            <select className="ce-select" value={echeanceCible} onChange={(e)=>{ setEcheanceCible(Number(e.target.value)); setPinned(null); }}>
              {echeanceOptions.map((y)=><option key={y} value={y}>{y}</option>)}
            </select>
          </div>
        </div>
      </div>

      {!hasGainsGrid && (
        <div style={{background:'var(--ce-saumon)',borderRadius:8,padding:'8px 12px',fontSize:'.72rem',color:'var(--ce-vert-tres-fonce)',marginBottom:12}}>
          Grille de gains DPE (onglet « Référentiel des gains DPE ») introuvable dans ce fichier : le DPE Global
          Actuel/Cible ne peut pas être projeté (distribution figée sur l'état importé).
        </div>
      )}

      {impactCounters && <ImpactCountersRow counters={impactCounters} />}

      {(()=>{
        const titles = { base:'Base'+(baseImport? ' — '+baseImport.nom:''), actuel:'Actuel ('+cutoffActuel+')', cible:'Cible ('+echeanceCible+')' };
        const visible = [];
        if (compareState.base && base) visible.push('base');
        if (compareState.actuel) visible.push('actuel');
        if (compareState.cible) visible.push('cible');
        // 3 grilles côte à côte débordent/se chevauchent à l'écran (chaque grille a besoin d'assez de
        // largeur pour ses 3 colonnes) : quand les 3 sont cochées, Cible passe sur sa propre rangée en
        // dessous plutôt que de forcer un flex-wrap qui coupe la 3ème grille au milieu.
        if (visible.length===3){
          return (
            <React.Fragment>
              <div style={{display:'flex',gap:24,flexWrap:'wrap',justifyContent:'center',marginBottom:14}}>
                {renderGrid('base', titles.base)}
                {renderGrid('actuel', titles.actuel)}
              </div>
              <div style={{display:'flex',gap:24,flexWrap:'wrap',justifyContent:'center',marginBottom:14}}>
                {renderGrid('cible', titles.cible)}
              </div>
            </React.Fragment>
          );
        }
        return (
          <div style={{display:'flex',gap:24,flexWrap:'wrap',justifyContent:'center',marginBottom:14}}>
            {visible.map((which)=>renderGrid(which, titles[which]))}
          </div>
        );
      })()}

      <p style={{fontSize:'.7rem',color:'var(--ce-vert-fonce)',marginTop:-4,marginBottom:14,lineHeight:1.5}}>
        Chaque grille croise 3 niveaux d'État technique (lignes) × 3 niveaux de DPE Global (colonnes),
        soit 9 familles — la couleur de fond suit une palette rouge (Mauvais état × DPE Performant -,
        pire cas) → vert (Bon état × Performant +, meilleur cas), du rouge au vert en passant par
        l'orange/jaune pour les familles intermédiaires. Cliquez sur une cellule pour voir le détail
        des résidences concernées.
      </p>

      <div style={{display:'flex',gap:16,flexWrap:'wrap',marginBottom:14}}>
        <div className="ce-card" style={{flex:1,minWidth:220,cursor:'pointer',border: (pinned && pinned.which==='parcATraiter') ? '2px solid var(--ce-corail)' : '1px solid #eef4f2'}}
          onClick={()=>setPinned((cur)=> (cur && cur.which==='parcATraiter') ? null : {which:'parcATraiter'})}>
          <div style={{fontSize:'.68rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase',letterSpacing:'.03em',marginBottom:6}}>Parc à traiter dans le prochain PSP</div>
          <div style={{fontSize:'1.5rem',fontWeight:700,color:'var(--ce-corail)'}}>{fmtNum(parcATraiterLgt)} lgt</div>
          <div style={{fontSize:'.72rem',color:'var(--ce-vert-fonce)'}}>{parcATraiterRes.length} résidence{parcATraiterRes.length>1?'s':''} — état technique &lt; 50 ou DPE Global Performant -, à l'échéance Cible {echeanceCible}</div>
        </div>
        {nonProjetees.length>0 && (
          <div className="ce-card" style={{flex:1,minWidth:220,cursor:'pointer',border: (pinned && pinned.which==='nonProjetees') ? '2px solid var(--ce-vert-fonce)' : '1px solid #eef4f2'}}
            onClick={()=>setPinned((cur)=> (cur && cur.which==='nonProjetees') ? null : {which:'nonProjetees'})}>
            <div style={{fontSize:'.68rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase',letterSpacing:'.03em',marginBottom:6}}>Résidences non projetées</div>
            <div style={{fontSize:'1.5rem',fontWeight:700,color:'var(--ce-vert-fonce)'}}>{nonProjetees.length}</div>
            <div style={{fontSize:'.72rem',color:'var(--ce-vert-fonce)'}}>Détail des 5 sous-critères ou distribution DPE indisponible — valeur brute conservée dans la grille Cible.</div>
          </div>
        )}
        {cumulNeuf>0 && (
          <div className="ce-card" style={{flex:1,minWidth:220}}>
            <div style={{fontSize:'.68rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase',letterSpacing:'.03em',marginBottom:6}}>Construction neuve simulée cumulée</div>
            <div style={{fontSize:'1.5rem',fontWeight:700,color:'var(--ce-vert-principal)'}}>{fmtNum(cumulNeuf)} lgt</div>
            <div style={{fontSize:'.72rem',color:'var(--ce-vert-fonce)'}}>Classée par hypothèse en Bon état × Performant + (aucune donnée d'état propre pour du neuf simulé).</div>
          </div>
        )}
      </div>

      {pinned && pinned.which==='parcATraiter' && (
        <div style={{marginBottom:12}}>
          <ResidenceListPanel rows={parcATraiterRes} renderRow={(r)=>residenceRow(r,'cible')} maxHeight={280} marginTop={0} />
        </div>
      )}
      {pinned && pinned.which==='nonProjetees' && (
        <div style={{marginBottom:12}}>
          <ResidenceListPanel rows={nonProjetees} renderRow={(r)=>residenceRow(r,'cible')} maxHeight={280} marginTop={0} />
        </div>
      )}
      {pinned && gridsByKey[pinned.which] && (()=>{
        const k = pinned.tb+'|'+pinned.db;
        const curCell = gridsByKey[pinned.which].cells[k];
        const refCell = base ? base.cells[k] : null; // référence pour l'évolution, seulement si Base existe
        const showDeltaHere = pinned.which!=='base' && !!refCell;
        // Totaux Réhab./RC/Démol./Vente de la famille sélectionnée (nb de logements), affichés ici
        // à côté du nom de la famille — pas dans la cellule de la grille (trop dense, cf. retour).
