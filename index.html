        const familyCounters = cellCounters(pinnedGridMembers, operations, includeIdentifiees);
        const travauxParts = [
          dataAvailability.rehab && ('Réhab '+fmtNum(familyCounters.rehab)),
          dataAvailability.rc && ('RC '+fmtNum(familyCounters.rc)),
          dataAvailability.demolition && ('Démol '+fmtNum(familyCounters.demolition)),
          dataAvailability.vente && ('Vente '+fmtNum(familyCounters.vente)),
        ].filter(Boolean);
        return (
          <div style={{marginBottom:12}}>
            <ResidenceListPanel
              title={pinned.tb+' × '+pinned.db+' ('+IMPACT_GRID_LABELS[pinned.which]+') — '+pinnedGridMembers.length+' résidence'+(pinnedGridMembers.length>1?'s':'')}
              headerActions={<button className="ce-btn-outline ce-btn-sm" onClick={()=>setShowDpeBreakdown((v)=>!v)}>{showDpeBreakdown? 'Masquer répartition DPE' : 'Répartition DPE'}</button>}
              rows={pinnedGridMembers}
              renderRow={(r)=>residenceRow(r, pinned.which)}
              maxHeight={280}
              marginTop={0}
            >
              {travauxParts.length>0 && (
                <div style={{fontSize:'.72rem',color:'var(--ce-vert-fonce)',marginBottom:8}}>{travauxParts.join(' · ')}</div>
              )}
              {showDpeBreakdown && (
                <div style={{marginBottom:10,padding:'8px 0',borderBottom:'1px solid #f0f5f3'}}>
                  {[['Énergie','distE'],['GES','distG']].map(([label,dk])=>(
                    <div key={dk} style={{display:'flex',alignItems:'center',gap:6,marginBottom:6,flexWrap:'wrap'}}>
                      <span style={{width:56,fontSize:'.68rem',fontWeight:700,color:'var(--ce-vert-fonce)'}}>{label}</span>
                      {['A','B','C','D','E','F','G'].map((cl)=>{
                        const cur = (curCell[dk][cl]||0);
                        const ref = refCell ? (refCell[dk][cl]||0) : 0;
                        let deltaLabel = null;
                        if (showDeltaHere){
                          if (ref>0){ const pct=Math.round((cur-ref)/ref*100); deltaLabel=(pct>=0?'+':'')+pct+'%'; }
                          else if (cur>0){ deltaLabel='nouveau'; }
                        }
                        return (
                          <span key={cl} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:1}}>
                            <DpeBadge cl={cl} />
                            <span style={{fontSize:'.6rem',color: deltaLabel? (deltaLabel.startsWith('-')?'var(--ce-corail)':'var(--ce-vert-principal)') : 'var(--ce-vert-fonce)'}}>
                              {fmtNum(cur)}{deltaLabel? ' ('+deltaLabel+')' : ''}
                            </span>
                          </span>
                        );
                      })}
                    </div>
                  ))}
                </div>
              )}
            </ResidenceListPanel>
          </div>
        );
      })()}
    </div>
  );
}

function ViewCotation({residences, onSelectResidence, operations, includeIdentifiees, baseImport, gainsGrid, hasGainsGrid, offreNouvelleLgt}){
  const [showAdvanced, setShowAdvanced] = useState(false);
  const [compare, setCompare] = useState(defaultCompareState());
  const hasScatterData = residences.some((r)=>r.attractivite!==null && r.technique!==null);
  const hasCompareBase = !!baseImport;
  const compareState = clampCompareState(compare, hasCompareBase);

  const scatterPoints = residences.filter((r)=>r.attractivite!==null && r.technique!==null).map((r)=>({
    x:r.attractivite, y:r.technique, r: Math.max(4,Math.min(22, Math.sqrt(r.nbLgt||1)*1.6)), res:r
  }));

  // Actuel/Cible : État technique projeté selon les opérations simulées (matrice RC/Réha), pas la
  // valeur brute du fichier — c'est tout l'intérêt de la comparaison. Actuel borne les opérations à
  // anneeCoupureActuel() (ce qui est déjà réalisé) ; Cible prend toute la trajectoire (cf. §2.1 de la
  // spec — les deux passent par la même fonction de projection, seul le jeu d'opérations en entrée
  // change, pour ne jamais diverger avant la date de coupure). Résidences démolies dans la simulation :
  // exclues (pas de point à comparer). Résidences sans détail des 5 sous-critères : repli sur la
  // valeur brute.
  function projectTechniquePoints(opsForProjection){
    return residences.filter((r)=>r.attractivite!==null).map((r)=>{
      const proj = computeTechniqueProjection(r, opsForProjection, includeIdentifiees);
      const tech = proj ? (proj.demolished? null : proj.technique) : r.technique;
      return tech!==null && tech!==undefined ? {x:r.attractivite, y:tech, r: Math.max(4,Math.min(22, Math.sqrt(r.nbLgt||1)*1.6)), res:r} : null;
    }).filter(Boolean);
  }
  const cutoffActuel = useMemo(()=>anneeCoupureActuel(), []);
  const actuelComparePoints = useMemo(()=>projectTechniquePoints(filterOpsUntil(operations, cutoffActuel)), [residences, operations, includeIdentifiees, cutoffActuel]);
  const cibleComparePoints = useMemo(()=>projectTechniquePoints(operations), [residences, operations, includeIdentifiees]);
  const baseComparePoints = useMemo(()=>{
    if (!hasCompareBase) return [];
    return (baseImport.data.residences||[]).filter((r)=>r.attractivite!==null && r.technique!==null).map((r)=>({
      x:r.attractivite, y:r.technique, r: Math.max(4,Math.min(22, Math.sqrt(r.nbLgt||1)*1.6)), res:r
    }));
  }, [baseImport, hasCompareBase]);
  const avgTech = (pts)=> pts.length? pts.reduce((s,p)=>s+p.y,0)/pts.length : null;
  const deltaVsBase = (pts)=> (hasCompareBase && baseComparePoints.length && pts.length) ? avgTech(pts)-avgTech(baseComparePoints) : null;
  const deltaActuel = deltaVsBase(actuelComparePoints);
  const deltaCible = deltaVsBase(cibleComparePoints);

  // Séries effectivement affichées sur le nuage, dans l'ordre Base -> Actuel -> Cible (couleurs et
  // libellés partagés avec CompareCheckboxes, cf. COMPARE_COLORS/COMPARE_LABELS).
  const compareSeries = [];
  if (compareState.base && baseComparePoints.length) compareSeries.push({key:'base', label:'Base', data:baseComparePoints});
  if (compareState.actuel) compareSeries.push({key:'actuel', label:'Actuel', data:actuelComparePoints});
  if (compareState.cible) compareSeries.push({key:'cible', label:'Cible', data:cibleComparePoints});

  const baseCols = [
    {key:'code', label:'Code'},
    {key:'nom', label:'Résidence'},
    {key:'commune', label:'Commune'},
    {key:'familleAttract', label:'Segment'},
    {key:'attractivite', label:'Attractivité', render:(r)=>r.attractivite!==null? r.attractivite.toFixed(1):'—'},
    {key:'technique', label:'État technique', render:(r)=>r.technique!==null? r.technique.toFixed(1):'—'},
    {key:'dpeEnergie', label:'DPE', render:(r)=><DpeBadge cl={r.dpeEnergie}/>},
  ];
  const advancedCols = [
    {key:'nbLgt', label:'Nb lgt'},
    {key:'secteur', label:'Secteur'},
    {key:'agence', label:'Agence'},
    {key:'dpeGES', label:'DPE GES', render:(r)=><DpeBadge cl={r.dpeGES}/>},
    {key:'familleTechnique', label:'Segment technique'},
    {key:'qpv', label:'QPV'},
  ];
  const columns = showAdvanced ? baseCols.concat(advancedCols) : baseCols;

  return (
    <div style={{padding:24,display:'flex',flexDirection:'column',gap:20}}>
      {hasScatterData && (
        <div className="ce-card">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10,flexWrap:'wrap',gap:8}}>
            <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700}}>Segmentation — Attractivité × État technique</h2>
            <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
              <CompareCheckboxes checked={compareState} onChange={setCompare} hasBase={hasCompareBase} />
              <span style={{fontSize:'.7rem',color:'var(--ce-vert-fonce)'}}>Taille des bulles = nombre de logements</span>
            </div>
          </div>
          {hasCompareBase && compareState.base && (deltaActuel!==null || deltaCible!==null) && (
            <div style={{fontSize:'.78rem',color:'var(--ce-vert-fonce)',marginBottom:10}}>
              Δ note technique moyenne du parc vs base « {baseImport.nom} » :{' '}
              {compareState.actuel && deltaActuel!==null && (<span>Actuel <b style={{color: deltaActuel>=0?'var(--ce-vert-principal)':'var(--ce-corail)'}}>{deltaActuel>=0?'+':''}{deltaActuel.toFixed(1)}</b></span>)}
              {compareState.actuel && deltaActuel!==null && compareState.cible && deltaCible!==null && <span> · </span>}
              {compareState.cible && deltaCible!==null && (<span>Cible <b style={{color: deltaCible>=0?'var(--ce-vert-principal)':'var(--ce-corail)'}}>{deltaCible>=0?'+':''}{deltaCible.toFixed(1)}</b></span>)}
            </div>
          )}
          <ChartCanvas type="bubble" height={340} data={{
            datasets: compareSeries.length ? compareSeries.map((s)=>({ label:s.label, data:s.data, backgroundColor:hexToRgba(COMPARE_COLORS[s.key],0.8) }))
              : [{ label:'Résidences', data: scatterPoints, backgroundColor: scatterPoints.map((p)=> PALETTE[(String(p.res.familleAttract||'').charCodeAt(0)||0)%PALETTE.length]+'cc') }]
          }} options={{
            layout:{ padding:{ top:24 } },
            plugins:{ legend:{display: compareSeries.length>0, labels:{boxHeight:8}},
              tooltip:{ callbacks:{ label:(ctx)=>{ const r=ctx.raw.res; return (ctx.dataset.label? ctx.dataset.label+' — ':'')+(r.nom||r.code)+' — Attract. '+ctx.raw.x.toFixed(1)+' / Tech. '+ctx.raw.y.toFixed(1)+(compareSeries.length? '' : ' / '+fmtNum(r.nbLgt)+' lgt'); } } }
            },
            scales:{ x:{title:{display:true,text:'Attractivité'}}, y:{title:{display:true,text:'État technique'}, suggestedMax:108} },
            onClick:(evt,elements)=>{
              if (!elements.length) return;
              const el = elements[0];
              // seules les séries Actuel/Cible sont cliquables pour ouvrir la fiche résidence (Base est
              // un instantané figé, distinct des opérations actuellement simulées).
              if (!compareSeries.length){ onSelectResidence(scatterPoints[el.index].res); return; }
              const series = compareSeries[el.datasetIndex];
              if (series && series.key!=='base' && series.data[el.index]) onSelectResidence(series.data[el.index].res);
            }
          }} />
          <p style={{fontSize:'.7rem',color:'var(--ce-vert-fonce)',marginTop:10,lineHeight:1.5}}>
            Chaque bulle est une résidence : sa position horizontale suit sa note d'Attractivité, sa
            position verticale sa note d'État technique (les deux ramenées sur 0-100) — et sa taille
            est proportionnelle à son nombre de logements. Cliquez sur une bulle Actuel ou Cible pour
            ouvrir la fiche résidence (Base est un instantané figé, non cliquable).
          </p>
        </div>
      )}
      <SegmentationGrid residences={residences} operations={operations} gainsGrid={gainsGrid} includeIdentifiees={includeIdentifiees} baseImport={baseImport} onSelectResidence={onSelectResidence} />
      <ImpactActionsStrategiques residences={residences} operations={operations} includeIdentifiees={includeIdentifiees} gainsGrid={gainsGrid} hasGainsGrid={hasGainsGrid} offreNouvelleLgt={offreNouvelleLgt} baseImport={baseImport} onSelectResidence={onSelectResidence} />
      <div className="ce-card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
          <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700}}>Table des résidences ({residences.length})</h2>
          <button className="ce-btn-outline ce-btn-sm" onClick={()=>setShowAdvanced(!showAdvanced)}>{showAdvanced? 'Masquer les colonnes avancées':'Colonnes avancées'}</button>
        </div>
        <SortableTable columns={columns} rows={residences} onRowClick={onSelectResidence} pageSize={20} />
      </div>
    </div>
  );
}

/* ---------------- Cartographie ---------------- */
function scoreStatusColor(value){
  if (value===null || value===undefined || isNaN(value)) return STATUS_COLORS.unknown;
  if (value<35) return STATUS_COLORS.critical;
  if (value<55) return STATUS_COLORS.serious;
  if (value<75) return STATUS_COLORS.warning;
  return STATUS_COLORS.good;
}
function ViewCarto({residences, allResidences, onSelectResidence}){
  const [colorMode, setColorMode] = useState('attractivite');
  const {coords, progress, status} = useGeocoding(allResidences);

  const withAddress = residences.filter((r)=>r.adresse).length;
  const failed = residences.filter((r)=>r.adresse && coords[r.code]===null).length;

  // Mémorisé : passé tel quel à LeafletMap, dont l'effet de (re)construction des marqueurs et de
  // recentrage de la carte dépend de cette référence. Sans ce useMemo, un rendu de ViewCarto
  // déclenché par un état sans rapport avec la carte (ex. ouverture de la fiche résidence, qui fait
  // remonter selectedResidence dans App) recréerait un nouveau tableau à chaque fois, et ferait donc
  // recharger inutilement tous les marqueurs et re-fitter la vue de la carte.
  const markers = useMemo(()=> residences.filter((r)=>coords[r.code]!=null).map((r)=>{
    const c = coords[r.code];
    let color;
    if (colorMode==='dpe') color = DPE_COLORS[String(r.dpeEnergie||'').toUpperCase()] || DPE_COLORS.NR;
    else if (colorMode==='technique') color = scoreStatusColor(r.technique);
    else color = scoreStatusColor(r.attractivite);
    return {res:r, lat:c.lat, lon:c.lon, color};
  }), [residences, coords, colorMode]);

  const legendDefs = colorMode==='dpe'
    ? [['A / B', DPE_COLORS.A],['C', DPE_COLORS.C],['D', DPE_COLORS.D],['E', DPE_COLORS.E],['F', DPE_COLORS.F],['G', DPE_COLORS.G],['NR', DPE_COLORS.NR]]
    : [['Bon (≥75)', STATUS_COLORS.good],['Correct (55-75)', STATUS_COLORS.warning],['Fragile (35-55)', STATUS_COLORS.serious],['Faible (<35)', STATUS_COLORS.critical],['Non renseigné', STATUS_COLORS.unknown]];

  return (
    <div style={{padding:24,display:'flex',flexDirection:'column',gap:20}}>
      <div style={{display:'flex',gap:16,flexWrap:'wrap'}}>
        <KpiCard label="Résidences géolocalisées" value={fmtNum(markers.length)} sub={"sur "+fmtNum(residences.length)} />
        <KpiCard label="Adresses non résolues" value={fmtNum(failed)} sub={failed>0? "vérifier l'adresse dans le fichier source":"—"} />
        {status==='loading' && <KpiCard label="Géolocalisation en cours" value={progress.done+' / '+progress.total} sub="via api-adresse.data.gouv.fr" />}
      </div>

      <div className="ce-card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14,flexWrap:'wrap',gap:10}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <span style={{fontSize:'.78rem',fontWeight:700,color:'var(--ce-vert-fonce)'}}>Coloration</span>
            <select className="ce-select" value={colorMode} onChange={(e)=>setColorMode(e.target.value)}>
              <option value="attractivite">Attractivité</option>
              <option value="technique">État technique</option>
              <option value="dpe">DPE énergie</option>
            </select>
          </div>
          <div className="carto-legend">
            {legendDefs.map((it)=>(<span key={it[0]} style={{display:'flex',alignItems:'center'}}><span className="sw" style={{background:it[1]}}></span>{it[0]}</span>))}
          </div>
        </div>
        {withAddress===0 ? (
          <div style={{padding:'40px 20px',textAlign:'center',color:'#9fb3ae',fontSize:'.85rem'}}>Aucune adresse exploitable n'a été trouvée dans le fichier importé pour ces résidences.</div>
        ) : (
          <LeafletMap markers={markers} height={520} onSelectResidence={onSelectResidence} />
        )}
      </div>

      <div style={{fontSize:'.7rem',color:'#9fb3ae'}}>Positionnement par géocodage des adresses via l'API publique <a href="https://api-adresse.data.gouv.fr/" target="_blank" rel="noreferrer" style={{color:'var(--ce-vert-principal)'}}>api-adresse.data.gouv.fr</a> (Base Adresse Nationale) — seules les adresses sont transmises à ce service, mises en cache localement dans votre navigateur. Cliquez sur un point pour ouvrir la fiche résidence complète.</div>
    </div>
  );
}

/* ---------------- Investissements & simulation ---------------- */
// Horizon maximal d'une trajectoire PSP : borne de sécurité, pas une contrainte métier. Sans elle,
// une simple faute de frappe dans le champ "Année" d'une opération (ex. "20260" au lieu de "2026",
// un zéro de trop) fait exploser le nombre d'années de la trajectoire (~18 000 au lieu de 10), ce qui
// gèle l'application (un <input> par année est rendu pour chaque ligne budgétaire/offre nouvelle, et
// la cascade DPE boucle sur years × résidences).
const MAX_TRAJECTORY_YEARS = 60;
function computeYearsRange(operations){
  // On ignore d'emblée les années hors d'une plage plausible pour ne pas laisser une valeur aberrante
  // (typo, import corrompu) déterminer min/max avant même l'application du plafond ci-dessous.
  const yrs = operations.map((o)=>o.annee).filter((y)=>y!==null && y!==undefined && !isNaN(y) && y>=1900 && y<=3000);
  let min = yrs.length? Math.min(...yrs) : 2026;
  let max = yrs.length? Math.max(...yrs) : 2036;
  min = Math.min(min, 2026); max = Math.max(max, min+5);
  max = Math.min(max, min+MAX_TRAJECTORY_YEARS);
  const arr=[]; for (let y=min;y<=max;y++) arr.push(y);
  return arr;
}
// Dernière année de la trajectoire ("Cible", cf. §2.1 de la spec) : même périmètre que le graphique
// Trajectoire d'investissement, jamais recalculé indépendamment — on réutilise computeYearsRange().
function trajectoryEndYear(operations){
  return Math.max(...computeYearsRange(operations));
}

// §9.1 — catégorisation de la colonne brute "Type de travaux" (RC / Réha. / Changement de vecteur /
// Démolition), utilisée UNIQUEMENT comme filtre dans le tableau des opérations de cette vue — jamais
// comme champ éditable, et jamais ailleurs dans l'outil (fiche résidence, pivot, formulaire d'ajout).
// Mêmes règles de détection que familyOfType() (robuste aux variantes de libellé), labels alignés sur
// le vocabulaire brut du fichier plutôt que sur les familles conviviales du graphique d'agrégation.
const TYPE_CAT_OPTIONS = ['RC','Réha.','Changement de vecteur','Démolition','Non renseigné'];
function typeCategorie(type){
  if (!type) return 'Non renseigné';
  const n = ceNorm(type);
  if (/^demol/.test(n)) return 'Démolition';
  if (/^reha/.test(n)) return 'Réha.';
  if (/passage|vecteur|chgt de mode|chaudiere condensation/.test(n)) return 'Changement de vecteur';
  return 'RC';
}
// §8 — palette des lignes budgétaires libres, distincte des couleurs de familles de travaux
// (Réhabilitation/RC/Chgt de vecteur/Démolition) déjà utilisées dans le même graphique empilé.
const BUDGET_LIGNE_COLORS = ['#F8C6BA','#9fb3ae','#B79CED','#FFD16A','#6BC9C0','#E6A4B4'];
function sumBudgetLignesYear(lignes, y){ return (lignes||[]).reduce((s,l)=>s+(Number((l.valeurs||{})[y])||0),0); }
// §5.3 — badge/delta "Vs Base" d'une opération, factorisé pour être réutilisé tel quel par la colonne
// du tableau des opérations ET par le panneau ouvert au clic sur "Évolution des investissements"
// (§Phase 4) plutôt que d'en recoder une variante.
function renderEcartBadge(o, ecartByOpId){
  const m = ecartByOpId[o.id];
  if (!m) return <span title="Absente de la base" style={{fontSize:'.66rem',fontWeight:700,color:'var(--ce-corail)',background:'#fff1ec',borderRadius:10,padding:'1px 6px',whiteSpace:'nowrap'}}>Nouvelle</span>;
  const noEcart = (!m.deltaAnnees || m.deltaAnnees===0) && (!m.deltaMontant || m.deltaMontant===0);
  const title = 'Base : '+(m.baseOp.annee ?? '—')+' · '+fmtEur(m.baseOp.montant);
  if (noEcart) return <span title={title} style={{fontSize:'.72rem',color:'#9fb3ae'}}>=</span>;
  const parts = [];
  if (m.deltaAnnees) parts.push((m.deltaAnnees>=0?'+':'')+m.deltaAnnees+'a');
  if (m.deltaPct!=null && m.deltaPct!==0) parts.push((m.deltaPct>=0?'+':'')+m.deltaPct.toFixed(0)+'%');
  return <span title={title} style={{fontSize:'.72rem',fontWeight:700,color:'var(--ce-corail)',whiteSpace:'nowrap'}}>{parts.join(' ')}</span>;
}
function ViewInvestissements({residences, operations, setOperations, includeIdentifiees, setIncludeIdentifiees, budgetLignes, setBudgetLignes, gainsGrid, isModified, onReset, baseImport, onSelectResidence}){
  const [search, setSearch] = useState('');
  const [compare, setCompare] = useState(defaultCompareState());
  const [filterNature, setFilterNature] = useState('');
  const [filterTypeCat, setFilterTypeCat] = useState('');
  const [filterStatut, setFilterStatut] = useState('');
  const [filterAnneeMin, setFilterAnneeMin] = useState('');
  const [filterAnneeMax, setFilterAnneeMax] = useState('');
  const [filterMontantMin, setFilterMontantMin] = useState('');
  const [filterMontantMax, setFilterMontantMax] = useState('');
  const [editingLigneId, setEditingLigneId] = useState(null);
  const [editingLigneName, setEditingLigneName] = useState('');
  const [onlyEcarts, setOnlyEcarts] = useState(true);
  const [showDisparues, setShowDisparues] = useState(false);
  // §V8 Phase 6 — famille retenue pour le graphique « Volume d'intervention et montants par année ».
  // Défaut Réhabilitation : c'est la famille qui porte l'arbitrage volume/montant, les RC étant trop
  // nombreux et trop petits pour qu'une lecture par volume y soit parlante.
  const [volFamille, setVolFamille] = useState('Réhabilitation');
  const years = useMemo(()=>computeYearsRange(operations), [operations]);
  const resByCode = useMemo(()=>{ const m={}; residences.forEach((r)=>m[r.code]=r); return m; }, [residences]);

  const visibleOps = useMemo(()=>operations.filter((o)=> includeIdentifiees || o.statut==='programme'), [operations, includeIdentifiees]);

  const families = ['Réhabilitation','Remplacement de composants','Changement de vecteur','Démolition'];
  const famColors = {'Réhabilitation':'#009261','Remplacement de composants':'#58D88B','Changement de vecteur':'#264E46','Démolition':'#FF8364'};

  const aggregation = useMemo(()=>{
    const agg = {}; families.forEach((f)=>{ agg[f]={}; years.forEach((y)=>agg[f][y]=0); });
    visibleOps.forEach((o)=>{ if (o.annee===null||!years.includes(o.annee)) return; const f=familyOfType(o.type); if(!agg[f]) agg[f]={}; agg[f][o.annee]=(agg[f][o.annee]||0)+(o.montant||0); });
    return { agg };
  }, [visibleOps, years]);

  const totalByYear = years.map((y)=> families.reduce((s,f)=>s+(aggregation.agg[f][y]||0),0) + sumBudgetLignesYear(budgetLignes, y));

  // §V8 Phase 6 — seconde lecture du MÊME jeu d'opérations que l'agrégation ci-dessus : le volume en
  // logements là où la première donne le montant en euros. Deux écueils traités ici :
  //   - o.logements peut être nul. On ne substitue JAMAIS r.nbLgt : une opération ne porte pas
  //     nécessairement sur toute la résidence, ce serait une surestimation silencieuse. Les opérations
  //     sans volume sont comptées et affichées sous le graphique.
  //   - le montant moyen par logement n'a de sens que sur les opérations ayant À LA FOIS un montant et
  //     un volume : il est calculé sur ce seul sous-ensemble, avec son taux de couverture.
  // Les lignes budgétaires libres sont exclues des deux séries (elles n'ont pas de volume) pour que
  // barres et courbe portent exactement le même périmètre.
  const volumeMontants = useMemo(()=>{
    const ops = visibleOps.filter((o)=> o.annee!==null && years.includes(o.annee)
      && (volFamille==='Toutes' || familyOfType(o.type)===volFamille));
    const vide = ()=>{ const m={}; years.forEach((y)=>m[y]=0); return m; };
    const volProgramme = vide(), volIdentifie = vide(), montantParAnnee = vide();
    let sansVolume = 0, totalMontant = 0, totalLogements = 0;
    let nComplet = 0, montantComplet = 0, logementsComplet = 0;
    ops.forEach((o)=>{
      const lgt = Number(o.logements) || 0;
      if (!lgt) sansVolume++;
      if (o.statut==='identifie') volIdentifie[o.annee] += lgt; else volProgramme[o.annee] += lgt;
      montantParAnnee[o.annee] += (o.montant||0);
      totalMontant += (o.montant||0);
      totalLogements += lgt;
      if (lgt && o.montant){ nComplet++; montantComplet += o.montant; logementsComplet += lgt; }
    });
    return {
      nbOps: ops.length, sansVolume, totalMontant, totalLogements,
      programme: years.map((y)=>volProgramme[y]),
      identifie: years.map((y)=>volIdentifie[y]),
      montants: years.map((y)=>montantParAnnee[y]),
      moyenneParLgt: logementsComplet>0 ? montantComplet/logementsComplet : null,
      couvertureOps: nComplet,
    };
  }, [visibleOps, years, volFamille]);

  // §5.1 — même agrégation par famille que ci-dessus, mais sur les opérations de la Base, pour la
  // 2ème série de barres empilées atténuées du graphique "Évolution des investissements".
  const baseAggregation = useMemo(()=>{
    if (!baseImport) return null;
    const baseOps = (baseImport.simOperations||[]).filter((o)=> baseImport.includeIdentifiees || o.statut==='programme');
    const agg = {}; families.forEach((f)=>{ agg[f]={}; years.forEach((y)=>agg[f][y]=0); });
    baseOps.forEach((o)=>{ if (o.annee===null||!years.includes(o.annee)) return; const f=familyOfType(o.type); if(!agg[f]) agg[f]={}; agg[f][o.annee]=(agg[f][o.annee]||0)+(o.montant||0); });
    return agg;
  }, [baseImport, years]);

  const hasCompareBase = !!baseImport;
  const compareState = clampCompareState(compare, hasCompareBase);
  const baseTotalByYear = useMemo(()=>{
    if (!hasCompareBase) return null;
    const baseOps = (baseImport.simOperations||[]).filter((o)=> baseImport.includeIdentifiees || o.statut==='programme');
    return years.map((y)=> baseOps.filter((o)=>o.annee===y).reduce((s,o)=>s+(o.montant||0),0) + sumBudgetLignesYear(baseImport.budgetLignes, y));
  }, [baseImport, years, hasCompareBase]);
  // Actuel : seules les années déjà "réalisées" (<= anneeCoupureActuel()) comptent — les années
  // futures du plan simulé n'apparaissent que dans Cible (cf. §2.1 de la spec). Cible = la trajectoire
  // complète telle que déjà calculée ci-dessus (totalByYear), renommée pour la comparaison à 3 états.
  const cutoffActuel = useMemo(()=>anneeCoupureActuel(), []);
  // Actuel s'arrête à l'année de coupure (ligne interrompue au-delà, valeur null pour Chart.js plutôt
  // qu'un 0 qui se lirait à tort comme "aucun investissement prévu") ; Cible seule continue jusqu'à la
  // fin de la trajectoire — convention reprise telle quelle dans la Trajectoire de décarbonation.
  const actuelTotalByYear = years.map((y,i)=> y<=cutoffActuel? totalByYear[i] : null);
  const cibleTotalByYear = totalByYear;
  const sumArr = (arr)=> arr? arr.reduce((a,b)=>a+(b||0),0) : null;
  const deltaActuelBudget = hasCompareBase ? sumArr(actuelTotalByYear) - sumArr(baseTotalByYear) : null;
  const deltaCibleBudget = hasCompareBase ? sumArr(cibleTotalByYear) - sumArr(baseTotalByYear) : null;
  const deltaActuelBudgetPct = hasCompareBase && sumArr(baseTotalByYear)>0 ? (deltaActuelBudget/sumArr(baseTotalByYear)*100) : null;
  const deltaCibleBudgetPct = hasCompareBase && sumArr(baseTotalByYear)>0 ? (deltaCibleBudget/sumArr(baseTotalByYear)*100) : null;

  // Bandeau de compteurs §5.2 : Réhab/RC/Démolition uniquement (pas Vente/Offre nouvelle, cf. §4.2),
  // + "reste à faire" = ce qui appartient encore au plan simulé au-delà de l'année de coupure Actuel
  // (années > cutoffActuel, dans le même jeu d'opérations que Cible — jamais recalculé indépendamment).
  const investCounters = useMemo(()=>{
    if (!hasCompareBase) return null;
    const baseOps = (baseImport.simOperations||[]).filter((o)=> baseImport.includeIdentifiees || o.statut==='programme');
    const actuelOpsRealisees = filterOpsUntil(operations, cutoffActuel).filter((o)=> includeIdentifiees || o.statut==='programme');
    const futureOps = visibleOps.filter((o)=> o.annee!=null && o.annee>cutoffActuel);
    const fams = ['Réhabilitation','Remplacement de composants','Démolition'];
    const counters = countByFamily(baseOps, actuelOpsRealisees, baseImport.data.residences, residences, fams);
    fams.forEach((fam)=>{
      const restant = sumLogementsForFamily(futureOps, fam, resByCode);
      counters[fam].restant = restant;
      counters[fam].restantPct = counters[fam].prevu>0 ? Math.round(restant/counters[fam].prevu*100) : null;
    });
    return counters;
  }, [hasCompareBase, baseImport, operations, visibleOps, residences, resByCode, includeIdentifiees, cutoffActuel]);

  // Écarts d'opérations vs Base (§5.3), intégrés directement dans le tableau "Opérations" existant
  // (colonne "Vs Base" + filtre "uniquement les écarts") plutôt qu'en tableau séparé — appariement par
  // résidence + nature exacte via la fonction unique matchOperations (cf. §5.4 fiche résidence, même
  // fonction réutilisée aux deux endroits). Comparaison sur l'ensemble des opérations (pas bornée à
  // anneeCoupureActuel) : l'objectif est de voir tous les écarts du plan simulé actuel vs Base, y
  // compris ceux qui portent sur des années futures (un plan qui a glissé dans le temps).
  const ecartsMatch = useMemo(()=>{
    if (!hasCompareBase) return null;
    return matchOperations(operations, baseImport.simOperations||[]);
  }, [hasCompareBase, operations, baseImport]);
  const ecartByOpId = useMemo(()=>{
    const m = {};
    if (ecartsMatch) ecartsMatch.matched.forEach((mt)=>{ m[mt.actuelOp.id] = mt; });
    return m;
  }, [ecartsMatch]);
  // Les opérations "disparues" (présentes en Base, absentes du plan actuel) n'ont pas de ligne
  // correspondante dans le tableau Opérations (pas d'id éditable) : listées à part, en dessous.
  const disparuesRows = ecartsMatch ? ecartsMatch.disparues : [];

  const typeOptions = useMemo(()=>{
    const s = new Set(Object.keys(gainsGrid));
    // Le sélecteur lié (colonne "Nature des travaux" et filtre "Toutes natures de travaux") édite/
    // filtre o.nature, pas o.type (catégorie brute RC/Réha./Démolition — cf. resolveGain, plus haut
    // dans le moteur, qui utilise déjà en priorité o.nature). Peupler la liste depuis o.type faisait
    // apparaître les mauvaises valeurs et, pire, une nature importée absente de gainsGrid (variante
    // d'orthographe, ancienne grille) ne matchait aucune <option> : le <select> retombait visuellement
    // sur "— À sélectionner —" alors que l'état contenait toujours la vraie nature, et le moindre choix
    // dans la liste écrasait silencieusement cette nature d'origine.
    // o.nature est null pour une opération venant d'être ajoutée (§9.3, champs vides à la création) :
    // sans ce garde, Array.from(s).sort() tente null.localeCompare(...) et fait planter tout le rendu
    // React (aucun error boundary dans l'app) dès qu'une opération est ajoutée.
    operations.forEach((o)=>{ if (o.nature) s.add(o.nature); });
    return Array.from(s).sort((a,b)=>a.localeCompare(b,'fr'));
  }, [gainsGrid, operations]);

  const hasActiveFilters = !!(search.trim() || filterNature || filterTypeCat || filterStatut || filterAnneeMin!=='' || filterAnneeMax!=='' || filterMontantMin!=='' || filterMontantMax!=='');
  function resetFilters(){
    setSearch(''); setFilterNature(''); setFilterTypeCat(''); setFilterStatut('');
    setFilterAnneeMin(''); setFilterAnneeMax(''); setFilterMontantMin(''); setFilterMontantMax('');
  }

  const filteredOps = useMemo(()=>{
    const s = ceNorm(search);
    const aMin = filterAnneeMin===''? null : Number(filterAnneeMin);
    const aMax = filterAnneeMax===''? null : Number(filterAnneeMax);
    const mMin = filterMontantMin===''? null : Number(filterMontantMin);
    const mMax = filterMontantMax===''? null : Number(filterMontantMax);
    return operations.filter((o)=>{
      const r = resByCode[o.resCode];
      if (s && !(ceNorm(o.nature||o.type).includes(s) || ceNorm(o.resCode).includes(s) || (r && ceNorm(r.nom).includes(s)))) return false;
      if (filterNature && (o.nature||o.type)!==filterNature) return false;
      if (filterTypeCat && typeCategorie(o.type)!==filterTypeCat) return false;
      if (filterStatut && o.statut!==filterStatut) return false;
      if (aMin!==null && (o.annee===null || o.annee<aMin)) return false;
      if (aMax!==null && (o.annee===null || o.annee>aMax)) return false;
      if (mMin!==null && (o.montant||0)<mMin) return false;
      if (mMax!==null && (o.montant||0)>mMax) return false;
      if (onlyEcarts && hasCompareBase){
        const m = ecartByOpId[o.id];
        const isEcart = !m || (m.deltaAnnees && m.deltaAnnees!==0) || (m.deltaMontant && m.deltaMontant!==0);
        if (!isEcart) return false;
      }
      return true;
    }).map((o)=>Object.assign({}, o, {resNom: (resByCode[o.resCode]||{}).nom || o.resCode}));
  }, [operations, search, filterNature, filterTypeCat, filterStatut, filterAnneeMin, filterAnneeMax, filterMontantMin, filterMontantMax, resByCode, onlyEcarts, hasCompareBase, ecartByOpId]);

  function updateOp(id, patch){ setOperations(operations.map((o)=> o.id===id? Object.assign({},o,patch) : o)); }
  function deleteOp(id){ setOperations(operations.filter((o)=>o.id!==id)); }
  function addLigne(){
    const id = genLocalId('ligne');
    setBudgetLignes(budgetLignes.concat([{id, nom:'Nouvelle ligne', valeurs:{}}]));
  }
  function removeLigne(id){ setBudgetLignes(budgetLignes.filter((l)=>l.id!==id)); }
  function updateLigneValeur(id, year, rawVal){
    setBudgetLignes(budgetLignes.map((l)=> l.id===id? Object.assign({},l,{valeurs:Object.assign({},l.valeurs,{[year]: rawVal===''? undefined : Number(rawVal)})}) : l));
  }
  function commitLigneName(id){
    setBudgetLignes(budgetLignes.map((l)=> l.id===id? Object.assign({},l,{nom: editingLigneName || l.nom}) : l));
    setEditingLigneId(null);
  }
  function addOp(){
    // Garde nécessaire : si les filtres transverses actifs excluent toutes les résidences,
    // residences[0] est undefined — sans cette garde, l'opération était créée avec un
    // resCode undefined, invisible dans toutes les vues et impossible à retrouver/supprimer.
    if (!residences.length) return;
    // §9.3 — tous les champs modifiables démarrent vides pour repérer immédiatement la ligne
    // nouvellement ajoutée (au lieu de pré-remplir résidence/nature/année/montant par défaut).
    const newOp = { id:genLocalId('op_new'), resCode:null, nature:null, type:null, statut:null, annee:null, anneeFin:null, montant:null, logements:null, origine:'ajout' };
    setOperations([newOp].concat(operations));
  }

  // Colonnes resserrées : largeurs explicites + mode `dense` du tableau (padding réduit, cf.
  // ce-table-dense) pour compenser l'ajout de la colonne "Vs Base" sans faire disparaître le contenu
  // essentiel (nature des travaux, année) qui doit rester lisible sans troncature.
  // Panneau ouvert au clic sur une barre de "Évolution des investissements" (§Phase 4) : un clic
  // isole une année + une famille — le "Base ou Actuel" de la barre cliquée ne change que la donnée
  // lue pour resoudre l'année/famille, la liste affichée reste toujours les opérations Actuel (colonne
  // Vs Base déjà réutilisée, cf. renderEcartBadge) puisque les opérations "disparues" n'ont justement
  // pas de ligne côté Actuel — confirmé avec Jules.
  const [investPanel, setInvestPanel] = useState(null); // {year, famille, title, rows}
  function toggleInvestPanel(year, famille){
    setInvestPanel((cur)=> (cur && cur.year===year && cur.famille===famille) ? null : (()=>{
      const rows = visibleOps.filter((o)=>o.annee===year && familyOfType(o.type)===famille);
      return { year, famille, title: famille+' — '+year+' ('+rows.length+' opération'+(rows.length>1?'s':'')+')', rows };
    })());
  }

  const opsCols = [
    {key:'_fiche', label:'', render:(o)=>{
      const r = resByCode[o.resCode];
      return <button className="ce-btn-outline ce-btn-sm" disabled={!r} title={r? "Ouvrir la fiche résidence" : ""} onClick={()=>r && onSelectResidence && onSelectResidence(r)}>Fiche</button>;
    }},
    {key:'resCode', label:'Résidence', render:(o)=>{
      const inList = residences.some((r)=>r.code===o.resCode);
      return (
        <select className="ce-select" style={{width:120}} value={o.resCode ?? ''} onChange={(e)=>{
          // <option value=...> est toujours une chaîne côté DOM, même quand r.code est numérique
          // (cas courant) : sans cette résolution, resCode passait de number à string, ce qui cassait
          // silencieusement le filtrage par filteredCodes.has(resCode) (comparaison stricte) et faisait
          // disparaître la ligne dès qu'une résidence était choisie.
          const match = residences.find((r)=>String(r.code)===e.target.value);
          updateOp(o.id,{resCode: match? match.code : e.target.value});
        }}>
          <option value="" disabled>— À sélectionner —</option>
          {!inList && o.resCode && <option value={o.resCode}>{o.resNom || o.resCode} (hors filtre)</option>}
          {residences.map((r)=><option key={r.code} value={r.code}>{r.nom||r.code}</option>)}
        </select>
      );
    }},
    {key:'nature', label:'Nature des travaux', render:(o)=>{
      const generic = !hasKnownDpeGain(o, gainsGrid);
      const val = o.nature ?? o.type ?? '';
      const valInList = !val || typeOptions.includes(val);
      return (
        <div>
          <select className="ce-select" style={{width:185}} value={val} onChange={(e)=>{
            const nature = e.target.value;
            // Auto-renseigne le Type de travaux brut (RC/Réha./Changement de vecteur/Démolition) à
            // partir de la Nature choisie, avec les mêmes règles de détection que familyOfType() —
            // indispensable pour les opérations ajoutées manuellement (type toujours vide sinon), et
            // cohérent pour les opérations importées si la Nature est modifiée après coup : sans ça,
            // le filtre "Type de travaux" et le graphique empilé par famille de travaux catégorisaient
            // mal (ou pas du tout) ces opérations.
            updateOp(o.id,{nature, type: typeCategorie(nature)});
          }}>
            <option value="" disabled>— À sélectionner —</option>
            {/* Nature réellement présente sur l'opération mais absente de typeOptions (variante
                d'orthographe, ancienne grille) : on l'affiche telle quelle plutôt que de laisser le
                <select> retomber silencieusement sur une autre option au premier changement. */}
            {!valInList && <option value={val}>{val} (hors liste)</option>}
            {typeOptions.map((t)=><option key={t} value={t}>{t}</option>)}
          </select>
          {val && generic && <div style={{fontSize:'.62rem',color:'var(--ce-corail)',marginTop:2}}>type générique — gain DPE non calculé</div>}
        </div>
      );
    }},
    {key:'type', label:'Type', render:(o)=><span style={{color:'#9fb3ae',fontSize:'.76rem'}}>{o.type || 'N.R.'}</span>},
    {key:'statut', label:'Statut', render:(o)=>(
      <select className="ce-select" style={{width:106}} value={o.statut ?? ''} onChange={(e)=>updateOp(o.id,{statut:e.target.value})}>
        <option value="" disabled>— —</option>
        <option value="programme">Programmé</option>
        <option value="identifie">Identifié</option>
      </select>
    )},
    {key:'annee', label:'Année', render:(o)=><input className="ce-input" style={{width:72}} type="number" min="2000" max="2100" step="1" value={o.annee ?? ''} onChange={(e)=>updateOp(o.id,{annee: e.target.value===''? null: Number(e.target.value)})} />},
    {key:'anneeFin', label:'Fin trav.', render:(o)=><input className="ce-input" style={{width:72}} type="number" min="2000" max="2100" step="1" value={o.anneeFin ?? ''} onChange={(e)=>updateOp(o.id,{anneeFin: e.target.value===''? null: Number(e.target.value)})} />},
    {key:'montant', label:'Coût TTC', render:(o)=><input className="ce-input" style={{width:95}} type="number" min="0" value={o.montant ?? ''} onChange={(e)=>updateOp(o.id,{montant: e.target.value===''? null: Number(e.target.value)})} />},
    {key:'_coutLgt', label:'€/lgt', render:(o)=> <span style={{fontSize:'.76rem'}}>{(o.logements>0 && o.montant!==null && o.montant!==undefined) ? fmtEur(o.montant/o.logements) : '—'}</span>},
  ].concat(hasCompareBase ? [
    // §5.3 — écart vs Base intégré directement dans le tableau des opérations (colonne dédiée), plutôt
    // qu'un tableau séparé : chaque ligne reste éditable normalement, cette colonne n'est qu'une lecture.
    // Contenu volontairement court (détail complet en info-bulle) pour ne pas élargir le tableau.
    {key:'_ecartBase', label:'Vs Base', render:(o)=>renderEcartBadge(o, ecartByOpId)},
  ] : []).concat([
    {key:'_actions', label:'', render:(o)=><button className="ce-btn-outline ce-btn-sm" onClick={()=>deleteOp(o.id)}>Suppr.</button>},
  ]);

  return (
    <div style={{padding:24,display:'flex',flexDirection:'column',gap:20}}>
      {investCounters && <ImpactCountersRow counters={investCounters} />}
      <div className="ce-card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10,marginBottom:12}}>
          <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700}}>Évolution des investissements ({years[0]}–{years[years.length-1]})</h2>
          <div style={{display:'flex',gap:14,alignItems:'center'}}>
            <label style={{fontSize:'.78rem',color:'var(--ce-vert-fonce)',display:'flex',alignItems:'center',gap:6,cursor:'pointer'}}>
              <input type="checkbox" checked={includeIdentifiees} onChange={(e)=>setIncludeIdentifiees(e.target.checked)} />
              Inclure les opérations identifiées
            </label>
            {isModified && <button className="ce-btn-corail ce-btn-sm" onClick={onReset}>Réinitialiser la simulation</button>}
          </div>
        </div>
        <ChartCanvas type="bar" height={300} plugins={CE_ECART_LABELS_PLUGINS} data={{
          labels: years,
          // Base d'abord (stack rendu en 1er = barre de gauche dans chaque paire), Actuel ensuite (barre
          // de droite) — Chart.js positionne les stacks dans l'ordre de 1re apparition des datasets.
          datasets: (baseAggregation? families.map((f)=>({ label:'Base — '+f, data: years.map((y)=>baseAggregation[f][y]||0), backgroundColor: hexToRgba(famColors[f],0.35), stack:'base' })) : [])
            .concat(families.map((f)=>({ label:f, data: years.map((y)=>aggregation.agg[f][y]||0), backgroundColor: famColors[f], stack:'actuel' })))
            .concat(budgetLignes.map((l,i)=>({ label:l.nom||'Ligne budgétaire', data: years.map((y)=>Number((l.valeurs||{})[y])||0), backgroundColor: BUDGET_LIGNE_COLORS[i%BUDGET_LIGNE_COLORS.length], stack:'actuel' })))
          // §5.1 — 2ème série de barres empilées "Base", mêmes couleurs par famille mais atténuées
          // (détail par famille conservé, pas une barre grisée uniforme). Légende masquée pour ces
          // séries (cf. filter du plugin legend ci-dessous) : la teinte pâle suffit à les identifier
          // comme "Base", pas besoin de dupliquer chaque nom de famille une 2e fois dans la légende.
        }} options={{
          layout: baseAggregation? {padding:{bottom:22}} : undefined,
          scales:{ x:{stacked:true}, y:{stacked:true, ticks:{callback:(v)=>fmtKEur(v)}} },
          plugins:{
            tooltip:{ callbacks:{ label:(ctx)=> ctx.dataset.label+': '+fmtEur(ctx.raw) } },
            // Masque les séries "Base — X" de la légende (déjà représentées par leur teinte pâle sur
            // les barres, cf. commentaire ci-dessus) — évite de répéter chaque famille deux fois.
            legend:{ labels:{ filter:(item)=>!item.text.startsWith('Base — ') } },
            ...(baseAggregation? { ceEcartLabels:{
              // % d'écart Actuel vs Base par année, dessiné par CE_ECART_LABELS_PLUGIN directement sous
              // la barre "Actuel" — jamais sous Base. Base occupe maintenant les datasets [0..families.
              // length-1] (barre de gauche), donc le 1er dataset du stack 'actuel' est à cet index-là.
              values: years.map((y,i)=> baseTotalByYear[i]>0 ? ((totalByYear[i]-baseTotalByYear[i])/baseTotalByYear[i]*100) : null),
              datasetIndex: families.length, colorPos:'#FF8364', colorNeg:'#009261', // = --ce-corail / --ce-vert-principal (Canvas n'accepte pas var(--x))
            } } : {}),
          },
          onClick:(evt,elements)=>{
            if (!elements.length) return;
            const el = elements[0];
            const year = years[el.index];
            const nBaseSets = baseAggregation ? families.length : 0;
            // Les datasets des lignes budgétaires libres (après les 2 blocs familles) n'ont pas
            // d'opération associée (montant saisi à la main, pas un import) : clic sans effet.
            const famille = el.datasetIndex<nBaseSets ? families[el.datasetIndex]
              : (el.datasetIndex-nBaseSets)<families.length ? families[el.datasetIndex-nBaseSets] : null;
            if (famille) toggleInvestPanel(year, famille);
          },
        }} />
        <p style={{fontSize:'.7rem',color:'var(--ce-vert-fonce)',marginTop:8,lineHeight:1.5}}>
          Chaque barre empile le montant des opérations par famille de travaux (Réhabilitation, Remplacement
          de composants, Changement de vecteur, Démolition), plus une éventuelle ligne budgétaire libre
          (montant non ventilé par opération).{baseAggregation? ' Quand une Base est chargée, une 2ème barre en teinte pâle (même couleur par famille) apparaît à côté — cliquer sur l\'une ou l\'autre ouvre le détail des opérations de cette année et cette famille.' : ' Cliquer sur un segment ouvre le détail des opérations de cette année et cette famille.'}
        </p>
        {baseAggregation && (
          <div style={{fontSize:'.68rem',color:'var(--ce-vert-fonce)',marginTop:4,display:'flex',alignItems:'center',gap:6}}>
            <span style={{display:'inline-block',width:12,height:12,borderRadius:3,background:hexToRgba(famColors['Réhabilitation'],0.35)}}></span>
            Teinte pâle = Base « {baseImport.nom} » — % sous chaque barre = écart Actuel vs Base
          </div>
        )}
        {investPanel && (
          <ResidenceListPanel title={investPanel.title} rows={investPanel.rows} onClose={()=>setInvestPanel(null)}
            renderRow={(o)=>{
              const r = resByCode[o.resCode];
              return (
                <div onClick={()=>r && onSelectResidence && onSelectResidence(r)} style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,fontSize:'.76rem',color:'var(--ce-vert-fonce)',padding:'3px 0',borderBottom:'1px solid #f0f5f3',cursor:(r&&onSelectResidence)?'pointer':'default'}}>
                  <span>{(r&&r.nom)||o.resCode||'—'} <span style={{color:'#9fb3ae'}}>— {o.nature||o.type||'Non renseigné'} · {o.annee} · {fmtEur(o.montant)}</span></span>
                  {hasCompareBase && renderEcartBadge(o, ecartByOpId)}
                </div>
              );
            }} />
        )}
      </div>

      {/* §V8 Phase 6 — placée juste sous « Évolution des investissements » : c'est la même série
          d'opérations lue en volume plutôt qu'en euros, et les deux graphiques se lisent sur le même
          axe d'années sans défilement. La reléguer dans un onglet séparé casserait ce lien. */}
      <div className="ce-card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10,flexWrap:'wrap',gap:8}}>
          <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700}}>Volume d'intervention et montants par année</h2>
          <select className="ce-select" style={{width:220}} value={volFamille} onChange={(e)=>setVolFamille(e.target.value)}>
            {families.map((f)=><option key={f} value={f}>{f}</option>)}
            <option value="Toutes">Toutes les familles</option>
          </select>
        </div>
        <ChartCanvas type="bar" height={300} data={{
          labels: years,
          datasets: [
            { type:'bar', label:'Logements — Programmé', data: volumeMontants.programme, backgroundColor:'#009261', stack:'vol', borderRadius:4 },
            // Quand « Inclure les opérations identifiées » est décochée, la pile disparaît — elle ne
            // devient pas grise : une barre à zéro se lirait comme « aucune opération identifiée ».
            ...(includeIdentifiees ? [{ type:'bar', label:'Logements — Identifié', data: volumeMontants.identifie, backgroundColor:'#58D88B', stack:'vol', borderRadius:4 }] : []),
            { type:'line', label:'Montants investis (M€)', data: volumeMontants.montants.map((m)=>m/1e6), borderColor:'#264E46', backgroundColor:'#264E46', pointRadius:3, fill:false, yAxisID:'y1' },
          ]
        }} options={{
          scales:{
            x:{ stacked:true },
            y:{ stacked:true, beginAtZero:true, title:{display:true,text:'Logements concernés'} },
            y1:{ beginAtZero:true, position:'right', grid:{drawOnChartArea:false}, title:{display:true,text:'Montants (M€)'} },
          }
        }} />
        <div style={{display:'flex',gap:12,flexWrap:'wrap',marginTop:14}}>
          <div style={{flex:1,minWidth:180,background:'#f6faf8',borderRadius:8,padding:'10px 14px'}}>
            <div style={{fontSize:'.68rem',color:'var(--ce-vert-fonce)'}}>Total investi</div>
            <div style={{fontSize:'1.05rem',fontWeight:700,color:'var(--ce-vert-tres-fonce)'}}>{fmtEur(volumeMontants.totalMontant)}</div>
          </div>
          <div style={{flex:1,minWidth:180,background:'#f6faf8',borderRadius:8,padding:'10px 14px'}}>
            <div style={{fontSize:'.68rem',color:'var(--ce-vert-fonce)'}}>Logements concernés</div>
            <div style={{fontSize:'1.05rem',fontWeight:700,color:'var(--ce-vert-tres-fonce)'}}>{fmtNum(volumeMontants.totalLogements)}</div>
          </div>
          <div style={{flex:1,minWidth:180,background:'#f6faf8',borderRadius:8,padding:'10px 14px'}}>
            <div style={{fontSize:'.68rem',color:'var(--ce-vert-fonce)'}}>Montant moyen / logement</div>
            <div style={{fontSize:'1.05rem',fontWeight:700,color:'var(--ce-vert-tres-fonce)'}}>{volumeMontants.moyenneParLgt!==null? fmtEur(volumeMontants.moyenneParLgt) : '—'}</div>
            <div style={{fontSize:'.64rem',color:'#9fb3ae',marginTop:2}}>
              {volumeMontants.moyenneParLgt!==null
                ? 'calculé sur '+volumeMontants.couvertureOps+' opération'+(volumeMontants.couvertureOps>1?'s':'')+' sur '+volumeMontants.nbOps
                : 'aucune opération ne porte à la fois un montant et un volume'}
            </div>
          </div>
        </div>
        <p style={{fontSize:'.7rem',color:'var(--ce-vert-fonce)',marginTop:10,lineHeight:1.5}}>
          Les barres empilent le nombre de logements concernés par année, réparti entre opérations programmées
          et identifiées ; la courbe donne les montants investis sur le même périmètre, en millions d'euros
          (axe de droite). Le montant moyen par logement n'est calculé que sur les opérations portant à la fois
          un montant et un volume.
          {volumeMontants.sansVolume>0 && ' '+volumeMontants.sansVolume+' opération'+(volumeMontants.sansVolume>1?'s':'')+' sur '+volumeMontants.nbOps+' ne renseigne'+(volumeMontants.sansVolume>1?'nt':'')+' aucun volume en logements : elle'+(volumeMontants.sansVolume>1?'s comptent':' compte')+' dans les montants, pas dans les barres.'}
          {' '}Les lignes budgétaires libres sont exclues de ce graphique — barres comme courbe — car elles ne
          portent pas de volume en logements.
        </p>
      </div>

      <div className="ce-card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10,flexWrap:'wrap',gap:8}}>
          <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700}}>Comparaison — Base / Actuel / Cible</h2>
          <CompareCheckboxes checked={compareState} onChange={setCompare} hasBase={hasCompareBase} />
        </div>
        {hasCompareBase && (deltaActuelBudget!==null || deltaCibleBudget!==null) && (
          <div style={{fontSize:'.78rem',color:'var(--ce-vert-fonce)',marginBottom:10}}>
            Δ budget total vs base « {baseImport.nom} » :{' '}
            {compareState.actuel && (<span>Actuel <b style={{color: deltaActuelBudget>=0?'var(--ce-corail)':'var(--ce-vert-principal)'}}>{deltaActuelBudget>=0?'+':''}{fmtEur(deltaActuelBudget)}</b>{deltaActuelBudgetPct!==null && <span> ({deltaActuelBudgetPct>=0?'+':''}{deltaActuelBudgetPct.toFixed(0)}%)</span>}</span>)}
            {compareState.actuel && compareState.cible && <span> · </span>}
            {compareState.cible && (<span>Cible <b style={{color: deltaCibleBudget>=0?'var(--ce-corail)':'var(--ce-vert-principal)'}}>{deltaCibleBudget>=0?'+':''}{fmtEur(deltaCibleBudget)}</b>{deltaCibleBudgetPct!==null && <span> ({deltaCibleBudgetPct>=0?'+':''}{deltaCibleBudgetPct.toFixed(0)}%)</span>}</span>)}
          </div>
        )}
        <ChartCanvas type="line" height={260} data={{
          labels: years,
          datasets: [
            // §14.3 — aucune résidence base ne passe les filtres transverses actifs : ne pas
            // inclure le dataset "Base" plutôt que de le tracer à 0 (une ligne plate à zéro se lit
            // à tort comme "la base ne prévoyait aucun investissement").
            ...(compareState.base && hasCompareBase && baseImport.data.residences.length>0? [{ label:'Base — '+baseImport.nom, data: baseTotalByYear, borderColor:COMPARE_COLORS.base, backgroundColor:COMPARE_COLORS.base, pointRadius:2, tension:.2 }] : []),
            ...(compareState.actuel? [{ label:'Actuel', data: actuelTotalByYear, borderColor:COMPARE_COLORS.actuel, backgroundColor:COMPARE_COLORS.actuel, pointRadius:2, tension:.2 }] : []),
            ...(compareState.cible? [{ label:'Cible', data: cibleTotalByYear, borderColor:COMPARE_COLORS.cible, backgroundColor:COMPARE_COLORS.cible, pointRadius:2, tension:.2 }] : []),
          ]
        }} options={{ scales:{ y:{ beginAtZero:true, ticks:{callback:(v)=>fmtKEur(v)} } },
          plugins:{ tooltip:{ callbacks:{ label:(ctx)=> ctx.dataset.label+': '+fmtEur(ctx.raw) } } } }} />
        <p style={{fontSize:'.7rem',color:'var(--ce-vert-fonce)',marginTop:10,lineHeight:1.5}}>
          Base = budget de la version sauvegardée comparée ; Actuel = budget déjà réalisé jusqu'à l'année
          en cours (ligne interrompue au-delà) ; Cible = budget de la trajectoire simulée jusqu'à son terme.
          Le Δ ci-dessus mesure l'écart de budget total entre Actuel/Cible et Base — positif si le plan
          simulé a plus dépensé/prévu que la Base.
        </p>
      </div>

      <div className="ce-card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
          <h3 style={{fontSize:'.85rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700}}>Lignes budgétaires libres (par année, en €)</h3>
          <button className="ce-btn ce-btn-sm" onClick={addLigne}>+ Ajouter une ligne</button>
        </div>
        {budgetLignes.length===0 && <div style={{fontSize:'.78rem',color:'#9fb3ae'}}>Aucune ligne budgétaire libre — utile pour représenter une enveloppe non ventilée par opération.</div>}
        {budgetLignes.map((l,i)=>(
          <div key={l.id} style={{marginBottom:14,paddingBottom:14,borderBottom: i<budgetLignes.length-1? '1px solid #eef4f2':'none'}}>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}>
              <span style={{width:10,height:10,borderRadius:'50%',background:BUDGET_LIGNE_COLORS[i%BUDGET_LIGNE_COLORS.length],display:'inline-block',flexShrink:0}}></span>
              {editingLigneId===l.id ? (
                <input className="ce-input" value={editingLigneName} autoFocus
                  onChange={(e)=>setEditingLigneName(e.target.value)}
                  onBlur={()=>commitLigneName(l.id)}
                  onKeyDown={(e)=>{ if(e.key==='Enter') e.target.blur(); else if(e.key==='Escape') setEditingLigneId(null); }} />
              ) : (
                <span style={{fontWeight:600,color:'var(--ce-vert-tres-fonce)',cursor:'text'}} title="Cliquer pour renommer"
                  onClick={()=>{setEditingLigneId(l.id); setEditingLigneName(l.nom);}}>{l.nom}</span>
              )}
              <button className="ce-btn-outline ce-btn-sm" onClick={()=>removeLigne(l.id)} style={{marginLeft:'auto'}}>Suppr.</button>
            </div>
            <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              {years.map((y)=>(
                <div key={y} style={{display:'flex',flexDirection:'column',gap:3}}>
                  <label style={{fontSize:'.68rem',color:'var(--ce-vert-fonce)'}}>{y}</label>
                  <input className="ce-input" style={{width:92}} type="number" min="0" value={(l.valeurs||{})[y]||''}
                    placeholder="0"
                    onChange={(e)=>updateLigneValeur(l.id, y, e.target.value)} />
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>

      <div className="ce-card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10,marginBottom:12}}>
          <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700}}>Opérations ({filteredOps.length} / {operations.length})</h2>
          <button className="ce-btn ce-btn-sm" onClick={addOp} disabled={!residences.length} title={!residences.length? "Aucune résidence ne correspond aux filtres actifs" : ""}>+ Ajouter une opération</button>
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'flex-end',marginBottom:14}}>
          <input className="ce-input" placeholder="Rechercher résidence / nature…" value={search} onChange={(e)=>setSearch(e.target.value)} style={{width:200}} />
          <select className="ce-select" value={filterNature} onChange={(e)=>setFilterNature(e.target.value)}>
            <option value="">Toutes natures de travaux</option>
            {typeOptions.map((t)=><option key={t} value={t}>{t}</option>)}
          </select>
          <select className="ce-select" value={filterTypeCat} onChange={(e)=>setFilterTypeCat(e.target.value)}>
            <option value="">Tous types de travaux</option>
            {TYPE_CAT_OPTIONS.map((t)=><option key={t} value={t}>{t}</option>)}
          </select>
          <select className="ce-select" value={filterStatut} onChange={(e)=>setFilterStatut(e.target.value)}>
            <option value="">Tous statuts</option>
            <option value="programme">Programmé</option>
            <option value="identifie">Identifié</option>
          </select>

            <label style={{fontSize:'.65rem',color:'var(--ce-vert-fonce)'}}>Année (de)</label>

                  </div>

/* ---------------- Décarbonation & DPE ---------------- */
const CLASS_ORDER_AG = CLASS_ORDER.slice().reverse(); // A -> G
function classRangeAG(lo, hi){
  const i1 = CLASS_ORDER_AG.indexOf(lo), i2 = CLASS_ORDER_AG.indexOf(hi);
  if (i1===-1 || i2===-1) return [];
  return CLASS_ORDER_AG.slice(Math.min(i1,i2), Math.max(i1,i2)+1);
}
/* V9 §1 — restitution de la feuille Excel « 4. Trajectoire décarbonation » : ses graphiques combinés
   (volume d'opérations en barres, intensité en courbe sur un axe secondaire) et l'intégralité de son
   tableau annuel. La feuille en porte trois, dont deux quasi identiques : celui qui superpose les deux
   courbes sur les barres « Nb lgt réhabilités » n'est pas repris, ses deux séries étant déjà lisibles
   sur les deux graphiques ci-dessous, chacune en regard des opérations qui la font bouger. */
function fmtDec(n, d){
  if (n===null || n===undefined || isNaN(n)) return '—';
  return new Intl.NumberFormat('fr-FR',{minimumFractionDigits:d, maximumFractionDigits:d}).format(n);
}
const DECARBO_SECTIONS = [
  { titre:null, lignes:[
    { label:'Total m²', get:(x)=>fmtNum(x.surfaceM2) },
  ]},
  { titre:'Énergie', lignes:[
    { label:'Nb lgt réhabilités thermiquement', get:(x)=>fmtNum(x.nbLgtRehab) },
    { label:'Gain consommation (kWh)', get:(x)=>fmtNum(x.gainConsoKwh), signe:true },
    { label:'Consommation (GWh)', get:(x)=>fmtDec(x.consoKwh/1e6, 1) },
    { label:'Consommation (kWh / m²)', get:(x)=>fmtDec(x.consoKwhM2, 1) },
  ]},
  { titre:'Empreinte carbone (GES)', lignes:[
    { label:'Nb chgt de vecteur énergétique', get:(x)=>fmtNum(x.nbChgtVecteur) },
    { label:'Gain émissions (kgCO2e)', get:(x)=>fmtNum(x.gainEmissionsKg), signe:true },
    { label:'Émissions (tCO2e)', get:(x)=>fmtDec(x.emissionsKg/1000, 1) },
    { label:'Émissions (kgCO2e / m²)', get:(x)=>fmtDec(x.emissionsKgM2, 2) },
  ]},
];
function DecarbonationTrajectoire({decarbo, refs, ventesSansAnnee}){
  const l = decarbo.lignes;
  const annees = l.map((x)=>x.annee);
  const classesRepart = ['A','B','C','D','E','F','G','NR'];
  // Une classe entièrement vide sur toute la trajectoire n'apporte aucune information : on ne la
  // laisse pas occuper une ligne du tableau (même règle que le graphique de trajectoire empilée).
  const classesVisibles = classesRepart.filter((cl)=>l.some((x)=>(x.repartition[cl]||0)>0));
  const cellLabel = {position:'sticky', left:0, background:'#fff', zIndex:1, fontWeight:600, whiteSpace:'nowrap'};
  const cellLabelTh = Object.assign({}, cellLabel, {background:'var(--ce-vert-tres-clair)', zIndex:2});

  function comboChart(titreBarres, cleBarres, couleurBarres, titreCourbe, cleCourbe, couleurCourbe, uniteCourbe){
    return (
      <ChartCanvas type="bar" height={320} data={{
        labels: annees,
        datasets: [
          { label:titreBarres, data:l.map((x)=>x[cleBarres]), backgroundColor:couleurBarres, yAxisID:'y', order:2 },
          { type:'line', label:titreCourbe, data:l.map((x)=>x[cleCourbe]), borderColor:couleurCourbe, backgroundColor:couleurCourbe, yAxisID:'y1', pointRadius:3, tension:.2, order:1 },
        ]
      }} options={{
        scales:{
          y:{ beginAtZero:true, position:'left', title:{display:true, text:'Logements'} },
          // Axe secondaire non forcé à zéro : l'écart entre années serait illisible sur une échelle
          // partant de 0 alors que l'intensité varie de quelques dizaines d'unités sur dix ans.
          y1:{ position:'right', grid:{drawOnChartArea:false}, title:{display:true, text:uniteCourbe} },
        },
        plugins:{ tooltip:{ callbacks:{ label:(ctx)=> ctx.dataset.label+' : '+(ctx.dataset.type==='line'? fmtDec(ctx.raw,1)+' '+uniteCourbe : fmtNum(ctx.raw)) } } },
      }} />
    );
  }

  return (
    <React.Fragment>
      <div className="ce-card">
        <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700,marginBottom:12}}>
          Évolution des consommations énergétiques (kWh / m²)
        </h2>
        {comboChart('Nb lgt réhabilités thermiquement','nbLgtRehab','#58D88B','Consommation (kWh / m²)','consoKwhM2','#009261','kWh / m²')}
      </div>
      <div className="ce-card">
        <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700,marginBottom:12}}>
          Évolution des émissions de GES (kgCO2e / m²)
        </h2>
        {comboChart('Nb chgt de vecteur énergétique','nbChgtVecteur','#CDF3DC','Émissions (kgCO2e / m²)','emissionsKgM2','#264E46','kgCO2e / m²')}
      </div>
      <div className="ce-card">
        <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700,marginBottom:12}}>
          Trajectoire de décarbonation — tableau annuel
        </h2>
        <div style={{overflowX:'auto'}}>
          <table className="ce-table ce-table-dense">
            <thead>
              <tr>
                <th style={cellLabelTh}></th>
                {annees.map((y)=><th key={y} style={{textAlign:'right'}}>{y}</th>)}
              </tr>
            </thead>
            <tbody>
              {DECARBO_SECTIONS.map((sec, si)=>(
                <React.Fragment key={si}>
                  {sec.titre && (
                    <tr>
                      <td style={Object.assign({}, cellLabel, {background:'var(--ce-vert-tres-clair)',fontWeight:700})}>{sec.titre}</td>
                      {annees.map((y)=><td key={y} style={{background:'var(--ce-vert-tres-clair)'}}></td>)}
                    </tr>
                  )}
                  {sec.lignes.map((ln)=>(
                    <tr key={ln.label}>
                      <td style={cellLabel}>{ln.label}</td>
                      {l.map((x)=>{
                        const v = ln.get(x);
                        // Les deux lignes de gain sont négatives quand la trajectoire décarbone :
                        // on les colore dans ce sens-là (vert = baisse), inverse des lignes de budget.
                        const couleur = ln.signe? (String(v).trim().startsWith('-')? 'var(--ce-vert-principal)' : (v==='0'? 'inherit' : 'var(--ce-corail)')) : 'inherit';
                        return <td key={x.annee} style={{textAlign:'right',fontVariantNumeric:'tabular-nums',color:couleur}}>{v}</td>;
                      })}
                    </tr>
                  ))}
                </React.Fragment>
              ))}
              <tr>
                <td style={Object.assign({}, cellLabel, {background:'var(--ce-vert-tres-clair)',fontWeight:700})}>Répartition des DPE énergie (nombre de logements)</td>
                {l.map((x)=><td key={x.annee} style={{background:'var(--ce-vert-tres-clair)',textAlign:'right',fontWeight:700,fontVariantNumeric:'tabular-nums'}}>{fmtNum(x.totalLgt)}</td>)}
              </tr>
              {classesVisibles.map((cl)=>(
                <tr key={cl}>
                  <td style={cellLabel}>{cl==='NR'? 'Inconnu' : <DpeBadge cl={cl} />}</td>
                  {l.map((x)=><td key={x.annee} style={{textAlign:'right',fontVariantNumeric:'tabular-nums'}}>{fmtNum(x.repartition[cl]||0)}</td>)}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <p style={{fontSize:'.7rem',color:'var(--ce-vert-fonce)',marginTop:12,lineHeight:1.5}}>
          <b>Méthodologie</b> — reprise de celle du gabarit Excel (colonnes de calcul en fin de « Base de
          cotation »). Chaque logement conserve le kWh/m² constaté de sa résidence tant qu'il n'a pas
          changé de classe DPE ; dès qu'il en change, il prend la valeur moyenne conventionnelle de sa
          nouvelle classe (A {fmtNum(refs.kwhM2.A)} · C {fmtNum(refs.kwhM2.C)} · E {fmtNum(refs.kwhM2.E)} ·
          G {fmtNum(refs.kwhM2.G)} kWh/m²). Les émissions sont le produit de cette consommation par le
          facteur d'émission du vecteur de la résidence, qui évolue à l'année d'un « Changement de
          vecteur ». Les gains annuels sont l'écart entre deux années consécutives : toute opération
          ajoutée ou modifiée dans l'outil déplace donc la trajectoire, contrairement à l'Excel qui la
          fige à l'import.
        </p>
        <p style={{fontSize:'.7rem',color:'var(--ce-vert-fonce)',marginTop:8,lineHeight:1.5}}>
          <b>Périmètre</b> — consommation, émissions et Total m² portent sur le parc vivant : une
          démolition en sort la résidence. La répartition DPE ajoute en outre les livraisons d'offre
          nouvelle (classées « Inconnu », faute d'étiquette connue à ce stade) et retranche les logements
          cédés, répartis au prorata des étiquettes de la résidence l'année de la cession — comme le fait
          la feuille Excel, dont les lignes de consommation restent en revanche calculées sur la seule
          Base de cotation.
          {ventesSansAnnee>0 && (
            <span> {ventesSansAnnee} ligne{ventesSansAnnee>1?'s':''} du plan de vente ne porte{ventesSansAnnee>1?'nt':''} aucune
            année : elle{ventesSansAnnee>1?'s ne sont':' n\'est'} retranchée{ventesSansAnnee>1?'s':''} d'aucun exercice.</span>
          )}
        </p>
        {(decarbo.couverture.sansKwh>0 || decarbo.couverture.sansFe>0 || decarbo.couverture.sansShab>0) && (
          <p style={{fontSize:'.7rem',color:'var(--ce-vert-fonce)',marginTop:8,lineHeight:1.5}}>
            <b>Données estimées</b> — sur {fmtNum(decarbo.nbResidences)} résidences :
            {decarbo.couverture.sansKwh>0 && <span> {fmtNum(decarbo.couverture.sansKwh)} sans « kWh / m² » (valeur moyenne de leur classe DPE appliquée) ;</span>}
            {decarbo.couverture.sansFe>0 && <span> {fmtNum(decarbo.couverture.sansFe)} sans vecteur énergétique exploitable — chauffage hybride ou mode absent de la table ({decarbo.couverture.feMoyenDisponible? 'facteur d\'émission moyen du parc appliqué' : 'aucun vecteur exploitable sur l\'ensemble du parc : intensité carbone conventionnelle de chaque classe DPE appliquée'}) ;</span>}
            {decarbo.couverture.sansShab>0 && <span> {fmtNum(decarbo.couverture.sansShab)} sans SHAB (surface moyenne par logement du parc appliquée) ;</span>}
            {' '}ces résidences restent comptées dans les totaux.
          </p>
        )}
        <p style={{fontSize:'.7rem',color:'var(--ce-vert-fonce)',marginTop:8,lineHeight:1.5}}>
          <b>Référentiels</b> — valeurs moyennes par classe DPE et facteurs d'émission :
          {refs.origine.table? ' onglet « 4. Table DPE et FE » du fichier importé' : ' valeurs Cellance par défaut (onglet « 4. Table DPE et FE » absent du fichier)'} ;
          vecteur visé par une nature de travaux :
          {refs.origine.vecteurs? ' onglet « 2. Table de ref prix » du fichier importé' : ' non disponible (onglet « 2. Table de ref prix » absent — les changements de vecteur ne font alors pas évoluer le facteur d\'émission)'}.
        </p>
      </div>
    </React.Fragment>
  );
}
function ViewDecarbonation({residences, operations, gainsGrid, hasGainsGrid, includeIdentifiees, baseImport, onSelectResidence, refsDecarbo, offreNouvelleLgt, planVenteLignes}){
  const [metric, setMetric] = useState('energie');
  const years = useMemo(()=>computeYearsRange(operations), [operations]);
  const classes = ['A','B','C','D','E','F','G','NR'];
  // Panneau ouvert au clic sur la trajectoire empilée ou le avant/après (§3 — un clic isole une
  // année + une classe DPE) : `source` distingue sous quel graphique l'afficher, `computeTrajectoryByResidence`
  // (déjà utilisé par le tableau Impact des actions stratégiques pour la même problématique) donne la
  // distribution DPE résidence par résidence à cette échéance, sans recalculer de projection ad hoc.
  const [trajPanel, setTrajPanel] = useState(null); // {source, year, cl, title, rows, renderRow}
  function buildTrajPanel(source, year, cl){
    const { state, alive } = computeTrajectoryByResidence(residences, operations, gainsGrid, year, metric, includeIdentifiees);
    const getCount = (r)=> (alive[r.code] && state[r.code] && state[r.code][cl]) || 0;
    const rows = residences.filter((r)=>getCount(r)>0);
    return { source, year, cl, title:'Résidences en classe '+cl+' en '+year+' ('+rows.length+')', rows, renderRow: ensembleFractionRow(onSelectResidence, getCount, 'classe '+cl) };
  }
  function toggleTrajPanel(source, year, cl){
    setTrajPanel((cur)=> (cur && cur.year===year && cur.cl===cl) ? null : buildTrajPanel(source, year, cl));
  }

  const trajectory = useMemo(()=>{
    if (!hasGainsGrid) return null;
    return computeTrajectory(residences, operations, gainsGrid, years, metric, includeIdentifiees);
  }, [residences, operations, gainsGrid, years, metric, includeIdentifiees, hasGainsGrid]);

  const initial = trajectory ? trajectory[years[0]] : null;
  // Année "après travaux" de la carte Répartition DPE avant/après (§10 bis) : librement choisie par
  // l'utilisateur, contrairement à "Avant" qui reste figé sur years[0] (l'état constaté à l'import).
  const [repartYear, setRepartYear] = useState(null);
  useEffect(()=>{ if (years.length && !years.includes(repartYear)) setRepartYear(years[years.length-1]); }, [years]);
  const final = trajectory && repartYear!==null ? trajectory[repartYear] : null;
  const rangeShare = (d, lo, hi)=>{
    if (!d) return null;
    const range = classRangeAG(lo, hi);
    const num = range.reduce((s,c)=>s+(d[c]||0),0);
    return (num / Math.max(1, classes.reduce((s,c)=>s+d[c],0))) * 100;
  };

  // §10 — carte configurable (remplace les deux cartes fixes "Logements A-C en <année de début/fin>") :
  // la borne haute du sélecteur d'année suit la dernière année de la trajectoire actuellement affichée
  // (pas une année calendaire codée en dur), et les deux sélecteurs de classe reproduisent n'importe
  // quelle plage A-G (ex. "A-C", "E-G").
  const [dpeCardYear, setDpeCardYear] = useState(null);
  const [dpeCardLo, setDpeCardLo] = useState('A');
  const [dpeCardHi, setDpeCardHi] = useState('C');
  useEffect(()=>{ if (years.length && !years.includes(dpeCardYear)) setDpeCardYear(years[years.length-1]); }, [years]);
  const dpeCardShare = trajectory && dpeCardYear!==null ? rangeShare(trajectory[dpeCardYear], dpeCardLo, dpeCardHi) : null;

  const hasCompareBase = !!(baseImport && baseImport.data.hasGainsGrid);
  const cutoffActuel = useMemo(()=>anneeCoupureActuel(), []);
  const baseTrajectory = useMemo(()=>{
    if (!hasCompareBase) return null;
    const baseYears = computeYearsRange(baseImport.simOperations||[]);
    return { years: baseYears, traj: computeTrajectory(baseImport.data.residences, baseImport.simOperations||[], baseImport.data.gainsGrid||{}, baseYears, metric, baseImport.includeIdentifiees) };
  }, [baseImport, hasCompareBase, metric]);

  // V9 §1 — agrégats annuels de la feuille Excel « 4. Trajectoire décarbonation ». Les cessions sont
  // celles de l'onglet Vente qui portent une année (l'échéancier importé et les lignes ajoutées dans
  // l'outil) : une ligne de plan de vente sans année ne peut être imputée à aucun exercice, elle est
  // comptée à part pour être signalée sous le tableau plutôt que silencieusement ignorée.
  const ventes = useMemo(()=>{
    const parAnnee = {}; let sansAnnee = 0;
    (planVenteLignes||[]).forEach((l)=>{
      if (l.retenue===false) return;
      const annees = Object.keys(l.parAnnee||{});
      if (!annees.length){ sansAnnee++; return; }
      let compte = 0;
      annees.forEach((y)=>{
        const n = Number((l.parAnnee[y]||{}).nbLgt)||0;
        if (n<=0) return;
        compte += n;
        if (!parAnnee[y]) parAnnee[y] = {};
        parAnnee[y][l.resCode] = (parAnnee[y][l.resCode]||0) + n;
      });
      if (compte===0) sansAnnee++;
    });
    return { parAnnee, sansAnnee };
  }, [planVenteLignes]);
  // Complété bloc par bloc (sauvegardes antérieures à la V9) et mémoïsé : sans cela l'objet de repli
  // serait neuf à chaque rendu et relancerait computeDecarbonation en boucle (la référence sert de
  // dépendance ci-dessous), et refs.origine serait indéfini au premier rendu d'un ancien import.
  const refs = useMemo(()=>Object.assign(refsDecarbonationDefaut(), refsDecarbo||{}), [refsDecarbo]);
  const decarbo = useMemo(()=>{
    if (!hasGainsGrid) return null;
    return computeDecarbonation(residences, operations, gainsGrid, years, includeIdentifiees, refs, {
      offreNouvelleLgt: offreNouvelleLgt||{}, ventesParAnnee: ventes.parAnnee,
    });
  }, [residences, operations, gainsGrid, years, includeIdentifiees, refs, offreNouvelleLgt, ventes, hasGainsGrid]);

  // Carte "Logements classe X-Y" (§10) : en plus de l'année librement choisie ci-dessus, affiche Base
  // (année de la version base — 1re année de sa propre trajectoire, même convention que "Avant
  // intervention" = years[0] ci-dessus) et Cible (dernière année du fichier importé) — toutes deux
  // suivent les mêmes sélecteurs de classe (borne basse/haute), seule l'année reste fixe pour ces deux-là.
  const baseCardYear = baseTrajectory ? baseTrajectory.years[0] : null;
  const baseCardShare = baseTrajectory ? rangeShare(baseTrajectory.traj[baseCardYear], dpeCardLo, dpeCardHi) : null;
  const cibleCardYear = years.length? years[years.length-1] : null;
  const cibleCardShare = (trajectory && cibleCardYear!==null) ? rangeShare(trajectory[cibleCardYear], dpeCardLo, dpeCardHi) : null;

  return (
    <div style={{padding:24,display:'flex',flexDirection:'column',gap:20}}>
      {!hasGainsGrid && (
        <div className="ce-card" style={{background:'var(--ce-saumon)'}}>
          Grille de gains DPE (onglet « Référentiel des gains DPE ») introuvable dans ce fichier : la projection de trajectoire n'est pas disponible. Seule la distribution actuelle peut être affichée.
        </div>
      )}
      {trajectory && (
        <React.Fragment>
          <div className="ce-card" style={{display:'flex',gap:16,flexWrap:'wrap',alignItems:'center'}}>
            <div style={{flex:1,minWidth:150}}>
              <div style={{fontSize:'.68rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase',letterSpacing:'.03em',marginBottom:6}}>
                Logements classe {dpeCardLo}{dpeCardLo!==dpeCardHi?('-'+dpeCardHi):''} en {dpeCardYear??''}
              </div>
              <div style={{fontSize:'1.7rem',fontWeight:700,color:'var(--ce-vert-principal)'}}>{dpeCardShare!==null? dpeCardShare.toFixed(0)+'%':'—'}</div>
            </div>
            {hasCompareBase && (
              <div style={{flex:1,minWidth:150}}>
                <div style={{fontSize:'.68rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase',letterSpacing:'.03em',marginBottom:6}}>
                  Base{baseCardYear!==null? ' — '+baseCardYear:''}
                </div>
                <div style={{fontSize:'1.7rem',fontWeight:700,color:COMPARE_COLORS.base}}>{baseCardShare!==null? baseCardShare.toFixed(0)+'%':'—'}</div>
              </div>
            )}
            <div style={{flex:1,minWidth:150}}>
              <div style={{fontSize:'.68rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase',letterSpacing:'.03em',marginBottom:6}}>
                Cible{cibleCardYear!==null? ' — '+cibleCardYear:''}
              </div>
              <div style={{fontSize:'1.7rem',fontWeight:700,color:COMPARE_COLORS.cible}}>{cibleCardShare!==null? cibleCardShare.toFixed(0)+'%':'—'}</div>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:4}}>
              <label style={{fontSize:'.66rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>Année</label>
              <select className="ce-select" value={dpeCardYear??''} onChange={(e)=>setDpeCardYear(Number(e.target.value))}>
                {years.map((y)=><option key={y} value={y}>{y}</option>)}
              </select>
            </div>
