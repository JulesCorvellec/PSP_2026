              ))}
            </div>
          </div>
        ))}
      </div>

      <div className="ce-card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10,marginBottom:12}}>
          <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700}}>Opérations ({filteredOps.length} / {operations.length})</h2>
          <button className="ce-btn ce-btn-sm" onClick={addOp} disabled={!residences.length} title={!residences.length? "Aucune résidence ne correspond aux filtres actifs" : ""}>+ Ajouter une opération</button>
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'flex-end',marginBottom:14}}>
          <input className="ce-input" placeholder="Rechercher résidence / nature…" value={search} onChange={(e)=>setSearch(e.target.value)} style={{width:200}} />
          <select className="ce-select" value={filterNature} onChange={(e)=>setFilterNature(e.target.value)}>
            <option value="">Toutes natures de travaux</option>
            {typeOptions.map((t)=><option key={t} value={t}>{t}</option>)}
          </select>
          <select className="ce-select" value={filterTypeCat} onChange={(e)=>setFilterTypeCat(e.target.value)}>
            <option value="">Tous types de travaux</option>
            {TYPE_CAT_OPTIONS.map((t)=><option key={t} value={t}>{t}</option>)}
          </select>
          <select className="ce-select" value={filterStatut} onChange={(e)=>setFilterStatut(e.target.value)}>
            <option value="">Tous statuts</option>
            <option value="programme">Programmé</option>
            <option value="identifie">Identifié</option>
          </select>
          <div style={{display:'flex',flexDirection:'column',gap:3}}>
            <label style={{fontSize:'.65rem',color:'var(--ce-vert-fonce)'}}>Année (de)</label>
            <select className="ce-select" value={filterAnneeMin} onChange={(e)=>setFilterAnneeMin(e.target.value)}>
              <option value="">—</option>
              {years.map((y)=><option key={y} value={y}>{y}</option>)}
            </select>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:3}}>
            <label style={{fontSize:'.65rem',color:'var(--ce-vert-fonce)'}}>Année (à)</label>
            <select className="ce-select" value={filterAnneeMax} onChange={(e)=>setFilterAnneeMax(e.target.value)}>
              <option value="">—</option>
              {years.map((y)=><option key={y} value={y}>{y}</option>)}
            </select>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:3}}>
            <label style={{fontSize:'.65rem',color:'var(--ce-vert-fonce)'}}>Montant min (€)</label>
            <input className="ce-input" style={{width:110}} type="number" value={filterMontantMin} onChange={(e)=>setFilterMontantMin(e.target.value)} />
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:3}}>
            <label style={{fontSize:'.65rem',color:'var(--ce-vert-fonce)'}}>Montant max (€)</label>
            <input className="ce-input" style={{width:110}} type="number" value={filterMontantMax} onChange={(e)=>setFilterMontantMax(e.target.value)} />
          </div>
          {hasActiveFilters && <button className="ce-btn-outline ce-btn-sm" onClick={resetFilters}>Réinitialiser les filtres</button>}
          {hasCompareBase && (
            <label style={{fontSize:'.76rem',color:'var(--ce-vert-fonce)',display:'flex',alignItems:'center',gap:6,cursor:'pointer'}}>
              <input type="checkbox" checked={onlyEcarts} onChange={(e)=>setOnlyEcarts(e.target.checked)} />
              Afficher uniquement les écarts vs Base
            </label>
          )}
        </div>
        <SortableTable columns={opsCols} rows={filteredOps} pageSize={15} dense />
        {hasCompareBase && disparuesRows.length>0 && (
          <div style={{marginTop:14,paddingTop:12,borderTop:'1px solid #eef4f2'}}>
            <button className="ce-btn-outline ce-btn-sm" onClick={()=>setShowDisparues((v)=>!v)}>
              {showDisparues? 'Masquer':'Afficher'} les {disparuesRows.length} opération{disparuesRows.length>1?'s':''} de la Base non reconduite{disparuesRows.length>1?'s':''}
            </button>
            {showDisparues && (
              <div style={{marginTop:10,display:'flex',flexDirection:'column',gap:4}}>
                {disparuesRows.map((o)=>(
                  <div key={o.id} style={{fontSize:'.76rem',color:'#9fb3ae',padding:'4px 0',borderBottom:'1px solid #f0f5f3'}}>
                    {(resByCode[o.resCode]||{}).nom || o.resCode} — {o.nature||o.type||'Non renseigné'} — {o.annee||'année n.c.'} — {fmtEur(o.montant)} <i>(Base uniquement)</i>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------------- Décarbonation & DPE ---------------- */
const CLASS_ORDER_AG = CLASS_ORDER.slice().reverse(); // A -> G
function classRangeAG(lo, hi){
  const i1 = CLASS_ORDER_AG.indexOf(lo), i2 = CLASS_ORDER_AG.indexOf(hi);
  if (i1===-1 || i2===-1) return [];
  return CLASS_ORDER_AG.slice(Math.min(i1,i2), Math.max(i1,i2)+1);
}
function ViewDecarbonation({residences, operations, gainsGrid, hasGainsGrid, includeIdentifiees, baseImport}){
  const [metric, setMetric] = useState('energie');
  const [compare, setCompare] = useState(defaultCompareState());
  const years = useMemo(()=>computeYearsRange(operations), [operations]);
  const classes = ['A','B','C','D','E','F','G','NR'];

  const trajectory = useMemo(()=>{
    if (!hasGainsGrid) return null;
    return computeTrajectory(residences, operations, gainsGrid, years, metric, includeIdentifiees);
  }, [residences, operations, gainsGrid, years, metric, includeIdentifiees, hasGainsGrid]);

  const initial = trajectory ? trajectory[years[0]] : null;
  // Année "après travaux" de la carte Répartition DPE avant/après (§10 bis) : librement choisie par
  // l'utilisateur, contrairement à "Avant" qui reste figé sur years[0] (l'état constaté à l'import).
  const [repartYear, setRepartYear] = useState(null);
  useEffect(()=>{ if (years.length && !years.includes(repartYear)) setRepartYear(years[years.length-1]); }, [years]);
  const final = trajectory && repartYear!==null ? trajectory[repartYear] : null;
  const bestShare = (d)=> d ? ((d.A+d.B+d.C) / Math.max(1, classes.reduce((s,c)=>s+d[c],0)) * 100) : null;
  const rangeShare = (d, lo, hi)=>{
    if (!d) return null;
    const range = classRangeAG(lo, hi);
    const num = range.reduce((s,c)=>s+(d[c]||0),0);
    return (num / Math.max(1, classes.reduce((s,c)=>s+d[c],0))) * 100;
  };

  // §10 — carte configurable (remplace les deux cartes fixes "Logements A-C en <année de début/fin>") :
  // la borne haute du sélecteur d'année suit la dernière année de la trajectoire actuellement affichée
  // (pas une année calendaire codée en dur), et les deux sélecteurs de classe reproduisent n'importe
  // quelle plage A-G (ex. "A-C", "E-G").
  const [dpeCardYear, setDpeCardYear] = useState(null);
  const [dpeCardLo, setDpeCardLo] = useState('A');
  const [dpeCardHi, setDpeCardHi] = useState('C');
  useEffect(()=>{ if (years.length && !years.includes(dpeCardYear)) setDpeCardYear(years[years.length-1]); }, [years]);
  const dpeCardShare = trajectory && dpeCardYear!==null ? rangeShare(trajectory[dpeCardYear], dpeCardLo, dpeCardHi) : null;

  const hasCompareBase = !!(baseImport && baseImport.data.hasGainsGrid);
  const compareState = clampCompareState(compare, hasCompareBase);
  const cutoffActuel = useMemo(()=>anneeCoupureActuel(), []);
  const baseTrajectory = useMemo(()=>{
    if (!hasCompareBase) return null;
    const baseYears = computeYearsRange(baseImport.simOperations||[]);
    return { years: baseYears, traj: computeTrajectory(baseImport.data.residences, baseImport.simOperations||[], baseImport.data.gainsGrid||{}, baseYears, metric, baseImport.includeIdentifiees) };
  }, [baseImport, hasCompareBase, metric]);
  const baseShareByYear = useMemo(()=>{
    if (!baseTrajectory) return null;
    return years.map((y)=>{
      const idx = baseTrajectory.years.indexOf(y);
      const d = idx>=0? baseTrajectory.traj[baseTrajectory.years[idx]] : null;
      return d? bestShare(d) : null;
    });
  }, [baseTrajectory, years]);
  // Cible = trajectoire complète (déjà calculée ci-dessus) ; Actuel s'arrête à anneeCoupureActuel()
  // (ligne interrompue au-delà, cf. convention ViewInvestissements) — les deux dérivent de la même
  // `trajectory`, jamais recalculées indépendamment (cf. §2.1 de la spec).
  const cibleShareByYear = trajectory ? years.map((y)=>bestShare(trajectory[y])) : null;
  const actuelShareByYear = trajectory ? years.map((y,i)=> y<=cutoffActuel? cibleShareByYear[i] : null) : null;
  // Delta Actuel évalué à l'année de coupure (dernier point réellement tracé par cette série) ; delta
  // Cible évalué en fin de trajectoire — chacun comparé à la Base à la même année, pas à l'année de fin
  // de Base qui peut différer.
  function shareAtYear(arr, year){ if (!arr) return null; const idx = years.indexOf(year); return idx>=0? arr[idx] : null; }
  function deltaAtYear(arr, year){ const a = shareAtYear(arr, year), b = shareAtYear(baseShareByYear, year); return (hasCompareBase && a!==null && b!==null) ? a-b : null; }
  const deltaActuelShare = deltaAtYear(actuelShareByYear, cutoffActuel);
  const deltaCibleShare = deltaAtYear(cibleShareByYear, years[years.length-1]);

  // Carte "Logements classe X-Y" (§10) : en plus de l'année librement choisie ci-dessus, affiche Base
  // (année de la version base — 1re année de sa propre trajectoire, même convention que "Avant
  // intervention" = years[0] ci-dessus) et Cible (dernière année du fichier importé) — toutes deux
  // suivent les mêmes sélecteurs de classe (borne basse/haute), seule l'année reste fixe pour ces deux-là.
  const baseCardYear = baseTrajectory ? baseTrajectory.years[0] : null;
  const baseCardShare = baseTrajectory ? rangeShare(baseTrajectory.traj[baseCardYear], dpeCardLo, dpeCardHi) : null;
  const cibleCardYear = years.length? years[years.length-1] : null;
  const cibleCardShare = (trajectory && cibleCardYear!==null) ? rangeShare(trajectory[cibleCardYear], dpeCardLo, dpeCardHi) : null;

  return (
    <div style={{padding:24,display:'flex',flexDirection:'column',gap:20}}>
      {!hasGainsGrid && (
        <div className="ce-card" style={{background:'var(--ce-saumon)'}}>
          Grille de gains DPE (onglet « Référentiel des gains DPE ») introuvable dans ce fichier : la projection de trajectoire n'est pas disponible. Seule la distribution actuelle peut être affichée.
        </div>
      )}
      {trajectory && (
        <React.Fragment>
          <div className="ce-card" style={{display:'flex',gap:16,flexWrap:'wrap',alignItems:'center'}}>
            <div style={{flex:1,minWidth:150}}>
              <div style={{fontSize:'.68rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase',letterSpacing:'.03em',marginBottom:6}}>
                Logements classe {dpeCardLo}{dpeCardLo!==dpeCardHi?('-'+dpeCardHi):''} en {dpeCardYear??''}
              </div>
              <div style={{fontSize:'1.7rem',fontWeight:700,color:'var(--ce-vert-principal)'}}>{dpeCardShare!==null? dpeCardShare.toFixed(0)+'%':'—'}</div>
            </div>
            {hasCompareBase && (
              <div style={{flex:1,minWidth:150}}>
                <div style={{fontSize:'.68rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase',letterSpacing:'.03em',marginBottom:6}}>
                  Base{baseCardYear!==null? ' — '+baseCardYear:''}
                </div>
                <div style={{fontSize:'1.7rem',fontWeight:700,color:COMPARE_COLORS.base}}>{baseCardShare!==null? baseCardShare.toFixed(0)+'%':'—'}</div>
              </div>
            )}
            <div style={{flex:1,minWidth:150}}>
              <div style={{fontSize:'.68rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase',letterSpacing:'.03em',marginBottom:6}}>
                Cible{cibleCardYear!==null? ' — '+cibleCardYear:''}
              </div>
              <div style={{fontSize:'1.7rem',fontWeight:700,color:COMPARE_COLORS.cible}}>{cibleCardShare!==null? cibleCardShare.toFixed(0)+'%':'—'}</div>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:4}}>
              <label style={{fontSize:'.66rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>Année</label>
              <select className="ce-select" value={dpeCardYear??''} onChange={(e)=>setDpeCardYear(Number(e.target.value))}>
                {years.map((y)=><option key={y} value={y}>{y}</option>)}
              </select>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:4}}>
              <label style={{fontSize:'.66rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>Classe (borne basse)</label>
              <select className="ce-select" value={dpeCardLo} onChange={(e)=>setDpeCardLo(e.target.value)}>
                {CLASS_ORDER_AG.map((c)=><option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:4}}>
              <label style={{fontSize:'.66rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>Classe (borne haute)</label>
              <select className="ce-select" value={dpeCardHi} onChange={(e)=>setDpeCardHi(e.target.value)}>
                {CLASS_ORDER_AG.map((c)=><option key={c} value={c}>{c}</option>)}
              </select>
            </div>
          </div>
          <div className="ce-card">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
              <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700}}>Trajectoire de décarbonation — DPE {metric==='energie'?'Énergie':'GES'}</h2>
              <div style={{display:'flex',gap:6}}>
                <button className={metric==='energie'?'ce-btn ce-btn-sm':'ce-btn-outline ce-btn-sm'} onClick={()=>setMetric('energie')}>Énergie</button>
                <button className={metric==='ges'?'ce-btn ce-btn-sm':'ce-btn-outline ce-btn-sm'} onClick={()=>setMetric('ges')}>GES</button>
              </div>
            </div>
            <ChartCanvas type="bar" height={340} data={{
              labels: years,
              datasets: classes.filter((c)=>years.some((y)=>trajectory[y][c]>0)).map((c)=>({
                label:c, data: years.map((y)=>trajectory[y][c]||0), backgroundColor: DPE_COLORS[c], stack:'s'
              }))
            }} options={{ scales:{ x:{stacked:true}, y:{stacked:true, title:{display:true,text:'Logements'}} } }} />
            <p style={{fontSize:'.7rem',color:'var(--ce-vert-fonce)',marginTop:10,lineHeight:1.5}}>
              Méthodologie (§8.2 du cahier des charges) : chaque résidence part de sa distribution DPE constatée ;
              chaque opération programmée (ou identifiée si incluse) applique le gain de la grille de référence à la classe
              atteinte à cet instant, avec effet cumulatif pour les opérations successives. Une démolition sort la résidence
              du parc à compter de l'année concernée. Simplification V1 : le gain s'applique à l'ensemble du parc de la
              résidence, pas uniquement aux logements concernés par l'opération.
            </p>
          </div>
          <div className="ce-card">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10,marginBottom:12}}>
              <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700}}>
                Répartition des étiquettes DPE {metric==='energie'?'Énergie':'GES'} — avant / après intervention
              </h2>
              <div style={{display:'flex',flexDirection:'column',gap:4}}>
                <label style={{fontSize:'.66rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>Année (après travaux)</label>

/* ---------------- Offre nouvelle & Vente ----------------
   Le "Plan de vente" ne correspond à aucun onglet ONI/ONNI dédié (aucun des deux fichiers de
   référence du projet n'en contient) : il s'agit en réalité de colonnes déjà présentes dans
   « 1. Base de cotation » elle-même (confirmé le 2026-07-10, cf. idx.planVente et suivants dans
   parseBaseCotation) — traité ici comme un dérivé de residences, pas comme un parseur séparé.
   L'"Offre nouvelle" (construction neuve) n'a en revanche aucune source dans les fichiers fournis :
   à la demande de Jules, elle est portée par une simulation manuelle (saisie libre par année,
   même principe que la "Ligne budgétaire libre" de la vue Investissements), pas par un import. */
// §12 — dérivation lecture seule de la conventionnalité d'une résidence pour une entrée de vente
// ajoutée manuellement : residence.conventionneVente si renseigné (donnée déjà présente dans la
// Base de cotation pour les résidences déjà en plan de vente), sinon déduit de dont conventionné /
// dont foyer (comptages déjà parsés), jamais une nouvelle saisie dupliquée dans l'entrée de vente.
function deriveConventionne(r){
  if (!r) return '—';
  if (r.conventionneVente) return r.conventionneVente;
  if (r.dontConventionne>0) return 'Conventionné';
  if (r.dontFoyer>0) return 'Foyer / résidence sociale';
  return '—';
}
// §6 — scission de l'ancienne vue "Offre nouvelle & Vente" en deux onglets distincts (Orientations
// stratégiques), sans changement de logique ni de calcul : ViewOffreNouvelle reprend la carte de
// simulation manuelle, ViewVente les deux cartes de ventes (simulées + résidences déjà en plan de
// vente). Les deux parties ne partageaient déjà aucun state ni logique croisée.
function ViewOffreNouvelle({residences, operations, offreNouvelleLgt, setOffreNouvelleLgt}){
  const years = useMemo(()=>computeYearsRange(operations), [operations]);
  const annualValues = years.map((y)=>Number(offreNouvelleLgt[y])||0);
  const cumulative = useMemo(()=>{
    let cum = 0;
    return years.map((y)=>{ cum += Number(offreNouvelleLgt[y])||0; return cum; });
  }, [years, offreNouvelleLgt]);

  return (
    <div style={{padding:24,display:'flex',flexDirection:'column',gap:20}}>
      <div className="ce-card">
        <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700,marginBottom:12}}>Offre nouvelle — simulation manuelle</h2>
        <p style={{fontSize:'.72rem',color:'var(--ce-vert-fonce)',marginBottom:14,lineHeight:1.5}}>
          Aucun onglet du fichier importé ne recense l'offre nouvelle (construction neuve) : cette section permet
          de saisir manuellement, année par année, le nombre de logements neufs simulés — à titre indicatif,
          en complément de la Base de cotation.
        </p>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:16}}>
          {years.map((y)=>(
            <div key={y} style={{display:'flex',flexDirection:'column',gap:3}}>
              <label style={{fontSize:'.68rem',color:'var(--ce-vert-fonce)'}}>{y}</label>
              <input className="ce-input" style={{width:92}} type="number" value={offreNouvelleLgt[y]||''}
                placeholder="0"
                onChange={(e)=>setOffreNouvelleLgt(Object.assign({},offreNouvelleLgt,{[y]: e.target.value===''? undefined : Number(e.target.value)}))} />
            </div>
          ))}
        </div>
        <ChartCanvas type="bar" height={260} data={{
          labels: years,
          datasets: [
            { type:'bar', label:'Logements neufs simulés (par année)', data: annualValues, backgroundColor:'#58D88B', borderRadius:4 },
            { type:'line', label:'Cumul de logements neufs', data: cumulative, borderColor:'#009261', backgroundColor:'#009261', pointRadius:3, fill:false, yAxisID:'y1' },
          ]
        }} options={{ scales:{ y:{ beginAtZero:true, title:{display:true,text:'Logements (année)'} }, y1:{ beginAtZero:true, position:'right', grid:{drawOnChartArea:false}, title:{display:true,text:'Cumul'} } } }} />
      </div>
    </div>
  );
}

function ViewVente({residences, ventesSimulees, setVentesSimulees}){
  const resByCode = useMemo(()=>{ const m={}; residences.forEach((r)=>m[r.code]=r); return m; }, [residences]);
  const typeVenteSuggestions = useMemo(()=>uniqueSorted(residences.map((r)=>r.typeVente)), [residences]);

  function addVente(){
    if (!residences.length) return;
    setVentesSimulees([{ id:'vente_'+Date.now(), resCode:null, typeVente:null, logementsRestants:null, prixVente:null, origine:'ajout' }].concat(ventesSimulees));
  }
  function updateVente(id, patch){ setVentesSimulees(ventesSimulees.map((v)=> v.id===id? Object.assign({},v,patch) : v)); }
  function removeVente(id){ setVentesSimulees(ventesSimulees.filter((v)=>v.id!==id)); }
  function selectVenteResidence(id, rawResCode, currentLogementsRestants){
    // rawResCode vient de <select> (toujours une chaîne côté DOM) : on le résout vers le code natif
    // de la résidence (souvent numérique) pour rester cohérent avec filteredCodes.has(resCode) côté
    // App, sans quoi la ligne disparaissait de la vue dès la sélection d'une résidence.
    const match = residences.find((r)=>String(r.code)===rawResCode);
    const resCode = match? match.code : rawResCode;
    const patch = { resCode };
    // Pré-remplissage au moment de la sélection uniquement, jamais en repli permanent : une fois
    // modifié manuellement par l'utilisateur, la valeur ne doit plus être écrasée par ce pré-remplissage.
    if (currentLogementsRestants===null || currentLogementsRestants===undefined){
      const r = resByCode[resCode];
      if (r && r.nbLgtRestantVente!==null && r.nbLgtRestantVente!==undefined) patch.logementsRestants = r.nbLgtRestantVente;
    }
    updateVente(id, patch);
  }

  const ventesSimuleesCols = [
    {key:'resCode', label:'Résidence', render:(v)=>{
      const inList = residences.some((r)=>r.code===v.resCode);
      return (
        <select className="ce-select" value={v.resCode ?? ''} onChange={(e)=>selectVenteResidence(v.id, e.target.value, v.logementsRestants)}>
          <option value="" disabled>— À sélectionner —</option>
          {!inList && v.resCode && <option value={v.resCode}>{(resByCode[v.resCode]||{}).nom || v.resCode} (hors filtre)</option>}
          {residences.map((r)=><option key={r.code} value={r.code}>{r.nom||r.code}</option>)}
        </select>
      );
    }},
    {key:'commune', label:'Commune', render:(v)=>(resByCode[v.resCode]||{}).commune || '—'},
    {key:'conventionne', label:'Conventionné / non conventionné', render:(v)=>deriveConventionne(resByCode[v.resCode])},
    {key:'typeVente', label:'Type de vente', render:(v)=>(
      <input className="ce-input" style={{width:140}} list="ce-type-vente-suggestions" value={v.typeVente ?? ''} placeholder="— À sélectionner —"
        onChange={(e)=>updateVente(v.id,{typeVente:e.target.value})} />
    )},
    {key:'logementsRestants', label:'Logements restants', render:(v)=><input className="ce-input" style={{width:90}} type="number" value={v.logementsRestants ?? ''} onChange={(e)=>updateVente(v.id,{logementsRestants: e.target.value===''? null: Number(e.target.value)})} />},
    {key:'prixVente', label:'Prix de vente', render:(v)=><input className="ce-input" style={{width:110}} type="number" value={v.prixVente ?? ''} onChange={(e)=>updateVente(v.id,{prixVente: e.target.value===''? null: Number(e.target.value)})} />},
    {key:'_montantM2', label:'Montant au m²', render:(v)=>{
      const r = resByCode[v.resCode];
      if (!r || !r.shab || r.shab<=0 || v.prixVente===null || v.prixVente===undefined) return '—';
      return fmtEur(v.prixVente / r.shab);
    }},
    {key:'_actions', label:'', render:(v)=><button className="ce-btn-outline ce-btn-sm" onClick={()=>removeVente(v.id)}>Suppr.</button>},
  ];

  const venteRows = useMemo(()=>residences.filter((r)=>
    r.nbLgtMiseVente!==null || r.prixVenteBrut!==null || r.typeVente!==null || r.planVente
  ), [residences]);
  const hasVente = venteRows.length>0;
  const totalMiseVente = venteRows.reduce((s,r)=>s+(r.nbLgtMiseVente||0),0);
  const totalRestant = venteRows.reduce((s,r)=>s+(r.nbLgtRestantVente||0),0);
  const totalProduitCession = venteRows.reduce((s,r)=>s+(r.prixVenteBrut||0),0);

  const venteCols = [
    {key:'nom', label:'Résidence'},
    {key:'commune', label:'Commune'},
    {key:'typeVente', label:'Type de vente', render:(r)=>r.typeVente||'—'},
    {key:'conventionneVente', label:'Conventionné / non conventionné', render:(r)=>r.conventionneVente||'—'},
    {key:'nbLgtMiseVente', label:'Logements mis en vente', render:(r)=>r.nbLgtMiseVente!==null? fmtNum(r.nbLgtMiseVente):'—'},
    {key:'nbLgtRestantVente', label:'Logements restants', render:(r)=>r.nbLgtRestantVente!==null? fmtNum(r.nbLgtRestantVente):'—'},
    {key:'prixVenteBrut', label:'Prix de vente brut', render:(r)=>r.prixVenteBrut!==null? fmtEur(r.prixVenteBrut):'—'},
    {key:'montantVenteM2', label:'Montant au m²', render:(r)=>r.montantVenteM2!==null? fmtEur(r.montantVenteM2):'—'},
  ];

  return (
    <div style={{padding:24,display:'flex',flexDirection:'column',gap:20}}>
      <div className="ce-card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10,marginBottom:12}}>
          <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700}}>Ventes simulées ({ventesSimulees.length})</h2>
          <button className="ce-btn ce-btn-sm" onClick={addVente} disabled={!residences.length} title={!residences.length? "Aucune résidence ne correspond aux filtres actifs" : ""}>+ Ajouter une vente</button>
        </div>
        <p style={{fontSize:'.72rem',color:'var(--ce-vert-fonce)',marginBottom:12,lineHeight:1.5}}>
          Ajoute une entrée de vente pour une résidence déjà existante du patrimoine importé (pas une résidence fictive) —
          en complément des résidences déjà en plan de vente listées ci-dessous.
        </p>
        <datalist id="ce-type-vente-suggestions">{typeVenteSuggestions.map((t)=><option key={t} value={t} />)}</datalist>
        {ventesSimulees.length>0 ? <SortableTable columns={ventesSimuleesCols} rows={ventesSimulees} pageSize={20} /> : <div style={{fontSize:'.78rem',color:'#9fb3ae'}}>Aucune vente simulée pour l'instant.</div>}
      </div>

      {hasVente ? (
        <React.Fragment>
          <div style={{display:'flex',gap:16,flexWrap:'wrap'}}>
            <KpiCard label="Résidences en plan de vente" value={fmtNum(venteRows.length)} />
            <KpiCard label="Logements mis en vente" value={fmtNum(totalMiseVente)} />
            <KpiCard label="Logements restants à vendre" value={fmtNum(totalRestant)} />
            <KpiCard label="Produit de cession (brut)" value={fmtKEur(totalProduitCession)} />
          </div>
          <div className="ce-card">
            <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700,marginBottom:12}}>Détail des résidences en plan de vente ({venteRows.length})</h2>
            <SortableTable columns={venteCols} rows={venteRows} pageSize={20} />
          </div>
        </React.Fragment>
      ) : (
        <div className="ce-card" style={{background:'var(--ce-saumon)'}}>
          Aucune donnée de vente (« Plan de vente », « Nombre de logement à la mise en vente », « Prix de vente »…)
          n'a été trouvée dans ce fichier — non disponible dans ce fichier.
        </div>
      )}
    </div>
  );
}

/* ---------------- Données financières (CRD / Autofinancement / VNC) ----------------
   Granularité confirmée le 2026-07-10 sur les deux fichiers de référence : résidence uniquement
   (cf. commentaire au-dessus de idx.crd dans parseBaseCotation) — pas de graphique d'évolution
   dans le temps ici, faute de dimension année associée à ces montants dans les fichiers fournis. */
function ViewFinance({residences, onSelectResidence}){
  const [search, setSearch] = useState('');
  const rows = useMemo(()=>residences.filter((r)=>r.crd!==null || r.autofinancement!==null || r.vnc!==null), [residences]);
  const filteredRows = useMemo(()=>{
    const s = ceNorm(search);
    if (!s) return rows;
    return rows.filter((r)=>ceNorm(r.nom).includes(s) || ceNorm(r.code).includes(s) || ceNorm(r.commune).includes(s));
  }, [rows, search]);

  const totalCrd = rows.reduce((s,r)=>s+(r.crd||0),0);
  const totalAuto = rows.reduce((s,r)=>s+(r.autofinancement||0),0);
  const totalVnc = rows.reduce((s,r)=>s+(r.vnc||0),0);

  // §11 — moyenne pondérée au logement = somme(indicateur)/somme(nbLgt) sur le périmètre filtré,
  // scopée aux résidences où l'indicateur est renseigné (pas la moyenne simple des colonnes "par
  // lgt" déjà présentes dans le fichier, qui ne serait pas pondérée par la taille des résidences).
  function weightedAvgPerLgt(key){
    const scoped = residences.filter((r)=>r[key]!==null && r[key]!==undefined);
    const totalLgt = scoped.reduce((s,r)=>s+(r.nbLgt||0),0);
    if (totalLgt<=0) return null;
    return scoped.reduce((s,r)=>s+(r[key]||0),0) / totalLgt;
  }
  const avgCrdLgt = weightedAvgPerLgt('crd');
  const avgAutoLgt = weightedAvgPerLgt('autofinancement');
  const avgVncLgt = weightedAvgPerLgt('vnc');

  const cols = [
    {key:'code', label:'Code'},
    {key:'nom', label:'Résidence'},
    {key:'commune', label:'Commune'},
    {key:'crd', label:'CRD', render:(r)=>r.crd!==null? fmtEur(r.crd):'—'},
    {key:'autofinancement', label:'Autofinancement', render:(r)=>r.autofinancement!==null? fmtEur(r.autofinancement):'—'},
    {key:'vnc', label:'VNC', render:(r)=>r.vnc!==null? fmtEur(r.vnc):'—'},
  ];

  return (
    <div style={{padding:24,display:'flex',flexDirection:'column',gap:20}}>
      <div style={{display:'flex',gap:16,flexWrap:'wrap'}}>
        <KpiCard label="CRD total du patrimoine" value={fmtKEur(totalCrd)} sub={rows.length+" résidences renseignées"} />
        <KpiCard label="CRD moyen pondéré / lgt" value={avgCrdLgt!==null? fmtEur(avgCrdLgt):'—'} />
        <KpiCard label="Autofinancement total" value={fmtKEur(totalAuto)} />
        <KpiCard label="Autofinancement moyen pondéré / lgt" value={avgAutoLgt!==null? fmtEur(avgAutoLgt):'—'} />
        <KpiCard label="VNC totale" value={fmtKEur(totalVnc)} />
        <KpiCard label="VNC moyenne pondérée / lgt" value={avgVncLgt!==null? fmtEur(avgVncLgt):'—'} />
      </div>
      <div className="ce-card" style={{background:'var(--ce-saumon)'}}>
        <p style={{fontSize:'.72rem',color:'var(--ce-vert-fonce)',lineHeight:1.5,margin:0}}>
          CRD, Autofinancement et VNC sont disponibles au niveau résidence dans ce fichier — aucune
          décomposition par opération/emprunt n'a été trouvée dans les fichiers de référence du
          projet, et aucun graphique d'évolution dans le temps n'est donc affiché ici (pas de
          dimension année associée à ces montants).
        </p>
      </div>
      <div className="ce-card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10,marginBottom:12}}>
          <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700}}>Détail par résidence ({filteredRows.length})</h2>
          <input className="ce-input" placeholder="Rechercher résidence / commune…" value={search} onChange={(e)=>setSearch(e.target.value)} style={{width:220}} />
        </div>
        <SortableTable columns={cols} rows={filteredRows} onRowClick={onSelectResidence} pageSize={20} />
      </div>
    </div>
  );
}

/* ---------------- Analyse libre (tableau croisé dynamique) ---------------- */
function downloadCsv(filename, rows){
  const csv = rows.map((r)=>r.map((c)=>{
    const s = c===null||c===undefined? '' : String(c);
    return /[",;\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(';')).join('\r\n');
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function pivotAggregate(items, metric){
  if (metric.agg==='count') return items.length;
  if (metric.agg==='sum') return items.reduce((s,it)=>s+(metric.get(it)||0),0);
  const vals = items.map(metric.get).filter((v)=>v!==null&&v!==undefined&&!isNaN(v));
  return vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}

// §13 — Analyse libre : direction validée avec Jules (multi-métriques côte à côte, drill-down au
// clic vers la liste résidences/opérations d'une cellule avec lien vers la fiche résidence, tri des
// lignes au clic sur un en-tête, heatmap optionnelle, champs enrichis, presets de croisements
// rapides). Priorisation fine et détail visuel (heatmap, presets) non arbitrés avec Jules : traité en
// dernier, implémentation volontairement simple plutôt que de deviner un détail non validé.
function ViewPivot({residences, operations, onSelectResidence}){
  const [dataset, setDataset] = useState('residences');
  const resByCode = useMemo(()=>{ const m={}; residences.forEach((r)=>m[r.code]=r); return m; }, [residences]);

  const RESIDENCE_FIELDS = useMemo(()=>[
    {key:'commune', label:'Commune', get:(r)=>r.commune||'Non renseignée'},
    {key:'secteur', label:'Secteur / agence', get:(r)=>r.secteur||r.agence||'Non renseigné'},
    {key:'qpv', label:'QPV', get:(r)=>r.qpv||'Non renseigné'},
    {key:'financement', label:'Financement', get:(r)=>r.financement||'Non renseigné'},
    {key:'familleAttract', label:'Famille attractivité', get:(r)=>r.familleAttract? ('Famille '+r.familleAttract):'Non renseignée'},
    {key:'familleTechnique', label:'Famille état technique', get:(r)=>r.familleTechnique? ('Famille '+r.familleTechnique):'Non renseignée'},
    {key:'dpeEnergie', label:'DPE Énergie', get:(r)=>r.dpeEnergie||'Non renseigné'},
    {key:'dpeGES', label:'DPE GES', get:(r)=>r.dpeGES||'Non renseigné'},
  ], []);
  const RESIDENCE_METRICS = useMemo(()=>[
    {key:'nbLgt_sum', label:'Nombre de logements', agg:'sum', get:(r)=>r.nbLgt||0, fmt:fmtNum},
    {key:'count', label:'Nombre de résidences', agg:'count', fmt:fmtNum},
    {key:'attractivite_avg', label:'Attractivité moyenne', agg:'avg', get:(r)=>r.attractivite, fmt:(v)=>v!==null?v.toFixed(1):'—'},
    {key:'technique_avg', label:'État technique moyen', agg:'avg', get:(r)=>r.technique, fmt:(v)=>v!==null?v.toFixed(1):'—'},
    {key:'crd_sum', label:'CRD total', agg:'sum', get:(r)=>r.crd||0, fmt:fmtEur},
    {key:'autofinancement_sum', label:'Autofinancement total', agg:'sum', get:(r)=>r.autofinancement||0, fmt:fmtEur},
    {key:'vnc_sum', label:'VNC totale', agg:'sum', get:(r)=>r.vnc||0, fmt:fmtEur},
  ], []);
  const OPERATION_FIELDS = useMemo(()=>[
    {key:'type', label:'Type de travaux', get:(o)=>o.type||'Non renseigné'},
    {key:'famille', label:'Famille de travaux', get:(o)=>familyOfType(o.type)},
    {key:'statut', label:'Statut', get:(o)=>o.statut==='programme'?'Programmé':'Identifié'},
    {key:'annee', label:'Année', get:(o)=>o.annee!==null&&o.annee!==undefined? String(o.annee):'Non renseignée'},
    {key:'commune', label:'Commune (résidence)', get:(o)=>{ const r=resByCode[o.resCode]; return (r&&r.commune)||'Non renseignée'; }},
  ], [resByCode]);
  const OPERATION_METRICS = useMemo(()=>[
    {key:'montant_sum', label:'Montant total', agg:'sum', get:(o)=>o.montant||0, fmt:fmtEur},
    {key:'count', label:"Nombre d'opérations", agg:'count', fmt:fmtNum},
    {key:'logements_sum', label:'Logements concernés', agg:'sum', get:(o)=>o.logements||0, fmt:fmtNum},
  ], []);

  const fields = dataset==='residences' ? RESIDENCE_FIELDS : OPERATION_FIELDS;
  const metrics = dataset==='residences' ? RESIDENCE_METRICS : OPERATION_METRICS;
  const items = dataset==='residences' ? residences : operations;

  const [rowKey, setRowKey] = useState(fields[0].key);
  const [colKey, setColKey] = useState('');
  const [metricKeys, setMetricKeys] = useState([metrics[0].key]);
  const [heatmap, setHeatmap] = useState(false);
  const [sortIdx, setSortIdx] = useState(null);
  const [sortDir, setSortDir] = useState(-1);
  const [drillIdx, setDrillIdx] = useState(null); // {rowIdx, cellIdx} de la cellule dépliée

  useEffect(()=>{
    setRowKey(fields[0].key); setColKey(''); setMetricKeys([metrics[0].key]); setSortIdx(null); setDrillIdx(null);
    // eslint-disable-next-line
  }, [dataset]);

  const rowField = fields.find((f)=>f.key===rowKey) || fields[0];
  const colField = colKey ? fields.find((f)=>f.key===colKey) : null;
  const selectedMetrics = metrics.filter((m)=>metricKeys.includes(m.key));
  const activeMetrics = selectedMetrics.length? selectedMetrics : [metrics[0]];

  function toggleMetric(key){
    setMetricKeys((cur)=> cur.includes(key) ? (cur.length>1? cur.filter((k)=>k!==key) : cur) : cur.concat([key]));
    setSortIdx(null);
  }

  const PRESETS = dataset==='residences' ? [
    {label:'Commune × DPE Énergie (logements)', apply:()=>{ setRowKey('commune'); setColKey('dpeEnergie'); setMetricKeys(['nbLgt_sum']); }},
    {label:'Famille attractivité × État technique', apply:()=>{ setRowKey('familleAttract'); setColKey('familleTechnique'); setMetricKeys(['count']); }},
    {label:'Commune — CRD / Autofinancement / VNC', apply:()=>{ setRowKey('commune'); setColKey(''); setMetricKeys(['crd_sum','autofinancement_sum','vnc_sum']); }},
  ] : [
    {label:'Année × Type de travaux (montant)', apply:()=>{ setRowKey('annee'); setColKey('type'); setMetricKeys(['montant_sum']); }},
    {label:'Statut × Année (nombre)', apply:()=>{ setRowKey('statut'); setColKey('annee'); setMetricKeys(['count']); }},
  ];

  const pivot = useMemo(()=>{
    const rowGroups = {};
    items.forEach((it)=>{ const k=String(rowField.get(it)); (rowGroups[k]=rowGroups[k]||[]).push(it); });
    const rowKeys = Object.keys(rowGroups).sort((a,b)=>a.localeCompare(b,'fr'));
    let colKeys = ['__all__'];
    if (colField){
      const s = new Set();
      items.forEach((it)=>s.add(String(colField.get(it))));
      colKeys = Array.from(s).sort((a,b)=>a.localeCompare(b,'fr'));
    }
    const subsetFor = (rk, ck) => {
      const rowItems = rowGroups[rk] || [];
      return colField ? rowItems.filter((it)=>String(colField.get(it))===ck) : rowItems;
    };
    const rows = rowKeys.map((rk)=>({
      key: rk,
      cells: colKeys.flatMap((ck)=> activeMetrics.map((m)=>({
        value: pivotAggregate(subsetFor(rk,ck), m), items: subsetFor(rk,ck), colKey: ck, metric: m,
      }))),
    }));
    const colTotals = colKeys.flatMap((ck)=>{
      const subset = colField ? items.filter((it)=>String(colField.get(it))===ck) : items;
      return activeMetrics.map((m)=>pivotAggregate(subset, m));
    });
    return { rowKeys, colKeys, rows, colTotals };
  }, [items, rowField, colField, activeMetrics]);

  const sortedRows = useMemo(()=>{
    if (sortIdx===null) return pivot.rows;
    const copy = pivot.rows.slice();
    copy.sort((a,b)=>{
      const va=a.cells[sortIdx].value, vb=b.cells[sortIdx].value;
      if (va===null||va===undefined) return 1; if (vb===null||vb===undefined) return -1;
      return (va-vb)*sortDir;
    });
    return copy;
  }, [pivot.rows, sortIdx, sortDir]);

  function toggleSort(idx){ if (sortIdx===idx) setSortDir(sortDir*-1); else { setSortIdx(idx); setSortDir(-1); } }

  const colMax = useMemo(()=>{
    const max = [];
    (pivot.rows[0]? pivot.rows[0].cells : []).forEach((_,i)=>{
      const vals = pivot.rows.map((r)=>r.cells[i].value).filter((v)=>v!==null&&v!==undefined&&!isNaN(v));
      max[i] = vals.length? Math.max(...vals.map(Math.abs)) : 0;
    });
    return max;
  }, [pivot.rows]);

  function fmtCell(cell){
    if (cell.value===null||cell.value===undefined) return '—';
    return cell.metric.fmt ? cell.metric.fmt(cell.value) : fmtNum(cell.value);
  }

  function exportCsv(){
    const header = [''].concat(pivot.colKeys.flatMap((ck)=> activeMetrics.map((m)=> colField? (ck+' — '+m.label) : m.label)));
    const rows = sortedRows.map((r)=>[r.key].concat(r.cells.map((c)=>c.value===null?'':c.value)));
    const totalRow = ['Total'].concat(pivot.colTotals.map((c)=>c===null?'':c));
    downloadCsv('pivot_'+dataset+'.csv', [header].concat(rows).concat([totalRow]));
  }

  const drillCell = drillIdx!==null ? sortedRows[drillIdx.rowIdx].cells[drillIdx.cellIdx] : null;

  return (
    <div style={{padding:24,display:'flex',flexDirection:'column',gap:20}}>
      <div className="ce-card">
        <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700,marginBottom:14}}>Tableau croisé dynamique</h2>
        <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:14}}>
          {PRESETS.map((p)=><button key={p.label} className="ce-btn-outline ce-btn-sm" onClick={p.apply}>{p.label}</button>)}
        </div>
        <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'flex-end'}}>
          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            <label style={{fontSize:'.68rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>Jeu de données</label>
            <select className="ce-select" value={dataset} onChange={(e)=>setDataset(e.target.value)}>
              <option value="residences">Résidences ({residences.length})</option>
              <option value="operations">Opérations ({operations.length})</option>
            </select>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            <label style={{fontSize:'.68rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>Lignes</label>
            <select className="ce-select" value={rowKey} onChange={(e)=>{setRowKey(e.target.value); setSortIdx(null);}}>
              {fields.map((f)=><option key={f.key} value={f.key}>{f.label}</option>)}
            </select>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            <label style={{fontSize:'.68rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>Colonnes</label>
            <select className="ce-select" value={colKey} onChange={(e)=>{setColKey(e.target.value); setSortIdx(null);}}>
              <option value="">Aucune (total uniquement)</option>
              {fields.filter((f)=>f.key!==rowKey).map((f)=><option key={f.key} value={f.key}>{f.label}</option>)}
            </select>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            <label style={{fontSize:'.68rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>Valeurs (une ou plusieurs)</label>
            <div style={{display:'flex',gap:8,flexWrap:'wrap',maxWidth:340}}>
              {metrics.map((m)=>(
                <label key={m.key} style={{fontSize:'.72rem',color:'var(--ce-vert-fonce)',display:'flex',alignItems:'center',gap:4,cursor:'pointer'}}>
                  <input type="checkbox" checked={metricKeys.includes(m.key)} onChange={()=>toggleMetric(m.key)} />{m.label}
                </label>
              ))}
            </div>
          </div>
          <label style={{fontSize:'.78rem',color:'var(--ce-vert-fonce)',display:'flex',alignItems:'center',gap:6,cursor:'pointer'}}>
            <input type="checkbox" checked={heatmap} onChange={(e)=>setHeatmap(e.target.checked)} />Heatmap
          </label>
          <button className="ce-btn-outline ce-btn-sm" onClick={exportCsv}>Exporter en CSV</button>
        </div>
      </div>

      <div className="ce-card">
        <div style={{overflowX:'auto',border:'1px solid #eef4f2',borderRadius:8}}>
          <table className="ce-table">
            <thead>
              <tr>
                <th>{rowField.label}</th>
                {pivot.colKeys.flatMap((ck)=>activeMetrics.map((m,mi)=>{
                  const idx = pivot.colKeys.indexOf(ck)*activeMetrics.length + mi;
                  return (
                    <th key={ck+'_'+m.key} onClick={()=>toggleSort(idx)}>
                      {colField? (ck+' — '+m.label) : m.label}{sortIdx===idx? (sortDir>0?' ▲':' ▼'):''}
                    </th>
                  );
                }))}
              </tr>
            </thead>
            <tbody>
              {sortedRows.map((r,ri)=>(
                <tr key={r.key}>
                  <td style={{fontWeight:600}}>{r.key}</td>
                  {r.cells.map((c,ci)=>{
                    const alpha = heatmap && colMax[ci]>0 && c.value!==null ? Math.min(1, Math.abs(c.value)/colMax[ci]) : 0;
                    const isOpen = drillIdx && drillIdx.rowIdx===ri && drillIdx.cellIdx===ci;
                    return (
                      <td key={ci} onClick={()=>setDrillIdx(isOpen? null : {rowIdx:ri, cellIdx:ci})}
                        style={{cursor:'pointer', background: heatmap? 'rgba(0,146,97,'+(0.08+0.5*alpha).toFixed(2)+')' : (isOpen? 'var(--ce-vert-tres-clair)':undefined)}}>
                        {fmtCell(c)}
                      </td>
                    );
                  })}
                </tr>
              ))}
              {sortedRows.length===0 && <tr><td colSpan={pivot.colKeys.length*activeMetrics.length+1} style={{textAlign:'center',color:'#9fb3ae',padding:20}}>Aucune donnée pour ce jeu.</td></tr>}
            </tbody>
            {sortedRows.length>0 && (
              <tfoot>
                <tr style={{fontWeight:700,background:'var(--ce-vert-tres-clair)',borderTop:'2px solid var(--ce-vert-pastel)'}}>
                  <td style={{padding:'7px 10px'}}>Total</td>
                  {pivot.colTotals.map((c,i)=>(<td key={i} style={{padding:'7px 10px'}}>{c===null? '—' : (activeMetrics[i%activeMetrics.length].fmt? activeMetrics[i%activeMetrics.length].fmt(c) : fmtNum(c))}</td>))}
                </tr>
              </tfoot>
            )}
          </table>
        </div>
        {drillCell && (
          <div style={{marginTop:14,border:'1px solid #eef4f2',borderRadius:8,padding:'10px 14px',maxHeight:280,overflowY:'auto'}}>
            <div style={{fontSize:'.78rem',fontWeight:700,color:'var(--ce-vert-tres-fonce)',marginBottom:8}}>
              {drillCell.items.length} élément{drillCell.items.length>1?'s':''} dans cette cellule
            </div>
            {drillCell.items.length===0 && <div style={{fontSize:'.76rem',color:'#9fb3ae'}}>Aucun élément.</div>}
            {drillCell.items.slice(0,200).map((it,i)=>{
              const r = dataset==='residences' ? it : resByCode[it.resCode];
              const label = dataset==='residences' ? (it.nom||it.code) : ((r&&r.nom)||it.resCode)+' — '+(it.nature||it.type||'Non renseigné')+' ('+(it.annee||'n.c.')+')';
              return (
                <div key={i} onClick={()=>r && onSelectResidence && onSelectResidence(r)} style={{fontSize:'.76rem',color:'var(--ce-vert-fonce)',padding:'3px 0',borderBottom:'1px solid #f0f5f3',cursor:(r&&onSelectResidence)?'pointer':'default'}}>
                  {label}
                </div>
              );
            })}
            {drillCell.items.length>200 && <div style={{fontSize:'.7rem',color:'#9fb3ae',marginTop:6}}>… et {drillCell.items.length-200} de plus (affinez les filtres transverses pour réduire la liste).</div>}
          </div>
        )}
        <p style={{fontSize:'.7rem',color:'var(--ce-vert-fonce)',marginTop:10,lineHeight:1.5}}>
          Le tableau croisé s'applique sur les données déjà filtrées par la barre de filtres transverses (pour les résidences),
          et se recalcule entièrement dans votre navigateur. Cliquez sur une cellule pour voir le détail, sur un en-tête pour trier.
        </p>
      </div>
    </div>
  );
}

/* ---------------- Jauge (demi-cercle SVG, sans dépendance externe) ---------------- */
function polarPoint(cx, cy, r, angleDeg){
  const rad = angleDeg * Math.PI / 180;
  return { x: cx + r*Math.cos(rad), y: cy - r*Math.sin(rad) };
}
function GaugeChart({value, max, label, color}){
  const size = 160, cx = size/2, cy = size/2+2, r = size/2-16;
  const has = typeof value==='number' && !isNaN(value) && max>0;
  const frac = has ? Math.max(0, Math.min(1, value/max)) : 0;
  const start = polarPoint(cx, cy, r, 180);
  const bgEnd = polarPoint(cx, cy, r, 0);
  const valEnd = polarPoint(cx, cy, r, 180 - 180*frac);
  const bgPath = 'M '+start.x+' '+start.y+' A '+r+' '+r+' 0 0 1 '+bgEnd.x+' '+bgEnd.y;
  const valPath = 'M '+start.x+' '+start.y+' A '+r+' '+r+' 0 0 1 '+valEnd.x+' '+valEnd.y;
  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',flex:1,minWidth:130}}>
      <svg viewBox={'0 0 '+size+' '+(size/2+22)} style={{width:'100%',maxWidth:170}}>
        <path d={bgPath} fill="none" stroke="var(--ce-vert-tres-clair)" strokeWidth="14" strokeLinecap="round" />
        {has && <path d={valPath} fill="none" stroke={color||'var(--ce-vert-principal)'} strokeWidth="14" strokeLinecap="round" />}
        <text x={cx} y={cy-4} textAnchor="middle" fontSize="22" fontWeight="700" fill="var(--ce-vert-tres-fonce)">{has? Math.round(value):'—'}</text>
      </svg>
      <div style={{fontSize:'.72rem',fontWeight:700,color:'var(--ce-vert-fonce)',textAlign:'center',marginTop:2}}>{label}</div>
    </div>
  );
}

/* ---------------- Mini-jauge de segmentation (quadrant attractivité/technique, climat/technique) ---------------- */
function segmentationQuadrant(residences, xKey, yKey, target){
  const xVals = residences.map((r)=>critValue(r,xKey)).filter((v)=>v!==null&&v!==undefined&&!isNaN(v)&&v>0);
  const yVals = residences.map((r)=>critValue(r,yKey)).filter((v)=>v!==null&&v!==undefined&&!isNaN(v)&&v>0);
  const xMax = xVals.length? Math.max(...xVals) : null;
  const yMax = yVals.length? Math.max(...yVals) : null;
  const bandFor = (r)=>{
    const xv = critValue(r,xKey), yv = critValue(r,yKey);
    const xPct = (xv!==null&&xv!==undefined&&!isNaN(xv)&&xMax>0) ? (xv/xMax*100) : null;
    const yPct = (yv!==null&&yv!==undefined&&!isNaN(yv)&&yMax>0) ? (yv/yMax*100) : null;
    return { xBand: bandOf(xPct), yBand: bandOf(yPct) };
  };
  const targetBand = bandFor(target);
  if (!targetBand.xBand || !targetBand.yBand) return null;
  let total=0, count=0;
  residences.forEach((r)=>{
    const b = bandFor(r);
    if (!b.xBand || !b.yBand) return;
    total++;
    if (b.xBand===targetBand.xBand && b.yBand===targetBand.yBand) count++;
  });
  return { xBand:targetBand.xBand, yBand:targetBand.yBand, count, total };
}

/* ---------------- Vue Comparatif dédiée ---------------- */
function ViewComparatif({currentSnapshot}){
  const [saves, setSaves] = useState([]);
  const [versionAId, setVersionAId] = useState(null);
  const [versionBId, setVersionBId] = useState('current');

  useEffect(()=>{
    let cancelled = false;
    idbGetAll().then((all)=>{
      if (cancelled) return;
      setSaves(all);
      const base = all.find((s)=>s.estBase);
      setVersionAId((prev)=> prev || (base? base.id : (all[0]? all[0].id : 'current')));
    });
    return ()=>{ cancelled = true; };
  }, []);

  const options = useMemo(()=>{
    const opts = [{id:'current', nom: currentSnapshot.nom}];
    saves.forEach((s)=>opts.push({id:s.id, nom:s.nom + (s.estBase?' (base)':'')}));
    return opts;
  }, [saves, currentSnapshot]);

  function resolveVersion(id){
    if (id==='current') return currentSnapshot;
    const s = saves.find((x)=>x.id===id);
    if (!s) return null;
    return { nom:s.nom, data:s.data, simOperations:s.simOperations||[], budgetLignes: migrateBudgetLignes(s), includeIdentifiees: s.includeIdentifiees!==undefined?s.includeIdentifiees:true, nomFichierSource:s.nomFichierSource, gabaritComplet:s.gabaritComplet };
  }

  const versionA = versionAId? resolveVersion(versionAId) : null;
  const versionB = versionBId? resolveVersion(versionBId) : null;
  const sameSource = versionA && versionB && versionA.nomFichierSource===versionB.nomFichierSource;

  function kpiOf(v){
    if (!v) return null;
    const totalLgt = v.data.residences.reduce((s,r)=>s+r.nbLgt,0);
    const totalInvest = v.simOperations.reduce((s,o)=>s+(o.montant||0),0) + (v.budgetLignes||[]).reduce((s,l)=>s+Object.values(l.valeurs||{}).reduce((s2,x)=>s2+(Number(x)||0),0),0);
    const dpeTotals = {A:0,B:0,C:0,D:0,E:0,F:0,G:0,NR:0};
    v.data.residences.forEach((r)=>{ if (r.distEnergie) Object.keys(dpeTotals).forEach((k)=>{ dpeTotals[k]+=(r.distEnergie[k]||0); }); });
    return { totalLgt, nbRes:v.data.residences.length, totalInvest, dpeTotals };
  }
  const kpiA = useMemo(()=>kpiOf(versionA), [versionA]);
  const kpiB = useMemo(()=>kpiOf(versionB), [versionB]);

  const years = useMemo(()=>{
    if (!versionA || !versionB) return [];
    const ya = computeYearsRange(versionA.simOperations);
    const yb = computeYearsRange(versionB.simOperations);
    const minY = Math.min(ya[0], yb[0]), maxY = Math.max(ya[ya.length-1], yb[yb.length-1]);
    const arr=[]; for (let y=minY;y<=maxY;y++) arr.push(y);
    return arr;
  }, [versionA, versionB]);

  function investByYear(v){
    if (!v) return [];
    const ops = v.simOperations.filter((o)=> v.includeIdentifiees || o.statut==='programme');
    return years.map((y)=> ops.filter((o)=>o.annee===y).reduce((s,o)=>s+(o.montant||0),0) + sumBudgetLignesYear(v.budgetLignes, y));
  }
  const investA = useMemo(()=>investByYear(versionA), [versionA, years]);
  const investB = useMemo(()=>investByYear(versionB), [versionB, years]);

  function dpeShareByYear(v){
    if (!v || !v.data.hasGainsGrid) return null;
    const vy = computeYearsRange(v.simOperations);
    const traj = computeTrajectory(v.data.residences, v.simOperations, v.data.gainsGrid, vy, 'energie', v.includeIdentifiees);
    const classes = ['A','B','C','D','E','F','G','NR'];
    function bestShare(d){ return d? (d.A+d.B+d.C)/Math.max(1,classes.reduce((s,c)=>s+d[c],0))*100 : null; }
    return years.map((y)=>{ const idx = vy.indexOf(y); return idx>=0? bestShare(traj[vy[idx]]) : null; });
  }
  const dpeShareA = useMemo(()=>dpeShareByYear(versionA), [versionA, years]);
  const dpeShareB = useMemo(()=>dpeShareByYear(versionB), [versionB, years]);
  const hasDpeCompare = dpeShareA && dpeShareB;

  const opsDiff = useMemo(()=>{
    if (!versionA || !versionB) return {added:[],removed:[],modified:[]};
    const resByCodeB = {}; versionB.data.residences.forEach((r)=>{ resByCodeB[r.code]=r; });
    const resByCodeA = {}; versionA.data.residences.forEach((r)=>{ resByCodeA[r.code]=r; });
    const mapA = new Map(versionA.simOperations.map((o)=>[o.id,o]));
    const mapB = new Map(versionB.simOperations.map((o)=>[o.id,o]));
    const added=[], removed=[], modified=[];
    mapB.forEach((o,id)=>{ if (!mapA.has(id)) added.push(Object.assign({},o,{resNom:(resByCodeB[o.resCode]||{}).nom||o.resCode})); });
    mapA.forEach((o,id)=>{ if (!mapB.has(id)) removed.push(Object.assign({},o,{resNom:(resByCodeA[o.resCode]||{}).nom||o.resCode})); });
    mapA.forEach((oa,id)=>{
      const ob = mapB.get(id);
      if (ob && (oa.annee!==ob.annee || oa.montant!==ob.montant || oa.statut!==ob.statut)){
        const changes = [];
        if (oa.annee!==ob.annee) changes.push('Année '+(oa.annee??'—')+' → '+(ob.annee??'—'));
        if (oa.montant!==ob.montant) changes.push('Montant '+fmtEur(oa.montant)+' → '+fmtEur(ob.montant));
        if (oa.statut!==ob.statut) changes.push('Statut '+oa.statut+' → '+ob.statut);
        modified.push({ id, resNom:(resByCodeA[oa.resCode]||{}).nom||oa.resCode, type:ob.type, annee:ob.annee, montant:ob.montant, statut:ob.statut, changes: changes.join(' · ') });
      }
    });
    return {added, removed, modified};
  }, [versionA, versionB]);

  const diffRows = [
    ...opsDiff.added.map((o)=>({...o, changeType:'Ajoutée'})),
    ...opsDiff.removed.map((o)=>({...o, changeType:'Supprimée'})),
    ...opsDiff.modified.map((m)=>({...m, changeType:'Modifiée'})),
  ];
  const diffCols = [
    {key:'changeType', label:'Changement', render:(o)=>{
      const color = o.changeType==='Ajoutée'?'var(--ce-vert-principal)':o.changeType==='Supprimée'?'var(--ce-corail)':'#264E46';
      return <span className="ce-badge" style={{background:color, color:'#fff'}}>{o.changeType}</span>;
    }},
    {key:'resNom', label:'Résidence'},
    {key:'type', label:'Type de travaux'},
    {key:'annee', label:'Année', render:(o)=>o.annee??'—'},
    {key:'montant', label:'Montant', render:(o)=>fmtEur(o.montant)},
    {key:'statut', label:'Statut', render:(o)=>o.statut==='programme'?'Programmé':'Identifié'},
    {key:'changes', label:'Détail', render:(o)=>o.changes||'—'},
  ];

  return (
    <div style={{padding:24,display:'flex',flexDirection:'column',gap:20}}>
      <div className="ce-card">
        <h2 style={{fontSize:'.95rem',color:'var(--ce-vert-tres-fonce)',fontWeight:700,marginBottom:14}}>Comparatif de versions</h2>
        <div style={{display:'flex',gap:16,flexWrap:'wrap'}}>
          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            <label style={{fontSize:'.68rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>Version A</label>
            <select className="ce-select" value={versionAId||''} onChange={(e)=>setVersionAId(e.target.value)}>
              {options.map((o)=><option key={o.id} value={o.id}>{o.nom}</option>)}
            </select>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            <label style={{fontSize:'.68rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>Version B</label>
            <select className="ce-select" value={versionBId||''} onChange={(e)=>setVersionBId(e.target.value)}>
              {options.map((o)=><option key={o.id} value={o.id}>{o.nom}</option>)}
            </select>
          </div>
        </div>
        {versionA && versionB && !sameSource && (
          <div style={{marginTop:14,background:'var(--ce-saumon)',borderRadius:8,padding:'10px 14px',fontSize:'.75rem',color:'var(--ce-vert-tres-fonce)'}}>
            <b>Attention :</b> ces deux versions ne proviennent pas du même fichier source ({versionA.nomFichierSource} / {versionB.nomFichierSource}) — vous comparez potentiellement deux patrimoines différents, pas seulement deux scénarios d'un même patrimoine.
          </div>
        )}
      </div>

      {kpiA && kpiB && (
        <div className="ce-card">
          <h3 style={{fontSize:'.85rem',fontWeight:700,marginBottom:12,color:'var(--ce-vert-tres-fonce)'}}>KPI globaux</h3>
          <div style={{overflowX:'auto'}}>
            <table className="ce-table">
              <thead><tr><th>Indicateur</th><th>Version A — {versionA.nom}</th><th>Version B — {versionB.nom}</th><th>Δ</th></tr></thead>
              <tbody>
                <tr><td>Logements</td><td>{fmtNum(kpiA.totalLgt)}</td><td>{fmtNum(kpiB.totalLgt)}</td><td>{kpiB.totalLgt-kpiA.totalLgt>=0?'+':''}{fmtNum(kpiB.totalLgt-kpiA.totalLgt)}</td></tr>
                <tr><td>Résidences</td><td>{fmtNum(kpiA.nbRes)}</td><td>{fmtNum(kpiB.nbRes)}</td><td>{kpiB.nbRes-kpiA.nbRes>=0?'+':''}{fmtNum(kpiB.nbRes-kpiA.nbRes)}</td></tr>
                <tr><td>Budget investissement total</td><td>{fmtKEur(kpiA.totalInvest)}</td><td>{fmtKEur(kpiB.totalInvest)}</td><td>{kpiB.totalInvest-kpiA.totalInvest>=0?'+':''}{fmtKEur(kpiB.totalInvest-kpiA.totalInvest)} ({kpiA.totalInvest>0? (((kpiB.totalInvest-kpiA.totalInvest)/kpiA.totalInvest*100).toFixed(0)):'—'}%)</td></tr>
                {['A','B','C','D','E','F','G'].map((cl)=>(
                  <tr key={cl}><td>DPE Énergie — classe {cl}</td><td>{fmtNum(kpiA.dpeTotals[cl])}</td><td>{fmtNum(kpiB.dpeTotals[cl])}</td><td>{kpiB.dpeTotals[cl]-kpiA.dpeTotals[cl]>=0?'+':''}{fmtNum(kpiB.dpeTotals[cl]-kpiA.dpeTotals[cl])}</td></tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {years.length>0 && (
        <div className="ce-card">
          <h3 style={{fontSize:'.85rem',fontWeight:700,marginBottom:12,color:'var(--ce-vert-tres-fonce)'}}>Trajectoire d'investissement</h3>
          <ChartCanvas type="line" height={260} data={{
            labels: years,
            datasets:[
              { label:'Version A — '+versionA.nom, data: investA, borderColor:'#9fb3ae', backgroundColor:'#9fb3ae', pointRadius:2, tension:.2 },
              { label:'Version B — '+versionB.nom, data: investB, borderColor:'#009261', backgroundColor:'#009261', pointRadius:2, tension:.2 },
            ]
          }} options={{ scales:{ y:{ beginAtZero:true, ticks:{callback:(v)=>fmtKEur(v)} } } }} />
        </div>
      )}

      {hasDpeCompare && (
        <div className="ce-card">
          <h3 style={{fontSize:'.85rem',fontWeight:700,marginBottom:12,color:'var(--ce-vert-tres-fonce)'}}>Trajectoire de décarbonation (% logements classe A-C, DPE Énergie)</h3>
          <ChartCanvas type="line" height={260} data={{
            labels: years,
            datasets:[
              { label:'Version A — '+versionA.nom, data: dpeShareA, borderColor:'#9fb3ae', backgroundColor:'#9fb3ae', pointRadius:2, tension:.2 },
              { label:'Version B — '+versionB.nom, data: dpeShareB, borderColor:'#009261', backgroundColor:'#009261', pointRadius:2, tension:.2 },
            ]
          }} options={{ scales:{ y:{ beginAtZero:true, max:100 } } }} />
        </div>
      )}

      {versionA && versionB && (
        <div className="ce-card">
          <h3 style={{fontSize:'.85rem',fontWeight:700,marginBottom:12,color:'var(--ce-vert-tres-fonce)'}}>Opérations qui diffèrent entre A et B ({diffRows.length})</h3>
          <SortableTable columns={diffCols} rows={diffRows} pageSize={20} />
          {diffRows.length===0 && <p style={{fontSize:'.75rem',color:'#9fb3ae',marginTop:8}}>Aucune différence détectée entre les opérations des deux versions.</p>}
        </div>
      )}
    </div>
  );
}

/* ---------------- Fiche résidence (drill-down) ---------------- */
function ResidenceDrawer({residence, operations, residences, onClose, gainsGrid, hasGainsGrid, includeIdentifiees, baseImport}){
  const [tab, setTab] = useState('synthese');
  // Les hooks doivent s'exécuter à chaque rendu dans le même ordre : le "return null" pour
  // l'absence de résidence sélectionnée doit donc venir APRÈS tous les hooks, jamais avant
  // (sans quoi React lève l'erreur #310 dès qu'une résidence est sélectionnée la 1re fois).
  const climatNoteKey = useMemo(()=>{
    for (const r of (residences||[])){ if (r.notes){ const k = Object.keys(r.notes).find((kk)=>ceNorm(kk).includes('climat')); if (k) return k; } }
    return null;
  }, [residences]);
  const quadrantAttractTechnique = useMemo(()=> (residence && residences && residences.length) ? segmentationQuadrant(residences,'attractivite','technique',residence) : null, [residences, residence]);
  const quadrantClimatTechnique = useMemo(()=> (residence && residences && residences.length && climatNoteKey) ? segmentationQuadrant(residences, climatNoteKey, 'technique', residence) : null, [residences, residence, climatNoteKey]);
  // §6 — projection DPE post-travaux à horizon 10 ans, restreinte aux opérations de cette résidence.
  // Année de référence = début de la trajectoire propre à cette résidence (pas une année calendaire
  // fixe), en réutilisant la même cascade que la trajectoire de décarbonation globale (computeTrajectory).
  const dpeHorizon = useMemo(()=>{
    if (!residence || !hasGainsGrid) return null;
    const resOps = (operations||[]).filter((o)=>o.resCode===residence.code);
    const startYear = computeYearsRange(resOps)[0];
    const endYear = startYear + 10;
    const seq = []; for (let y=startYear;y<=endYear;y++) seq.push(y);
    const trajE = computeTrajectory([residence], resOps, gainsGrid||{}, seq, 'energie', includeIdentifiees);
    const trajG = computeTrajectory([residence], resOps, gainsGrid||{}, seq, 'ges', includeIdentifiees);
    return { startYear, endYear, avantE: trajE[startYear], apresE: trajE[endYear], avantG: trajG[startYear], apresG: trajG[endYear] };
  }, [residence, operations, gainsGrid, hasGainsGrid, includeIdentifiees]);

  if (!residence) return null;
  const ops = operations.filter((o)=>o.resCode===residence.code).sort((a,b)=>(a.annee||9999)-(b.annee||9999));
  const programmees = ops.filter((o)=>o.statut==='programme');
  const identifiees = ops.filter((o)=>o.statut==='identifie');
  const identifieesTop4 = identifiees.slice(0,4);
  const critereGroups = residence.critereGroups || {};

  // §5.4 — comparaison Base des actions de cette résidence, même fonction d'appariement matchOperations
  // que la table des écarts d'"Investissements & Entretien du parc" (§5.3), jamais une 2e implémentation.
  const baseOpsForResidence = baseImport ? (baseImport.simOperations||[]).filter((o)=>o.resCode===residence.code) : [];
  const ecartsResidence = baseImport ? matchOperations(ops, baseOpsForResidence) : null;
  const baseMatchByActuelId = {};
  if (ecartsResidence) ecartsResidence.matched.forEach((m)=>{ baseMatchByActuelId[m.actuelOp.id] = m; });
  const disparuesResidence = ecartsResidence ? ecartsResidence.disparues : [];
  function baseAnnotation(o){
    if (!baseImport) return null;
    const m = baseMatchByActuelId[o.id];
    if (m){
      if ((!m.deltaAnnees || m.deltaAnnees===0) && (!m.deltaMontant || m.deltaMontant===0)) return null; // identique à la base, rien à signaler
      return (
        <div style={{marginTop:4,fontSize:'.7rem',color:'var(--ce-corail)',background:'#fff1ec',display:'inline-block',borderRadius:8,padding:'2px 8px'}}>
          Base : {fmtEur(m.baseOp.montant)} en {m.baseOp.annee ?? '—'}{m.deltaAnnees? ' ('+(m.deltaAnnees>=0?'+':'')+m.deltaAnnees+' an'+(Math.abs(m.deltaAnnees)>1?'s':'')+')':''}
        </div>
      );
    }
    return <div style={{marginTop:4,fontSize:'.7rem',color:'var(--ce-corail)',fontStyle:'italic'}}>Nouvelle opération (absente de la base)</div>;
  }

  const byYear = {};
  ops.forEach((o)=>{ const y=o.annee||'?'; byYear[y]=(byYear[y]||0)+(o.montant||0); });
  const years = Object.keys(byYear).filter((y)=>y!=='?').sort();

  const tabs = [
    {id:'synthese', label:'Synthèse'},
    {id:'actions', label:'Actions stratégiques'},
    {id:'suivi', label:'Suivi / commentaire'},
  ];

  return (
    <React.Fragment>
      <div className="drawer-overlay" onClick={onClose}></div>
      <div className="drawer">
        <div style={{background:'var(--ce-vert-tres-fonce)',padding:'18px 22px',color:'#fff'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
            <div>
              <div style={{fontSize:'.68rem',opacity:.75,textTransform:'uppercase',letterSpacing:'.04em'}}>Fiche résidence</div>
              <div style={{fontSize:'1.2rem',fontWeight:700}}>{residence.nom || residence.code}</div>
              <div style={{fontSize:'.78rem',opacity:.85,marginTop:2}}>{[residence.commune, residence.secteur, residence.agence].filter(Boolean).join(' · ')}</div>
            </div>
            <button onClick={onClose} style={{background:'transparent',border:'none',color:'#fff',fontSize:'1.3rem',cursor:'pointer',lineHeight:1}}>×</button>
          </div>
          <div style={{display:'flex',gap:8,marginTop:12}}>
            <DpeBadge cl={residence.dpeEnergie}/><span style={{fontSize:'.72rem',opacity:.85,alignSelf:'center'}}>Énergie</span>
            <DpeBadge cl={residence.dpeGES}/><span style={{fontSize:'.72rem',opacity:.85,alignSelf:'center'}}>GES</span>
          </div>
        </div>
        <div style={{display:'flex',borderBottom:'2px solid #eef4f2',padding:'0 12px'}}>
          {tabs.map((t)=>(<div key={t.id} className={"ce-tab"+(tab===t.id?" active":"")} onClick={()=>setTab(t.id)}>{t.label}</div>))}
        </div>
        <div style={{padding:22}}>
          {tab==='synthese' && (
            <div style={{display:'flex',flexDirection:'column',gap:16}}>
              <div className="ce-card">
                <h3 style={{fontSize:'.8rem',fontWeight:700,marginBottom:10}}>Identité</h3>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,fontSize:'.8rem'}}>
                  <div><b>Code :</b> {residence.code}</div>
                  <div><b>Nb logements :</b> {fmtNum(residence.nbLgt)}</div>
                  {residence.adresse && <div style={{gridColumn:'1 / -1'}}><b>Adresse :</b> {residence.adresse}</div>}
                  {residence.qpv && <div><b>QPV :</b> {residence.qpv}</div>}
                  {residence.codeInsee && <div><b>Code INSEE :</b> {residence.codeInsee}</div>}
                  {residence.anneeConstruction && <div><b>Année de construction :</b> {residence.anneeConstruction}</div>}
                  {residence.shab!==null && <div><b>SHAB :</b> {fmtNum(residence.shab)} m²</div>}
                  {residence.corpro && <div><b>Copro :</b> {residence.corpro}</div>}
                  {residence.tauxVacance!==null && <div><b>Taux de vacance :</b> {residence.tauxVacance}%</div>}
                  {residence.autofinancementLgt!==null && <div><b>Autofinancement / lgt :</b> {fmtEur(residence.autofinancementLgt)}</div>}
                </div>
                {(residence.distEnergie || residence.distGES) && (
                  <div style={{marginTop:14}}>
                    <h4 style={{fontSize:'.72rem',fontWeight:700,marginBottom:6,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>Répartition DPE</h4>
                    <table className="ce-table">
                      <thead><tr><th>Classe</th><th>Énergie</th><th>GES</th></tr></thead>
                      <tbody>
                        {['A','B','C','D','E','F','G','NR'].map((cl)=>(
                          <tr key={cl}>
                            <td><DpeBadge cl={cl}/></td>
                            <td>{residence.distEnergie? fmtNum(residence.distEnergie[cl]||0):'—'}</td>
                            <td>{residence.distGES? fmtNum(residence.distGES[cl]||0):'—'}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
              {(residence.crd!==null || residence.autofinancement!==null || residence.vnc!==null) && (
                <div className="ce-card">
                  <h3 style={{fontSize:'.8rem',fontWeight:700,marginBottom:10}}>Données financières</h3>
                  <div style={{display:'flex',gap:16,flexWrap:'wrap'}}>
                    {residence.crd!==null && <div style={{flex:1,minWidth:120}}><div style={{fontSize:'.68rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>CRD</div><div style={{fontSize:'1.1rem',fontWeight:700,color:'var(--ce-vert-principal)'}}>{fmtEur(residence.crd)}</div></div>}
                    {residence.autofinancement!==null && <div style={{flex:1,minWidth:120}}><div style={{fontSize:'.68rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>Autofinancement</div><div style={{fontSize:'1.1rem',fontWeight:700,color:'var(--ce-vert-principal)'}}>{fmtEur(residence.autofinancement)}</div></div>}
                    {residence.vnc!==null && <div style={{flex:1,minWidth:120}}><div style={{fontSize:'.68rem',fontWeight:700,color:'var(--ce-vert-fonce)',textTransform:'uppercase'}}>VNC</div><div style={{fontSize:'1.1rem',fontWeight:700,color:'var(--ce-vert-principal)'}}>{fmtEur(residence.vnc)}</div></div>}
                  </div>
                </div>
              )}
              <div className="ce-card">
                <h3 style={{fontSize:'.8rem',fontWeight:700,marginBottom:10}}>Jauges de synthèse</h3>
                <div style={{display:'flex',gap:8,flexWrap:'wrap',justifyContent:'space-around'}}>
                  <GaugeChart label="Attractivité globale" value={residence.attractivite} max={100} color="#009261" />
                  <GaugeChart label="Note technique" value={residence.technique} max={100} color="#264E46" />
                  {residence.performanceCarbone!==null && <GaugeChart label="Performance carbone" value={residence.performanceCarbone} max={100} color="#58D88B" />}
                </div>
              </div>
              <div className="ce-card">
                <h3 style={{fontSize:'.8rem',fontWeight:700,marginBottom:10}}>Scores de diagnostic</h3>
                <CritBar label={"Attractivité"+(residence.familleAttract? ' (famille '+residence.familleAttract+')':'')} value={residence.attractivite} max={100} />
                <CritBar label={"État technique"+(residence.familleTechnique? ' (famille '+residence.familleTechnique+')':'')} value={residence.technique} max={100} />
              </div>
              {Object.keys(critereGroups).length>0 && (
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
                  {['environnement','programme','technique','carbone','climat'].map((key)=> critereGroups[key] ? (
                    <RadarChart key={key} title={critereGroups[key].label} values={critereGroups[key].values} />
                  ) : null)}
