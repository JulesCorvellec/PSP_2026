<script id="engine-source">
/* =========================================================================
   MOTEUR DE PARSING PSP — lecture des fichiers Excel côté client (SheetJS)
   Aucune donnée n'est transmise à un serveur : tout le traitement a lieu
   dans le navigateur. Le mapping est construit par détection de colonnes
   (recherche du nom d'en-tête), pas par position fixe, afin de rester
   robuste aux variations d'un fichier bailleur à l'autre (cf. cahier des
   charges §11 — variabilité des fichiers clients réels).
   ========================================================================= */

function ceStripAccents(s){ return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function ceNorm(s){
  if (s===null||s===undefined) return '';
  return ceStripAccents(String(s)).toLowerCase().replace(/[°''']/g,'').trim().replace(/\s+/g,' ');
}
// Certains fichiers PSP utilisent "NR" / "N/A" comme convention explicite pour une donnée
// manquante ou non pertinente (cf. onglet Paramétrage) : Number("NR") vaut NaN, ce qui
// s'affichait tel quel ("NaN") dans l'interface. On distingue explicitement l'absence
// de donnée (null) d'une vraie valeur numérique.
function ceNum(v){
  if (v===null||v===undefined||v==='') return null;
  if (typeof v==='number') return isNaN(v)? null : v;
  const n = ceNorm(v);
  if (n==='nr'||n==='n/a'||n==='na'||n==='') return null;
  const num = Number(String(v).replace(',','.'));
  return isNaN(num)? null : num;
}
function sheetToMatrix(ws){ return XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null}); }
function findHeaderRow(matrix, testFn, maxScan){
  const lim = Math.min(maxScan||25, matrix.length);
  for (let r=0;r<lim;r++){ if (testFn(matrix[r]||[])) return r; }
  return -1;
}
function findColIndex(headerRow, patterns){
  for (const p of patterns){ for (let i=0;i<headerRow.length;i++){ if (p.test(ceNorm(headerRow[i]))) return i; } }
  return -1;
}
function findAllColIndices(headerRow, pattern){
  const out=[]; for (let i=0;i<headerRow.length;i++){ if (pattern.test(ceNorm(headerRow[i]))) out.push(i); } return out;
}
function findSheet(sheetNames, pattern){ return sheetNames.find((n)=>pattern.test(ceNorm(n))); }

/* Colonnes de la Base de cotation vérifiées le 2026-07-10 sur les deux fichiers de référence du
   projet (Base patrimoniale_PSP STANDARD v2.xlsx — gabarit complet, 299 colonnes ; Base
   patrimoniale_PSP_OPH_Aubervilliers V4.xlsx — gabarit réduit, 233 colonnes), utilisées pour
   l'enrichissement V4 de la Vue d'ensemble (cf. cahier des charges V4 §Tâche A) :
   - "Année de construction" : présente et peuplée dans les deux fichiers (col. 27 / col. 27).
   - "QPV / Hors QPV" : présente dans les deux fichiers mais convention de valeur différente d'un
     fichier à l'autre — STANDARD utilise "QPV" (vide sinon), Aubervilliers utilise "OUI"/"NON"
     explicites. D'où une détection par exclusion (tout sauf vide/"non"/"hors qpv") plutôt qu'une
     égalité stricte à une valeur unique.
   - "DPE Principal" : présente et peuplée dans les deux fichiers (col. 42 / col. 34).
   - "typologie" (Individuel/Collectif, une valeur par résidence) : présente dans les deux fichiers
     mais seulement peuplée dans STANDARD (40/40) ; entièrement vide dans Aubervilliers (0/84) bien
     que la colonne existe — dégradation gracieuse attendue.
   - "Mode énergie chauffage" / "Mode énergie ECS" : présentes et peuplées dans les deux fichiers.
   - "dont conventionné" / "dont foyer / résidences social" : présentes dans les deux fichiers mais
     partiellement peuplées uniquement (comptes par résidence, pas un statut unique) — utilisées en
     somme (comme nbLgt), jamais comme statut catégoriel unique.
   - "PLU" : non trouvée dans les deux fichiers fournis (aucun en-tête ne s'en approche). TODO :
     colonne non trouvée, à confirmer avec Jules — non codée, aucun indicateur PLU dans l'UI.
   - "Financement" (PLAI/PLUS/HLM) : présente et peuplée dans STANDARD (40/40) mais entièrement vide
     dans Aubervilliers (0/84) — non retenue pour un indicateur dédié V4 (redondante avec la
     conventionnalité issue de "dont conventionné", et absente d'un des deux fichiers de référence).
   - "Moyenne - Performance Carbonne" : présente uniquement dans STANDARD, absente d'Aubervilliers —
     réservée à la Tâche B (fiche résidence), non utilisée en Tâche A. */
function parseBaseCotation(matrix){
  const headerRowIdx = findHeaderRow(matrix, (row)=>row.some((c)=>ceNorm(c)==='code de residence'));
  if (headerRowIdx===-1) return null;
  const header = matrix[headerRowIdx];
  const codeCol = findColIndex(header,[/^code de residence$/]);
  const dataRows = matrix.slice(headerRowIdx+1).filter((r)=>r && r[codeCol]!==null && r[codeCol]!==undefined && r[codeCol]!=='');

  const idx = {
    code: codeCol,
    nom: findColIndex(header,[/^nom residence$/,/^nom du groupe$/]),
    adresse: findColIndex(header,[/^adresse$/,/compilation adresse/]),
    commune: findColIndex(header,[/^commune$/]),
    secteur: findColIndex(header,[/^secteur$/]),
    agence: findColIndex(header,[/^agence$/]),
    codePostal: findColIndex(header,[/^code postal$/]),
    qpv: findColIndex(header,[/qpv/]),
    nbLgt: findColIndex(header,[/^nb lgt ou eq/, /^nb lgts? \(/, /^nb lgts?$/]),
    dpeEnergie: findColIndex(header,[/^dpe energie$/, /^etiquette dpe energie/]),
    dpeGES: findColIndex(header,[/^dpe ges$/, /^etiquette dpe ges/]),
    attractivite: findColIndex(header,[/^note attractivite globale$/, /^note attractivite totale/, /^note de service rendu/]),
    technique: findColIndex(header,[/^moyenne - technique$/, /^note technique globale$/, /^note etat technique$/]),
    familleAttract: findColIndex(header,[/^famille attractivite$/]),
    familleTechnique: findColIndex(header,[/^famille etat technique$/]),
    anneeConstruction: findColIndex(header,[/^annee de construction$/]),
    dpePrincipal: findColIndex(header,[/^dpe principal$/]),
    typeBati: findColIndex(header,[/^typologie$/]),
    modeChauffage: findColIndex(header,[/^mode energie chauffage$/]),
    modeECS: findColIndex(header,[/^mode energie ecs$/]),
    // V9 §1 — trajectoire de décarbonation. « kWh / m² » est l'entrée JX du calcul Excel (consommation
    // constatée), « Type chauffage » (Individuel/Collectif/Hybride) complète « Mode énergie chauffage »
    // pour déduire le facteur d'émission de départ (entrée JY). La colonne « kg CO₂e / m² » existe aussi
    // dans le gabarit mais n'est PAS reprise : l'Excel ne s'en sert nulle part dans la trajectoire, qui
    // recalcule les émissions en kWh/m² × facteur d'émission (cf. computeDecarbonation).
    kwhM2: findColIndex(header,[/^kwh ?\/ ?m.?$/]),
    // Motif non ancré en fin : l'en-tête du gabarit porte un retour à la ligne et sa légende
    // (« Type chauffage ⏎ Individuel/Collectif »), que ceNorm ramène à un espace.
    typeChauffage: findColIndex(header,[/^type chauffage/]),
    dontConventionne: findColIndex(header,[/^dont conventionne$/]),
    dontFoyer: findColIndex(header,[/^dont foyer/]),
    financement: findColIndex(header,[/^financement$/]),
    codeInsee: findColIndex(header,[/^code insee$/]),
    shab: findColIndex(header,[/^shab \(m.?\)$/]),
    corpro: findColIndex(header,[/^corpro$/]),
    // Colonne brute en %, distincte de la note de cotation "Taux de vacance" du groupe
    // critereGroups.economique (échelle 0/33/66/100, cf. CRITERE_GROUP_DEFS ci-dessous) — motif
    // ancré en préfixe pour absorber le suffixe millésimé côté Aubervilliers ("... (en %) 2024"),
    // sans jamais matcher la variante bare (cotation) ni la variante "hors démolition".
    tauxVacance: findColIndex(header,[/^taux de vacance \(en %\)/]),
    autofinancementLgt: findColIndex(header,[/^autofinancement \(en.*pa lgt\)/, /^autofi\s*\/\s*lgt$/]),
    // Tâche D — Offre nouvelle & Vente : pas d'onglet ONI/ONNI dédié dans les fichiers de référence
    // (confirmé le 2026-07-10, cf. commentaire au-dessus de parseBaseCotation) ; la partie "Vente"
    // est en réalité déjà portée par ces colonnes de la Base de cotation elle-même (confirmées dans
    // Base patrimoniale_PSP STANDARD v2.xlsx, partiellement peuplées — 3 à 5 résidences sur 40 ;
    // colonnes présentes mais vides dans Aubervilliers V4, sauf "Montant au m²").
    planVente: findColIndex(header,[/^plan de vente$/]),
    conventionneVente: findColIndex(header,[/^conventionne \/ non conventionne$/]),
    nbLgtMiseVente: findColIndex(header,[/^nombre de logement a la mise en vente$/]),
    nbLgtRestantVente: findColIndex(header,[/^nombre de logement restant$/]),
    prixVenteBrut: findColIndex(header,[/^prix de vente/]),
    montantVenteM2: findColIndex(header,[/^montant au m/]),
    typeVente: findColIndex(header,[/^type de vente$/]),
    // Données financières (CRD / Autofinancement / VNC) — colonnes vérifiées le 2026-07-10 sur les
    // deux fichiers de référence, présentes et bien peuplées dans les deux (niveau résidence
    // uniquement : la feuille "1. Actions P et I" ne fait que répéter la valeur résidence sur
    // chaque ligne d'opération via formule, ce n'est pas une donnée distincte par opération — donc
    // pas de granularité "par opération" dans ces fichiers, seulement "par résidence"). Motifs
    // conçus pour cibler la valeur totale par résidence, pas la déclinaison "par logement" (colonnes
    // distinctes également présentes mais non retenues ici, ex. "CRD (en € / lgt)" / "CRD / lgt").
    crd: findColIndex(header,[/^crd\s*\(en.*res/, /^crd\s*\(\d{4}\)$/]),
    vnc: findColIndex(header,[/^vnc\s*\(en.*res/, /^vnc\s*\(\d{4}\)$/]),
    autofinancement: findColIndex(header,[/^autofinancement \(en.*res/, /^autofinancement \d{2}\/\d{2}/]),
  };
  const typoCols = {};
  ['T1','T2','T3','T4','T5','T6+'].forEach((t)=>{ typoCols[t]=findColIndex(header,[new RegExp('^'+t.toLowerCase().replace('+','\\+')+'$')]); });

  // Colonnes "notes" génériques (au-delà d'Attractivité/État technique) pouvant servir de
  // critère de segmentation : détectées par mot-clé d'en-tête plutôt que par position fixe,
  // pour rester robustes d'un fichier bailleur à l'autre. Chaque colonne garde son échelle
  // native (0-3, 0-10, sur 100...) ; c'est la vue de segmentation qui la ramène en % de son
  // maximum observé pour appliquer des seuils comparables (§ segmentation en 9 familles).
  const NOTE_PATTERNS = [
    /^note /,
    /^moyenne .*(technique|attractivit|climat|economique|segmentation)/,
    /^etat technique (du logement|facades)/,
    /^niveau de loyers$/,
    /^indice /,
    /^score /,
  ];
  const noteCols = [];
  header.forEach((h,c)=>{
    if (c===idx.attractivite || c===idx.technique) return;
    const n = ceNorm(h);
    if (!n) return;
    if (NOTE_PATTERNS.some((p)=>p.test(n))) noteCols.push({ label: String(h).trim(), col: c });
  });

  idx.performanceCarbone = findColIndex(header,[/^moyenne.*performance carbon/]);

  // Sous-critères de cotation détaillés (Tâche B — fiche résidence, radars/graphiques). Colonnes
  // vérifiées le 2026-07-10 sur Base patrimoniale_PSP STANDARD v2.xlsx (gabarit complet) : présentes
  // et peuplées. Absentes (ou nommées différemment) dans Base patrimoniale_PSP_OPH_Aubervilliers V4.xlsx
  // (gabarit réduit / ancien PSP antérieur au gabarit Cellance actuel) — chaque groupe ne s'affichera
  // donc, en pratique, que sur des fichiers construits sur le gabarit complet récent. Détection par nom
  // normalisé (ceNorm), jamais par position, pour rester robuste si l'ordre des colonnes varie.
  const CRITERE_GROUP_DEFS = [
    { key:'environnement', label:"Environnement urbain", patterns:[
      [/^accessibilite et desserte du quartier$/,'Accessibilité et desserte du quartier'],
      [/^equipements commerciaux et service de proximite/,'Équipements commerciaux et services de proximité'],
      [/^image du quartier$/,'Image du quartier'],
      [/^nuisance et vie sociale$/,'Nuisance et vie sociale'],
    ]},
    { key:'programme', label:"Programme", patterns:[
      [/^les abords et espaces verts$/,'Abords et espaces verts'],
      [/^les stationnements$/,'Stationnements'],
      [/^les parties communes$/,'Parties communes'],
      [/^les equipements techniques collectifs$/,'Équipements techniques collectifs'],
      [/^les logements$/,'Logements'],
      [/^accessibilite \/ adaptabilite pmr$/,'Accessibilité / Adaptabilité PMR'],
    ]},
    { key:'technique', label:"État technique", patterns:[
      [/^facades, toitures et couvertures$/,'Façades, toitures et couvertures'],
      [/^menuiserie$/,'Menuiserie'],
      [/^parties communes$/,'Parties communes'],
      [/^parties privatives$/,'Parties privatives'],
      [/^structure$/,'Structure'],
    ]},
    { key:'carbone', label:"Performance carbone", patterns:[
      [/^etiquette dpe \(nouveau\)$/,'Étiquette DPE (nouveau)'],
      [/^systeme de chauffage$/,'Système de chauffage'],
      [/^capacite de decarbonation$/,'Capacité de décarbonation'],
      [/^emissions absolues/,'Émissions absolues (tCO2e)'],
    ]},
    { key:'climat', label:"Confort d'été / Résilience climatique", patterns:[
      [/^pompe a chaleur reversible/,'Pompe à chaleur réversible / climatisation'],
      [/^vagues de chaleur$/,'Vagues de chaleur'],
      [/^vulnerabilite des residents$/,'Vulnérabilité des résidents'],
      [/^rga$/,'RGA'],
      [/^incendie$/,'Incendie'],
      [/^inondation$/,'Inondation'],
    ]},
    { key:'economique', label:"Performance économique", patterns:[
      [/^commercialite$/,'Commercialité'],
      [/^taux de vacance$/,'Taux de vacance'],
      [/^taux d.?impayes$/,"Taux d'impayés"],
      [/^niveau de loyers$/,'Niveau de loyers'],
      [/^autofinancement$/,'Autofinancement'],
      [/^capitaux restants dus$/,'Capitaux restants dus'],
      [/^taux de rotation$/,'Taux de rotation'],
      [/^valeur nette comptable$/,'Valeur nette comptable'],
      [/^ecart loyers plafonds \/ pratiques$/,'Écart loyers plafonds / pratiqués'],
    ]},
    { key:'social', label:"Fragilité sociale", patterns:[
      [/^taux de famille monoparentale$/,'Taux de familles monoparentales'],
      [/^ressources < a 60% du plafonds plus$/,'Ressources < 60% du plafond PLUS'],
      [/^ressources < a 20% du plafonds plus$/,'Ressources < 20% du plafond PLUS'],
      [/^taux de chomeurs et inactifs$/,'Taux de chômeurs et inactifs'],
      [/^vieillissement$/,'Vieillissement'],
    ]},
  ];
  const critereGroupCols = {};
  CRITERE_GROUP_DEFS.forEach((g)=>{
    const cols = [];
    g.patterns.forEach(([pattern,label])=>{
      const c = findColIndex(header,[pattern]);
      if (c>=0) cols.push({label, col:c});
    });
    if (cols.length>=3) critereGroupCols[g.key] = { label:g.label, cols };
  });

  const distRuns=[];
  for (let i=0;i<header.length-7;i++){
    const seq = header.slice(i,i+8).map(ceNorm);
    if (seq[0]==='a'&&seq[1]==='b'&&seq[2]==='c'&&seq[3]==='d'&&seq[4]==='e'&&seq[5]==='f'&&seq[6]==='g'&&seq[7]==='nr') distRuns.push(i);
  }

  const typeColIdxs = findAllColIndices(header,/^type de travaux$/);
  const opBlocks = typeColIdxs.map((start,bi)=>{
    const nextStart = typeColIdxs[bi+1]!==undefined? typeColIdxs[bi+1] : Math.min(header.length, start+12);
    const span={};
    for (let c=start;c<nextStart;c++){ const key=ceNorm(header[c]); if(key) span[key]=c; }
    let anneeIdx=-1, statut='programme';
    for (const k in span){ if (/^annee os travaux previsionnelle$/.test(k)){ anneeIdx=span[k]; statut='identifie'; break; } }
    if (anneeIdx===-1){ for (const k in span){ if (/^annee d.?os$/.test(k)){ anneeIdx=span[k]; statut='programme'; break; } } }
    let montantIdx=-1;
    for (const k in span){ if (/^cout de revient ttc$/.test(k)){ montantIdx=span[k]; break; } }
    if (montantIdx===-1){ for (const k in span){ if (/^montant total en ttc$/.test(k)){ montantIdx=span[k]; break; } } }
    let logIdx=-1;
    for (const k in span){ if (/^logements concernes$/.test(k)){ logIdx=span[k]; break; } }
    // "Nature des travaux" porte le libellé précis de l'action (ex. "Réha niv. 2", "Ravalement de
    // façade") — c'est CETTE granularité qui correspond aux lignes de la grille de gains DPE et de
    // la matrice de projection État technique, pas "Type de travaux" qui n'est qu'une catégorie
    // large (RC / Réha. / Chgt de vecteur / Démolition). Cf. resolveGain() et
    // computeTechniqueProjection() plus bas.
    let natureIdx=-1;
    for (const k in span){ if (/^nature des travaux$/.test(k)){ natureIdx=span[k]; break; } }
    // "Année de fin de travaux" — absente de tous les blocs sur le fichier Aubervilliers (vérifié le
    // 2026-07-16, cf. Étape 0) : anneeFinIdx reste -1 pour ce fichier, o.anneeFin est alors toujours
    // null à l'import (dégradation gracieuse), mais reste éditable manuellement dans l'UI (§9.2).
    let anneeFinIdx=-1;
    for (const k in span){ if (/^annee de fin de travaux$/.test(k)){ anneeFinIdx=span[k]; break; } }
    return { typeIdx:start, natureIdx, anneeIdx, anneeFinIdx, montantIdx, logIdx, statut };
  });

  const residences = dataRows.map((row)=>{
    const res = {
      code: row[idx.code], nom: idx.nom>=0? row[idx.nom]:null, adresse: idx.adresse>=0? row[idx.adresse]:null,
      commune: idx.commune>=0? row[idx.commune]:null, secteur: idx.secteur>=0? row[idx.secteur]:null,
      agence: idx.agence>=0? row[idx.agence]:null, codePostal: idx.codePostal>=0? row[idx.codePostal]:null,
      qpv: idx.qpv>=0? row[idx.qpv]:null,
      nbLgt: idx.nbLgt>=0? (Number(row[idx.nbLgt])||0):0,
      dpeEnergie: idx.dpeEnergie>=0? row[idx.dpeEnergie]:null, dpeGES: idx.dpeGES>=0? row[idx.dpeGES]:null,
      attractivite: idx.attractivite>=0? ceNum(row[idx.attractivite]):null,
      technique: idx.technique>=0? ceNum(row[idx.technique]):null,
      familleAttract: idx.familleAttract>=0? row[idx.familleAttract]:null,
      familleTechnique: idx.familleTechnique>=0? row[idx.familleTechnique]:null,
      anneeConstruction: idx.anneeConstruction>=0? (Number(row[idx.anneeConstruction])||null):null,
      dpePrincipal: idx.dpePrincipal>=0? row[idx.dpePrincipal]:null,
      typeBati: idx.typeBati>=0? row[idx.typeBati]:null,
      modeChauffage: idx.modeChauffage>=0? row[idx.modeChauffage]:null,
      modeECS: idx.modeECS>=0? row[idx.modeECS]:null,
      kwhM2: idx.kwhM2>=0? ceNum(row[idx.kwhM2]):null,
      typeChauffage: idx.typeChauffage>=0? row[idx.typeChauffage]:null,
      dontConventionne: idx.dontConventionne>=0? ceNum(row[idx.dontConventionne]):null,
      dontFoyer: idx.dontFoyer>=0? ceNum(row[idx.dontFoyer]):null,
      performanceCarbone: idx.performanceCarbone>=0? ceNum(row[idx.performanceCarbone]):null,
      planVente: idx.planVente>=0? row[idx.planVente]:null,
      conventionneVente: idx.conventionneVente>=0? row[idx.conventionneVente]:null,
      nbLgtMiseVente: idx.nbLgtMiseVente>=0? ceNum(row[idx.nbLgtMiseVente]):null,
      nbLgtRestantVente: idx.nbLgtRestantVente>=0? ceNum(row[idx.nbLgtRestantVente]):null,
      prixVenteBrut: idx.prixVenteBrut>=0? ceNum(row[idx.prixVenteBrut]):null,
      montantVenteM2: idx.montantVenteM2>=0? ceNum(row[idx.montantVenteM2]):null,
      typeVente: idx.typeVente>=0? row[idx.typeVente]:null,
      crd: idx.crd>=0? ceNum(row[idx.crd]):null,
      vnc: idx.vnc>=0? ceNum(row[idx.vnc]):null,
      autofinancement: idx.autofinancement>=0? ceNum(row[idx.autofinancement]):null,
      financement: idx.financement>=0? row[idx.financement]:null,
      codeInsee: idx.codeInsee>=0? row[idx.codeInsee]:null,
      shab: idx.shab>=0? ceNum(row[idx.shab]):null,
      corpro: idx.corpro>=0? row[idx.corpro]:null,
      tauxVacance: idx.tauxVacance>=0? ceNum(row[idx.tauxVacance]):null,
      autofinancementLgt: idx.autofinancementLgt>=0? ceNum(row[idx.autofinancementLgt]):null,
      notes: {},
      critereGroups: {},
    };
    Object.keys(critereGroupCols).forEach((key)=>{
      const g = critereGroupCols[key];
      const vals = g.cols.map((gc)=>{
        let value = ceNum(row[gc.col]);
        // Fragilité sociale : colonnes en fraction Excel brute (0-1, ex. 0.3 pour 30%), contrairement
        // aux autres groupes déjà notés sur 100 (cf. commentaire plus haut sur idx) — pas d'équivalent
        // "note/100" pour ce groupe dans le fichier source, donc converti en pourcentage à la lecture.
        if (key==='social' && value!==null) value = value*100;
        return { label:gc.label, value };
      });
      if (vals.some((v)=>v.value!==null)) res.critereGroups[key] = { label:g.label, values: vals };
    });
    noteCols.forEach((nc)=>{ res.notes[nc.label] = ceNum(row[nc.col]); });
    Object.keys(typoCols).forEach((t)=>{ res[t] = typoCols[t]>=0? (Number(row[typoCols[t]])||0):null; });
    if (distRuns[0]!==undefined){ res.distEnergie={}; ['A','B','C','D','E','F','G','NR'].forEach((cl,i)=>{res.distEnergie[cl]=Number(row[distRuns[0]+i])||0;}); }
    if (distRuns[1]!==undefined){ res.distGES={}; ['A','B','C','D','E','F','G','NR'].forEach((cl,i)=>{res.distGES[cl]=Number(row[distRuns[1]+i])||0;}); }
    // Certains fichiers renseignent une étiquette DPE globale par résidence (colonnes
    // "DPE énergie"/"DPE GES") mais laissent la répartition détaillée par logement (A-G/NR)
    // entièrement vide (tout en NR) : sans ce repli, les graphiques de répartition et la
    // trajectoire de décarbonation traiteraient ces logements comme "non renseignés" alors
    // que leur classe est en réalité connue.
    if (res.distEnergie){
      const connu = ['A','B','C','D','E','F','G'].reduce((s,cl)=>s+(res.distEnergie[cl]||0),0);
      if (connu===0 && res.distEnergie.NR>0 && /^[A-G]$/.test(res.dpeEnergie||'')){
        res.distEnergie = {A:0,B:0,C:0,D:0,E:0,F:0,G:0,NR:0};
        res.distEnergie[res.dpeEnergie] = res.nbLgt;
      }
    }
    if (res.distGES){
      const connu = ['A','B','C','D','E','F','G'].reduce((s,cl)=>s+(res.distGES[cl]||0),0);
      if (connu===0 && res.distGES.NR>0 && /^[A-G]$/.test(res.dpeGES||'')){
        res.distGES = {A:0,B:0,C:0,D:0,E:0,F:0,G:0,NR:0};
        res.distGES[res.dpeGES] = res.nbLgt;
      }
    }
    if (!res.commune && res.adresse){
      const m = String(res.adresse).match(/(\d{5})\s+([A-ZÀ-ÖØ-Þ' -]{3,})\s*$/);
      if (m) res.commune = m[2].trim();
    }
    if (!res.nom){
      // Sans colonne de nom dédiée, on retombe sur l'adresse : on retire le code postal +
      // la commune en fin de chaîne (déjà affichés dans leur propre colonne) et on tronque
      // sur une frontière de mot plutôt qu'en plein milieu.
      let base = res.adresse ? String(res.adresse).replace(/\s*\d{5}\s+[A-ZÀ-ÖØ-Þ' -]{3,}\s*$/,'').trim() : '';
      if (!base) base = res.adresse ? String(res.adresse) : ('Résidence '+res.code);
      res.nom = base.length>42 ? base.slice(0,42).replace(/\s+\S*$/,'')+'…' : base;
    }
    return res;
  });

  // Un "Code de Résidence" dupliqué ferait compter deux fois la même distribution DPE dans les
  // agrégats de trajectoire (computeTrajectory indexe état/vivant par r.code) : on ne garde que la
  // première occurrence et on remonte les doublons pour que l'écran d'import puisse avertir l'utilisateur.
  const seenCodes = new Set();
  const duplicateCodes = [];
  const dedupedResidences = residences.filter((r)=>{
    if (seenCodes.has(r.code)) { duplicateCodes.push(r.code); return false; }
    seenCodes.add(r.code);
    return true;
  });

  let opId=0;
  const operations=[];
  dataRows.forEach((row)=>{
    const code = row[idx.code];
    opBlocks.forEach((b)=>{
      const type = row[b.typeIdx];
      if (type!==null && type!==undefined && String(type).trim()!==''){
        const natureVal = b.natureIdx>=0? row[b.natureIdx] : null;
        operations.push({
          id:'op'+(opId++), resCode:code, type:String(type).trim(), statut:b.statut,
          nature: (natureVal!==null && natureVal!==undefined && String(natureVal).trim()!=='')? String(natureVal).trim() : null,
          annee: b.anneeIdx>=0? (Number(row[b.anneeIdx])||null):null,
          anneeFin: b.anneeFinIdx>=0? (Number(row[b.anneeFinIdx])||null):null,
          montant: b.montantIdx>=0? (Number(row[b.montantIdx])||0):0,
          logements: b.logIdx>=0? (Number(row[b.logIdx])||null):null,
          origine:'import',
        });
      }
    });
  });
  return { headerRowIdx, idx, typoCols, distRuns, opBlocks, residences: dedupedResidences, operations, duplicateCodes, nbCols: header.length };
}

// Cherche, dans la fenêtre [start,end) de l'en-tête, les colonnes A..G par leur nom normalisé
// (pas par position fixe). Renvoie null si les 7 classes ne sont pas toutes trouvées explicitement.
function findClassCols(header, start, end){
  const cols = {};
  for (let i=start; i<end && i<header.length; i++){
    const n = ceNorm(header[i]);
    if (['a','b','c','d','e','f','g'].includes(n) && cols[n.toUpperCase()]===undefined) cols[n.toUpperCase()]=i;
  }
  return CLASS_ORDER.every((cl)=>cols[cl]!==undefined) ? cols : null;
}
function parseGainsDPE(matrix){
  const headerRowIdx = findHeaderRow(matrix, (row)=>row.some((c)=>ceNorm(c)==='energie'));
  if (headerRowIdx===-1) return null;
  const header = matrix[headerRowIdx];
  const energieAnchor = header.findIndex((c)=>ceNorm(c)==='energie');
  let gesAnchor=-1;
  for (let i=energieAnchor+1;i<header.length;i++){ if (ceNorm(header[i])==='ges'){ gesAnchor=i; break; } }
  const energieStart = energieAnchor+1, gesStart = gesAnchor+1;
  const windowEnd = gesAnchor>=0? gesAnchor : header.length;
  // Priorité à la détection par nom de colonne (A/B/C/.../G explicites dans l'en-tête, robuste à un
  // décalage/réordonnancement) ; repli sur l'hypothèse positionnelle historique (7 colonnes qui
  // suivent immédiatement l'ancre "Energie"/"Ges") si l'en-tête ne porte pas ces libellés.
  const energieCols = findClassCols(header, energieStart, windowEnd) || {A:energieStart,B:energieStart+1,C:energieStart+2,D:energieStart+3,E:energieStart+4,F:energieStart+5,G:energieStart+6};
  const gesCols = gesAnchor>=0 ? (findClassCols(header, gesStart, header.length) || {A:gesStart,B:gesStart+1,C:gesStart+2,D:gesStart+3,E:gesStart+4,F:gesStart+5,G:gesStart+6}) : null;
  const grid={};
  for (let r=headerRowIdx+1;r<matrix.length;r++){
    const row = matrix[r]||[]; const label=row[0];
    if (!label || typeof label!=='string') continue;
    if (!CLASS_ORDER.some((cl)=>typeof row[energieCols[cl]]==='number')) continue;
    const energie={}, ges={};
    CLASS_ORDER.forEach((cl)=>{
      energie[cl] = row[energieCols[cl]]||0;
      ges[cl] = gesCols? (row[gesCols[cl]]||0) : 0;
    });
    grid[label.trim()] = { energie, ges };
  }
  return grid;
}

/* ---- V8 §1.1 — Échéancier de cessions (onglet « 5. Cessions identifiées ») ----
   Module strictement OPTIONNEL : l'onglet est absent de la plupart des fichiers clients, son absence
   ne doit jamais bloquer ni ralentir un import (cf. V8 §10.4). Contrairement aux colonnes vente de la
   Base de cotation — des données de stock, sans dimension année — cet onglet porte un échéancier
   annuel complet, seule source importable d'un plan de vente daté.

   Vérifié le 2026-09-11 sur Base patrimoniale_PSP STANDARD v2.xlsx : 150 lignes × 367 colonnes,
   en-tête ligne 2 (détectée, jamais présumée), 3 lignes réellement peuplées, 5 familles annualisées
   couvrant 2023→2072. Sur ce gabarit, les familles « Nb logts » et « Mois cession » sont
   INTÉGRALEMENT vides (0 colonne sur 50 porte une valeur) : un échéancier importé peut donc
   parfaitement n'avoir aucun volume, seulement des prix. Ce n'est pas une anomalie à corriger, c'est
   le cas nominal — d'où le filtrage par « année portant au moins une valeur » plus bas, et non par
   « année portant un nbLgt ». */
// Préfixes des familles de colonnes annualisées, testés sur le libellé NORMALISÉ après retrait de
// l'année. Les libellés réels comportent des espaces doubles, des variantes d'accentuation et des
// symboles monétaires : d'où les tolérances (k€/ke, espaces optionnels autour du séparateur).
const CESSION_FAMILLES = [
  { cle:'mois',              re:/^mois cession$/,                                   unite:'mois'  },
  { cle:'nbLgt',             re:/^nb logts?$/,                                      unite:'lgt'   },
  { cle:'prixUnitaire',      re:/^prix net de cession k[€e]\s*\/\s*logts?$/,        unite:'kEuro' },
  { cle:'valeurComptable',   re:/^valeur comptable en k[€e]\s*\/\s*lgt cede$/,      unite:'kEuro' },
  { cle:'remboursement',     re:/^remboursements? anticipes? en k[€e]$/,            unite:'kEuro' },
];
function parseCessionsIdentifiees(matrix){
  const headerRowIdx = findHeaderRow(matrix, (row)=>row.some((c)=>/^n ?groupe$|^no groupe$/.test(ceNorm(c))));
  if (headerRowIdx===-1) return null;
  const header = matrix[headerRowIdx];
  const idx = {
    numeroGroupe: findColIndex(header,[/^n ?groupe$/,/^no groupe$/]),
    sousGroupe:   findColIndex(header,[/^n ?sous ?-? ?groupe$/]),
    nomGroupe:    findColIndex(header,[/^nom du groupe$/]),
    nbLgtTotal:   findColIndex(header,[/^nb de logts$/]),
    codeInsee:    findColIndex(header,[/^code insee$/]),
    nature:       findColIndex(header,[/^nature$/]),
  };
  if (idx.numeroGroupe<0) return null;
  // Familles annualisées : on isole l'année en suffixe PUIS on teste le préfixe, plutôt que d'embarquer
  // \d{4} dans chaque motif — sinon les familles hors périmètre (« Économies d'annuités cumulée suite
  // à RA — part capital YYYY », dont le gabarit de démo n'est que du remplissage) seraient à exclure
  // une par une au lieu de simplement ne matcher aucun préfixe connu.
  const colsAnnuelles = [];
  header.forEach((cell, i)=>{
    const m = /^(.*?)\s*(\d{4})$/.exec(ceNorm(cell));
    if (!m) return;
    const fam = CESSION_FAMILLES.find((f)=>f.re.test(m[1]));
    if (fam) colsAnnuelles.push({ cle:fam.cle, unite:fam.unite, annee:Number(m[2]), col:i });
  });
  // Le gabarit prévoit 150 lignes dont une poignée seulement sont utilisées : les lignes vides
  // portent un n° de groupe vide ou littéralement 0, jamais un vrai code.
  const lignes = [];
  for (let r=headerRowIdx+1; r<matrix.length; r++){
    const row = matrix[r]||[];
    const brut = row[idx.numeroGroupe];
    if (brut===null || brut===undefined || String(brut).trim()==='' || String(brut).trim()==='0') continue;
    const parAnnee = {};
    colsAnnuelles.forEach((c)=>{
      const v = row[c.col];
      if (v===null || v===undefined || String(v).trim()==='') return;
      if (!parAnnee[c.annee]) parAnnee[c.annee] = {};
      if (c.unite==='mois'){ parAnnee[c.annee].mois = v; return; }
      const n = ceNum(v);
      if (n===null) return;
      // Les montants sont exprimés en k€ PAR LOGEMENT dans cet onglet, là où « Prix de vente "brut"
      // Total » de la Base de cotation est en € totaux. On convertit ici, à la lecture, pour que le
      // modèle interne soit homogène en euros — jamais à l'affichage, sinon les deux sources
      // finiraient additionnées sans conversion quelque part.
      parAnnee[c.annee][c.cle] = c.unite==='kEuro' ? n*1000 : n;
    });
    // Une année sans aucune valeur n'est pas un échéancier : on ne la conserve pas.
    Object.keys(parAnnee).forEach((y)=>{ if (!Object.keys(parAnnee[y]).length) delete parAnnee[y]; });
    lignes.push({
      numeroGroupe: brut,
      sousGroupe:   idx.sousGroupe>=0? row[idx.sousGroupe] : null,
      nomGroupe:    idx.nomGroupe>=0? row[idx.nomGroupe] : null,
      nbLgtTotal:   idx.nbLgtTotal>=0? ceNum(row[idx.nbLgtTotal]) : null,
      codeInsee:    idx.codeInsee>=0? row[idx.codeInsee] : null,
      nature:       idx.nature>=0? row[idx.nature] : null,
      parAnnee: parAnnee,
    });
  }
  return { headerRowIdx, lignes, anneesDetectees: [...new Set(colsAnnuelles.map((c)=>c.annee))].sort((a,b)=>a-b) };
}
// V8 §1.2 — l'onglet est clé par N° groupe + Nom du groupe, jamais par Code de Résidence : d'où
// l'appariement par code PUIS le repli par nom normalisé. Les lignes non appariées ne sont jamais
// silencieusement ignorées, elles alimentent un avertissement à l'import (même modèle que
// duplicateCodes).
function matchCessionsToResidences(cessions, residences){
  const out = { parResCode:{}, orphelines:[] };
  if (!cessions || !cessions.lignes) return out;
  const parCode = {}, parNom = {};
  (residences||[]).forEach((r)=>{
    parCode[String(r.code)] = r;
    const n = ceNorm(r.nom);
    // Un nom en doublon ne peut pas servir de clé de repli : on neutralise plutôt que d'apparier au
    // hasard sur la première occurrence rencontrée.
    if (n) parNom[n] = (parNom[n]===undefined) ? r : null;
  });
  cessions.lignes.forEach((l)=>{
    let res = parCode[String(l.numeroGroupe)] || null;
    let via = res? 'code' : null;
    if (!res){ const c = parNom[ceNorm(l.nomGroupe)]; if (c){ res = c; via = 'nom'; } }
    if (!res){ out.orphelines.push(l); return; }
    // Deux lignes de cessions peuvent viser la même résidence (sous-groupes, tranches) : on fusionne
    // leurs échéanciers année par année plutôt que d'écraser la première.
    const cible = out.parResCode[res.code] || (out.parResCode[res.code] = { resCode:res.code, via:via, parAnnee:{}, nature:l.nature });
    Object.keys(l.parAnnee).forEach((y)=>{
      const src = l.parAnnee[y];
      const dst = cible.parAnnee[y] || (cible.parAnnee[y] = {});
      Object.keys(src).forEach((k)=>{
        // nbLgt s'additionne (deux tranches cédées la même année) ; un prix unitaire ne s'additionne
        // pas, on garde la première valeur rencontrée.
        if (k==='nbLgt') dst.nbLgt = (dst.nbLgt||0) + src.nbLgt;
        else if (dst[k]===undefined) dst[k] = src[k];
      });
    });
  });
  return out;
}
// V8 §1.3 — construction des lignes de plan de vente issues de l'import. Deux sources, une seule
// ligne par résidence : les colonnes vente de la Base de cotation (stock, sans année) et l'échéancier
// de « 5. Cessions identifiées » (daté). Quand les deux existent pour une même résidence, on garde
// l'origine « import-cotation » (c'est bien le plan de vente du bailleur) et on lui attache
// l'échéancier — plutôt que de créer deux lignes qui se compteraient deux fois dans les cumuls.
// Les identifiants sont dérivés du code résidence (pas aléatoires) pour qu'un même import produise
// toujours les mêmes ids : sans cela, deux rechargements d'un même fichier donneraient des lignes
// considérées comme distinctes lors d'une comparaison avec la version base.
function buildPlanVenteInitial(residences, cessionsParResCode){
  const parRes = cessionsParResCode || {};
  const lignes = [];
  (residences||[]).forEach((r)=>{
    const enCotation = (r.planVente && String(r.planVente).trim()!=='') || (r.nbLgtMiseVente||0) > 0;
    const ech = parRes[r.code] || null;
    if (!enCotation && !ech) return;
    lignes.push({
      id: 'pv_' + r.code,
      resCode: r.code,
      origine: enCotation ? 'import-cotation' : 'import-cessions',
      retenue: true,
      typeVente: r.typeVente || null,
      conventionne: r.conventionneVente || null,
      logementsTotal: r.nbLgt || null,
      parAnnee: ech ? ech.parAnnee : {},
      prioriteManuelle: null,
      scorePotentiel: null,
      commentaire: null,
      // Valeurs de stock de la Base de cotation : conservées telles quelles, sans être réparties
      // arbitrairement sur des années qui n'existent pas dans le fichier (cf. V8 §1.3).
      _legacyLogementsRestants: r.nbLgtRestantVente!==undefined? r.nbLgtRestantVente : null,
      _legacyPrixVente: r.prixVenteBrut!==undefined? r.prixVenteBrut : null,
    });
  });
  return lignes;
}

/* ---- Cascade DPE (cahier des charges §8.2) ---- */
const CLASS_ORDER = ['G','F','E','D','C','B','A'];
function classIndex(c){ const i=CLASS_ORDER.indexOf(c); return i===-1? null : i; }
// Bug corrigé le 2026-07-10 : la grille de gains DPE (et, de la même façon, la matrice de
// projection État technique plus bas) est indexée au niveau "Nature des travaux" (ex. "Réha niv. 2",
// "Ravalement de façade") — "Type de travaux" seul (RC / Réha. / Chgt de vecteur / Démolition,
// cf. idx.typoCols) est une catégorie trop large pour matcher ces lignes. Avant ce correctif,
// resolveGain() ne recevait que o.type et ne matchait donc jamais rien en dehors des démolitions :
// la trajectoire DPE ne reflétait que les sorties de parc (démolitions), jamais les gains réels des
// travaux simulés. On tente d'abord o.nature (résidences importées), puis o.type en repli (cas des
// opérations ajoutées/éditées manuellement dans l'outil, où seul un champ "type" est proposé — cf.
// ViewInvestissements — et qui utilise déjà directement les libellés de la grille comme options).
function findGridKey(label, gainsGrid){
  if (!label) return null;
  if (gainsGrid[label]) return label;
  const n = ceNorm(label);
  for (const k in gainsGrid){ if (ceNorm(k)===n) return k; }
  return null;
}
function resolveGain(op, gainsGrid, metric){
  const type = typeof op==='string'? op : op.type;
  const nature = typeof op==='string'? null : op.nature;
  const n2 = ceNorm(type);
  if (/^demol/.test(n2)) return 'DEMOL';
  const natureKey = findGridKey(nature, gainsGrid);
  if (natureKey) return gainsGrid[natureKey][metric];
  const typeKey = findGridKey(type, gainsGrid);
  if (typeKey) return gainsGrid[typeKey][metric];
  return null;
}
function hasKnownDpeGain(op, gainsGrid){
  return resolveGain(op, gainsGrid, 'energie')!==null;
}
// Classe atteinte par un logement de classe `cl` après un gain de `g` étiquettes. Clamp bas ET haut :
// un gain négatif (grille de gains DPE mal saisie) ne doit jamais sortir de CLASS_ORDER (sinon
// CLASS_ORDER[-1] est undefined et les logements concernés disparaissent silencieusement de tous les
// totaux futurs de la trajectoire). Partagée par la cascade et par computeDecarbonation, qui a besoin
// de savoir si un logement a réellement bougé — un gain non nul mais écrêté ne le déplace pas.
function classeApresGain(cl, g){
  const idx = classIndex(cl);
  if (idx===null) return cl;
  return CLASS_ORDER[Math.max(0, Math.min(CLASS_ORDER.length-1, idx+(g||0)))];
}
function computeTrajectory(residences, operations, gainsGrid, years, metric, includeIdentifiees, onYearEnd){
  const distKey = metric==='energie'? 'distEnergie':'distGES';
  const state={}, alive={};
  residences.forEach((r)=>{ state[r.code]=Object.assign({A:0,B:0,C:0,D:0,E:0,F:0,G:0,NR:0}, r[distKey]||{}); alive[r.code]=true; });
  const opsByResYear={};
  operations.forEach((o)=>{
    if (!includeIdentifiees && o.statut==='identifie') return;
    if (o.annee===null || o.annee===undefined) return;
    if (!opsByResYear[o.resCode]) opsByResYear[o.resCode]={};
    if (!opsByResYear[o.resCode][o.annee]) opsByResYear[o.resCode][o.annee]=[];
    opsByResYear[o.resCode][o.annee].push(o);
  });
  const timeline={};
  years.forEach((y)=>{
    residences.forEach((r)=>{
      if (!alive[r.code]) return;
      const ops = (opsByResYear[r.code] && opsByResYear[r.code][y]) || [];
      ops.forEach((o)=>{
        const gain = resolveGain(o, gainsGrid, metric);
        if (gain==='DEMOL'){ alive[r.code]=false; return; }
        if (gain===null || gain===undefined) return;
        const dist = state[r.code];
        const next = {A:0,B:0,C:0,D:0,E:0,F:0,G:0,NR:dist.NR||0};
        CLASS_ORDER.forEach((cl)=>{
          const n = dist[cl]||0; if (n<=0) return;
          const newCl = classeApresGain(cl, gain[cl]||0);
          next[newCl] = (next[newCl]||0) + n;
        });
        state[r.code]=next;
      });
    });
    const agg={A:0,B:0,C:0,D:0,E:0,F:0,G:0,NR:0};
    residences.forEach((r)=>{ if (alive[r.code]){ const d=state[r.code]; Object.keys(agg).forEach((cl)=>agg[cl]+=(d[cl]||0)); } });
    timeline[y]=agg;
    // Callback optionnel exposant l'état par résidence (pas seulement l'agrégat portefeuille) à la
    // fin de chaque année — utilisé par computeTrajectoryByResidence (cf. Tableau "Impact des actions
    // stratégiques") pour lire la distribution DPE d'une résidence donnée à une échéance choisie, sans
    // dupliquer toute la boucle de cascade ci-dessus.
    if (onYearEnd) onYearEnd(y, state, alive);
  });
  return timeline;
}

// Variante par résidence de computeTrajectory ci-dessus : ne renvoie pas l'agrégat portefeuille mais
// l'état individuel (distribution DPE + vivante/démolie) de chaque résidence à une année cible donnée.
// `echeance` borne la trajectoire (les opérations au-delà ne sont jamais appliquées) sans qu'il soit
// nécessaire de pré-filtrer `operations` : on se contente de ne pas dépasser `echeance` dans `years`.
function computeTrajectoryByResidence(residences, operations, gainsGrid, echeance, metric, includeIdentifiees){
  const years = computeYearsRange(operations).filter((y)=>y<=echeance);
  let finalState=null, finalAlive=null;
  computeTrajectory(residences, operations, gainsGrid, years, metric, includeIdentifiees, (y, state, alive)=>{
    finalState = state; finalAlive = alive;
  });
  if (!finalState){
    // echeance antérieure à la première année de la trajectoire : aucune année parcourue, l'état
    // "après" reste identique à l'état brut importé.
    const distKey = metric==='energie'? 'distEnergie':'distGES';
    finalState={}; finalAlive={};
    residences.forEach((r)=>{ finalState[r.code]=Object.assign({A:0,B:0,C:0,D:0,E:0,F:0,G:0,NR:0}, r[distKey]||{}); finalAlive[r.code]=true; });
  }
  return { state: finalState, alive: finalAlive };
}

/* ---- Trajectoire de décarbonation (V9 §1) ----
   Transposition dans l'outil de la méthode de calcul déjà portée par le gabarit Excel : les colonnes
   masquées JX→KK en fin de « 1. Base de cotation », alimentées par « 4. Table DPE et FE » (valeurs
   moyennes par classe + facteurs d'émission) et « 2. Table de ref prix » (vecteur visé par une nature
   de travaux), puis agrégées par la feuille « 4. Trajectoire décarbonation » :
     JX  kWh/m² constaté de la résidence (colonne « kWh / m² »)
     JY  facteur d'émission initial, déduit du couple (Mode énergie chauffage × Type chauffage)
     KB  kWh/m² après travaux = JX si la classe DPE n'a pas bougé, sinon la valeur moyenne
         conventionnelle de la nouvelle classe (A 70 · B 90 · C 145 · D 210 · E 290 · F 375 · G 420)
     KC  facteur d'émission après travaux = celui du vecteur cible d'un « Chgt de vecteur », sinon JY
     KJ  (KB − JX) × SHAB           — gain de consommation de l'année
     KK  (KB×KC − JX×JY) × SHAB     — gain d'émissions de l'année
   Deux écarts assumés avec l'Excel, tous deux dans le sens d'une plus grande finesse — c'est ce qui
   permet à la trajectoire de se déplacer quand une opération est ajoutée ou modifiée dans l'outil,
   alors que l'Excel la fige à l'import :
   - l'Excel n'accorde qu'UN saut de classe et UNE année par résidence (colonne KI = première opération
     « Réha. » ou « Chgt de vecteur ») ; ici la règle KB est rejouée à chaque année de la cascade DPE
     existante (computeTrajectory), donc les opérations successives se cumulent ;
   - l'Excel raisonne sur la classe DPE unique de la résidence ; ici la résidence porte une distribution
     A-G/NR, donc la SHAB est ventilée au prorata des logements par classe et seuls les logements ayant
     réellement changé de classe basculent sur la valeur conventionnelle — les autres conservent le
     kWh/m² constaté, ce qui est exactement le IF(AQ=IC ; JX ; …) de KB appliqué logement par logement.
   Le gain annuel n'est jamais recalculé opération par opération : il se déduit de l'écart entre deux
   années consécutives de consommation/émissions, comme la feuille Excel qui cumule (C8 = B8 + C7). */
const DPE_KWH_M2_DEFAUT = {A:70,B:90,C:145,D:210,E:290,F:375,G:420};
const DPE_KGCO2_M2_DEFAUT = {A:6,B:9,C:20,D:40,E:60,F:85,G:100};
// Facteurs d'émission (kgCO2e/kWh) par vecteur, indexés sur le libellé NORMALISÉ du vecteur — mêmes
// clés que la colonne « Type d'énergie » de « 4. Table DPE et FE » et que la colonne « Projection nvx
// vecteur » de « 2. Table de ref prix », ce qui permet d'utiliser un seul dictionnaire pour l'état
// initial et pour l'état d'arrivée d'un changement de vecteur.
const FE_VECTEUR_DEFAUT = {
  'collectif - gaz':0.244, 'collectif - electrique':0.058, 'collectif - fioul':0.324,
  'collectif - bois et granule':0.03, 'collectif - biomethane':0.044,
  'collectif - geothermie':0.045, 'collectif - photovoltaique':0.044,
  'individuel - gaz':0.244, 'individuel - electrique':0.052, 'individuel - fioul':0.324,
  'individuel - bois et granule':0.03, 'individuel - biomethane':0.044,
  'chaufferie urbain':0.055,
};
function refsDecarbonationDefaut(){
  return {
    kwhM2: Object.assign({}, DPE_KWH_M2_DEFAUT),
    kgCo2M2: Object.assign({}, DPE_KGCO2_M2_DEFAUT),
    fe: Object.assign({}, FE_VECTEUR_DEFAUT),
    vecteurs: {},
    origine: { table:false, vecteurs:false },
  };
}
// Onglet « 4. Table DPE et FE » — optionnel comme « 5. Cessions identifiées » : son absence fait
// simplement retomber sur les valeurs de repli ci-dessus, jamais sur un écran vide. Les deux blocs
// (bornes/moyennes par classe, puis facteurs d'émission par vecteur) sont repérés par nom d'en-tête,
// jamais par position, le gabarit client pouvant décaler les lignes.
function parseTableDpeFe(matrix){
  if (!matrix || !matrix.length) return null;
  const out = refsDecarbonationDefaut();
  let trouve = false;
  // Le bloc supérieur porte deux colonnes « valeur moy » : la première sous « GES » (kgCO2/m²), la
  // seconde sous « Thermique » (kWh/m²) — l'ordre des deux blocs de l'onglet.
  const hdrIdx = findHeaderRow(matrix, (row)=>findAllColIndices(row, /^valeur moy/).length>=2, matrix.length);
  if (hdrIdx>=0){
    const cols = findAllColIndices(matrix[hdrIdx], /^valeur moy/);
    for (let r=hdrIdx+1; r<matrix.length; r++){
      const cl = ceNorm((matrix[r]||[])[0]).toUpperCase();
      if (CLASS_ORDER.indexOf(cl)===-1) continue;
      const ges = ceNum(matrix[r][cols[0]]), kwh = ceNum(matrix[r][cols[1]]);
      if (ges!==null){ out.kgCo2M2[cl]=ges; trouve=true; }
      if (kwh!==null){ out.kwhM2[cl]=kwh; trouve=true; }
    }
  }
  const feHdr = findHeaderRow(matrix, (row)=>row.some((c)=>/^type d.?energie$/.test(ceNorm(c))), matrix.length);
  if (feHdr>=0){
    const colLabel = findColIndex(matrix[feHdr], [/^type d.?energie$/]);
    const colVal = findColIndex(matrix[feHdr], [/^valeur$/]);
    if (colLabel>=0 && colVal>=0){
      for (let r=feHdr+1; r<matrix.length; r++){
        const lab = ceNorm((matrix[r]||[])[colLabel]);
        const val = ceNum((matrix[r]||[])[colVal]);
        if (!lab || val===null) continue;
        out.fe[lab] = val; trouve = true;
      }
    }
  }
  if (!trouve) return null;
  out.origine.table = true;
  return out;
}
// Onglet « 2. Table de ref prix », colonne « Projection nvx vecteur » / « Vecteur post interv. » :
// vecteur énergétique visé par une nature de travaux (c'est la colonne ID de la Base de cotation, qui
// alimente KC). On balaie toute la feuille plutôt que le seul bloc « Chgt de vecteur » : la colonne
// existe dans chaque bloc, remplie à « NC » quand la nature ne change aucun vecteur.
function parseVecteursTravaux(matrix){
  if (!matrix || !matrix.length) return null;
  const estEnTete = (n)=>/^(projection nvx vecteur|vecteur post)/.test(n);
  const cols = [];
  matrix.forEach((row)=>{
    (row||[]).forEach((cell,i)=>{ if (estEnTete(ceNorm(cell)) && cols.indexOf(i)===-1) cols.push(i); });
  });
  if (!cols.length) return null;
  const out = {};
  matrix.forEach((row)=>{
    const nature = (row||[])[0];
    if (typeof nature!=='string' || !nature.trim()) return;
    cols.forEach((c)=>{
      const v = row[c];
      if (typeof v!=='string') return;
      const n = ceNorm(v);
      if (!n || n==='nc' || estEnTete(n)) return;
      out[ceNorm(nature)] = String(v).trim();
    });
  });
  return Object.keys(out).length? out : null;
}
// Assemble les deux référentiels optionnels en un seul objet, avec repli sur les valeurs Cellance
// pour chaque bloc manquant. Appelé à l'identique par le worker d'import et par le repli thread
// principal — un écart entre les deux produirait des imports différents selon le navigateur.
function buildRefsDecarbonation(wb){
  const refs = refsDecarbonationDefaut();
  const nomTable = findSheet(wb.SheetNames, /table dpe et fe/);
  if (nomTable){
    const lu = parseTableDpeFe(sheetToMatrix(wb.Sheets[nomTable]));
    if (lu){ refs.kwhM2 = lu.kwhM2; refs.kgCo2M2 = lu.kgCo2M2; refs.fe = lu.fe; refs.origine.table = true; }
  }
  const nomPrix = findSheet(wb.SheetNames, /table de ref prix/);
  if (nomPrix){
    const lu = parseVecteursTravaux(sheetToMatrix(wb.Sheets[nomPrix]));
    if (lu){ refs.vecteurs = lu; refs.origine.vecteurs = true; }
  }
  return refs;
}
// Reproduit la cascade JY : le vecteur de départ d'une résidence se déduit du couple (Mode énergie
// chauffage × Type chauffage). « Hybride » — que l'Excel renvoie lui-même « À ventiler » — et tout
// couple hors table restent non résolus : la résidence prend alors le facteur moyen du parc.
function vecteurInitialResidence(r){
  const mode = ceNorm(r && r.modeChauffage);
  const type = ceNorm(r && r.typeChauffage);
  if (!mode || type==='hybride') return null;
  if (/reseau de chaleur|chaufferie urbain/.test(mode)) return 'chaufferie urbain';
  if (/geothermie/.test(mode)) return 'collectif - geothermie';
  if (/photovoltaique/.test(mode)) return 'collectif - photovoltaique';
  const prefixe = type==='collectif'? 'collectif' : type==='individuel'? 'individuel' : null;
  if (!prefixe) return null;
  if (/^gaz/.test(mode)) return prefixe+' - gaz';
  if (/^electri/.test(mode)) return prefixe+' - electrique';
  // Écart assumé avec l'Excel, validé avec Jules le 2026-09-14 : sa table (Mode énergie × Type
  // chauffage) ne prévoit pas « Pompe à chaleur » et renvoie donc « NR », ce qui sort silencieusement
  // ces résidences de ses totaux d'émissions. Une PAC consomme de l'électricité — et le kWh/m² du DPE
  // est déjà de l'énergie finale — donc le facteur d'émission de l'électricité s'applique tel quel.
  // Placé APRÈS la géothermie ci-dessus, qui est une PAC géothermique et garde son propre facteur.
  if (/pompe a chaleur|^pac\b/.test(mode)) return prefixe+' - electrique';
  if (/^fioul/.test(mode)) return prefixe+' - fioul';
  if (/bois|granule/.test(mode)) return prefixe+' - bois et granule';
  if (/biomethane/.test(mode)) return prefixe+' - biomethane';
  return null;
}
// Répartit un total entier sur des parts fractionnaires (méthode du plus fort reste) : sans cela les
// colonnes A..G/NR de la répartition, arrondies indépendamment, ne totalisent pas la ligne « Total ».
function repartirEntier(parts, total){
  const cles = Object.keys(parts);
  const bas = {}; let somme = 0;
  cles.forEach((k)=>{ bas[k] = Math.floor(parts[k]); somme += bas[k]; });
  let reste = Math.round(total) - somme;
  const ordre = cles.slice().sort((a,b)=>(parts[b]-Math.floor(parts[b]))-(parts[a]-Math.floor(parts[a])));
  for (let i=0; reste>0 && i<ordre.length*2; i++){ bas[ordre[i%ordre.length]] += 1; reste--; }
  for (let i=0; reste<0 && i<ordre.length*2; i++){ const k=ordre[ordre.length-1-(i%ordre.length)]; if (bas[k]>0){ bas[k]-=1; reste++; } }
  return bas;
}
/* Agrégats annuels de la feuille « 4. Trajectoire décarbonation ».
   `refs`        — sortie de parseTableDpeFe + parseVecteursTravaux (ou refsDecarbonationDefaut()).
   `mouvements`  — {offreNouvelleLgt:{annee:nb}, ventesParAnnee:{annee:{resCode:nb}}} : livraisons et
                   cessions, qui ne touchent QUE la répartition DPE — exactement comme l'Excel, dont
                   les lignes de consommation et d'émissions sont des SUMPRODUCT sur la seule Base de
                   cotation. Les démolitions, elles, sortent du parc partout (computeTrajectory). */
function computeDecarbonation(residences, operations, gainsGrid, years, includeIdentifiees, refs, mouvements){
  // Une sauvegarde antérieure à la V9 ne porte aucun référentiel, et une sauvegarde plus ancienne
  // pourrait n'en porter qu'une partie : on complète bloc par bloc plutôt que de supposer l'objet
  // complet (un R.vecteurs absent ferait planter la résolution des changements de vecteur).
  const D = refsDecarbonationDefaut();
  const R = Object.assign(D, refs || {});
  const mvt = mouvements || {};
  const ops = (operations||[]).filter((o)=> (includeIdentifiees || o.statut!=='identifie') && o.annee!==null && o.annee!==undefined);
  const classes = ['A','B','C','D','E','F','G','NR'];

  // -- Socle par résidence : distribution d'origine, surface, kWh/m² constaté, vecteur de départ.
  const socle = {};
  let shabConnue = 0, lgtShabConnue = 0;
  (residences||[]).forEach((r)=>{
    const dist0 = Object.assign({A:0,B:0,C:0,D:0,E:0,F:0,G:0,NR:0}, r.distEnergie||{});
    const nb0 = classes.reduce((s,cl)=>s+(dist0[cl]||0), 0);
    socle[r.code] = { r, dist0, nb0, shab: (r.shab>0? r.shab : null), kwh: (r.kwhM2>0? r.kwhM2 : null), vecteur: vecteurInitialResidence(r) };
    if (r.shab>0 && nb0>0){ shabConnue += r.shab; lgtShabConnue += nb0; }
  });
  // Repli « valeur conventionnelle par défaut » pour les données manquantes : surface moyenne par
  // logement du parc, et facteur d'émission moyen du parc pondéré par la surface.
  const shabParLgtMoyen = lgtShabConnue>0 ? shabConnue/lgtShabConnue : 0;
  let feNum = 0, feDen = 0;
  Object.keys(socle).forEach((code)=>{
    const s = socle[code];
    const fe = s.vecteur!==null ? R.fe[s.vecteur] : undefined;
    const surf = s.shab!==null ? s.shab : shabParLgtMoyen*s.nb0;
    if (fe!==undefined && surf>0){ feNum += fe*surf; feDen += surf; }
  });
  const feMoyen = feDen>0 ? feNum/feDen : 0;
  const kwhMoyen = (function(){
    let n=0, d=0;
    Object.keys(socle).forEach((code)=>{ const s=socle[code]; const surf = s.shab!==null? s.shab : shabParLgtMoyen*s.nb0; if (s.kwh!==null && surf>0){ n += s.kwh*surf; d += surf; } });
    return d>0? n/d : 0;
  })();
  const couverture = { sansKwh:0, sansFe:0, sansShab:0, feMoyenDisponible: feMoyen>0 };
  Object.keys(socle).forEach((code)=>{
    const s = socle[code];
    if (s.kwh===null) couverture.sansKwh++;
    if (s.vecteur===null || R.fe[s.vecteur]===undefined) couverture.sansFe++;
    if (s.shab===null) couverture.sansShab++;
  });

  // -- Changements de vecteur : {resCode: [{annee, vecteur}]}, appliqués au fil des années (le dernier
  //    changement daté à une année ≤ N fixe le facteur d'émission de cette année-là).
  const chgtVecteur = {};
  ops.forEach((o)=>{
    if (familyOfType(o.type)!=='Changement de vecteur') return;
    const cible = R.vecteurs[ceNorm(o.nature)] || R.vecteurs[ceNorm(o.type)];
    if (!cible) return;
    (chgtVecteur[o.resCode] = chgtVecteur[o.resCode] || []).push({ annee:o.annee, vecteur:ceNorm(cible) });
  });
  Object.keys(chgtVecteur).forEach((k)=>chgtVecteur[k].sort((a,b)=>a.annee-b.annee));

  // -- Cascade DPE : on capture l'état par résidence à la fin de chaque année (copie, l'objet `state`
  //    étant muté d'une année sur l'autre par computeTrajectory).
  const etats = {};
  computeTrajectory(residences, operations, gainsGrid, years, 'energie', includeIdentifiees, (y, state, alive)=>{
    const snap = {};
    Object.keys(state).forEach((code)=>{ if (alive[code]) snap[code] = Object.assign({}, state[code]); });
    etats[y] = snap;
  });

  // -- Comptages annuels d'opérations : filtre de l'Excel (« le DPE évolue réellement ») transposé en
  //    « le gain de la grille est non nul sur au moins une classe occupée par la résidence l'année
  //    précédente » — une opération dont la nature n'ouvre aucun gain (Ravalement, Réha non thermique)
  //    ne gonfle donc pas les barres du graphique.
  function compteOps(y, famille){
    const precedent = etats[y-1] || null;
    let n = 0;
    ops.forEach((o)=>{
      if (o.annee!==y || familyOfType(o.type)!==famille) return;
      const s = socle[o.resCode];
      if (!s) return;
      const gain = resolveGain(o, gainsGrid, 'energie');
      if (gain===null || gain==='DEMOL') return;
      const dist = (precedent && precedent[o.resCode]) || s.dist0;
      const bouge = CLASS_ORDER.some((cl)=>(dist[cl]||0)>0 && (gain[cl]||0)>0);
      if (!bouge) return;
      n += (o.logements>0? o.logements : s.nb0);
    });
    return n;
  }

  // -- Classes « figées » d'une résidence : celles dont aucun logement n'a encore bougé. La cascade
  //    applique le gain d'une opération à TOUTE la distribution de la résidence (simplification V1),
  //    donc un logement de classe d'origine cl n'a pas bougé tant qu'aucune opération appliquée n'a
  //    déplacé cl — et il est alors toujours dans cl. C'est la condition AQ=IC de la formule KB,
  //    évaluée logement par logement au lieu de la classe unique de la résidence.
  const figees = {};
  // NR reste figée en toute circonstance : la cascade la reporte telle quelle d'une année sur l'autre,
  // aucun gain ne s'y applique (on ne sait pas de quelle étiquette partent ces logements).
  Object.keys(socle).forEach((code)=>{ figees[code] = {NR:true}; CLASS_ORDER.forEach((cl)=>{ figees[code][cl]=true; }); });
  const opsParResAnnee = {};
  ops.forEach((o)=>{
    if (!opsParResAnnee[o.resCode]) opsParResAnnee[o.resCode] = {};
    (opsParResAnnee[o.resCode][o.annee] = opsParResAnnee[o.resCode][o.annee] || []).push(o);
  });

  // -- Cumuls de cessions (toutes sources de l'onglet Vente portant une année) par résidence.
  const ventesCum = {};
  const lignes = [];
  let consoPrec = null, emissionsPrec = null;

  years.forEach((y)=>{
    const ventesY = (mvt.ventesParAnnee && mvt.ventesParAnnee[y]) || {};
    Object.keys(ventesY).forEach((code)=>{ ventesCum[code] = (ventesCum[code]||0) + (Number(ventesY[code])||0); });
    // Dégel des classes déplacées par les opérations de l'année — avant le calcul de l'année, dans le
    // même ordre que la cascade (qui applique les opérations de l'année puis enregistre l'état).
    Object.keys(figees).forEach((code)=>{
      ((opsParResAnnee[code]||{})[y]||[]).forEach((o)=>{
        const gain = resolveGain(o, gainsGrid, 'energie');
        if (gain===null || gain==='DEMOL') return;
        CLASS_ORDER.forEach((cl)=>{ if (classeApresGain(cl, gain[cl]||0)!==cl) figees[code][cl]=false; });
      });
    });

    const etat = etats[y] || {};
    const repart = {A:0,B:0,C:0,D:0,E:0,F:0,G:0,NR:0};
    let surface = 0, conso = 0, emissions = 0;

    Object.keys(etat).forEach((code)=>{
      const s = socle[code];
      if (!s) return;
      const dist = etat[code];
      const total = classes.reduce((acc,cl)=>acc+(dist[cl]||0), 0);
      const surfRes = s.shab!==null ? s.shab : shabParLgtMoyen*(total||s.nb0);
      // Facteur d'émission de l'année : dernier changement de vecteur daté à une année ≤ y.
      let vecteur = s.vecteur;
      (chgtVecteur[code]||[]).forEach((c)=>{ if (c.annee<=y) vecteur = c.vecteur; });
      const feRes = (vecteur!==null && R.fe[vecteur]!==undefined) ? R.fe[vecteur] : null;
      const kwhReel = s.kwh!==null ? s.kwh : null;
      // Repli du facteur d'émission : le facteur moyen du parc quand au moins une résidence porte un
      // vecteur exploitable, sinon l'intensité carbone conventionnelle implicite de la classe
      // (kgCO2e/m² ÷ kWh/m² des tables DPE). Sans ce second repli, un parc dont aucune résidence n'a
      // de vecteur résolu — chauffages hybrides ou hors table — afficherait des émissions nulles.
      const feDeClasse = (cl)=>{
        if (feRes!==null) return feRes;
        if (feMoyen>0) return feMoyen;
        return (R.kgCo2M2[cl]>0 && R.kwhM2[cl]>0) ? R.kgCo2M2[cl]/R.kwhM2[cl] : 0;
      };

      if (total<=0){
        // Résidence sans répartition DPE exploitable : aucune cascade n'est possible, mais sa surface
        // et sa consommation constatée comptent dans les totaux — l'Excel les agrège de la même façon,
        // par un SUMPRODUCT qui ne regarde pas la répartition par étiquette.
        const kwh0 = kwhReel!==null ? kwhReel : kwhMoyen;
        surface += surfRes;
        conso += kwh0*surfRes;
        emissions += kwh0*surfRes*feDeClasse('NR');
        return;
      }
      const surfParLgt = surfRes/total;

      let consoRes = 0, emissionsRes = 0;
      classes.forEach((cl)=>{
        const n = dist[cl]||0;
        if (n<=0) return;
        // Règle KB appliquée logement par logement : ceux restés dans leur classe d'origine gardent le
        // kWh/m² constaté, ceux qui en ont changé prennent la valeur conventionnelle de leur classe.
        const restes = (figees[code] && figees[code][cl]) ? Math.min(s.dist0[cl]||0, n) : 0;
        const deplaces = n - restes;
        const conv = R.kwhM2[cl]!==undefined ? R.kwhM2[cl] : (kwhReel!==null? kwhReel : kwhMoyen);
        const initial = kwhReel!==null ? kwhReel : conv;
        const consoCl = surfParLgt * (restes*initial + deplaces*conv);
        consoRes += consoCl;
        emissionsRes += consoCl * feDeClasse(cl);
      });
      surface += surfRes;
      conso += consoRes;
      emissions += emissionsRes;

      // Cessions : elles ne sortent pas la résidence du parc, elles en retirent des logements — répartis
      // au prorata de la distribution DPE de l'année, faute d'information sur les étiquettes vendues.
      const vendus = Math.min(ventesCum[code]||0, total);
      const facteur = total>0 ? (total-vendus)/total : 0;
      classes.forEach((cl)=>{ repart[cl] += (dist[cl]||0)*facteur; });
    });

    // Livraisons d'offre nouvelle cumulées : classées « Inconnu » (NR), comme la ligne « Nombre de DPE
    // énergie inconnu » du tableau de bord des investissements de l'Excel.
    let neufs = 0;
    years.forEach((yy)=>{ if (yy<=y) neufs += Number((mvt.offreNouvelleLgt||{})[yy])||0; });
    repart.NR += neufs;

    const totalLgt = classes.reduce((acc,cl)=>acc+repart[cl], 0);
    lignes.push({
      annee: y,
      surfaceM2: surface,
      nbLgtRehab: compteOps(y, 'Réhabilitation'),
      nbChgtVecteur: compteOps(y, 'Changement de vecteur'),
      gainConsoKwh: consoPrec===null ? 0 : conso-consoPrec,
      consoKwh: conso,
      consoKwhM2: surface>0 ? conso/surface : null,
      gainEmissionsKg: emissionsPrec===null ? 0 : emissions-emissionsPrec,
      emissionsKg: emissions,
      emissionsKgM2: surface>0 ? emissions/surface : null,
      repartition: repartirEntier(repart, totalLgt),
      totalLgt: Math.round(totalLgt),
    });
    consoPrec = conso; emissionsPrec = emissions;
  });

  return { lignes, couverture, nbResidences: Object.keys(socle).length };
}

function familyOfType(type){
  const n = ceNorm(type);
  if (/^demol/.test(n)) return 'Démolition';
  if (/^reha/.test(n)) return 'Réhabilitation';
  if (/passage|vecteur|chgt de mode|chaudiere condensation/.test(n)) return 'Changement de vecteur';
  if (n==='rc') return 'Remplacement de composants';
  return 'Remplacement de composants';
}

/* ---------------- Matrice de projection État technique (hypothèse par défaut, non issue du
   fichier importé — cf. disclaimer affiché dans l'UI ; aucune grille de correspondance travaux ->
   état technique n'existe dans les fichiers de référence du projet, contrairement au DPE). Validée
   avec Jules le 2026-07-10 : Remplacement de composants (RC) -> saut direct à 100 sur le(s)
   sous-critère(s) concerné(s) ; Réhabilitation (niv. 1 à 4) -> effet progressif, chaque niveau fixant
   sa propre valeur cible sur son propre périmètre de sous-critères (pas cumulatif entre niveaux).
   Indexée par "Nature des travaux" (mêmes libellés que la grille de gains DPE), pas par "Type de
   travaux" — même principe que le correctif resolveGain() ci-dessus. */
const TECH_SUBCRITERES = ['Façades, toitures et couvertures','Menuiserie','Parties communes','Parties privatives','Structure'];
const TECH_RC_MAP = {
  'refection toiture et isolation des combles': ['Façades, toitures et couvertures'],
  'ravalement de facade': ['Façades, toitures et couvertures'],
  'isolation thermique exterieure': ['Façades, toitures et couvertures'],
  'changement des menuiseries exterieures': ['Menuiserie'],
  'changement des portes palieres': ['Menuiserie'],
  'remises aux normes electrique - incendie - gaz (parties communes)': ['Parties communes'],
  'refection parties communes': ['Parties communes'],
  'refection vmc': ['Parties communes'],
  'changement sanitaire et reprise salle de bains': ['Parties privatives'],
};
const TECH_REHA_MAP = {
  'reha non thermique': { subs:['Parties privatives'], value:66 },
  'reha niv. 1': { subs:['Façades, toitures et couvertures','Menuiserie'], value:33 },
  'reha niv. 2': { subs:['Façades, toitures et couvertures','Menuiserie','Parties communes'], value:66 },
  'reha niv. 3': { subs:['Façades, toitures et couvertures','Menuiserie','Parties communes','Parties privatives'], value:100 },
  'reha niv. 4': { subs:['Façades, toitures et couvertures','Menuiserie','Parties communes','Parties privatives','Structure'], value:100 },
};
// Résidences sans le détail des 5 sous-critères (moyenne globale seule) : on ne projette rien
// (retour null) plutôt qu'un résultat approximatif — cf. points de vigilance de la spec.
function computeTechniqueProjection(residence, operations, includeIdentifiees){
  const group = residence.critereGroups && residence.critereGroups.technique;
  if (!group) return null;
  const state = {};
  group.values.forEach((v)=>{ state[v.label] = v.value; });
  if (TECH_SUBCRITERES.some((l)=>state[l]===null || state[l]===undefined)) return null;
  // Référence "avant" = moyenne des 5 sous-critères eux-mêmes (pas residence.technique, qui peut
  // moyenner un périmètre de sous-critères plus large selon le fichier — cf. colonnes "Sous-critère
  // 26-35" additionnelles dans le gabarit complet) : on compare ce qui est réellement recalculé.
  const initialTechnique = TECH_SUBCRITERES.reduce((s,l)=>s+state[l],0) / TECH_SUBCRITERES.length;

  const ops = operations.filter((o)=>o.resCode===residence.code)
    .filter((o)=>includeIdentifiees || o.statut==='programme')
    .filter((o)=>o.annee!==null && o.annee!==undefined);

  let demolished = false;
  ops.forEach((o)=>{
    if (demolished) return;
    if (/^demol/.test(ceNorm(o.type))){ demolished = true; return; }
    const key = ceNorm(o.nature || o.type);
    if (TECH_RC_MAP[key]){ TECH_RC_MAP[key].forEach((sub)=>{ state[sub] = Math.max(state[sub], 100); }); return; }
    if (TECH_REHA_MAP[key]){ const {subs, value} = TECH_REHA_MAP[key]; subs.forEach((sub)=>{ state[sub] = Math.max(state[sub], value); }); }
  });

  if (demolished) return { demolished:true, values:null, technique:null, initialTechnique };
  const values = TECH_SUBCRITERES.map((l)=>({label:l, value:state[l]}));
  const technique = values.reduce((s,v)=>s+v.value,0) / values.length;
  return { demolished:false, values, technique, initialTechnique };
}

/* ---------------- DPE Global (résidence) — règle de classement Cellance, pas une colonne du
   gabarit : cf. Segmentation en 9 familles (axe DPE Global) et Impact des actions stratégiques
   (grilles avant/après). Définie une seule fois ici et réutilisée telle quelle par les deux
   fonctionnalités pour ne jamais diverger. Validé avec Jules le 2026-07-20 : pas de correspondance
   logement-par-logement entre classe Énergie et classe GES dans les fichiers, donc on classe chaque
   distribution indépendamment puis on retient la moins bonne des deux. */
const DPE_PERF_ORDER = ['Performant -', 'Performant ±', 'Performant +'];
function dpePerfBandOfDist(dist){
  if (!dist) return null;
  const total = ['A','B','C','D','E','F','G'].reduce((s,c)=>s+(dist[c]||0), 0);
  if (total<=0) return null;
  const efg = (dist.E||0)+(dist.F||0)+(dist.G||0);
  const abc = (dist.A||0)+(dist.B||0)+(dist.C||0);
  if (efg>=1) return 'Performant -';
  if (abc/total<0.80) return 'Performant ±';
  return 'Performant +';
}
function dpeGlobalBand(residence){
  const bandEnergie = dpePerfBandOfDist(residence.distEnergie);
  const bandGES = dpePerfBandOfDist(residence.distGES);
  if (!bandEnergie && !bandGES) return null;
  if (!bandEnergie) return bandGES;
  if (!bandGES) return bandEnergie;
  return DPE_PERF_ORDER[Math.min(DPE_PERF_ORDER.indexOf(bandEnergie), DPE_PERF_ORDER.indexOf(bandGES))];
}

/* ---------------- Axe État technique du tableau "Impact des actions stratégiques" — seuils
   absolus (confirmés par Jules), à ne pas confondre avec les bandes de la Segmentation en 9 familles
   qui restent, elles, relatives au maximum observé dans le fichier importé. */
function technicalBand(note){
  if (note===null || note===undefined || isNaN(note)) return null;
  if (note>70) return 'Bon état';
  if (note>=50) return 'État moyen';
  return 'État à améliorer';
}

/* ---------------- Généralisation Base / Actuel / Cible ----------------
   Base : version sauvegardée de référence (baseImport), utilisée telle quelle, jamais reprojetée.
   Actuel : import courant, opérations dont l'année <= anneeCoupureActuel() seulement (ce qui est déjà
   réalisé/committed à la date du jour).
   Cible : import courant, toutes les opérations de la trajectoire (jusqu'à la dernière année couverte).
   Cible ne doit JAMAIS être recalculée indépendamment d'Actuel : les deux passent par la même fonction
   filterOpsUntil(), seul le cutoff change, ce qui garantit qu'elles sont rigoureusement identiques
   jusqu'à anneeCoupureActuel() incluse (même cascade, mêmes filtres, aucun risque de divergence par
   arrondi ou par filtre légèrement différent entre les deux). */
function anneeCoupureActuel(dateImport){
  const d = dateImport || new Date();
  const annee = d.getFullYear();
  const mois = d.getMonth(); // 0-indexé : 10 = novembre, 11 = décembre
  return mois>=10 ? annee : annee-1;
}
function filterOpsUntil(operations, year){
  return operations.filter((o)=> o.annee!==null && o.annee!==undefined && o.annee<=year);
}

// Appariement d'opérations Actuel <-> Base par Code de résidence + Nature des travaux (libellé exact,
// jamais "Type de travaux" — cf. resolveGain/computeTechniqueProjection ci-dessus, même convention),
// tri chronologique et appariement 1ère avec 1ère / 2ème avec 2ème en cas d'opérations multiples de
// même nature sur une même résidence. Fonction unique, réutilisée par la table des écarts
// d'"Investissements & Entretien du parc" et par l'onglet "Actions stratégiques" de la fiche résidence.
function matchOperations(actuelOps, baseOps){
  function groupBy(ops){
    const g = {};
    (ops||[]).forEach((o)=>{
      const nature = String(o.nature || o.type || '').trim();
      const key = o.resCode+'|'+nature;
      if (!g[key]) g[key]=[];
      g[key].push(o);
    });
    Object.values(g).forEach((arr)=>arr.sort((a,b)=>(a.annee??9999)-(b.annee??9999)));
    return g;
  }
  const gActuel = groupBy(actuelOps), gBase = groupBy(baseOps);
  const matched=[], nouvelles=[], disparues=[];
  const keys = new Set(Object.keys(gActuel).concat(Object.keys(gBase)));
  keys.forEach((key)=>{
    const a = gActuel[key]||[], b = gBase[key]||[];
    const n = Math.max(a.length, b.length);
    for (let i=0;i<n;i++){
      const actuelOp = a[i], baseOp = b[i];
      if (actuelOp && baseOp){
        const deltaMontant = (actuelOp.montant||0) - (baseOp.montant||0);
        const deltaPct = baseOp.montant ? (deltaMontant/baseOp.montant*100) : null;
        const deltaAnnees = (actuelOp.annee!=null && baseOp.annee!=null) ? (actuelOp.annee-baseOp.annee) : null;
        matched.push({ actuelOp, baseOp, deltaMontant, deltaPct, deltaAnnees });
      } else if (actuelOp && !baseOp){
        nouvelles.push(actuelOp);
      } else if (baseOp && !actuelOp){
        disparues.push(baseOp);
      }
    }
  });
  return { matched, nouvelles, disparues };
}
</script>

<script type="text/babel" data-presets="react,env">
const {useState, useEffect, useMemo, useRef, useCallback} = React;

const DPE_COLORS = {A:'#009261',B:'#58D88B',C:'#CDF3DC',D:'#FAEFE2',E:'#F8C6BA',F:'#FF8364',G:'#1C3A35',NR:'#9fb3ae'};
const DPE_TEXT = {A:'#fff',B:'#1C3A35',C:'#1C3A35',D:'#1C3A35',E:'#1C3A35',F:'#fff',G:'#fff',NR:'#1C3A35'};
const PALETTE = ['#009261','#FF8364','#264E46','#58D88B','#F8C6BA','#1C3A35','#CDF3DC'];
const STATUS_COLORS = {good:'#0ca30c', warning:'#fab219', serious:'#ec835a', critical:'#d03b3b', unknown:'#b7b6ae'};

/* ---------------- Géocodage adresse -> lat/lon (cartographie) ----------------
   Utilise l'API publique et gratuite api-adresse.data.gouv.fr (Base Adresse Nationale).
   Seule l'adresse texte de la résidence est envoyée à ce service tiers — aucune autre
   donnée du fichier importé. Les résultats sont mis en cache à deux niveaux : le
   localStorage du navigateur (le plus rapide, consulté en premier) puis une table
   Supabase partagée par tous les visiteurs (psp_geocode_cache, cf. sbGeocodeCacheGetMany/
   SetMany plus bas) — une adresse déjà géocodée par n'importe quel visiteur, sur n'importe
   quel appareil, n'est ensuite plus jamais renvoyée à l'API externe. Les deux caches sont
   best-effort : Supabase indisponible/non configuré dégrade simplement vers un géocodage
   direct, comme avant. */
const GEOCODE_CACHE_KEY = 'psp_geocode_cache_v1';
function ceAddrKey(a){ return ceNorm(a||''); }
function loadGeocodeCache(){
  try { return JSON.parse(localStorage.getItem(GEOCODE_CACHE_KEY) || '{}'); } catch(e){ return {}; }
}
function saveGeocodeCache(cache){
  try { localStorage.setItem(GEOCODE_CACHE_KEY, JSON.stringify(cache)); } catch(e){ /* quota / navigation privée : tant pis, pas de cache */ }
}
async function geocodeOneAddress(address){
  const url = 'https://api-adresse.data.gouv.fr/search/?q=' + encodeURIComponent(address) + '&limit=1';
  const res = await fetch(url);
  if (!res.ok) throw new Error('geocoding http '+res.status);
  const json = await res.json();
  const f = json.features && json.features[0];
  if (!f) return null;
  return { lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0], label: f.properties.label, score: f.properties.score };
}
function useGeocoding(residences){
  const [coords, setCoords] = useState({});
  const [progress, setProgress] = useState({done:0, total:0});
  const [status, setStatus] = useState('idle');
  useEffect(()=>{
    if (!residences || !residences.length) { setStatus('done'); return; }
    let cancelled = false;
    const cache = loadGeocodeCache();
    const toFetch = [];
    const initial = {};
    residences.forEach((r)=>{
      if (!r.adresse){ initial[r.code] = null; return; }
      const key = ceAddrKey(r.adresse);
      if (Object.prototype.hasOwnProperty.call(cache,key)) initial[r.code] = cache[key];
      else toFetch.push(r);
    });
    setCoords((prev)=>Object.assign({}, prev, initial));
    if (!toFetch.length){ setStatus('done'); setProgress({done:residences.length, total:residences.length}); return; }
    setStatus('loading');
    setProgress({done: residences.length - toFetch.length, total: residences.length});
    (async()=>{
      // Cache partagé Supabase : avant d'appeler l'API externe pour les adresses absentes du
      // localStorage, on regarde si quelqu'un d'autre (même import consulté ailleurs, autre bailleur
      // partageant des adresses) les a déjà géocodées — c'est ce qui rend un import déjà consulté par
      // un collègue, ou rouvert depuis un autre appareil/navigateur, quasi instantané sur cet écran.
      // Best-effort : en cas d'erreur (backend inaccessible, etc.), on continue directement sur l'API
      // externe comme avant (sbGeocodeCacheGetMany avale déjà l'erreur et renvoie {} sans lever).
      let stillToFetch = toFetch;
      {
        const keys = Array.from(new Set(toFetch.map((r)=>ceAddrKey(r.adresse))));
        const shared = await sbGeocodeCacheGetMany(keys);
        const remaining = [];
        toFetch.forEach((r)=>{
          const key = ceAddrKey(r.adresse);
          if (Object.prototype.hasOwnProperty.call(shared, key)){
            const result = shared[key];
            cache[key] = result;
            if (!cancelled) setCoords((prev)=>Object.assign({}, prev, {[r.code]: result}));
          } else {
            remaining.push(r);
          }
        });
        stillToFetch = remaining;
        if (!cancelled) setProgress((prev)=>({done: prev.total - stillToFetch.length, total: prev.total}));
      }

      const newlyFetched = [];
      for (const r of stillToFetch){
        if (cancelled) return;
        const key = ceAddrKey(r.adresse);
        let result = null;
        // Ne mettre en cache que les réponses effectivement obtenues de l'API (y compris "aucun
        // résultat trouvé", un null légitime) — jamais un échec technique (réseau coupé, timeout,
        // rate-limit 429). Sans cette distinction, une coupure réseau pendant l'import marquait
        // l'adresse comme définitivement non géolocalisable dans le localStorage, sans nouvelle
        // tentative possible avant un vidage manuel du cache.
        try { result = await geocodeOneAddress(r.adresse); cache[key] = result; newlyFetched.push({key, result}); } catch(e){ result = null; }
        if (!cancelled){
          setCoords((prev)=>Object.assign({}, prev, {[r.code]: result}));
          setProgress((prev)=>({done: prev.done+1, total: prev.total}));
        }
        await new Promise((r2)=>setTimeout(r2, 130));
      }
      saveGeocodeCache(cache);
      // Alimente le cache partagé pour les prochains visiteurs — fire-and-forget (best-effort), ne
      // doit jamais retarder l'affichage de la carte pour l'utilisateur courant.
      if (newlyFetched.length) sbGeocodeCacheSetMany(newlyFetched);
      if (!cancelled) setStatus('done');
    })();
    return ()=>{ cancelled = true; };
  }, [residences]);
  return {coords, progress, status};
}

/* ---------------- Appels au backend (auth + proxy Supabase) ----------------
   Depuis la migration vers un backend d'authentification, le frontend ne détient plus aucune clé
   Supabase et ne parle plus jamais directement à Supabase : toutes les fonctions ci-dessous appellent
   /api/* (Vercel Serverless Functions, cf. dossier api/), qui seul détient la clé service_role. La
   session est un cookie httpOnly (posé par /api/auth/login) : `credentials:'include'` l'attache
   automatiquement à chaque requête, jamais lu/manipulé en JS ici. Un 401 (cookie absent ou JWT expiré
   après 12h) déclenche `onUnauthorized` — enregistrée par AuthGate au montage — qui renvoie
   immédiatement vers l'écran de connexion, quel que soit l'endroit du code où l'appel a été fait. */
let onUnauthorized = null;
function setUnauthorizedHandler(fn){ onUnauthorized = fn; }
async function apiFetch(path, options){
  const opts = Object.assign({ credentials:'include' }, options||{});
  const headers = Object.assign({ 'Content-Type':'application/json' }, (options && options.headers) || {});
  // Une sauvegarde peut embarquer un import complet (plusieurs Mo une fois sérialisé) : Vercel plafonne
  // le corps d'une requête à environ 4,5 Mo côté plateforme, une limite qu'on ne peut pas relever
  // autrement. Au-delà d'un seuil, on compresse (gzip) plutôt que d'envoyer le JSON brut ; le corps est
  // alors lu et décompressé côté serveur (cf. api/_lib/http.js#readJsonBody). Sans CompressionStream
  // (navigateur ancien), on retombe simplement sur l'envoi non compressé.
  if (typeof opts.body === 'string' && opts.body.length > 100000 && typeof CompressionStream === 'function'){
    try {
      const stream = new Blob([opts.body]).stream().pipeThrough(new CompressionStream('gzip'));
      opts.body = await new Response(stream).arrayBuffer();
      headers['Content-Type'] = 'application/octet-stream';
      headers['Content-Encoding'] = 'gzip';
    } catch(e){ /* compression indisponible : corps envoyé tel quel (JSON non compressé) */ }
  }
  opts.headers = headers;
  const res = await fetch(path, opts);
  if (res.status===401){
    if (onUnauthorized) onUnauthorized();
    throw new Error('Session expirée.');
  }
  return res;
}
async function apiJson(path, options){
  const res = await apiFetch(path, options);
  let json = null;
  try { json = await res.json(); } catch(e){ /* réponse vide (ex. 405) */ }
